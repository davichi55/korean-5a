<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>5A 단어 같이 외우기</title>
<meta property="og:title" content="5A 단어 같이 외우기">
<meta property="og:description" content="오늘 밤 같이 내일 수업 단어를 외워요 · 중요 단어(★) 먼저">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<!-- installable as a full-screen app (no browser buttons to misclick): manifest + the shared pass-through sw.js -->
<link rel="manifest" href="together.webmanifest">
<meta name="theme-color" content="#0f1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="같이 외우기">
<link rel="apple-touch-icon" href="icon-together-192.png">
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2e; --card:#1c2740; --card2:#223052;
    --line:#2c3a5a; --txt:#eaf0fb; --dim:#96a3c2; --accent:#5b8cff;
    --gold:#ffcf5c; --good:#37d18f; --bad:#ff6b7a; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-tap-highlight-color:transparent}
  [lang="zh-Hans"]{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
  [lang="zh-Hant"]{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Microsoft YaHei",sans-serif}
  [lang="th"]{font-family:"Leelawadee UI","Noto Sans Thai","Tahoma",sans-serif;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
  h1{font-size:22px;margin:4px 0 2px}
  .sub{color:var(--dim);font-size:13.5px;margin:0 0 16px;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--dim);font-weight:600}
  label{display:block;font-size:12.5px;color:var(--dim);margin:10px 0 5px}
  input,select{width:100%;font:inherit;font-size:16px;color:var(--txt);background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px}
  input.code{text-transform:uppercase;letter-spacing:.3em;font-weight:700;text-align:center;font-size:22px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1 1 140px}
  button{font:inherit}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:13px 14px;font-size:16px;font-weight:700;cursor:pointer;
    background:var(--accent);color:#fff;margin-top:12px}
  .btn.alt{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn.gold{background:var(--gold);color:#1b1400}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .big-code{font-size:42px;letter-spacing:.25em;font-weight:800;text-align:center;margin:4px 0;color:var(--gold)}
  .players{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px}
  .chip.me{border-color:var(--accent)}
  .note{font-size:13px;color:var(--dim);line-height:1.55}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);margin-bottom:8px}
  .bar{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:0 0 16px}
  .bar i{display:block;height:100%;background:var(--accent);width:100%;transform-origin:left;animation:shrink linear forwards}
  @keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  .prompt{text-align:center;padding:22px 10px 18px;font-size:30px;font-weight:800;line-height:1.3;word-break:keep-all}
  .prompt.gloss{font-size:22px;font-weight:700}
  .opts{display:grid;gap:10px}
  .opt{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:14px;padding:15px 14px;font-size:17px;
    text-align:left;cursor:pointer;min-height:56px;line-height:1.35}
  .opt.kr{font-size:20px;font-weight:700;text-align:center}
  .opt.picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
  .opt.good{background:rgba(55,209,143,.18);border-color:var(--good)}
  .opt.bad{background:rgba(255,107,122,.16);border-color:var(--bad)}
  .opt:disabled{cursor:default}
  .full{margin-top:14px;font-size:14.5px;line-height:1.55}
  .full .ex{color:var(--dim);font-size:13.5px;margin-top:4px}
  .res{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .res .chip.o{border-color:var(--good);color:var(--good)} .res .chip.x{border-color:var(--bad);color:var(--bad)}
  .banner{text-align:center;font-weight:800;font-size:18px;margin-top:12px}
  .banner.o{color:var(--good)} .banner.x{color:var(--bad)}
  .intro{text-align:center;padding:48px 10px}
  .intro .n{font-size:14px;color:var(--dim);letter-spacing:.1em}
  .intro .t{font-size:30px;font-weight:800;margin:10px 0}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td{padding:7px 4px;border-bottom:1px solid var(--line)}
  td.s{text-align:right;font-weight:700;color:var(--gold)}
  .hard li{margin:6px 0;line-height:1.4}
  .hard b{font-size:17px}
  .hard span{color:var(--dim)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);
    padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:90vw}
  .err{color:var(--bad)}
  .secs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .tog{border:1px solid var(--line);background:var(--bg2);color:var(--dim);border-radius:999px;padding:6px 11px;font-size:13.5px;cursor:pointer}
  .tog.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tog small{opacity:.75;margin-left:4px}
  .star{color:var(--gold)}

  /* ---- chat: a round button bottom-right that opens a panel; in 설명왕 the chat IS the screen ---- */
  #chatFab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
    border:0;background:var(--accent);color:#fff;font-size:24px;box-shadow:var(--shadow);cursor:pointer;z-index:20}
  #chatFab .badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--bad);
    color:#fff;font-size:12px;font-weight:700;line-height:22px;padding:0 6px}
  #chatPanel{position:fixed;right:10px;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:420px;margin-left:auto;
    height:min(62vh,520px);background:var(--bg2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;z-index:30}
  #chatPanel header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}
  #chatPanel header button{background:none;border:0;color:var(--dim);font-size:22px;cursor:pointer}
  .feed{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:0}
  .msg{font-size:14.5px;line-height:1.4;word-break:break-word}
  .msg b{color:var(--accent);font-weight:700;margin-right:6px}
  .msg.me b{color:var(--gold)}
  .msg.hint{background:rgba(91,140,255,.14);border:1px solid rgba(91,140,255,.35);border-radius:12px;padding:8px 10px;font-size:16px}
  .msg.hint b{color:var(--gold)}
  .msg.sys{color:var(--dim);font-size:13px;text-align:center}
  .chatIn{border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  .quick{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto}
  .quick button{flex:0 0 auto;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer}
  .sendRow{display:flex;gap:8px}
  .sendRow input{flex:1;padding:9px 12px}
  .sendRow button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:0 14px;font-weight:700;font-size:15px;cursor:pointer}
  body.nochat #chatFab, body.nochat #chatPanel, body.exmode #chatFab, body.exmode #chatPanel{display:none!important}
  #chatPanel[hidden], #chatBadge[hidden]{display:none}       /* display:flex above would otherwise beat the hidden attribute */
  body.exmode .toast{bottom:130px}
  #hostEnd{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;background:var(--card2);color:var(--txt);
    border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);display:none}
  body.hostplay #hostEnd{display:block}
  body.exmode #hostEnd{display:none}
  .ver{text-align:center;color:var(--dim);font-size:11.5px;margin-top:18px}

  /* ---- 설명왕 ---- */
  body.exmode .wrap{max-width:560px;height:100dvh;padding:10px 12px 0;display:flex;flex-direction:column}
  .exTop{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px}
  .exTop .who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .exTop .clock{font-weight:800;color:var(--gold);min-width:34px;text-align:right}
  .mini{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 11px;font-size:14px;font-weight:700;cursor:pointer}
  .secret{padding:10px 12px;margin-bottom:6px}
  .secret .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .secret .kr{font-size:24px;font-weight:800;margin:0}
  .secret .mean{font-size:14.5px;line-height:1.4;margin-top:2px}
  .secret .ex{color:var(--dim);font-size:12.5px;margin-top:2px}
  .secret .meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--dim)}
  .secret .meta span{flex:1;min-width:0}
  .secret .meta .mini{padding:5px 9px;font-size:12.5px}
  .exStatus{font-size:13px;color:var(--dim);margin:0 0 6px;line-height:1.45}
  .exBox{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:14px 14px 0 0}
  .sheet{position:fixed;inset:0;background:rgba(5,8,15,.72);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:60px 12px 12px}
  .sheet .inner{background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;max-height:80vh;display:flex;flex-direction:column}
  .sheet .inner header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;overflow-y:auto}
  .wchip{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 11px;font-size:16px;cursor:pointer}
  .wchip.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
  .wchip:disabled{opacity:.35;text-decoration:line-through;cursor:default}
  .sheet .foot{padding:10px 14px;border-top:1px solid var(--line)}

  /* ---- avatars ---- */
  .av{display:inline-block;width:24px;height:24px;flex:0 0 auto;vertical-align:middle}
  .av svg{width:100%;height:100%;display:block}
  .chip .av{width:22px;height:22px;margin:-3px 5px -3px -5px}
  .msg{display:flex;gap:7px;align-items:flex-start}
  .msg .av{margin-top:1px}
  .msg.sys{display:block}
  .msg.syshint{display:block;text-align:center;color:var(--gold);font-size:14px;background:rgba(255,207,92,.08);border:1px dashed rgba(255,207,92,.35);border-radius:10px;padding:6px 8px}
  td .av{width:26px;height:26px;margin-right:6px}
  .avEdit{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
  .avBig{width:96px;height:96px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);padding:6px}
  .avRow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
  .avRow button{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer}
  .avRow button.on{background:var(--txt);color:var(--bg);font-weight:700}
  .avRow .sw{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid transparent}
  .avRow .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  .avLbl{font-size:11.5px;color:var(--dim);letter-spacing:.06em}
  /* ---- 설명왕 extras ---- */
  .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .facts span{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px}
  .starters{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .starters[hidden]{display:none}
  .quick::-webkit-scrollbar{display:none}
  .quick{scrollbar-width:none}
  .starters button{flex:0 0 auto;background:rgba(255,207,92,.1);border:1px solid rgba(255,207,92,.4);color:var(--gold);border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer}
  .mask{font-size:22px;letter-spacing:.18em;font-weight:800;color:var(--gold)}
  .pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--good);color:#06291a;font-size:26px;font-weight:800;
    padding:18px 26px;border-radius:18px;box-shadow:var(--shadow);z-index:60;text-align:center;animation:pop .25s ease-out}
  @keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
</style>
</head>
<body class="nochat">
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<button id="hostEnd">⏹ 게임 끝내기</button>
<button id="chatFab" aria-label="채팅">💬<span class="badge" id="chatBadge" hidden>0</span></button>
<div id="chatPanel" hidden>
  <header><span>채팅</span><button id="chatClose" aria-label="닫기">×</button></header>
  <div class="feed" id="chatFeed"></div>
  <div class="chatIn" id="chatIn"></div>
</div>
<script>

/* ---------- the class schedule: which words belong to which night ---------- */
const DOW = "일월화수목금토";
function fmtDate(d){ const x = new Date(d + "T03:00:00Z"); return (x.getUTCMonth() + 1) + "월 " + x.getUTCDate() + "일 (" + DOW[x.getUTCDay()] + ")"; }
const todayKST = () => new Intl.DateTimeFormat("en-CA", {timeZone:"Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date());
function tonightIndex(){ const t = todayKST(); const i = SCHED.findIndex(e => e.d > t); return i < 0 ? SCHED.length - 1 : i; }
const sid = (n, s) => "ch" + n + "-" + s;
const idsOf = s => (SEC[s] ? SEC[s].ids : []);
function chRange(chs){ return chs.length > 2 ? chs[0] + "–" + chs[chs.length - 1] + "과" : chs.join("·") + "과"; }
/* groups are in priority order; within a group the sections take turns, so one night mixes them */
function planFor(e){
  if(e.k === "l" && e.p === 1) return { chs:[e.ch], groups:[[sid(e.ch,"v"), sid(e.ch,"r1"), sid(e.ch,"s1")]],
    label: e.ch + "과 · 비디오 + 읽기 1 + 말하기 1" };
  if(e.k === "l") return { chs:[e.ch], groups:[[sid(e.ch,"r2")], [sid(e.ch,"v")]],
    label: e.ch + "과 · 읽기 2 + 비디오 다시" };
  const all = e.chs.flatMap(n => ["v","r1","r2","s1"].map(s => sid(n, s)));
  const kind = e.k === "r" ? "복습" : e.k === "q" ? "퀴즈 준비" : "중간시험 준비";
  return { chs:e.chs, groups:[all], label: kind + " · " + chRange(e.chs) };
}
const nightText = i => fmtDate(SCHED[i].d) + " 수업 · " + planFor(SCHED[i]).label;
const secName = id => (SEC[id] ? SEC[id].ch + " " + SEC[id].t : id);
/* the host can switch single classes (비디오 수업, 읽기 1 …) off for tonight; off = not asked */
function activePlan(){
  const plan = planFor(SCHED[G.nightIdx]), off = G.secOff || new Set();
  const groups = plan.groups.map(g => g.filter(x => !off.has(x))).filter(g => g.length);
  const all = plan.groups.flat(), on = all.filter(x => !off.has(x));
  return Object.assign({}, plan, { groups, allSecs:all, label: plan.label + (on.length < all.length ? " · " + on.map(secName).join(", ") + "만" : "") });
}

/* The host remembers which words the group missed. Those come first on later nights (that is what
   a review night is for); a word answered right with no misses slowly drops back out. */
const HIST_KEY = "k5a_together_hist";
function loadHist(){ try{ return JSON.parse(store.get(HIST_KEY, "{}")) || {}; }catch(e){ return {}; } }
function pickWords(plan, count){
  const hist = loadHist(), order = [], seen = new Set();
  const add = id => { if(C[id] && !seen.has(id)){ seen.add(id); order.push(id); } };
  const inPlan = plan.groups.flat().flatMap(idsOf);
  inPlan.filter(id => hist[id] && hist[id].m > 0).sort((a, b) => hist[b].m - hist[a].m).forEach(add);
  for(const star of [1, 0]) for(const g of plan.groups){
    const lists = g.map(s => shuffle(idsOf(s).filter(id => (C[id].star ? 1 : 0) === star)));
    for(let i = 0; lists.some(l => i < l.length); i++) lists.forEach(l => { if(i < l.length) add(l[i]); });
  }
  if(count === "star") return order.filter(id => C[id].star || (hist[id] && hist[id].m > 0));
  return order.slice(0, +count);
}

  ctl.innerHTML = '<div class="avLbl">색</div><div class="avRow">' + AV_COLORS.map((c, i) =>
      '<button class="sw' + (ME.av.c === i ? " on" : "") + '" data-k="c" data-i="' + i + '" style="background:' + c + '" aria-label="색 ' + (i + 1) + '"></button>').join("") + '</div>' +

  if(!m.solo) html += '<div class="card"><h2>참여한 사람 ' + m.players.length + '명</h2><div class="players">' +
    m.players.map(p => '<span class="chip' + (p.pid === ME.pid ? " me" : "") + '">' + avHtml(p.av) + esc(p.name) + '</span>').join("") + '</div></div>';
  html += '<div class="card"><h2>오늘의 단어</h2>';
  if(hostCtl){
    if(!m.solo) html += '<label>게임</label><select id="mode">' + [["quiz","단어 퀴즈"],["explain","설명왕 (채팅으로 설명하기)"]].map(([v, t]) =>
      '<option value="' + v + '"' + (G.mode === v ? " selected" : "") + '>' + t + '</option>').join("") + '</select>';
    if(G.mode === "explain") html += '<label>한 사람이 몇 번 설명?</label><select id="exRounds">' + [1,2,3].map(v =>
      '<option value="' + v + '"' + (G.exRounds === v ? " selected" : "") + '>' + v + '번</option>').join("") + '</select>';
    html += '<label>어느 수업 준비?</label><select id="night">' + SCHED.map((e, i) => '<option value="' + i + '"' + (i === G.nightIdx ? " selected" : "") + '>' +
      esc(nightText(i)) + (i === tonightIndex() ? "  ← 다음 수업" : "") + '</option>').join("") + '</select>' +
      '<label>어느 수업 단어?</label><div class="secs">' + planFor(SCHED[G.nightIdx]).groups.flat().map(x => '<button class="tog' + (G.secOff.has(x) ? "" : " on") + '" data-sec="' + x + '">' +
        esc(secName(x)) + '<small>' + idsOf(x).length + '</small></button>').join("") + '</div>' +
      '<label>단어 수</label><select id="count">' + [["10","10개"],["20","20개"],["30","30개"],["star","★ 전부"]].map(([v, t]) =>
      '<option value="' + v + '"' + (String(G.count) === v ? " selected" : "") + '>' + t + '</option>').join("") + '</select>' +
      '<p class="note" style="margin-top:10px">' + esc(modeNote(m)) + '</p>' +
      '<button class="btn gold" id="start"' + (m.nWords < 4 || (m.mode === "explain" && m.players.length < 2) ? " disabled" : "") + '>시작</button>';
  } else {
    html += '<p style="margin:0 0 6px"><b>' + esc(m.mode === "explain" ? "설명왕" : "단어 퀴즈") + ' · ' + esc(m.label) + '</b></p><p class="note">' + esc(modeNote(m)) + '<br>호스트가 시작할 때까지 기다리세요.</p>' +
      '<label>뜻 언어</label>' + langSelect();
  }
  html += '</div>';
  if(hostCtl && !m.solo) html += '<button class="btn alt" id="leave">방 닫기</button>';
  if(!ME.host) html += '<button class="btn alt" id="leave">나가기</button>';
  $("#app").innerHTML = html;
  bindLang();
  if(hostCtl){
    const md = $("#mode"); if(md) md.onchange = e => { G.mode = e.target.value; lobbyUpdate(); };
    const er = $("#exRounds"); if(er) er.onchange = e => { G.exRounds = +e.target.value; lobbyUpdate(); };
    $("#night").onchange = e => { G.nightIdx = +e.target.value; G.secOff = new Set(); lobbyUpdate(); };
    document.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => {
      const x = b.dataset.sec, all = planFor(SCHED[G.nightIdx]).groups.flat();
      if(G.secOff.has(x)) G.secOff.delete(x);
      else if(all.filter(y => !G.secOff.has(y)).length > 1) G.secOff.add(x);   // keep at least one class on
      else toast("수업을 하나는 골라야 해요");
      lobbyUpdate();
    });
    $("#count").onchange = e => { G.count = e.target.value; lobbyUpdate(); };
    $("#start").onclick = startGame;
    const cl = $("#copyLink");
    if(cl) cl.onclick = async () => {
      const url = location.origin + location.pathname + "?room=" + G.code;
      try{ await navigator.clipboard.writeText(url); toast("복사했어요: " + url); }catch(e){ prompt("이 링크를 복사하세요", url); }
    };
  }
  const lv = $("#leave"); if(lv) lv.onclick = leave;
}

function modeNote(m){
  if(m.mode === "explain") return m.nWords + "단어 · 한 사람이 단어를 한국어로 설명하고, 다른 사람은 단어 목록에서 맞혀요 · " +
    (m.players.length < 2 ? "2명 이상 필요해요" : m.players.length + "명 × " + m.exRounds + "번 = " + Math.min(m.nWords, m.players.length * m.exRounds) + "단어");
  return m.nWords + "단어 · 1라운드 한국어 → 뜻 · 2라운드 뜻 → 한국어 · 틀린 단어 클리어 보드";
}

function qHeader(m){
  return '<div class="top"><span>' + esc(ROUND_NAME[m.round]) + '</span><span>' +
    (m.round === 3 ? "남은 단어 " + m.left : m.n + " / " + m.of) + '</span></div>';

function qBody(m, picked){
  const k2m = m.dir === "k2m";
  const prompt = k2m ? '<div class="prompt" lang="ko">' + esc(C[m.card].kr) + '</div>'
                     : '<div class="prompt gloss" lang="' + hl(LANG) + '">' + esc(lab(m.card)) + '</div>';
  const opts = '<div class="opts">' + m.opts.map(id => '<button class="opt' + (k2m ? "" : " kr") + (picked === id ? " picked" : "") + '" data-id="' + id + '"' +
    (k2m ? ' lang="' + hl(LANG) + '"' : ' lang="ko"') + '>' + esc(k2m ? lab(id) : C[id].kr) + '</button>').join("") + '</div>';
  return prompt + opts;
}
function renderQ(m){
  VIEW.q = { qn:m.qn, picked:null };
  $("#app").innerHTML = qHeader(m) + '<div class="bar"><i style="animation-duration:' + m.ms + 'ms"></i></div>' + qBody(m, null) +
    '<p class="note" id="wait" style="text-align:center;margin-top:14px"></p>';
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if(!VIEW.q || VIEW.q.qn !== m.qn || VIEW.q.picked) return;
    VIEW.q.picked = b.dataset.id;
    b.classList.add("picked");
    document.querySelectorAll(".opt").forEach(x => x.disabled = true);
    $("#wait").textContent = "다른 사람을 기다리는 중…";
    sendAnswer(m.qn, b.dataset.id);
  });
}
function renderReveal(m){
  const mine = m.res[ME.pid];
  const picked = VIEW.q && VIEW.q.qn === m.qn ? VIEW.q.picked : null;
  VIEW.q = null;
  let html = qHeader(m) + '<div class="bar"><i style="animation:none;transform:scaleX(0)"></i></div>' + qBody(m, picked);
  const c = C[m.card];
  html += '<div class="card full"><b lang="ko">' + esc(c.kr) + '</b>' + (c.star ? ' <span class="star">★</span>' : '') +
    '<div lang="' + hl(LANG) + '">' + esc(full(m.card)) + '</div>' + (c.ex ? '<div class="ex" lang="ko">' + esc(c.ex) + '</div>' : '') + '</div>';
  if(m.round === 3) html += '<div class="banner ' + (m.cleared ? "o" : "x") + '">' + (m.cleared ? "클리어! 🎉" : "아직이에요 · 다시 나와요") + '</div>';
  else if(mine) html += '<div class="banner ' + (mine.s === "o" ? "o" : "x") + '">' + (mine.s === "o" ? "정답 +" + mine.pts : mine.s === "x" ? "오답" : "시간 초과") + '</div>';
  const others = Object.entries(m.res);
  if(others.length > 1) html += '<div class="res">' + others.map(([pid, r]) => '<span class="chip ' + r.s + '">' + (r.s === "o" ? "✓ " : r.s === "x" ? "✗ " : "… ") + esc(r.name) + '</span>').join("") + '</div>';
  $("#app").innerHTML = html;
  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if(b.dataset.id === m.card) b.classList.add("good");
    else if(b.dataset.id === picked) b.classList.add("bad");
  });
}

    (m.early ? ' · ⏹ 중간에 끝냈어요' : '') + '</p>';
  if(ex) m = Object.assign({}, m, { hardest: [] });
  html += '<div class="card"><h2>점수</h2><table>' + m.scores.map((p, i) => '<tr><td>' + medal(i) + ' ' + avHtml(p.av) + esc(p.name) + (p.pid === ME.pid ? " (나)" : "") +
    '</td><td class="s">' + p.score + '</td></tr>').join("") + '</table></div>';
  // 설명왕: every word of the night with its meaning in YOUR language, because a word you picked from the
  // list without knowing it only teaches you something once you see what it means
  if(ex && m.played.length) html += '<div class="card"><h2>오늘 설명한 단어</h2><ul class="hard" style="padding-left:18px;margin:0">' +
    m.played.map(x => '<li><b lang="ko">' + esc(C[x.card].kr) + '</b> ' + (x.ok ? "✓" : "✗") + '<br><span lang="' + hl(LANG) + '">' + esc(full(x.card)) + '</span>' +
      ' <span>· 설명: ' + esc(x.by) + '</span></li>').join("") + '</ul></div>';
  if(m.hardest.length) html += '<div class="card"><h2>오늘 제일 어려웠던 단어</h2><ul class="hard" style="padding-left:18px;margin:0">' +
    m.hardest.map(([id, n]) => '<li><b lang="ko">' + esc(C[id].kr) + '</b> <span lang="' + hl(LANG) + '">' + esc(lab(id)) + '</span> <span>· ' + n + '번 틀림</span></li>').join("") + '</ul></div>';
  if(ME.host && G){
    if(m.hardest.length && !G.solo) html += '<button class="btn alt" id="copyHard">어려운 단어 복사 (단톡방용)</button>';
    html += '<button class="btn gold" id="again">' + (G.solo ? "다시 하기" : "대기실로") + '</button>';
    if(G.solo) html += '<button class="btn alt" id="leave">처음으로</button>';
  } else html += '<p class="note" style="text-align:center">호스트가 다음 게임을 준비할 때까지 기다리세요.</p><button class="btn alt" id="leave">나가기</button>';
  $("#app").innerHTML = html;
  const ch = $("#copyHard");
  if(ch) ch.onclick = async () => {
    const txt = "오늘 어려웠던 단어 (" + m.label + ")\n" + m.hardest.map(([id, n]) => "• " + C[id].kr + " — " + C[id].lab.en).join("\n");
    try{ await navigator.clipboard.writeText(txt); toast("복사했어요"); }catch(e){ prompt("복사하세요", txt); }
  };
  const ag = $("#again"); if(ag) ag.onclick = () => { G.phase = "lobby"; lobbyUpdate(); };
  const lv = $("#leave"); if(lv) lv.onclick = leave;
}
function renderMessage(title, text, back){
  VIEW.q = null;
  $("#app").innerHTML = '<div class="intro"><div class="t" style="font-size:24px">' + esc(title) + '</div><p class="note">' + esc(text) + '</p>' +
    (back ? '<button class="btn alt" id="back">처음으로</button>' : '') + '</div>';
  const b = $("#back"); if(b) b.onclick = leave;
}

/* Korean typing: while a syllable is being composed (ㅇ → 아 → 안), any change to the page makes the
   Windows/Chrome IME commit the half-built syllable, so 안녕 came out as ㅇㅏㄴㄴㅕㅇ. So while composing,
   incoming messages wait and are applied the moment the syllable is finished. The last syllable of a word
   stays "composing" while you think, so the wait is capped at 6 s: a new question must still arrive. */
const IME = { on:false, q:[], t:null };
function imeFlush(){
  clearTimeout(IME.t); IME.t = null;
  const q = IME.q; IME.q = [];
  for(const m of q) handleMessage(m);
}
document.addEventListener("compositionstart", () => { IME.on = true; clearTimeout(IME.t); IME.t = setTimeout(() => { IME.on = false; imeFlush(); }, 6000); }, true);
document.addEventListener("compositionend", () => { IME.on = false; setTimeout(() => { if(!IME.on) imeFlush(); }, 0); }, true);

/* Some laptop browsers hand the page loose letters (ㅇ ㅏ ㄴ) instead of syllables, whatever the page
   does. When a vowel arrives right after a loose consonant (which a working IME never does), this switches
   on "jamo mode" for that device and joins the letters at the end of the box into syllables: ㅇㅏㄴㄴㅕㅇ → 안녕.
   Devices whose keyboard works (phones) never trigger it. */
const H_CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ", H_JUNG = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const H_JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const H_V2 = { "ㅗㅏ":"ㅘ","ㅗㅐ":"ㅙ","ㅗㅣ":"ㅚ","ㅜㅓ":"ㅝ","ㅜㅔ":"ㅞ","ㅜㅣ":"ㅟ","ㅡㅣ":"ㅢ" };
const H_T2 = { "ㄱㅅ":"ㄳ","ㄴㅈ":"ㄵ","ㄴㅎ":"ㄶ","ㄹㄱ":"ㄺ","ㄹㅁ":"ㄻ","ㄹㅂ":"ㄼ","ㄹㅅ":"ㄽ","ㄹㅌ":"ㄾ","ㄹㅍ":"ㄿ","ㄹㅎ":"ㅀ","ㅂㅅ":"ㅄ" };
const H_T2R = Object.fromEntries(Object.entries(H_T2).map(([k, v]) => [v, k]));
function hangulJoin(chars){
  let out = "", L = "", V = "", T = "";
  const flush = () => {
    if(L && V) out += String.fromCharCode(0xAC00 + (H_CHO.indexOf(L) * 21 + H_JUNG.indexOf(V)) * 28 + H_JONG.indexOf(T));
    else out += L + V;
    L = V = T = "";
  };
  for(const ch of chars){
    const isC = H_CHO.includes(ch), isV = H_JUNG.includes(ch);
    if(isC){
      if(L && V && !T && H_JONG.includes(ch)) T = ch;
      else if(L && V && T && H_T2[T + ch]) T = H_T2[T + ch];
      else { flush(); L = ch; }
    } else if(isV){
      if(L && !V) V = ch;
      else if(L && V && !T && H_V2[V + ch]) V = H_V2[V + ch];
      else if(L && V && T){                         // the last consonant moves to the next syllable: 안+ㅕ → 아녀
        const split = H_T2R[T];
        const next = split ? split[1] : T;
        T = split ? split[0] : "";
        flush(); L = next; V = ch;
      } else { flush(); out += ch; }
    } else { flush(); out += ch; }
  }
  flush();
  return out;
}
function hangulSplit(syl){
  const c = syl.charCodeAt(0) - 0xAC00;
  if(c < 0 || c > 11171) return [syl];
  const t = H_JONG[c % 28];
  return [H_CHO[Math.floor(c / 588)], H_JUNG[Math.floor(c % 588 / 28)], ...(H_T2R[t] ? [...H_T2R[t]] : t ? [t] : [])];
}
IME.jamo = store.get("k5a_together_jamo", "") === "1";
function fixJamo(el){
  if(!(el instanceof HTMLInputElement) || el.selectionStart !== el.value.length) return;
  const v = el.value, m = v.match(/([가-힣]?)([ㄱ-ㅣ]+)$/);
  if(!m) return;
  const fixed = hangulJoin([...(m[1] ? hangulSplit(m[1]) : []), ...m[2]]);
  const nv = v.slice(0, v.length - m[0].length) + fixed;
  if(nv !== v){ el.value = nv; el.setSelectionRange(nv.length, nv.length); }
}
function jamoWatch(el, data){
  if(!(el instanceof HTMLInputElement)) return;
  if(!IME.jamo && data && /^[ㅏ-ㅣ]$/.test(data)){
    const before = el.value.slice(0, Math.max(0, el.selectionStart - 1));
    if(/[ㄱ-ㅎ]$/.test(before)){ IME.jamo = true; store.set("k5a_together_jamo", "1"); }
  }
  if(IME.jamo) fixJamo(el);
}
document.addEventListener("input", e => { if(!e.isComposing) jamoWatch(e.target, e.data); }, true);
document.addEventListener("compositionend", e => { const el = e.target, d = e.data; setTimeout(() => jamoWatch(el, d), 0); }, true);

function onMessage(m){
  if(IME.on){ IME.q.push(m); return; }
  handleMessage(m);
}

/* everything a screen receives, from the host over the network or from the host's own engine */
function handleMessage(m){
  if(m.t !== "chat" && m.t !== "ex" && m.t !== "exYou") document.body.classList.remove("exmode");
  if(["lobby","wait","round","q","reveal","end","ex","exReveal"].includes(m.t)) setChatAvailable(!(ME.host && G && G.solo));
  document.body.classList.toggle("hostplay", !!(ME.host && G && G.phase === "play" && m.t !== "end" && m.t !== "lobby"));
  if(m.t === "chat") addChat(m);
  else if(m.t === "ex") renderEx(m);
  else if(m.t === "exReveal") renderExReveal(m);
  else if(m.t === "exYou"){   // only the person who guessed it sees this; the chat just says they got it
    const sh = $("#wordSheet"); if(sh) sh.remove();
    const d = document.createElement("div"); d.className = "pop"; d.innerHTML = '🎉 정답!<br><span lang="ko">' + esc(C[m.card].kr) + '</span> +' + m.pts;
    document.body.appendChild(d); setTimeout(() => d.remove(), 2200);
  }
  else if(m.t === "lobby") renderLobby(m);
  else if(m.t === "wait") renderMessage("게임 진행 중", "다음 문제부터 같이 해요.");
  else if(m.t === "round") renderRound(m);
  else if(m.t === "q") renderQ(m);
  else if(m.t === "reveal") renderReveal(m);
  else if(m.t === "end") renderEnd(m);
  else if(m.t === "closed") { cleanup(); renderMessage("방이 닫혔어요", "호스트가 방을 닫았어요.", true); }
}

/* ================================ player side ================================ */
/* Everyone connects to the room relay on Cloudflare (relay/ in the project) over an ordinary secure
   websocket, which works on mobile data and on any Wi-Fi. ?relay=ws://localhost:8787 points a test copy
   at a local relay (npx wrangler dev). */
const RELAY = (new URLSearchParams(location.search).get("relay") || "wss://k5a-rooms.sparkheavenapp.workers.dev").replace(/\/$/, "");
const rid = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);

function joinRoom(code){
  renderMessage("연결 중…", "방 " + code + "에 연결하고 있어요.");
  cleanup();
  ME.host = false;
  ME.pid = "p" + rid();
  let opened = false;
  const ws = ME.ws = new WebSocket(RELAY + "/room/" + code + "?role=player&id=" + ME.pid);
  const conn = ME.conn = { open:false, send: d => { if(ws.readyState === 1) ws.send(JSON.stringify(d)); }, close: () => { try{ ws.close(1000); }catch(e){} } };
  const giveUp = setTimeout(() => { if(!opened && ME.ws === ws){ cleanup(); home("연결이 안 돼요. 인터넷 연결을 확인하고 다시 해 보세요."); } }, 15000);
  ws.onopen = () => { opened = true; conn.open = true; clearTimeout(giveUp); ME.lastMsg = Date.now(); conn.send({ t:"hello", name:ME.name, lang:LANG, av:ME.av }); };
  ws.onmessage = e => {
    let m; try{ m = JSON.parse(e.data); }catch(_){ return; }
    ME.lastMsg = Date.now();
    if(m && m.t === "ping") conn.send({ t:"pong" }); else if(m) onMessage(m);
  };
  ws.onclose = e => {
    clearTimeout(giveUp);
    if(ME.ws !== ws) return;
    conn.open = false;
    cleanup();
    if(e.code === 4004) home("방 " + code + "을(를) 찾을 수 없어요. 코드를 확인하거나 호스트에게 물어보세요.");
    else if(e.code === 4029) home("방이 꽉 찼어요.");
    else if(e.code === 4000) renderMessage("방이 닫혔어요", "호스트가 나갔어요.", true);
    else if(e.code === 4010) renderMessage("다른 창에서 참여했어요", "이 창은 연결을 끊었어요.", true);
    else if(!opened) home("연결이 안 돼요. 인터넷 연결을 확인하고 다시 해 보세요.");
    else renderMessage("연결이 끊겼어요", "인터넷이 잠깐 끊겼어요. 같은 코드로 다시 참여할 수 있어요.", true);
  };
}
function sendAnswer(qn, pick){
  if(ME.host) hostReceive("me", { t:"ans", qn, pick });
  else if(ME.conn && ME.conn.open) ME.conn.send({ t:"ans", qn, pick });
}
setInterval(() => {   // the host pings every 4 s; silence means the connection is gone
  if(!ME.host && ME.conn && ME.lastMsg && Date.now() - ME.lastMsg > 28000){   // longer than the relay's 20 s wait for a reconnecting host
    cleanup(); renderMessage("연결이 끊겼어요", "호스트의 응답이 없어요. 같은 코드로 다시 참여할 수 있어요.", true);
  }
}, 3000);

function cleanup(){
  if(G){ clearTimeout(G.timer); clearInterval(G.pinger); }
  const ws = ME.ws; ME.ws = null;                 // cleared first, so its close event is ignored
  try{ if(ws) ws.close(1000); }catch(e){}
  ME.conn = null; ME.lastMsg = 0;
  resetChat(); document.body.classList.remove("exmode", "hostplay"); EXV = null;
  if(ME.wake){ try{ ME.wake.release(); }catch(e){} ME.wake = null; }
  G = null;
}
function leave(){
  if(ME.host && G && !G.solo) broadcast({ t:"closed" }, true);
  setTimeout(() => { cleanup(); ME.host = false; history.replaceState(null, "", location.pathname); home(); }, 150);
}

/* ================================ host side ================================ */
function randCode(){ const A = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let s = ""; for(let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }

function newGame(solo){
  cleanup();
  ME.host = true; ME.pid = "me";
  G = { solo, code:"", players:new Map(), nightIdx:tonightIndex(), count:"20", phase:"lobby", timer:null, pinger:null, secOff:new Set(),
        mode:"quiz", exRounds:2, ex:null, exQueue:[], played:[], turn:0, turns:0,
        words:[], pool:[], stages:[], si:0, li:0, board:[], qn:0, cur:null, miss:{}, tries:{}, cleared:0, boardTotal:0 };
  G.players.set("me", { pid:"me", name:ME.name, av:ME.av, score:0, conn:null, alive:Date.now() });
  if(solo){ lobbyUpdate(); return; }
  renderMessage("방 만드는 중…", "잠시만요.");
  G.key = rid() + rid();                          // proves to the relay that a reconnect is the same host
  openHostRelay(randCode(), 0, 0);
}
/* The host's link to the relay. If it drops mid-game (Wi-Fi hiccup), it reconnects with the same code and
   key; the relay keeps the players waiting for 20 s, so the game carries on. */
function openHostRelay(code, codeTries, reconnects){
  const game = G;
  const ws = ME.ws = new WebSocket(RELAY + "/room/" + code + "?role=host&key=" + game.key);
  let opened = false;
  ws.onopen = () => {
    if(G !== game) return;
    opened = true;
    if(reconnects) toast("다시 연결됐어요 ✓");
    if(!game.code){
      game.code = code;
      lobbyUpdate();
      game.pinger = setInterval(() => {
        if(!ME.ws || ME.ws.readyState !== 1) return;
        const now = Date.now();
        for(const [pid, p] of game.players) if(pid !== "me" && now - p.alive > 15000) dropPlayer(pid);
        broadcast({ t:"ping" }, true);
      }, 4000);
    } else {
      for(const p of game.players.values()) p.alive = Date.now();   // nobody is dropped for the host's own outage
    }
  };
  ws.onmessage = e => {
    if(G !== game) return;
    let m; try{ m = JSON.parse(e.data); }catch(_){ return; }
    if(m.k === "msg" && m.d) hostReceive(m.from, m.d, relayConn(m.from));
    else if(m.k === "leave") dropPlayer(m.id);
  };
  ws.onclose = e => {
    if(G !== game || ME.ws !== ws) return;
    if(e.code === 4009 && codeTries < 8) return openHostRelay(randCode(), codeTries + 1, 0);   // code in use: pick another
    if(!opened && !game.code){ cleanup(); home("방을 만들 수 없어요. 인터넷 연결을 확인하세요."); return; }
    if(e.code === 4010) return;                                                               // replaced by our own reconnect
    if(reconnects >= 8){ cleanup(); home("연결이 끊겨서 방이 닫혔어요. 새 방을 만들어 주세요."); return; }
    toast("연결이 끊겼어요 · 다시 연결하는 중…", 4000);
    setTimeout(() => { if(G === game) openHostRelay(game.code, 0, reconnects + 1); }, 1500);
  };
}
/* what the game engine calls "conn" for a player: a send that goes through the relay to that one person */
function relayConn(pid){
  return { get open(){ return !!(ME.ws && ME.ws.readyState === 1); },
           send: d => { if(ME.ws && ME.ws.readyState === 1) ME.ws.send(JSON.stringify({ to:pid, d })); },
           close: () => {} };
}
function sendTo(p, m){
  if(p.pid === "me") onMessage(m);
  else if(p.conn && p.conn.open){ try{ p.conn.send(m); }catch(e){} }
}
function broadcast(m, remoteOnly){ for(const p of G.players.values()) if(!(remoteOnly && p.pid === "me")) sendTo(p, m); }

function lobbyMessage(){
  const plan = activePlan();
  return { t:"lobby", solo:G.solo, code:G.code, label:fmtDate(SCHED[G.nightIdx].d) + " 수업 · " + plan.label, nWords:pickWords(plan, G.count).length,
           mode:G.solo ? "quiz" : G.mode, exRounds:G.exRounds,
           players:[...G.players.values()].map(p => ({ pid:p.pid, name:p.name, av:p.av })) };
}
function lobbyUpdate(){ if(G && G.phase === "lobby") broadcast(lobbyMessage()); }

function hostReceive(pid, m, conn){
  const p = G.players.get(pid);
  if(p) p.alive = Date.now();
  if(m.t === "hello"){
    const name = String(m.name || "?").trim().slice(0, 16) || "?";
    G.players.set(pid, { pid, name, av:cleanAv(m.av), score:0, conn, alive:Date.now() });
    if(G.phase === "lobby") lobbyUpdate(); else sendTo(G.players.get(pid), { t:"wait" });
    if(G.phase !== "lobby") toast(name + " 님이 들어왔어요");
    return;
  }
  if(m.t === "chat") return hostChat(pid, m.text);
  if(m.t === "guess") return exGuess(pid, m.card);
  if(m.t === "pass") return exPass(pid);
  if(m.t === "ans"){
    const c = G.cur;
    if(!p || !c || c.done || m.qn !== c.qn || c.answers[pid] || !c.opts.includes(m.pick)) return;
    c.answers[pid] = { pick:m.pick, ms:Date.now() - c.start };
    const waiting = c.expect.filter(x => G.players.has(x) && !c.answers[x]);
    if(!waiting.length){ clearTimeout(G.timer); G.timer = setTimeout(reveal, 350); }
  }
}
function dropPlayer(pid){
  const p = G && G.players.get(pid); if(!p || pid === "me") return;
  G.players.delete(pid);
  try{ p.conn && p.conn.close(); }catch(e){}
  if(G.phase === "lobby") lobbyUpdate();
  else if(G.mode === "explain" && G.ex && G.ex.phase === "play"){
    broadcast({ t:"chat", kind:"sys", text:p.name + " 님이 나갔어요" });
    if(pid === G.ex.explainer) exReveal(); else if(exAllDone()) { clearTimeout(G.timer); G.timer = setTimeout(exReveal, 600); } else exBroadcast();
  }
  else if(G.cur && !G.cur.done && !G.cur.expect.some(x => G.players.has(x) && !G.cur.answers[x])){ clearTimeout(G.timer); G.timer = setTimeout(reveal, 350); }
}

async function startGame(){
  const plan = activePlan();
  G.plan = plan;
  G.words = pickWords(plan, G.count);
  if(G.words.length < 4){ toast("단어가 부족해요"); return; }
  G.pool = plan.chs.flatMap(n => ["v","r1","r2","s1"].flatMap(s => idsOf(sid(n, s))));
  G.label = fmtDate(SCHED[G.nightIdx].d) + " 수업 · " + plan.label;
  G.miss = {}; G.tries = {}; G.cleared = 0; G.boardTotal = 0; G.board = []; G.qn = 0; G.asked = new Set();
  for(const p of G.players.values()) p.score = 0;
  if(G.mode === "explain" && !G.solo) return startExplain();
  G.stages = [{ round:1, dir:"k2m", list:shuffle(G.words) }, { round:2, dir:"m2k", list:shuffle(G.words) }];
  G.phase = "play";
  if(!G.solo && "wakeLock" in navigator){ try{ ME.wake = await navigator.wakeLock.request("screen"); }catch(e){} }
  nextStage(0);
}
function nextStage(i){
  G.si = i; G.li = 0;
  if(i < 2){
    broadcast({ t:"round", round:i + 1 });
    G.timer = setTimeout(ask, G.solo ? 1500 : 2500);
    return;
  }
  G.board = shuffle(G.words.filter(id => G.miss[id] > 0));
  G.boardTotal = G.board.length;
  if(!G.board.length) return finish();
  broadcast({ t:"round", round:3, left:G.board.length });
  G.timer = setTimeout(askBoard, G.solo ? 1500 : 2500);
}
function ask(){
  const st = G.stages[G.si];
  if(G.li >= st.list.length) return nextStage(G.si + 1);
  const card = st.list[G.li++];
  pose(card, st.dir, st.round, { n:G.li, of:st.list.length });
}
function askBoard(){
  if(!G.board.length) return finish();
  const card = G.board.shift();
  pose(card, (G.tries[card] || 0) % 2 ? "m2k" : "k2m", 3, { left:G.board.length + 1 });
}
/* three wrong options: same part of speech where possible, never a word that looks or means the same */
function makeOpts(card){
  const taken = new Set([C[card].kr]), labs = LANGS.map(l => new Set([C[card].lab[l.code]]));
  const clash = id => taken.has(C[id].kr) || LANGS.some((l, i) => labs[i].has(C[id].lab[l.code]));
  const pick = [];
  const tryFrom = list => { for(const id of list){ if(pick.length >= 3) break; if(id === card || clash(id)) continue;
    pick.push(id); taken.add(C[id].kr); LANGS.forEach((l, i) => labs[i].add(C[id].lab[l.code])); } };
  const pool = shuffle(G.pool.length >= 8 ? G.pool : Object.keys(C));
  tryFrom(pool.filter(id => C[id].pos && C[id].pos === C[card].pos));
  tryFrom(pool);
  tryFrom(shuffle(Object.keys(C)));
  return shuffle([card, ...pick]);
}
function pose(card, dir, round, extra){
  G.qn++; G.asked.add(card);
  G.cur = { qn:G.qn, card, dir, round, extra, opts:makeOpts(card), start:Date.now(), answers:{}, expect:[...G.players.keys()], done:false };
  broadcast(Object.assign({ t:"q", qn:G.qn, card, dir, round, opts:G.cur.opts, ms:QMS }, extra));
  G.timer = setTimeout(reveal, QMS + 400);
}
function reveal(){
  const c = G && G.cur; if(!c || c.done) return;
  c.done = true; clearTimeout(G.timer);
  const res = {}; let answered = 0, wrong = 0;
  for(const [pid, p] of G.players){
    const a = c.answers[pid];
    if(!a){ if(c.expect.includes(pid)) res[pid] = { name:p.name, s:"-" }; continue; }
    answered++;
    const ok = a.pick === c.card;
    const pts = ok ? 100 + Math.round(100 * Math.max(0, 1 - a.ms / QMS)) : 0;
    if(!ok) wrong++;
    p.score += pts;
    res[pid] = { name:p.name, s: ok ? "o" : "x", pts };
  }
  // a timeout alone does not send a word to the board (someone may just be away), unless nobody answered
  const missed = wrong + (answered ? 0 : 1);
  if(missed) G.miss[c.card] = (G.miss[c.card] || 0) + missed;
  let cleared = false;
  if(c.round === 3){
    cleared = answered > 0 && wrong === 0;
    if(cleared) G.cleared++;
    else { G.tries[c.card] = (G.tries[c.card] || 0) + 1; if(G.tries[c.card] < BOARD_MAX_TRIES) G.board.push(c.card); }
  }
  const left = c.round === 3 ? G.board.length : undefined;
  broadcast(Object.assign({ t:"reveal", qn:c.qn, card:c.card, dir:c.dir, round:c.round, opts:c.opts, res, cleared }, c.extra, left != null ? { left } : {}));
  const delay = G.solo ? (wrong || !answered ? 3200 : 1100) : (wrong || !answered ? REVEAL_MS + 1000 : REVEAL_MS);
  G.timer = setTimeout(() => { if(!G) return; c.round === 3 ? askBoard() : ask(); }, delay);
}
function finish(early){
  G.phase = "end"; G.cur = null; G.ex = null; clearTimeout(G.timer);
  const explain = G.mode === "explain" && !G.solo;
  // only words that were actually asked count, so ending a game early doesn't mark unseen words as learned
  const used = explain ? G.played.map(x => x.card) : [...G.asked];
  const hist = loadHist(), today = todayKST();
  for(const id of used){
    const h = hist[id] || { m:0, s:0 };
    h.s++; h.d = today;
    h.m = G.miss[id] ? Math.min(9, h.m + G.miss[id]) : Math.max(0, h.m - 1);
    hist[id] = h;
  }
  store.set(HIST_KEY, JSON.stringify(hist));
  const hardest = Object.entries(G.miss).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const scores = [...G.players.values()].map(p => ({ pid:p.pid, name:p.name, av:p.av, score:p.score })).sort((a, b) => b.score - a.score);
  if(ME.wake){ try{ ME.wake.release(); }catch(e){} ME.wake = null; }
  broadcast({ t:"end", mode: explain ? "explain" : "quiz", label:G.label, words:used.length, cleared:G.cleared, boardTotal:G.boardTotal,
              hardest, scores, played: explain ? G.played : [], early: early === true });
}

/* ================================ chat ================================
   Text goes to the host, the host checks it (length, speed, and in 설명왕 whether it gives away or guesses
   the word) and sends it to everyone. Nothing is stored: when the room closes, the chat is gone. */
let CHAT = [], chatUnread = 0;
const QUICK = ["ㅋㅋㅋ", "👏", "헐", "아~", "힌트 더!", "몰라요 😅"];
function chatInputHtml(id){
  return '<div class="quick">' + QUICK.map(q => '<button data-q="' + esc(q) + '">' + esc(q) + '</button>').join("") + '</div>' +
    '<form class="sendRow" id="' + id + '"><input maxlength="200" enterkeyhint="send" autocomplete="off" placeholder="메시지…"><button>보내기</button></form>';
}
function bindChatInput(root){
  root.querySelectorAll(".quick button").forEach(b => b.onclick = () => sendChat(b.dataset.q));
  const f = root.querySelector("form"), inp = f.querySelector("input");
  f.onsubmit = e => {
    e.preventDefault(); const t = inp.value.trim(); if(!t) return; sendChat(t); inp.value = ""; inp.focus();
    // Enter can commit the last Hangul syllable a moment after submit; don't leave it behind in the box
    setTimeout(() => { if([...inp.value].length <= 1) inp.value = ""; }, 40);
  };
}
function msgHtml(m){
  if(m.kind === "sys") return '<div class="msg sys">' + esc(m.text) + '</div>';
  if(m.kind === "syshint") return '<div class="msg syshint" lang="ko">' + esc(m.text) + '</div>';
  return '<div class="msg' + (m.kind === "hint" ? " hint" : "") + (m.pid === ME.pid ? " me" : "") + '">' + avHtml(m.av) + '<div><b>' +
    (m.kind === "hint" ? "💡 " : "") + esc(m.name) + '</b><span lang="ko">' + esc(m.text) + '</span></div></div>';
}
function paintFeed(el){ if(!el) return; el.innerHTML = CHAT.map(msgHtml).join(""); el.scrollTop = el.scrollHeight; }
function addChat(m){
  CHAT.push(m); if(CHAT.length > 150) CHAT.shift();
  for(const el of [$("#chatFeed"), $("#exFeed")]) if(el){
    const near = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    el.insertAdjacentHTML("beforeend", msgHtml(m));
    if(near || m.pid === ME.pid) el.scrollTop = el.scrollHeight;
  }
  const panelOpen = !$("#chatPanel").hidden, exOpen = document.body.classList.contains("exmode");
  if(!panelOpen && !exOpen && m.kind !== "sys"){ chatUnread++; const b = $("#chatBadge"); b.textContent = chatUnread > 99 ? "99+" : chatUnread; b.hidden = false; }
}
function sendChat(text){
  if(ME.host && G) hostChat("me", text);
  else if(ME.conn && ME.conn.open) ME.conn.send({ t:"chat", text });
}
function setChatAvailable(on){ document.body.classList.toggle("nochat", !on); }
function resetChat(){ CHAT = []; chatUnread = 0; $("#chatBadge").hidden = true; $("#chatPanel").hidden = true; $("#chatFeed").innerHTML = ""; setChatAvailable(false); }
$("#chatIn").innerHTML = chatInputHtml("chatForm");
bindChatInput($("#chatIn"));
$("#chatFab").onclick = () => { $("#chatPanel").hidden = false; chatUnread = 0; $("#chatBadge").hidden = true; paintFeed($("#chatFeed")); $("#chatForm input").focus(); };
$("#chatClose").onclick = () => { $("#chatPanel").hidden = true; };

const norm = s => String(s || "").toLowerCase().replace(/[\s.,!?~·'"()\[\]\-…_/:;]+/g, "");
/* does this text contain the word? also catches the stem, so 흐트러지 and 흐트러져 give away 흐트러지다 */
function containsWord(text, id){
  const t = norm(text), w = norm(C[id].kr);
  if(!w) return false;
  // one-syllable words (탈, 총, -편) would match inside almost anything, so they must stand alone
  if(w.length === 1) return String(text).split(/\s+/).map(norm).includes(w);
  if(t.includes(w)) return true;
  if(w.length >= 3 && w.endsWith("다") && t.includes(w.slice(0, -1))) return true;
  return false;
}
function hostChat(pid, raw){
  const p = G && G.players.get(pid); if(!p) return;
  const text = String(raw || "").replace(/\s+/g, " ").trim().slice(0, 200); if(!text) return;
  const now = Date.now(); if(p.lastChat && now - p.lastChat < 500) return; p.lastChat = now;
  const ex = G.ex;
  if(G.phase === "play" && G.mode === "explain" && ex && ex.phase === "play"){
    if(pid === ex.explainer){
      if(containsWord(text, ex.card)){ sendTo(p, { t:"chat", kind:"sys", text:"✋ 단어를 직접 쓰면 안 돼요 · 다른 말로 설명하세요" }); return; }
      return broadcast({ t:"chat", kind:"hint", pid, name:p.name, av:p.av, text });
    }
    if(ex.solved[pid] != null){
      if(containsWord(text, ex.card)){ sendTo(p, { t:"chat", kind:"sys", text:"🤫 정답은 아직 비밀이에요" }); return; }
    } else {
      // a guess typed into the chat counts like a tap in the word list, and is never shown as text
      if(containsWord(text, ex.card)) return exGuess(pid, ex.card);
      const hit = G.words.find(id => norm(C[id].kr) === norm(text));
      if(hit) return exGuess(pid, hit);
      exSyllables(pid, text);
    }
  }
  broadcast({ t:"chat", kind:"chat", pid, name:p.name, av:p.av, text });
}

/* ================================ 설명왕: host ================================ */
function startExplain(){
  if(G.players.size < 2){ toast("설명왕은 2명 이상 필요해요"); G.phase = "lobby"; return; }
  const stars = shuffle(G.words.filter(id => C[id].star)), rest = shuffle(G.words.filter(id => !C[id].star));
  G.exQueue = stars.concat(rest);
  G.turns = Math.min(G.words.length, G.players.size * G.exRounds);
  G.turn = 0; G.played = []; G.ex = null;
  G.phase = "play";
  broadcast({ t:"round", round:"ex" });
  G.timer = setTimeout(exNextTurn, 6000);
}
function exNextTurn(){
  if(!G) return;
  if(G.turn >= G.turns || !G.exQueue.length || G.players.size < 2) return finish();
  const order = [...G.players.keys()];
  const explainer = order[G.turn % order.length];
  G.turn++;
  G.ex = { phase:"play", n:G.turn, card:G.exQueue.shift(), explainer, endAt:Date.now() + EX_MS, start:Date.now(), solved:{}, wrong:{}, passed:false,
           found:{}, hintTimers:[] };
  broadcast({ t:"chat", kind:"sys", text:"— " + G.turn + "번째 단어 · 설명: " + G.players.get(explainer).name + " —" });
  exScheduleHints();
  exBroadcast();
  clearTimeout(G.timer);
  G.timer = setTimeout(exReveal, EX_MS + 300);
}
/* The system helps the guessers as time passes, from vague to specific:
   10 s the example with the word hidden, 20 s how many syllables, 35 s part of speech or where it came from,
   55 s the first syllable. Restarted when the explainer passes, so hints always belong to the current word. */
function exScheduleHints(){
  const ex = G.ex; if(!ex) return;
  ex.hintTimers.forEach(clearTimeout); ex.hintTimers = [];
  const card = ex.card, s = sylls(card), shape = C[card].kr.replace(/[가-힣]/g, "○");
  const masked = maskedExample(card);
  const steps = [];
  if(masked) steps.push([10000, "💡 예문: " + masked]);
  else if(posKo(card)) steps.push([10000, "💡 품사: " + posKo(card)]);
  steps.push([20000, "💡 " + s.length + "글자예요: " + shape]);
  steps.push([35000, masked && posKo(card) ? "💡 품사: " + posKo(card) : "💡 나온 곳: " + placeKo(card)]);
  if(s.length >= 2) steps.push([55000, "💡 첫 글자: " + s[0] + " " + "○".repeat(s.length - 1)]);
  for(const [at, text] of steps) ex.hintTimers.push(setTimeout(() => {
    if(G && G.ex === ex && ex.phase === "play" && ex.card === card) broadcast({ t:"chat", kind:"syshint", text });
  }, at - (Date.now() - ex.start)));
}
/* A syllable a guesser typed in the right place (counted from the start or from the end) is revealed to
   that guesser only: 떠들다 against 떠들썩하다 shows 떠들○○다. */
function exSyllables(pid, text){
  const ex = G.ex, p = G.players.get(pid); if(!ex || !p) return;
  const w = sylls(ex.card); if(!w.length) return;
  const found = ex.found[pid] = ex.found[pid] || [];
  let added = false;
  const tokens = String(text).split(/\s+/).map(t => [...t.replace(/[^가-힣]/g, "")]).filter(t => t.length);
  tokens.push([...String(text).replace(/[^가-힣]/g, "")]);
  for(const t of tokens){
    for(let i = 0; i < Math.min(t.length, w.length); i++) if(t[i] === w[i] && !found.includes(i)){ found.push(i); added = true; }
    for(let j = 1; j <= Math.min(t.length, w.length); j++){ const i = w.length - j; if(t[t.length - j] === w[i] && !found.includes(i)){ found.push(i); added = true; } }
  }
  if(added && found.length >= w.length) found.pop();     // never hand over the whole word this way
  if(added) exBroadcast();
}
function exMask(pid){
  const ex = G.ex, w = sylls(ex.card), f = ex.found[pid] || [];
  return f.length ? w.map((ch, i) => f.includes(i) ? ch : "○").join("") : "";
}
function exBroadcast(){
  const ex = G.ex; if(!ex) return;
  const e = G.players.get(ex.explainer);
  const solvedNames = Object.keys(ex.solved).map(pid => G.players.get(pid) ? G.players.get(pid).name : "?");
  for(const p of G.players.values()) sendTo(p, {
    t:"ex", n:ex.n, of:G.turns, explainer:ex.explainer, explainerName:e ? e.name : "?", ms:Math.max(0, ex.endAt - Date.now()),
    words:G.words, done:G.played.map(x => x.card), secret: p.pid === ex.explainer ? ex.card : null, passed:ex.passed,
    solvedNames, iSolved: ex.solved[p.pid] != null, wrongLeft: EX_WRONG - (ex.wrong[p.pid] || 0),
    mask: p.pid === ex.explainer ? "" : exMask(p.pid)
  });
}
function exAllDone(){
  const ex = G.ex;
  const guessers = [...G.players.keys()].filter(x => x !== ex.explainer);
  return guessers.length > 0 && guessers.every(x => ex.solved[x] != null || (ex.wrong[x] || 0) >= EX_WRONG);
}
function exGuess(pid, id){
  const ex = G && G.ex, p = G && G.players.get(pid);
  if(!ex || ex.phase !== "play" || !p || pid === ex.explainer || ex.solved[pid] != null || !C[id]) return;
  if((ex.wrong[pid] || 0) >= EX_WRONG){ sendTo(p, { t:"chat", kind:"sys", text:"이번 단어는 기회를 다 썼어요" }); return; }
  if(id === ex.card){
    const first = Object.keys(ex.solved).length === 0;
    const pts = first ? 100 + Math.round(100 * Math.max(0, (ex.endAt - Date.now()) / EX_MS)) : 60;
    ex.solved[pid] = pts; p.score += pts;
    const e = G.players.get(ex.explainer); if(e) e.score += 50;      // the explainer earns for every classmate who gets it
    broadcast({ t:"chat", kind:"sys", text:"✓ " + p.name + " 님이 맞혔어요! +" + pts });
    sendTo(p, { t:"exYou", pts, card:id });
  } else {
    ex.wrong[pid] = (ex.wrong[pid] || 0) + 1;
    broadcast({ t:"chat", kind:"sys", text:"✗ " + p.name + ": " + C[id].kr });
    exSyllables(pid, C[id].kr);
  }
  if(exAllDone()){ clearTimeout(G.timer); G.timer = setTimeout(exReveal, 900); }
  else exBroadcast();
}
function exPass(pid){
  const ex = G && G.ex;
  if(!ex || ex.phase !== "play" || pid !== ex.explainer || ex.passed || !G.exQueue.length || Object.keys(ex.solved).length) return;
  G.exQueue.push(ex.card);
  ex.card = G.exQueue.shift(); ex.passed = true; ex.wrong = {}; ex.found = {};
  broadcast({ t:"chat", kind:"sys", text:"⏭ 패스! 새 단어예요 · 힌트도 새로 시작해요" });
  ex.start = Date.now();
  exScheduleHints();
  exBroadcast();
}
function exReveal(){
  const ex = G && G.ex; if(!ex || ex.phase !== "play") return;
  ex.phase = "reveal"; clearTimeout(G.timer); ex.hintTimers.forEach(clearTimeout);
  const solved = Object.entries(ex.solved).map(([pid, pts]) => ({ name: G.players.get(pid) ? G.players.get(pid).name : "?", pts }));
  if(!solved.length) G.miss[ex.card] = (G.miss[ex.card] || 0) + 1;
  const e = G.players.get(ex.explainer);
  G.played.push({ card:ex.card, by: e ? e.name : "?", ok: solved.length > 0 });
  broadcast({ t:"exReveal", n:ex.n, of:G.turns, card:ex.card, by: e ? e.name : "?", solved,
              scores:[...G.players.values()].map(p => ({ pid:p.pid, name:p.name, av:p.av, score:p.score })).sort((a, b) => b.score - a.score) });
  G.timer = setTimeout(exNextTurn, EX_REVEAL_MS);
}

/* ================================ 설명왕: screens ================================
   The play screen is built once per word and then only updated in place, so a half-typed hint or a
   guess being picked is never wiped by someone else's move. */
let EXV = null;
function renderEx(m){
  document.body.classList.add("exmode");
  setChatAvailable(true);
  $("#chatPanel").hidden = true;
  const me = m.explainer === ME.pid;
  if(!EXV || EXV.n !== m.n || EXV.secret !== m.secret || !$("#exFeed")){
    const keepDraft = EXV && $("#exForm input") ? $("#exForm input").value : "";
    EXV = { n:m.n, secret:m.secret, pick:null, m };
    $("#app").innerHTML =
      '<div class="exTop"><span class="who">' + m.n + ' / ' + m.of + ' · 💡 <b>' + esc(m.explainerName) + '</b>' + (me ? " (나)" : "") + '</span>' +
      '<span class="clock" id="exClock"></span>' + (ME.host ? '<button class="mini" id="exEnd" title="게임 끝내기">⏹</button>' : '') +
      '<button class="mini" id="exListBtn">단어 목록</button></div>' +
      '<div class="bar"><i id="exBar" style="animation-duration:' + m.ms + 'ms"></i></div>' +
      // the explainer's card stays small so the chat (where the explaining happens) keeps the screen;
      // the sentence starters fold away behind one button
      (me ? '<div class="card secret"><div class="head"><span class="kr" lang="ko">' + esc(C[m.secret].kr) + '</span>' + (C[m.secret].star ? '<span class="star">★</span>' : '') +
            '<span class="note">내 단어 · 한국어로 설명하세요</span></div>' +
            '<div class="mean" lang="' + hl(LANG) + '">' + esc(full(m.secret)) + '</div>' + (C[m.secret].ex ? '<div class="ex" lang="ko">예: ' + esc(C[m.secret].ex) + '</div>' : '') +
            '<div class="meta" lang="ko"><span>' + esc([posKo(m.secret), sylls(m.secret).length + "글자", placeKo(m.secret)].filter(Boolean).join(" · ")) + '</span>' +
            '<button class="mini" id="exHelp">설명 도움</button><button class="mini" id="exPass">패스</button></div>' +
            '<div class="starters" id="exStarters" lang="ko" hidden>' + explainStarters(m.secret).map(s => '<button data-s="' + esc(s) + '">' + esc(s) + '</button>').join("") + '</div></div>' : '') +
      '<p class="exStatus" id="exStatus"></p>' +
      '<div class="exBox"><div class="feed" id="exFeed"></div><div class="chatIn" id="exIn">' + chatInputHtml("exForm") + '</div></div>';
    bindChatInput($("#exIn"));
    if(keepDraft) $("#exForm input").value = keepDraft;
    if(me) $("#exForm input").placeholder = "힌트를 쓰세요 (단어는 쓰지 마세요)";
    else $("#exForm input").placeholder = "대화하거나 단어를 쓰면 정답 도전!";
    paintFeed($("#exFeed"));
    $("#exListBtn").onclick = () => openWordSheet();
    const ee = $("#exEnd"); if(ee) ee.onclick = endGameEarly;
    const ps = $("#exPass"); if(ps) ps.onclick = () => { if(ME.host) exPass("me"); else ME.conn && ME.conn.send({ t:"pass" }); };
    // a starter goes into the input to be finished, never straight to the chat
    const hb = $("#exHelp"); if(hb) hb.onclick = () => { const st = $("#exStarters"); st.hidden = !st.hidden; hb.textContent = st.hidden ? "설명 도움" : "도움 닫기"; };
    document.querySelectorAll(".starters button").forEach(b => b.onclick = () => {
      const inp = $("#exForm input"); inp.value = b.dataset.s; inp.focus();
      const at = inp.value.indexOf("…"); if(at >= 0) inp.setSelectionRange(at, at + 1);
    });
    clearInterval(renderEx.clock);
    renderEx.clock = setInterval(() => { const c = $("#exClock"); if(!c || !EXV){ clearInterval(renderEx.clock); return; }
      if(IME.on) return;                                   // never touch the page mid-syllable (see IME below)
      const s = Math.max(0, Math.ceil((EXV.endAt - Date.now()) / 1000)) + "s";
      if(c.textContent !== s) c.textContent = s; }, 250);
  }
  EXV.m = m; EXV.endAt = Date.now() + m.ms;
  const ps = $("#exPass"); if(ps) ps.disabled = m.passed || m.solvedNames.length > 0;
  const st = $("#exStatus");
  if(me) st.textContent = m.solvedNames.length ? "맞힌 사람: " + m.solvedNames.join(", ") + " · 계속 설명하세요!" : "아직 아무도 못 맞혔어요 · 쉬운 말로 설명해 보세요";
  else if(m.iSolved) st.textContent = "✓ 맞혔어요! 다른 사람을 기다리는 중… (정답은 채팅에 쓰지 마세요)";
  else if(m.wrongLeft <= 0) st.textContent = "기회를 다 썼어요 · 정답은 곧 나와요";
  else st.innerHTML = (m.mask ? '내가 찾은 글자 <span class="mask" lang="ko">' + esc(m.mask) + '</span><br>' : '') +
    "힌트를 읽고 오른쪽 위 단어 목록에서 고르세요 · 남은 기회 " + m.wrongLeft + "번" + (m.solvedNames.length ? " · 맞힌 사람: " + esc(m.solvedNames.join(", ")) : "");
  if($("#wordSheet")) openWordSheet(true);
}
/* sentence starters for the explainer, fitted to the kind of word; "…" is where they continue */
function explainStarters(id){
  const pos = C[id].pos, out = [];
  if(posKo(id)) out.push(posKo(id) + "예요.");
  if(pos === "verb") out.push("…할 때 이 말을 해요.", "사람이 …하는 거예요.");
  else if(pos === "adjective") out.push("…한 느낌이에요.", "…할 때 이렇게 말해요.");
  else if(pos === "noun") out.push("…에 있는 거예요.", "…할 때 필요한 거예요.");
  else if(pos === "adverb") out.push("… 정도로 하는 거예요.");
  else out.push("…한 상황에서 써요.");
  out.push("비슷한 말은 …예요.", "반대말은 …예요.", sylls(id).length + "글자예요.", "이 단어는 " + placeKo(id) + "에 나왔어요.");
  return out;
}
function openWordSheet(refresh){
  if(!EXV) return;
  const m = EXV.m, me = m.explainer === ME.pid, canGuess = !me && !m.iSolved && m.wrongLeft > 0;
  let sh = $("#wordSheet");
  if(!sh){ if(refresh) return; sh = document.createElement("div"); sh.id = "wordSheet"; sh.className = "sheet"; document.body.appendChild(sh);
    sh.onclick = e => { if(e.target === sh) sh.remove(); }; }
  const done = new Set(m.done);
  sh.innerHTML = '<div class="inner"><header><span>단어 목록 · ' + m.words.length + '</span><button class="mini" id="wsClose">닫기</button></header>' +
    '<div class="chips">' + m.words.map(id => '<button class="wchip' + (EXV.pick === id ? " sel" : "") + '" data-id="' + id + '" lang="ko"' +
      (done.has(id) || !canGuess ? " disabled" : "") + '>' + esc(C[id].kr) + '</button>').join("") + '</div>' +
    '<div class="foot">' + (canGuess ? '<button class="btn gold" id="wsGo" style="margin:0"' + (EXV.pick ? "" : " disabled") + '>' +
      (EXV.pick ? esc(C[EXV.pick].kr) + " · 이 단어로 맞히기" : "단어를 고르세요") + '</button>'
      : '<p class="note" style="margin:0">' + (me ? "설명하는 사람은 목록을 보기만 해요." : "이번 단어는 더 고를 수 없어요.") + '</p>') + '</div></div>';
  $("#wsClose").onclick = () => sh.remove();
  sh.querySelectorAll(".wchip").forEach(b => b.onclick = () => { EXV.pick = b.dataset.id; openWordSheet(true); });
  const go = $("#wsGo");
  if(go) go.onclick = () => { const id = EXV.pick; if(!id) return; EXV.pick = null; sh.remove();
    if(ME.host) exGuess("me", id); else ME.conn && ME.conn.send({ t:"guess", card:id }); };
}
function renderExReveal(m){
  const sh = $("#wordSheet"); if(sh) sh.remove();
  document.body.classList.remove("exmode");
  EXV = null;
  const c = C[m.card];
  $("#app").innerHTML = '<div class="top"><span>설명왕 · ' + m.n + ' / ' + m.of + '</span><span>다음 단어까지 잠시…</span></div>' +
    '<div class="card" style="text-align:center"><div class="note">정답 · 설명: ' + esc(m.by) + '</div>' +
    '<div class="prompt" lang="ko" style="padding:10px 0 6px">' + esc(c.kr) + (c.star ? ' <span class="star">★</span>' : '') + '</div>' +
    '<div class="full" lang="' + hl(LANG) + '" style="margin-top:0;font-size:17px">' + esc(full(m.card)) + '</div>' +
    (c.ex ? '<div class="full"><div class="ex" lang="ko">' + esc(c.ex) + '</div></div>' : '') + '</div>' +
    '<div class="banner ' + (m.solved.length ? "o" : "x") + '">' + (m.solved.length ? "✓ " + m.solved.map(s => esc(s.name)).join(", ") : "아무도 못 맞혔어요 · 이 단어는 다음에 또 나와요") + '</div>' +
    '<div class="card" style="margin-top:14px"><h2>점수</h2><table>' + m.scores.map(p => '<tr><td>' + avHtml(p.av) + esc(p.name) + (p.pid === ME.pid ? " (나)" : "") +
      '</td><td class="s">' + p.score + '</td></tr>').join("") + '</table></div>';
}

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && ME.host && G && !G.solo && G.phase === "play" && !G.warnedVisible){
    G.warnedVisible = true;                                   // once per game, it covered the chat every time
    toast("호스트는 이 창을 계속 열어 두세요 · 다른 탭에 가면 게임이 느려져요", 4000);
  }
});
window.addEventListener("beforeunload", e => { if(ME.host && G && !G.solo && G.players.size > 1){ e.preventDefault(); e.returnValue = ""; } });

/* the host can stop a game at any moment: everyone gets the end screen with the scores so far, and the
   room stays open (대기실로 starts the next game with the same people) */
function endGameEarly(){
  if(!ME.host || !G || G.phase !== "play") return;
  if(!confirm("게임을 지금 끝낼까요? 지금까지 점수로 결과가 나와요.")) return;
  clearTimeout(G.timer);
  if(G.ex){ (G.ex.hintTimers || []).forEach(clearTimeout); if(G.ex.phase === "play") G.ex.phase = "reveal"; }
  if(G.cur) G.cur.done = true;
  const sh = $("#wordSheet"); if(sh) sh.remove();
  broadcast({ t:"chat", kind:"sys", text:"⏹ 호스트가 게임을 끝냈어요" });
  finish(true);
}
$("#hostEnd").onclick = endGameEarly;

/* Back button / back swipe guard (same as 단어 바): while in a room, "back" asks first. */
const inRoom = () => !!(ME.ws || G);
function armBackGuard(){ if(!(history.state && history.state.together)) history.pushState({ together:1 }, ""); }
window.addEventListener("popstate", () => {
  if(!inRoom()) return;
  if(confirm(ME.host && G && !G.solo ? "호스트가 나가면 게임이 끝나요. 정말 나갈까요?" : "게임에서 나갈까요?")) leave();
  else armBackGuard();
});
const _newGame = newGame, _joinRoom = joinRoom;
newGame = function(){ armBackGuard(); return _newGame.apply(this, arguments); };
joinRoom = function(){ armBackGuard(); return _joinRoom.apply(this, arguments); };

if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
home();
</script>
