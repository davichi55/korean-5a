<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korean 5A — Vocabulary</title>
<meta property="og:title" content="Korean 5A 단어장 · Vocabulary">
<meta property="og:description" content="8과 · 비디오/읽기/말하기 · 706 words · English · 简体 · 繁體 · ไทย · Русский. Pick your language, pick your sections, study.">
<meta property="og:type" content="website">
<meta name="description" content="Sogang Korean 5A vocabulary — 8 chapters, video + reading + speaking sections, in English, Chinese, Thai and Russian.">
<meta name="theme-color" content="#0f1420">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2e; --card:#1c2740; --card2:#223052;
    --line:#2c3a5a; --txt:#eaf0fb; --dim:#96a3c2; --accent:#5b8cff;
    --gold:#ffcf5c; --good:#37d18f; --warn:#ffb15c; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",
      "Noto Sans KR","Microsoft YaHei","PingFang SC","Noto Sans SC","Leelawadee UI","Noto Sans Thai",Tahoma,Roboto,sans-serif;
    background:linear-gradient(180deg,#0f1420,#0c1019 60%);color:var(--txt);
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  /* translations get the right script font first */
  [lang="zh"],[lang="zh-Hans"]{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","Hiragino Sans GB",sans-serif}
  [lang="zh-Hant"]{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Hiragino Sans TC","Microsoft YaHei",sans-serif}
  [lang="th"]{font-family:"Leelawadee UI","Noto Sans Thai","Tahoma","Sarabun",sans-serif;line-height:1.5}
  header{
    position:sticky;top:0;z-index:20;background:rgba(15,20,32,.92);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px 10px;
  }
  .titlebar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:13px}
  .langsw{margin-left:auto;display:flex;gap:4px}
  .langsw button{padding:5px 9px;font-size:12px;border-radius:8px}
  .controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .search{
    flex:1;min-width:160px;background:var(--bg2);border:1px solid var(--line);
    color:var(--txt);border-radius:10px;padding:9px 12px;font-size:15px;outline:none;
  }
  .search::placeholder{color:#6b7898}
  .btn{
    background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer;user-select:none;white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg .btn{border:0;border-radius:0}
  /* ---- chapter / section picker ---- */
  .picker{padding:10px 16px 4px;border-bottom:1px solid var(--line);background:var(--bg2)}
  .pickhdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;cursor:pointer;user-select:none}
  .pickhdr:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
  .pickhdr .t{font-size:13px;color:var(--dim)}
  .pickhdr .cnt{font-size:12px;color:var(--good);margin-left:auto}
  .pickhdr .mini{font-size:12px;padding:5px 9px;cursor:pointer}
  .pickhdr .chev{font-size:10px;color:var(--dim);display:inline-block;transition:transform .15s;width:10px}
  /* collapsed: the chapter rows fold away, the summary line in the header stays */
  .picker.collapsed .chev{transform:rotate(-90deg)}
  .picker.collapsed #chapters{display:none}
  .picker.collapsed .pickhdr{margin-bottom:0}
  .picker.collapsed{padding-bottom:8px}
  .chrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 0}
  .chname{
    font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);min-width:64px;text-align:center;
  }
  .chname.on{background:#2a3d6b;border-color:var(--accent)}
  .chname.part{border-color:var(--accent);background:var(--card)}
  .chtheme{font-size:11px;color:#7f8db0;margin-right:4px}
  .chip{
    font-size:12.5px;padding:5px 10px;border-radius:999px;cursor:pointer;
    background:var(--bg);border:1px solid var(--line);color:var(--dim);
  }
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .n{opacity:.7;margin-left:5px;font-size:11px}
  /* ---- browse ---- */
  main{padding:14px 16px 40px;max-width:1100px;margin:0 auto}
  .deckhdr{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px;font-weight:700;font-size:15px}
  .deckhdr .ds{color:var(--dim);font-weight:400;font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .vc{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 12px;min-height:96px;cursor:pointer;position:relative;
    display:flex;flex-direction:column;justify-content:center;transition:.15s;overflow:hidden;
  }
  .vc:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
  .vc .kr{font-size:20px;font-weight:700;line-height:1.3;margin-top:12px}
  .vc .grp{font-size:10.5px;color:#7f8db0;margin-top:14px;line-height:1.3}
  .vc .grp+.kr{margin-top:2px}
  .exen{color:#7f8db0}
  .vc .tr{color:var(--good);font-size:14px;margin-top:8px;line-height:1.35;display:none}
  .vc .tr.none{color:var(--warn);font-style:italic}
  .vc .ex{color:var(--dim);font-size:12px;margin-top:6px;line-height:1.35;display:none}
  .vc.revealed .tr,.vc.revealed .ex{display:block}
  .vc.revealed .kr{color:var(--accent)}
  .vc.known{opacity:.45}
  .star{position:absolute;top:8px;right:10px;color:var(--gold);font-size:13px}
  .pos{position:absolute;top:8px;left:12px;color:#7f8db0;font-size:10px;letter-spacing:.4px;text-transform:lowercase;font-style:italic}
  .tap{position:absolute;bottom:8px;right:10px;color:#4a5578;font-size:10px}
  .vc.revealed .tap{display:none}
  /* ---- flashcards ---- */
  #flash{display:none;flex-direction:column;align-items:center;padding-top:16px}
  .fcard{
    width:100%;max-width:460px;min-height:280px;background:linear-gradient(160deg,var(--card),var(--card2));
    border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px 24px;cursor:pointer;position:relative;user-select:none;
  }
  .fcard .fkr{font-size:44px;font-weight:800;line-height:1.25}
  .fcard .ftr{font-size:22px;color:var(--good);margin-top:20px;display:none;line-height:1.4}
  .fcard .ftr.none{color:var(--warn);font-style:italic;font-size:16px}
  .fcard .fex{font-size:14px;color:var(--dim);margin-top:14px;display:none;line-height:1.45}
  .fcard.flip .ftr,.fcard.flip .fex{display:block}
  .fcard .hint{position:absolute;bottom:14px;left:0;right:0;color:#4a5578;font-size:12px}
  .fcard.flip .hint{display:none}
  .fstar{position:absolute;top:14px;right:18px;color:var(--gold);font-size:16px}
  .fpos{position:absolute;top:16px;left:20px;color:#8593b8;font-size:13px;font-style:italic}
  .fmeta{color:var(--dim);font-size:12px;margin-top:4px}
  .fnav{display:flex;gap:10px;margin-top:18px;width:100%;max-width:460px}
  .fnav .btn{flex:1;text-align:center;padding:13px;font-size:15px}
  .progress{width:100%;max-width:460px;height:6px;background:var(--bg2);border-radius:3px;margin-top:16px;overflow:hidden}
  .progress>i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
  .counter{color:var(--dim);font-size:13px;margin-top:10px}
  .empty{color:var(--dim);text-align:center;padding:60px 20px;font-size:15px}
  footer{color:#55617f;font-size:11px;text-align:center;padding:20px}
  /* ---- first-run language picker ---- */
  #langpick{
    position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.96);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  #langpick[hidden]{display:none}
  .lpbox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 26px;max-width:440px;width:100%;box-shadow:var(--shadow);text-align:center}
  .lpbox h2{margin:0 0 6px;font-size:22px}
  .lpbox p{margin:0 0 20px;color:var(--dim);font-size:14px}
  .lpbox .opt{
    display:block;width:100%;padding:16px;margin:10px 0;border-radius:14px;font-size:20px;font-weight:700;
    background:var(--bg2);border:1px solid var(--line);color:var(--txt);cursor:pointer;
  }
  .lpbox .opt:hover{border-color:var(--accent);background:#233256}
  .lpbox .opt small{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-top:3px}
  @media(max-width:520px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
    .fcard .fkr{font-size:38px}
    h1{font-size:17px}
  }
</style>
</head>
<body>

<div id="langpick" hidden>
  <div class="lpbox">
    <h2>언어를 선택하세요</h2>
    <p>Choose your language · 选择你的语言 · เลือกภาษาของคุณ</p>
    <div id="lpopts"></div>
  </div>
</div>

<header>
  <div class="titlebar">
    <h1>Korean 5A — <span data-i="vocab">Vocabulary</span></h1>
    <span class="sub" id="totsub"></span>
    <div class="langsw" id="langsw"></div>
  </div>
  <div class="controls">
    <input class="search" id="search" data-i="search" placeholder="Search…">
    <div class="seg">
      <button class="btn active" id="mBrowse" data-i="browse">Browse</button>
      <button class="btn" id="mFlash" data-i="flash">Flashcards</button>
    </div>
    <button class="btn" id="starOnly">★ <span data-i="priority">Priority</span></button>
    <button class="btn" id="revealAll" data-i="reveal">Reveal all</button>
  </div>
</header>

<div class="picker" id="picker">
  <div class="pickhdr" id="pickHdr" role="button" tabindex="0" aria-controls="chapters" aria-expanded="true">
    <span class="chev" aria-hidden="true">▼</span>
    <span class="t" data-i="pick">Pick the chapters and sections you want to preview</span>
    <button class="btn mini" id="selAll" data-i="selall">All</button>
    <button class="btn mini" id="selNone" data-i="selnone">None</button>
    <span class="cnt" id="selcnt"></span>
  </div>
  <div id="chapters"></div>
</div>

<main>
  <div id="browse"></div>
  <div id="flash">
    <div class="fcard" id="fcard">
      <span class="fpos" id="fpos"></span>
      <span class="fstar" id="fstar">★</span>
      <div class="fkr" id="fkr"></div>
      <div class="ftr" id="ftr"></div>
      <div class="fex" id="fex"></div>
      <div class="hint" data-i="tapflip">tap to flip</div>
    </div>
    <div class="fmeta" id="fmeta"></div>
    <div class="progress"><i id="pbar"></i></div>
    <div class="counter" id="counter"></div>
    <div class="fnav">
      <button class="btn" id="prevBtn">‹ <span data-i="prev">Prev</span></button>
      <button class="btn" id="knowBtn">✓ <span data-i="gotit">Got it</span></button>
      <button class="btn" id="nextBtn"><span data-i="next">Next</span> ›</button>
    </div>
    <div class="fnav">
      <button class="btn" id="shuffleBtn" style="flex:1">🔀 <span data-i="shuffle">Shuffle</span></button>
      <button class="btn" id="resetBtn" style="flex:1">↺ <span data-i="reset">Reset known</span></button>
    </div>
  </div>
</main>
<footer data-i="foot">Tap a card to see the meaning. ★ marks priority words. Sogang Korean 5A.</footer>

<script>

const LANGS = DATA.languages.map(l=>l.code);
const BCP47 = {en:"en", zh:"zh-Hans", zht:"zh-Hant", th:"th", ru:"ru"};     // for lang= attributes (font selection)
const htmlLang = code => BCP47[code] || code;
const store = {
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){}},
};

/* ---------- flatten ---------- */
const ALL=[], SECTIONS=[];
DATA.chapters.forEach(ch=>ch.sections.forEach(sec=>{
  SECTIONS.push({id:sec.id,chId:ch.id,chTitle:ch.title,title:sec.title,n:sec.cards.length});
  sec.cards.forEach(c=>ALL.push({...c,secId:sec.id,chId:ch.id,chTitle:ch.title,secTitle:sec.title}));
}));

const state={lang:null,mode:"browse",star:false,q:"",revealAll:false,
             sel:new Set(SECTIONS.map(s=>s.id)),known:new Set(),fIdx:0,fList:[],fFlip:false};
try{const k=JSON.parse(store.get("k5a_known")||"[]");k.forEach(x=>state.known.add(x));}catch(e){}
try{const s=JSON.parse(store.get("k5a_sel")||"null");if(Array.isArray(s)&&s.length){state.sel=new Set(s.filter(id=>SECTIONS.some(x=>x.id===id)));}}catch(e){}

const $=s=>document.querySelector(s);
const T=k=>(I18N[state.lang]||I18N.en)[k]||I18N.en[k]||k;
const trOf=c=>(c.tr&&c.tr[state.lang])||"";
function esc(s){return String(s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));}

/* ---------- language ---------- */
function applyLang(code,save){
  state.lang=code; if(save)store.set("k5a_lang",code);
  document.documentElement.setAttribute("data-lang",code);
  document.querySelectorAll("[data-i]").forEach(el=>{
    const k=el.dataset.i;
    if(el.tagName==="INPUT")el.placeholder=T(k); else el.textContent=(k==="reveal"&&state.revealAll)?T("hide"):T(k);
  });
  const sw=$("#langsw");sw.innerHTML="";
  DATA.languages.forEach(l=>{const b=document.createElement("button");b.className="btn"+(l.code===code?" active":"");
    b.textContent=l.short||l.native;b.setAttribute("lang",htmlLang(l.code));b.onclick=()=>{applyLang(l.code,true);render();};sw.appendChild(b);});
  $("#totsub").textContent=ALL.length+" "+T("words")+" · "+SECTIONS.length+" "+T("sections");
  $("#langpick").hidden=true;
}
function showLangPick(){
  const box=$("#lpopts");box.innerHTML="";
  DATA.languages.forEach(l=>{const b=document.createElement("button");b.className="opt";b.setAttribute("lang",htmlLang(l.code));
    b.innerHTML=esc(l.native)+"<small>"+esc(l.name)+"</small>";b.onclick=()=>{applyLang(l.code,true);render();};box.appendChild(b);});
  $("#langpick").hidden=false;
}

/* ---------- chapter / section picker ---------- */
function buildPicker(){
  const wrap=$("#chapters");wrap.innerHTML="";
  DATA.chapters.forEach(ch=>{
    const row=document.createElement("div");row.className="chrow";
    const ids=ch.sections.map(s=>s.id), on=ids.filter(id=>state.sel.has(id)).length;
    const name=document.createElement("span");name.className="chname"+(on===ids.length?" on":on?" part":"");
    name.textContent=ch.title;name.title=ch.theme||"";
    name.onclick=()=>{const all=ids.every(id=>state.sel.has(id));ids.forEach(id=>all?state.sel.delete(id):state.sel.add(id));selChanged();};
    row.appendChild(name);
    if(ch.theme){const t=document.createElement("span");t.className="chtheme";t.textContent=ch.theme;row.appendChild(t);}
    ch.sections.forEach(sec=>{
      const c=document.createElement("span");c.className="chip"+(state.sel.has(sec.id)?" on":"");
      c.innerHTML=esc(sec.title)+'<span class="n">'+sec.cards.length+'</span>';
      c.onclick=()=>{state.sel.has(sec.id)?state.sel.delete(sec.id):state.sel.add(sec.id);selChanged();};
      row.appendChild(c);
    });
    wrap.appendChild(row);
  });
  // Summary stays visible when the picker is folded, so name the sections while that is still short.
  const n=filtered().length, k=state.sel.size;
  const what = (k>0&&k<=2)
    ? SECTIONS.filter(s=>state.sel.has(s.id)).map(s=>s.chTitle+" · "+s.title).join(", ")
    : k+" "+T("sections")+" "+T("selected");
  $("#selcnt").textContent=what+" · "+n+" "+T("words");
}
function selChanged(){store.set("k5a_sel",JSON.stringify([...state.sel]));state.fIdx=0;buildPicker();render();}
$("#selAll").onclick=()=>{SECTIONS.forEach(s=>state.sel.add(s.id));selChanged();};
$("#selNone").onclick=()=>{state.sel.clear();selChanged();};

/* ---------- picker fold ---------- */
function setPicker(open,save){
  $("#picker").classList.toggle("collapsed",!open);
  $("#pickHdr").setAttribute("aria-expanded",open?"true":"false");
  if(save)store.set("k5a_pickopen",open?"1":"0");
}
$("#pickHdr").onclick=e=>{ if(e.target.closest("button"))return;   // All / None must not fold it
  setPicker($("#picker").classList.contains("collapsed"),true); };
$("#pickHdr").onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();
  setPicker($("#picker").classList.contains("collapsed"),true);} };

/* ---------- filtering ---------- */
function filtered(){
  const q=state.q.trim().toLowerCase();
  return ALL.filter(c=>{
    if(!state.sel.has(c.secId))return false;
    if(state.star&&!c.star)return false;
    if(q){
      const hay=[c.kr,trOf(c),c.tr&&c.tr.en||"",c.ex||""].join(" ").toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
}

/* ---------- browse ---------- */
function trHtml(c,cls){
  const t=trOf(c);
  return t?'<div class="'+cls+'" lang="'+htmlLang(state.lang)+'">'+esc(t)+'</div>'
          :'<div class="'+cls+' none">— '+esc(T("untr"))+(c.tr&&c.tr.en?' · '+esc(c.tr.en):'')+'</div>';
}
function renderBrowse(){
  const list=filtered(),wrap=$("#browse");wrap.innerHTML="";
  if(!list.length){wrap.innerHTML='<div class="empty">'+esc(T("nomatch"))+'</div>';return;}
  const groups={};list.forEach(c=>{(groups[c.secId]=groups[c.secId]||[]).push(c);});
  SECTIONS.forEach(s=>{
    if(!groups[s.id])return;
    const h=document.createElement("div");h.className="deckhdr";
    h.innerHTML=esc(s.chTitle)+' · '+esc(s.title)+'<span class="ds">'+groups[s.id].length+' '+esc(T("words"))+'</span>';
    wrap.appendChild(h);
    const g=document.createElement("div");g.className="grid";
    groups[s.id].forEach(c=>{
      const el=document.createElement("div");
      el.className="vc"+(state.revealAll?" revealed":"")+(state.known.has(c.id)?" known":"");
      el.innerHTML=(c.pos?'<span class="pos">'+esc(c.pos)+'</span>':'')+(c.star?'<span class="star">★</span>':'')+
        (c.grp?'<div class="grp" lang="ko">'+esc(c.grp)+'</div>':'')+
        '<div class="kr" lang="ko">'+esc(c.kr)+'</div>'+trHtml(c,"tr")+
        (c.ex?'<div class="ex" lang="ko">'+esc(c.ex)+(c.exEn?'<span class="exen"> — '+esc(c.exEn)+'</span>':'')+'</div>':'')+'<span class="tap">'+esc(T("tap"))+'</span>';
      el.onclick=()=>el.classList.toggle("revealed");
      g.appendChild(el);
    });
    wrap.appendChild(g);
  });
}

/* ---------- flashcards ---------- */
function buildFlashList(){state.fList=filtered().filter(c=>!state.known.has(c.id));if(state.fIdx>=state.fList.length)state.fIdx=0;}
function showCard(){
  const list=state.fList,fc=$("#fcard");
  if(!list.length){
    $("#fkr").textContent="🎉";$("#ftr").textContent=filtered().length?T("alldone"):T("nomatch");
    $("#ftr").className="ftr";$("#ftr").style.display="block";$("#fex").style.display="none";
    $("#fstar").style.display="none";$("#fpos").textContent="";$("#fmeta").textContent="";
    $("#counter").textContent=filtered().length?T("again"):"";$("#pbar").style.width="100%";return;
  }
  const c=list[state.fIdx];fc.classList.remove("flip");state.fFlip=false;
  $("#fkr").textContent=c.kr;
  const t=trOf(c);$("#ftr").textContent=t||("— "+T("untr")+(c.tr&&c.tr.en?" · "+c.tr.en:""));
  $("#ftr").className="ftr"+(t?"":" none");$("#ftr").setAttribute("lang",htmlLang(state.lang));$("#ftr").style.display="";
  $("#fex").textContent=(c.ex||"")+(c.exEn?" — "+c.exEn:"");$("#fex").style.display=c.ex?"":"none";
  $("#fstar").style.display=c.star?"":"none";$("#fpos").textContent=c.pos||"";
  $("#fmeta").textContent=c.chTitle+" · "+c.secTitle+(c.grp?" · "+c.grp:"");
  $("#counter").textContent=(state.fIdx+1)+" / "+list.length+"   ·   "+state.known.size+" "+T("learned");
  $("#pbar").style.width=(state.fIdx/list.length*100)+"%";
}
function renderFlash(){buildFlashList();showCard();}
function saveKnown(){store.set("k5a_known",JSON.stringify([...state.known]));}
$("#fcard").onclick=()=>{state.fFlip=!state.fFlip;$("#fcard").classList.toggle("flip",state.fFlip);};
$("#nextBtn").onclick=()=>{if(!state.fList.length)return;state.fIdx=(state.fIdx+1)%state.fList.length;showCard();};
$("#prevBtn").onclick=()=>{if(!state.fList.length)return;state.fIdx=(state.fIdx-1+state.fList.length)%state.fList.length;showCard();};
$("#knowBtn").onclick=()=>{const l=state.fList;if(!l.length)return;state.known.add(l[state.fIdx].id);saveKnown();renderFlash();};
$("#shuffleBtn").onclick=()=>{buildFlashList();for(let i=state.fList.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.fList[i],state.fList[j]]=[state.fList[j],state.fList[i]];}state.fIdx=0;showCard();};
$("#resetBtn").onclick=()=>{state.known.clear();saveKnown();state.fIdx=0;render();};
document.addEventListener("keydown",e=>{
  if(state.mode!=="flash"||e.target===$("#search"))return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();$("#fcard").click();}
  else if(e.key==="ArrowRight")$("#nextBtn").click();
  else if(e.key==="ArrowLeft")$("#prevBtn").click();
  else if(e.key.toLowerCase()==="k")$("#knowBtn").click();
});

/* ---------- controls ---------- */
$("#mBrowse").onclick=()=>setMode("browse");
$("#mFlash").onclick=()=>setMode("flash");
function setMode(m){
  state.mode=m;
  $("#mBrowse").classList.toggle("active",m==="browse");$("#mFlash").classList.toggle("active",m==="flash");
  $("#browse").style.display=m==="browse"?"":"none";$("#flash").style.display=m==="flash"?"flex":"none";
  $("#revealAll").style.display=m==="browse"?"":"none";render();
}
$("#starOnly").onclick=()=>{state.star=!state.star;$("#starOnly").classList.toggle("active",state.star);state.fIdx=0;render();};
$("#revealAll").onclick=()=>{state.revealAll=!state.revealAll;$("#revealAll").classList.toggle("active",state.revealAll);$("#revealAll").textContent=state.revealAll?T("hide"):T("reveal");renderBrowse();};
$("#search").oninput=e=>{state.q=e.target.value;state.fIdx=0;render();};

function render(){buildPicker();if(state.mode==="browse")renderBrowse();else renderFlash();}

/* ---------- start ---------- */
// First visit: folded on a phone (nine rows of chips would push the words off screen), open on a
// wide screen. After that the reader's own choice wins.
const savedOpen=store.get("k5a_pickopen");
setPicker(savedOpen===null||savedOpen===undefined ? window.innerWidth>=760 : savedOpen==="1", false);
const savedLang=store.get("k5a_lang");
if(savedLang&&LANGS.includes(savedLang)){applyLang(savedLang,false);render();}
else{applyLang("en",false);render();showLangPick();}
</script>
