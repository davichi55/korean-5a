<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Korean 5A — 중간시험 연습</title>
<meta name="description" content="Sogang Korean 5A mock midterm: 5급 말하기 어휘·문법 + 대화, 39 questions, 60 points, a new test every time.">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="exam.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="5A 시험 연습">
<link rel="apple-touch-icon" href="icon-exam-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2e; --card:#1c2740; --card2:#223052; --paper:#f7f4ec; --ink:#1d2230;
    --line:#2c3a5a; --txt:#eaf0fb; --dim:#96a3c2; --accent:#5b8cff; --gold:#ffcf5c; --good:#37d18f; --bad:#ff6b7a; --fire:#ff8a3d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Microsoft YaHei","PingFang SC","Leelawadee UI",Tahoma,Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -200px,#1b2747,transparent),linear-gradient(180deg,#0f1420,#0b0f18);color:var(--txt);min-height:100vh;overflow-x:hidden}
  .wrap{max-width:680px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--accent)}
  .hidden{display:none!important}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .home{border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--dim);text-decoration:none;font-size:14px}
  .top h1{font-size:19px;margin:0;flex:1}
  .iconbtn{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:16px}
  .chip{background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 12px;font-size:14px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .langs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
  .hero{background:linear-gradient(135deg,#23315a,#1a2440);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .hero h2{margin:0 0 4px;font-size:22px}
  .hero p{margin:0;color:var(--dim);font-size:14px;line-height:1.5}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:rgba(0,0,0,.18);border-radius:12px;padding:8px;text-align:center}
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--dim)}
  .label{font-size:13px;color:var(--dim);margin:14px 0 6px}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mode{text-align:left;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2)}
  .mode b{display:block;font-size:16px}
  .mode small{color:var(--dim);font-size:12.5px;line-height:1.35;display:block;margin-top:3px}
  .mode.on{border-color:var(--accent);background:linear-gradient(135deg,rgba(91,140,255,.25),rgba(155,123,255,.18))}
  .chs{display:flex;flex-wrap:wrap;gap:6px}
  .go{display:block;width:100%;margin-top:18px;padding:16px;border:0;border-radius:16px;font-size:19px;font-weight:800;color:#fff;background:linear-gradient(135deg,#5b8cff,#8a6bff);box-shadow:0 10px 26px rgba(91,140,255,.35)}
  .go:disabled{opacity:.45}
  .note{color:var(--dim);font-size:12.5px;margin-top:14px;line-height:1.5}

  /* exam paper */
  .hud{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .prog{flex:1;height:10px;background:#0d1322;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--good),#7af0c0);transition:width .35s}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold);min-width:58px;text-align:right}
  .timer.low{color:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.5}}
  .combo{font-weight:800;color:var(--fire);min-width:44px;text-align:right}
  .paper{background:var(--paper);color:var(--ink);border-radius:14px;padding:18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);line-height:1.7}
  .sec{font-size:14.5px;font-weight:700;color:#3a3f52;border-bottom:1px dashed #cfc8b6;padding-bottom:8px;margin-bottom:12px}
  .qn{font-weight:800;margin-right:6px}
  .stem{font-size:18.5px;word-break:keep-all}
  .stem u{text-decoration-thickness:2px;text-underline-offset:4px}
  .box{border:1.6px solid #333;padding:10px 14px;margin:10px 0;display:flex;flex-wrap:wrap;gap:18px;justify-content:center;font-size:17px;font-weight:600}
  .bogi{border:1.4px solid #555;border-radius:10px;padding:10px 12px;margin:8px 0 12px;font-size:15.5px;background:#fffdf6}
  .opts{display:grid;gap:8px;margin-top:12px}
  .opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:#fff;border:1.5px solid #d7d0bf;border-radius:12px;padding:10px 12px;font-size:17px;color:var(--ink)}
  .opt .n{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #888;display:grid;place-items:center;font-size:13px;font-weight:700}
  .opt.sel{border-color:var(--accent);background:#e8eeff}
  .opt.sel .n{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt.right{border-color:var(--good);background:#dff7ec}
  .opt.wrong{border-color:var(--bad);background:#ffe6e9}
  .two{display:flex;gap:10px;margin-top:12px}
  .two .opt{justify-content:center}
  .blank{display:inline-block;min-width:110px;border-bottom:2px solid #333;margin:0 4px}
  input.ans,textarea.ans{width:100%;margin-top:12px;background:#fff;border:1.5px solid #c9c1ad;border-radius:10px;padding:10px 12px;font-size:17px;color:var(--ink)}
  textarea.ans{min-height:110px;resize:vertical;line-height:1.6}
  input.ans:focus,textarea.ans:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .dlg{margin:8px 0;font-size:16.5px}
  .dlg div{margin:3px 0}
  .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:12px}
  .mcol{display:grid;gap:8px;align-content:start}
  .mi{background:#fff;border:1.5px solid #d7d0bf;border-radius:10px;padding:9px 10px;font-size:16.5px;color:var(--ink);text-align:left;position:relative}
  .mi.sel{border-color:var(--accent);background:#e8eeff}
  .mi .tag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;border-radius:999px;padding:1px 7px;color:#fff}
  .mi.right{border-color:var(--good);background:#dff7ec}
  .mi.wrong{border-color:var(--bad);background:#ffe6e9}
  .fb{margin-top:12px;border-radius:12px;padding:10px 12px;background:#efe9da;font-size:15px;line-height:1.55}
  .fb .h{font-weight:800}
  .fb.good .h{color:#178a58}.fb.bad .h{color:#c23a4b}
  .model{white-space:pre-wrap;background:#fff;border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;margin-top:6px}
  .marks{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .marks button{flex:1;min-width:90px;padding:10px;border-radius:10px;border:1.5px solid #bdb5a2;background:#fff;color:var(--ink);font-weight:700}
  .marks button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .nav{display:flex;gap:10px;margin-top:12px}
  .nav button{flex:1;padding:13px;border-radius:14px;border:0;font-weight:800;font-size:16px}
  .nav .prev{background:var(--bg2);border:1px solid var(--line)}
  .nav .next{background:var(--accent);color:#fff}
  .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
  .dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);font-size:12px;color:var(--dim)}
  .dot.done{background:#2a3a63;color:var(--txt)}
  .dot.cur{outline:2px solid var(--gold)}
  .override{margin-top:8px;font-size:13.5px;background:none;border:1px dashed #9a927d;border-radius:8px;padding:6px 10px;color:#5b5440}
  /* results */
  .score{text-align:center;margin:8px 0}
  .score .big{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#ffcf5c,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .score .of{color:var(--dim);font-size:18px}
  .grade{text-align:center;font-size:20px;font-weight:800;margin-top:2px}
  .rows{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .row:first-child{border-top:0}
  .row b{font-variant-numeric:tabular-nums}
  .ghost{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);font-weight:700;font-size:16px}
  .float{position:fixed;pointer-events:none;font-weight:900;font-size:24px;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.6);z-index:30;animation:rise 1s ease-out forwards}
  @keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:29}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <a class="home" href="index.html">← 5A</a>
    <h1>📝 중간시험 연습 <span style="color:var(--dim);font-weight:500;font-size:14px">· Mock exam</span></h1>
    <button class="iconbtn" id="mute">🔊</button>
  </div>

  <section id="start">
    <div class="langs" id="langs"></div>
    <div class="hero">
      <h2>5급 말하기 · 어휘·문법 / 대화</h2>
      <p id="tIntro"></p>
      <div class="stats">
        <div class="stat"><b id="sTests">0</b><span id="tTests"></span></div>
        <div class="stat"><b id="sBest">–</b><span id="tBest"></span></div>
        <div class="stat"><b id="sLast">–</b><span id="tLast"></span></div>
      </div>
    </div>
    <div class="label" id="tMode"></div>
    <div class="modes" id="modes"></div>
    <div class="label" id="tCh"></div>
    <div class="chs" id="chs"></div>
    <button class="go" id="go"></button>
    <p class="note" id="tNote"></p>
  </section>

  <section id="exam" class="hidden">
    <div class="hud">
      <button class="iconbtn" id="quit">✕</button>
      <div class="prog"><i id="progFill"></i></div>
      <div class="combo hidden" id="combo">🔥0</div>
      <div class="timer" id="timer"></div>
    </div>
    <div class="paper" id="paper"></div>
    <div class="nav">
      <button class="prev" id="prev">←</button>
      <button class="next" id="next"></button>
    </div>
    <div class="dots" id="dots"></div>
  </section>

  <section id="mark" class="hidden"></section>
  <section id="result" class="hidden"></section>
</div>

<script>
const DATA = {"chapters":[{"n":1,"title":"1과"},{"n":2,"title":"2과"},{"n":3,"title":"3과"},{"n":4,"title":"4과"},{"n":5,"title":"5과"},{"n":6,"title":"6과"},{"n":7,"title":"7과"},{"n":8,"title":"8과"}],"words":[{"kr":"막돼먹다","ch":1,"s":"어른 앞에서도 인사를 안 하는 [[예의가 없고 행동이 나쁜]] 사람이라서 다들 싫어해요.","a":"막돼먹은","w":["진지한","서먹한","난처한"],"en":"Everybody dislikes him because he is a rude, ill-mannered person who doesn't even greet his elders.","gl":"to be rude, ill-mannered, badly behaved (often implies lack of basic decency)"},{"kr":"탈출하다","ch":1,"s":"불이 나자 사람들이 건물에서 [[위험한 곳을 벗어나 밖으로 도망쳤어요]].","a":"탈출했어요","w":["도전했어요","몰두했어요","발전했어요"],"en":"When the fire broke out, people escaped from the building.","gl":"to escape, to break out, to get away"},{"kr":"소름","ch":1,"s":"그 영화의 마지막 장면을 보고 온몸에 [[무섭거나 놀랄 때 피부에 작게 올라오는 것]]이 돋았어요.","a":"소름","w":["환청","식중독","소란"],"en":"I got goosebumps all over my body when I saw the last scene of that movie.","gl":"goosebumps, chills (from fear, shock, or strong emotion)"},{"kr":"바짝","ch":1,"s":"버스가 너무 붐벼서 모르는 사람이 내 옆에 [[아주 가깝게]] 붙어 섰어요.","a":"바짝","w":["설마","반드시","끊임없이"],"en":"The bus was so crowded that a stranger stood pressed right up against me.","gl":"closely, tightly, right up against; also \"completely / extremely\" depending on context"},{"kr":"야심","ch":1,"s":"그는 언젠가 회사의 사장이 되겠다는 [[높은 자리에 올라 크게 성공하고 싶은 마음]]을 가지고 있어요.","a":"야심","w":["충격","비결","이력"],"en":"He has the ambition to become the company president someday.","gl":"ambition (often strong or big goals)"},{"kr":"줄줄이","ch":1,"s":"새로 나온 빵을 사려고 손님들이 가게 앞에 [[한 사람씩 계속 이어서]] 서 있었어요.","a":"줄줄이","w":["설마","반드시","맘껏"],"en":"Customers stood one after another in front of the shop to buy the newly released bread.","gl":"one after another, in a row, consecutively"},{"kr":"나가떨어지다","ch":1,"s":"마라톤 중간에 힘이 부족한 사람들이 [[더 버티지 못하고 쓰러지거나 그만두었어요]].","a":"나가떨어졌어요","w":["매달렸어요","몰두했어요","도전했어요"],"en":"Midway through the marathon, the runners who lacked stamina collapsed or dropped out.","gl":"to collapse, drop out, be knocked out (physically or figuratively)"},{"kr":"설마","ch":1,"s":"[[그럴 리 없다고 믿지만]] 네가 내 비밀을 다른 사람한테 말한 건 아니지?","a":"설마","w":["반드시","맘껏","줄줄이"],"en":"You didn't tell my secret to somebody else, did you? (I can't believe you would.)","gl":"no way, could it be?, I doubt it (expresses disbelief)"},{"kr":"조잡하다","ch":1,"s":"값은 싸지만 [[만든 솜씨가 거칠고 정성이 없는]] 물건이라서 금방 망가졌어요.","a":"조잡한","w":["진지한","서먹한","불안한"],"en":"It was cheap, but it was a poorly made, crude product, so it broke right away.","gl":"crude, sloppy, poorly made"},{"kr":"대체","ch":1,"s":"약속 시간이 한 시간이나 지났는데 [[답답해서 강하게 묻는데]], 너는 지금 어디야?","a":"대체","w":["설마","일단","아무래도"],"en":"It's been an hour past our appointment time. Where on earth are you?","gl":"on earth, in the world"},{"kr":"매달리다","ch":1,"s":"아이가 울면서 엄마의 팔에 [[떨어지지 않으려고 꼭 붙잡았어요]].","a":"매달렸어요","w":["부딪혔어요","안주했어요","도전했어요"],"en":"The child cried and clung to his mother's arm.","gl":"to hang onto, cling to; to be obsessed with / devoted to"},{"kr":"대충","ch":1,"s":"시간이 없어서 청소를 [[꼼꼼하게 하지 않고 적당히]] 끝냈어요.","a":"대충","w":["깨끗이","끊임없이","맘껏"],"en":"I didn't have time, so I finished the cleaning half-heartedly.","gl":"roughly, approximately; carelessly, half-heartedly"},{"kr":"몰두하다","ch":1,"s":"그는 요즘 새 소설을 쓰는 일에 [[다른 것은 잊고 온 마음을 쏟고]] 있어요.","a":"몰두하고","w":["탈출하고","망하고","안주하고"],"en":"These days he is completely absorbed in writing his new novel.","gl":"to immerse oneself in, to be absorbed in"},{"kr":"처형","ch":1,"s":"저는 생일에 [[아내의 언니]]한테 예쁜 시계를 선물받았어요.","a":"처형","w":["안무가","금메달리스트","장애인"],"en":"For my birthday, I received a pretty watch from my wife's older sister.","gl":"wife's older sister (a man's term); (also) execution"},{"kr":"일단","ch":1,"s":"배고프니까 [[다른 일은 나중에 하고 먼저]] 밥부터 먹자.","a":"일단","w":["설마","맘껏","끊임없이"],"en":"I'm hungry, so let's eat first and deal with the rest later.","gl":"for now, first of all, once (something happens)"},{"kr":"아무래도","ch":1,"s":"하늘이 점점 어두워지는 걸 보니 [[여러 상황을 생각해 보면]] 오늘 비가 올 것 같아요.","a":"아무래도","w":["맘껏","일단","끊임없이"],"en":"Judging by the sky getting darker, it lo ks hard at everything, so he is trustworthy.","gl":"everything, every matter, in all things"},{"kr":"백수","ch":4,"s":"대학을 졸업하고 6개월째 [[직업 없이 지내는 사람이에요]].","a":"백수예요","w":["노인이에요","신하예요","주례예요"],"en":"It has been six months since graduating, and I am still unemployed.","gl":"unemployed person; also literally \"idle person"},{"kr":"쏘다","ch":4,"s":"벌이 아이의 팔을 [[독침으로 찔러서]] 팔이 부었다.","a":"쏘아서","w":["압박해서","상대해서","인정해서"],"en":"A bee stung the child's arm, and the arm swelled up.","gl":"to shoot; to treat/pay (for food, etc., slang); to sting (like eyes in pain depending on context)"},{"kr":"엄한(=애먼) 사람 (하나) 잡다","ch":4,"s":"확실한 증거 없이 경찰이 [[죄 없는 사람을 범인으로 몰면]] 안 돼요.","a":"엄한 사람 잡으면","w":["화를 풀면","속이 상하면","되는 일이 없으면"],"en":"The police must not go after the wrong person without solid evidence.","gl":"to get the wrong person"},{"kr":"되는 일이 없다","ch":4,"s":"요즘 시험도 망치고 지갑도 잃어버리고 [[무엇을 해도 결과가 좋지 않아요]].","a":"되는 일이 없어요","w":["엄한 사람 잡아요","화를 풀어요","식은 죽 먹기예요"],"en":"Lately I failed an exam and lost my wallet; nothing is going right.","gl":"Nothing works out / Nothing goes right"},{"kr":"노인","ch":4,"s":"버스에서 [[나이가 많이 든 사람]]에게 자리를 양보했다.","a":"노인","w":["신하","주례","전쟁터"],"en":"I gave up my seat on the bus to an elderly person.","gl":"old person"},{"kr":"신하","ch":4,"s":"옛날에 임금님은 아침마다 [[나랏일을 돕는 관리]]들과 회의를 했다.","a":"신하","w":["노인","주례","백수"],"en":"In the old days, the king held a meeting with his officials every morning.","gl":"King's officials"},{"kr":"전쟁터","ch":4,"s":"병사들은 무기를 들고 [[나라끼리 싸우는 곳으로]] 떠났다.","a":"전쟁터로","w":["신하로","주례로","줄넘기로"],"en":"The soldiers took their weapons and left for the battlefield.","gl":"battlefield, battleground"},{"kr":"젊은이","ch":4,"s":"그 카페는 [[이십 대의 나이 어린 사람]]들에게 인기가 많다.","a":"젊은이","w":["노인","신하","주례"],"en":"That cafe is popular with young people.","gl":"young person"},{"kr":"큰일","ch":4,"s":"열쇠를 잃어버렸으니 [[아주 심각한 문제가]] 났어요.","a":"큰일이","w":["영감이","수작이","품행이"],"en":"I lost my key, so now I'm in big trouble.","gl":"An important affair, a serious matter"},{"kr":"물려주다","ch":4, a":"나는 일찍 일어나는 반면에 동생은 늦게 일어난다.","en":"I get up early, whereas my younger brother gets up late."},{"g":"g2-3","ch":2,"title":"N을/를 비롯해서","p":"서울에는 [[창덕궁을 포함해서]] 유명한 명소가 많다.","a":"서울에는 창덕궁을 비롯해서 유명한 명소가 많다.","en":"Seoul has many famous sights, starting with Changdeokgung."},{"g":"g2-3","ch":2,"title":"N을/를 비롯해서","p":"그 콘서트에는 [[아이유를 포함해서]] 유명한 가수들이 많이 참가했다.","a":"그 콘서트에는 아이유를 비롯해서 유명한 가수들이 많이 참가했다.","en":"Many famous singers took part in the concert, including IU."},{"g":"g2-3","ch":2,"title":"N을/를 비롯해서","p":"한국에서 [[서울을 포함해서]] 여러 도시를 여행했다.","a":"한국에서 서울을 비롯해서 여러 도시를 여행했다.","en":"In Korea I traveled to several cities, starting with Seoul."},{"g":"g2-3","ch":2,"title":"N을/를 비롯해서","p":"박물관에는 [[불상을 포함해서]] 많은 유물이 있다.","a":"박물관에는 불상을 비롯해서 많은 유물이 있다.","en":"The museum has many relics, including Buddha statues."},{"g":"g2-3","ch":2,"title":"N을/를 비롯해서","p":"우리 가족은 [[아버지를 포함해서]] 모두 운동을 좋아한다.","a":"우리 가족은 아버지를 비롯해서 모두 운동을 좋아한다.","en":"Everyone in my family, starting with my father, likes sports."},{"g":"g2-3","ch":2,"title":"N을/를 비롯해서","p":"이 식당에서는 [[김치찌개를 포함해서]] 여러 한식을 판다.","a":"이 식당에서는 김치찌개를 비롯해서 여러 한식을 판다.","en":"This restaurant sells various Korean dishes, including kimchi stew."},{"g":"g2-3","ch":2,"title":"N을/를 비롯해서","p":"회의에는 [[사장님을 포함해서]] 모든 직원이 참석했다.","a":"회의에는 사장님을 비롯해서 모든 직원이 참석했다.","en":"All the staff attended the meeting, starting with the CEO."},{"g":"g2-3","ch":2,"title":"N을/를 비롯해서","p":"이 학교에는 [[영어를 포함해서]] 다양한 외국어 수업이 있다.","a":"이 학교에는 영어를 비롯해서 다양한 외국어 수업이 있다.","en":"This school has classes in various foreign languages, including English."},{"g":"g3-1","ch":3,"title":"V-고 말다","p":"최선을 다했지만 아쉽게 이번 경기에서 [[졌다.]]","a":"최선을 다했지만 아쉽게 이번 경기에서 지고 말았다.","en":"I did my best, but sadly I ended up losing this match."},{"g":"g3-1","ch":3,"title":"V-고 말다","p":"열심히 외웠는데 시험에서 [[틀렸다.]]","a":"열심히 외웠는데 시험에서 틀리고 말았다.","en":"I studied hard, but I ended up getting it wrong on the test."},{"g":"g3-1","ch":3,"title":"V-고 말다","p":"막차를 타려고 힘껏 뛰어갔지만 [[놓쳤다.]]","a":"막차를 타려고 힘껏 뛰어갔지만 놓치고 말았다.","en":"I ran as hard as I could to catch the last train, but I ended up missing it."},{"g":"g3-1","ch":3,"title":"V-고 말다","p":"슬픈 마음을 보이기 싫었지만 [[울었다.]]","a":"슬픈 마음을 보이기 싫었지만 울고 말았다.","en":"I didn't want to show how sad I was, but I ended up crying."},{"g":"g3-1","ch":3,"title":"V-고 말다","p":"다이어트 중인데 피자를 한 판이나 [[먹었다.]]","a":"다이어트 중인데 피자를 한 판이나 먹고 말았다.","en":"I'm on a diet, but I ended up eating a whole pizza."},{"g":"g3-1","ch":3,"title":"V-고 말다","p":"비밀로 하기로 약속했는데 친구한테 [[말했다.]]","a":"비밀로 하기로 약속했는데 친구한테 말하고 말았다.","en":"I had promised to keep it a secret, but I ended up telling my friend."},{"g":"g3-1","ch":3,"title":"V-고 말다","p":"늦지 않으려고 했는데 늦잠을 [[잤다.]]","a":"늦지 않으려고 했는데 늦잠을 자고 말았다.","en":"I tried not to be late, but I ended up oversleeping."},{"g":"g3-1","ch":3,"title":"V-고 말다","p":"아끼던 컵을 청소하다가 [[깼다.]]","a":"아끼던 컵을 청소하다가 깨고 말았다.","en":"I ended up breaking my favorite cup while cleaning."},{"g":"g3-2","ch":3,"title":"A/V-기라도 하면","p":"시험에 떨어지다 + 어떡하나 걱정이 돼요","a":"시험에 떨어지기라도 하면 어떡하나 걱정이 돼요.","en":"I'm worried about what I'll do if I fail the exam."},{"g":"g3-2","ch":3,"title":"A/V-기라도 하면","p":"저렇게 빨리 운전하다가 사고가 나다 + 어떡해?","a":"저렇게 빨리 운전하다가 사고가 나기라도 하면 어떡해?","en":"What if he has an accident driving that fast?"},{"g":"g3-2","ch":3,"title":"A/V-기라도 하면","p":"아이가 길을 잃다 + 어떡하나 걱정이다","a":"아이가 길을 잃기라도 하면 어떡하나 걱정이다.","en":"I'm worried about what to do if the child gets lost."},{"g":"g3-2","ch":3,"title":"A/V-기라도 하면","p":"비밀번호를 잊어버리다 + 어떡해?","a":"비밀번호를 잊어버리기라도 하면 어떡해?","en":"What if I forget the password?"},{"g":"g3-2","ch":3,"title":"A/V-기라도 하면","p":"수술 중에 문제가 생기다 + 두렵다","a":"수술 중에 문제가 생기기라도 하면 두렵다.","en":"I'm scared of what happens if a problem comes up during the surgery."},{"g":"g3-2","ch":3,"title":"A/V-기라도 하면","p":"엄마가 내 일기를 읽다 + 어떡하지?","a":"엄마가 내 일기를 읽기라도 하면 어떡하지?","en":"What if Mom reads my diary?"},{"g":"g3-2","ch":3,"title":"A/V-기라도 하면","p":"여권을 잃어버리다 + 어떡하나 걱정이 됐다","a":"여권을 잃어버리기라도 하면 어떡하나 걱정이 됐다.","en":"I was worried about what I'd do if I lost my passport."},{"g":"g3-2","ch":3,"title":"A/V-기라도 하면","p":"급한 연락을 놓치다 + 어떡하나 불안했다","a":"급한 연락을 놓치기라도 하면 어떡하나 불안했다.","en":"I felt anxious about what would happen if I missed an urgent message."},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"처음 인천공항에서 나왔을 때 날씨가 [[아주 추웠다.]]","a":"처음 인천공항에서 나왔을 때 날씨가 어찌나 춥던지…","en":"When I first came out of Incheon Airport, the weather was so cold…"},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"그 영화가 [[아주 지루했다.]]","a":"그 영화가 어찌나 지루하던지…","en":"That movie was so boring…"},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"밀린 숙제를 끝내고 나니까 [[아주 후련했다.]]","a":"밀린 숙제를 끝내고 나니까 어찌나 후련하던지…","en":"After I finished my backlog of homework, I felt so relieved…"},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"결혼식 날 어머니가 [[아주 많이 우셨다.]]","a":"결혼식 날 어머니가 어찌나 많이 우시던지…","en":"On the wedding day, Mom cried so much…"},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"내가 삼겹살을 [[아주 급하게 먹었다.]]","a":"내가 삼겹살을 어찌나 급하게 먹었던지…","en":"I ate the pork belly so hurriedly…"},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"어제 본 공포 영화가 [[아주 무서웠다.]]","a":"어제 본 공포 영화가 어찌나 무섭던지…","en":"The horror movie I watched yesterday was so scary…"},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"시장에 갔더니 사람이 [[아주 많았다.]]","a":"시장에 갔더니 사람이 어찌나 많던지…","en":"When I went to the market, there were so many people…"},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"내가 어제 [[아주 많이 웃었다.]]","a":"내가 어제 어찌나 많이 웃었던지…","en":"Yesterday I laughed so much…"},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"사람들 앞에서 발표하다 + 차라리 쓰기 숙제를 3개 하겠다","a":"사람들 앞에서 발표하느니 차라리 쓰기 숙제를 3개 하겠다.","en":"I'd rather do three writing assignments than give a presentation in front of people."},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"주말에 백화점에서 쇼핑하다 + 차라리 도서관에서 공부하겠다","a":"주말에 백화점에서 쇼핑하느니 차라리 도서관에서 공부하겠다.","en":"I'd rather study at the library than shop at a department store on the weekend."},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"청소하다 + 차라리 설거지할게","a":"청소하느니 차라리 설거지할게.","en":"I'd rather do the dishes than clean."},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"택시를 타다 + 차라리 걸어가겠다","a":"택시를 타느니 차라리 걸어가겠다.","en":"I'd rather walk than take a taxi."},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"그 사람한테 부탁하다 + 차라리 내가 직접 하겠다","a":"그 사람한테 부탁하느니 차라리 내가 직접 하겠다.","en":"I'd rather do it myself than ask that person."},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"이런 회사에서 일하다 + 차라리 그만두겠다","a":"이런 회사에서 일하느니 차라리 그만두겠다.","en":"I'd rather quit than work at a company like this."},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"비싼 옷을 사다 + 차라리 여행을 가겠다","a":"비싼 옷을 사느니 차라리 여행을 가겠다.","en":"I'd rather go on a trip than buy expensive clothes."},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"시험에서 부정행위를 하다 + 차라리 낮은 점수를 받겠다","a":"시험에서 부정행위를 하느니 차라리 낮은 점수를 받겠다.","en":"I'd rather get a low score than cheat on the exam."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[커피도 마시고 책도 읽기 위해서]] 카페에 갔다.","a":"커피도 마시고 책도 읽을 겸 카페에 갔다.","en":"I went to a cafe to have coffee and read a book."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[영어도 배우고 여행도 하기 위해서]] 호주에 갔다.","a":"영어도 배우고 여행도 할 겸 호주에 갔다.","en":"I went to Australia to learn English and to travel."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[돈도 벌고 한국 친구도 사귀기 위해서]] 아르바이트를 시작했다.","a":"돈도 벌고 한국 친구도 사귈 겸 아르바이트를 시작했다.","en":"I started a part-time job to earn money and make Korean friends."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[운동도 하고 바람도 쐬기 위해서]] 공원에 갔다.","a":"운동도 하고 바람도 쐴 겸 공원에 갔다.","en":"I went to the park to exercise and get some fresh air."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[기분 전환도 하고 선물도 사기 위해서]] 쇼핑몰에 갔다.","a":"기분 전환도 하고 선물도 살 겸 쇼핑몰에 갔다.","en":"I went to the mall to cheer myself up and buy a present."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[산책도 하고 장도 보기 위해서]] 시장에 나왔다.","a":"산책도 하고 장도 볼 겸 시장에 나왔다.","en":"I came out to the market to take a walk and do some shopping."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[한국어도 연습하고 친구도 사귀기 위해서]] 모임에 나갔다.","a":"한국어도 연습하고 친구도 사귈 겸 모임에 나갔다.","en":"I went to the meetup to practice Korean and make friends."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[인사도 드리고 선물도 전하기 위해서]] 할머니 댁에 들렀다.","a":"인사도 드리고 선물도 전할 겸 할머니 댁에 들렀다.","en":"I stopped by Grandma's house to say hello and deliver a gift."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"엄마 얘기는 듣다 + 청소하라고 하실 거야","a":"엄마 얘기는 들으나 마나 청소하라고 하실 거야.","en":"There's no need to listen — Mom will just tell me to clean."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"기다리다 + 오늘도 늦게 올 거야","a":"기다리나 마나 오늘도 늦게 올 거야.","en":"Waiting is pointless — he'll come late again today."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"이 약은 우유와 함께 먹다 + 효과가 없어요","a":"이 약은 우유와 함께 먹으나 마나예요.","en":"Taking this medicine with milk is pointless."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"이렇게 비가 오는 날에는 우산은 쓰다 + 소용없어요","a":"이렇게 비가 오는 날에는 우산은 쓰나 마나예요.","en":"On a rainy day like this, an umbrella is useless."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"미나에게 말하다 + 절대로 안 할 거야","a":"미나에게 말하나 마나 절대로 안 할 거야.","en":"There's no point asking Mina — she will never do it."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"그 영화는 보다 + 재미없을 거야","a":"그 영화는 보나 마나 재미없을 거야.","en":"I don't even need to watch that movie — it's bound to be boring."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"그 사람에게 물어보다 + 모른다고 할 거예요","a":"그 사람에게 물어보나 마나 모른다고 할 거예요.","en":"It's no use asking him — he'll say he doesn't know."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"점심시간이라 식당에 가다 + 사람이 많을 거야","a":"점심시간이라 식당에 가나 마나 사람이 많을 거야.","en":"It's lunchtime, so there's no point going to the restaurant — it'll be crowded."},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"하얗다 + 눈이 내렸다","a":"하얀 눈이 내렸다.","en":"White snow fell."},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"파랗다 + 하늘을 좋아해요","a":"파란 하늘을 좋아해요.","en":"I like blue skies."},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"까맣다 + 고양이가 지붕 위에 앉아 있어요","a":"까만 고양이가 지붕 위에 앉아 있어요.","en":"A black cat is sitting on the roof."},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"노랗다 + 꽃이 피었어요","a":"노란 꽃이 피었어요.","en":"Yellow flowers have bloomed."},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"오늘 하늘이 정말 파랗다 + (-아/어요)","a":"오늘 하늘이 정말 파래요.","en":"The sky is really blue today."},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"왜 얼굴이 빨갛다 + (-아/어요)","a":"왜 얼굴이 빨개요?","en":"Why is your face red?"},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"하늘이 까맣다 + (-(으)니까) 곧 비가 올 거예요","a":"하늘이 까마니까 곧 비가 올 거예요.","en":"The sky is dark, so it will rain soon."},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"이렇다 + 날씨에는 우산이 필요해요","a":"이런 날씨에는 우산이 필요해요.","en":"You need an umbrella in weather like this."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"데이트할 때 영화를 보다 / 드라이브를 하다","a":"데이트할 때 영화를 보기도 하고 드라이브를 하기도 한다.","en":"On dates, we sometimes watch a movie and sometimes go for a drive."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"대학을 졸업했을 때 기쁘다 / 아쉽다 (과거)","a":"대학을 졸업했을 때 기쁘기도 하고 아쉽기도 했다.","en":"When I graduated from university, I felt both happy and sad."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"사과는 맛있다 / 건강에 좋다 → 아침마다 먹는다","a":"사과는 맛있기도 하고 건강에 좋기도 해서 아침마다 먹는다.","en":"Apples are both tasty and good for your health, so I eat one every morning."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"이 가방은 예쁘다 / 튼튼하다 → 자주 써요","a":"이 가방은 예쁘기도 하고 튼튼하기도 해서 자주 써요.","en":"This bag is pretty and sturdy, so I use it often."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"주말에 늦잠을 자다 / 운동을 하다","a":"주말에 늦잠을 자기도 하고 운동을 하기도 한다.","en":"On weekends I sometimes sleep in and sometimes exercise."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"그 식당은 맛있다 / 싸다 → 자주 가요","a":"그 식당은 맛있기도 하고 싸기도 해서 자주 가요.","en":"That restaurant is tasty and cheap, so I go there often."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"퇴근 후에 친구를 만나다 / 혼자 쉬다","a":"퇴근 후에 친구를 만나기도 하고 혼자 쉬기도 해요.","en":"After work I sometimes meet friends and sometimes rest alone."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"시험 전날에는 긴장되다 / 설레다","a":"시험 전날에는 긴장되기도 하고 설레기도 해요.","en":"The day before an exam I feel both nervous and excited."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"학생들 + 이 문법 + 어렵다","a":"학생들이 이 문법을 어려워한다.","en":"The students find this grammar difficult."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"동생 + 큰 개 + 무섭다","a":"동생이 큰 개를 무서워한다.","en":"My younger sibling is afraid of big dogs."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"어머니 + 시험에 합격한 아들 + 자랑스럽다","a":"어머니가 시험에 합격한 아들을 자랑스러워한다.","en":"The mother is proud of her son who passed the exam."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"친구 + 내 선물 + 기쁘다","a":"친구가 내 선물을 기뻐한다.","en":"My friend is delighted with my gift."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"고양이 + 물 + 싫다","a":"고양이가 물을 싫어한다.","en":"The cat dislikes water."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"할머니 + 손주 + 귀엽다","a":"할머니가 손주를 귀여워한다.","en":"The grandmother adores her grandchild."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"동생 + 강아지를 키우다 + -고 싶다","a":"동생이 강아지를 키우고 싶어한다.","en":"My younger sibling wants to raise a puppy."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"아버지 + 내 성적 + 궁금하다","a":"아버지가 내 성적을 궁금해한다.","en":"My father is curious about my grades."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"지갑 + 가방 + 넣었다","a":"지갑을 가방에다가 넣었다.","en":"I put my wallet in my bag."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"상처 + 약 + 발랐다","a":"상처에다가 약을 발랐다.","en":"I put medicine on the wound."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"안내문 + 벽 + 붙였다","a":"안내문을 벽에다가 붙였다.","en":"I stuck the notice on the wall."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"꽃 + 꽃병 + 꽂았다","a":"꽃을 꽃병에다가 꽂았다.","en":"I put the flowers in the vase."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"커피 + 설탕 + 넣었다","a":"커피에다가 설탕을 넣었다.","en":"I put sugar in the coffee."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"그림 + 거실 벽 + 걸었다","a":"그림을 거실 벽에다가 걸었다.","en":"I hung the picture on the living room wall."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"책 + 책상 위 + 놓았다","a":"책을 책상 위에다가 놓았다.","en":"I put the book on the desk."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"메모 + 냉장고 문 + 붙였다","a":"메모를 냉장고 문에다가 붙였다.","en":"I stuck a note on the fridge door."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"한국의 장례식이 왜 떠들썩합니까? + 연구하고자 합니다.","a":"한국의 장례식이 왜 떠들썩한가에 대해 연구하고자 합니다.","en":"I would like to study why Korean funerals are so lively."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"정부가 취업 문제를 어떻게 생각합니까? + 궁금합니다.","a":"정부가 취업 문제를 어떻게 생각하는가가 궁금합니다.","en":"I am curious how the government thinks about the employment problem."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"프로젝트를 어떻게 성공적으로 끝냈습니까? + 관심을 갖고 있습니다.","a":"프로젝트를 어떻게 성공적으로 끝냈는가에 관심을 갖고 있습니다.","en":"I am interested in how the project was finished successfully."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"사람은 왜 태어납니까? + 궁금합니다.","a":"사람은 왜 태어나는가가 궁금합니다.","en":"I wonder why people are born."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"이 도시는 얼마나 안전합니까? + 조사했습니다.","a":"이 도시는 얼마나 안전한가를 조사했습니다.","en":"We investigated how safe this city is."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"인생에서 중요한 것은 무엇입니까? + 생각해 봅시다.","a":"인생에서 중요한 것이 무엇인가를 생각해 봅시다.","en":"Let us think about what is important in life."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"그 사건은 왜 일어났습니까? + 뉴스에서 설명했다.","a":"그 사건이 왜 일어났는가를 뉴스에서 설명했다.","en":"The news explained why that incident happened."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"앞으로 환경을 보호하기 위해 무엇을 할 것입니까? + 생각해야 한다.","a":"앞으로 환경을 보호하기 위해 무엇을 할 것인가를 생각해야 한다.","en":"We should think about what we will do from now on to protect the environment."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"등산 신발을 사다 + 등산 양말도 샀다.","a":"등산 신발을 사는 김에 등산 양말도 샀다.","en":"While buying hiking shoes, I bought hiking socks too."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"도서관에 가다 + 지난주에 빌린 책도 반납했다.","a":"도서관에 가는 김에 지난주에 빌린 책도 반납했다.","en":"While going to the library, I also returned the book I borrowed last week."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"이사를 하다 + 가구도 바꿨다.","a":"이사를 하는 김에 가구도 바꿨다.","en":"While moving, I changed the furniture too."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"내 커피를 사다 + 네 것도 하나 샀어.","a":"내 커피를 사는 김에 네 것도 하나 샀어.","en":"While buying my coffee, I got one for you too."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"오사카에 출장을 갔다 + 구경도 하고 와.","a":"오사카에 출장을 간 김에 구경도 하고 와.","en":"Since you are already on a business trip to Osaka, do some sightseeing too."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"마트에 가다 + 우유도 사 올게.","a":"마트에 가는 김에 우유도 사 올게.","en":"While I am going to the supermarket, I will buy milk too."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"세차를 하다 + 차 안도 청소했다.","a":"세차를 하는 김에 차 안도 청소했다.","en":"While washing the car, I cleaned the inside too."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"친구를 만나다 + 영화도 봤다.","a":"친구를 만나는 김에 영화도 봤다.","en":"While meeting my friend, I watched a movie too."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"언제 + 시작할 수 있다.","a":"언제든지 시작할 수 있다.","en":"You can start whenever."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"무슨 내용 + 한번 읽으면 다 이해한다.","a":"무슨 내용이든지 한번 읽으면 다 이해한다.","en":"Whatever the content, I understand it all once I read it."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"어떤 상황에서 + 최선을 다해야 한다.","a":"어떤 상황에서든지 최선을 다해야 한다.","en":"You must do your best in any situation."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"무엇을 먹다 + 다 좋다.","a":"무엇을 먹든지 다 좋다.","en":"Whatever we eat, it is all good."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"누구를 만나서 이야기를 하다 + 조심해야 한다.","a":"누구를 만나서 이야기를 하든지 조심해야 한다.","en":"Whoever you meet and talk with, you have to be careful."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"어디에 가다 + 사람이 많다.","a":"어디에 가든지 사람이 많다.","en":"Wherever you go, there are lots of people."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"무엇이 필요하다 + 저에게 말씀하세요.","a":"무엇이 필요하든지 저에게 말씀하세요.","en":"Whatever you need, tell me."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"어떻게 하다 + 결과는 같다.","a":"어떻게 하든지 결과는 같다.","en":"No matter how you do it, the result is the same."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"백화점에서 음식을 사다 + 집에서 먹었다.","a":"백화점에서 음식을 사다가 집에서 먹었다.","en":"I bought food at the department store and ate it at home."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"도서관에서 책을 빌리다 + 카페에서 읽었다.","a":"도서관에서 책을 빌려다가 카페에서 읽었다.","en":"I borrowed a book at the library and read it at a cafe."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"여행지에서 사진을 찍다 + 인터넷에 올렸다.","a":"여행지에서 사진을 찍어다가 인터넷에 올렸다.","en":"I took photos at the travel destination and uploaded them to the internet."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"냉장고에서 물을 꺼내다 + 아이에게 주었다.","a":"냉장고에서 물을 꺼내다가 아이에게 주었다.","en":"I took water out of the fridge and gave it to the child."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"서류를 복사하다 + 직원들에게 나누어 주었다.","a":"서류를 복사해다가 직원들에게 나누어 주었다.","en":"I copied the documents and handed them out to the staff."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"냇가에서 물을 떠다 + 마당에 뿌렸다.","a":"냇가에서 물을 떠다가 마당에 뿌렸다.","en":"I scooped up water at the stream and sprinkled it in the yard."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"식당에서 음식을 포장하다 + 집에서 먹었다.","a":"식당에서 음식을 포장해다가 집에서 먹었다.","en":"I got food packed at the restaurant and ate it at home."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"밭에서 딸기를 따다 + 손님에게 드렸다.","a":"밭에서 딸기를 따다가 손님에게 드렸다.","en":"I picked strawberries in the field and gave them to the guest."},{"g":"g8-1","ch":8,"title":"N조차","p":"요리를 잘 못해서 [[라면도]] 못 끓인다.","a":"요리를 잘 못해서 라면조차 못 끓인다.","en":"I am so bad at cooking that I cannot even boil instant noodles."},{"g":"g8-1","ch":8,"title":"N조차","p":"술에 약해서 [[맥주 한 잔도]] 못 마신다.","a":"술에 약해서 맥주 한 잔조차 못 마신다.","en":"I am so weak with alcohol that I cannot even drink one glass of beer."},{"g":"g8-1","ch":8,"title":"N조차","p":"아침에 늦게 일어나서 [[세수도]] 못 했다.","a":"아침에 늦게 일어나서 세수조차 못 했다.","en":"I got up so late in the morning that I could not even wash my face."},{"g":"g8-1","ch":8,"title":"N조차","p":"요즘 너무 바빠서 [[밥 먹을 시간도]] 없다.","a":"요즘 너무 바빠서 밥 먹을 시간조차 없다.","en":"I am so busy these days that I do not even have time to eat."},{"g":"g8-1","ch":8,"title":"N조차","p":"그 사람이 어디에 사는지[[도]] 모른다.","a":"그 사람이 어디에 사는지조차 모른다.","en":"I do not even know where that person lives."},{"g":"g8-1","ch":8,"title":"N조차","p":"그 사람은 [[가장 친한 친구한테도]] 비밀을 말하지 않았다.","a":"그 사람은 가장 친한 친구한테조차 비밀을 말하지 않았다.","en":"He did not tell his secret even to his closest friend."},{"g":"g8-1","ch":8,"title":"N조차","p":"한국에 오기 전에는 [[인사말도]] 몰랐다.","a":"한국에 오기 전에는 인사말조차 몰랐다.","en":"Before coming to Korea, I did not even know a greeting."},{"g":"g8-1","ch":8,"title":"N조차","p":"그는 화가 나서 [[내 얼굴도]] 안 봤다.","a":"그는 화가 나서 내 얼굴조차 안 봤다.","en":"He was so angry that he would not even look at my face."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"신발을 신다 + 집 안으로 들어왔다.","a":"신발을 신은 채로 집 안으로 들어왔다.","en":"I came into the house with my shoes still on."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"창문을 열다 + 잠이 들었다.","a":"창문을 연 채로 잠이 들었다.","en":"I fell asleep with the window open."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"스마트폰을 손에 들다 + 스마트폰을 찾으러 다녔다.","a":"스마트폰을 손에 든 채로 스마트폰을 찾으러 다녔다.","en":"I went around looking for my smartphone with it in my hand."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"미소를 짓다 + 눈물을 흘렸다.","a":"미소를 지은 채 눈물을 흘렸다.","en":"She shed tears while still smiling."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"불을 켜다 + 잠들었다.","a":"불을 켠 채로 잠들었다.","en":"I fell asleep with the light on."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"안경을 쓰다 + 샤워를 했다.","a":"안경을 쓴 채로 샤워를 했다.","en":"I took a shower with my glasses on."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"입을 벌리다 + 말을 못 했다.","a":"입을 벌린 채 말을 못 했다.","en":"He could not speak, his mouth hanging open."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"눈을 감다 + 음악을 들었다.","a":"눈을 감은 채로 음악을 들었다.","en":"I listened to music with my eyes closed."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"기타 연습을 열심히 했다 + 공연이 엉망이었다.","a":"기타 연습을 열심히 했는데도 공연이 엉망이었다.","en":"Even though I practiced guitar hard, the performance was a mess."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"좋아하는 마음이 크다 + 말조차 걸 수 없다.","a":"좋아하는 마음이 큰데도 말조차 걸 수 없다.","en":"Even though my feelings are big, I cannot even talk to him."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"책을 열심히 읽었다 + 이해할 수 없다.","a":"책을 열심히 읽었는데도 이해할 수 없다.","en":"Even though I read the book diligently, I cannot understand it."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"문법을 알다 + 말할 때 자꾸 틀린다.","a":"문법을 아는데도 말할 때 자꾸 틀린다.","en":"Even though I know the grammar, I keep making mistakes when I speak."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"준비를 많이 못 했다 + 시험을 잘 봤다.","a":"준비를 많이 못 했는데도 시험을 잘 봤다.","en":"Even though I could not prepare much, I did well on the exam."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"한국어가 어렵다 + 포기하지 않고 계속 공부하고 있다.","a":"한국어가 어려운데도 포기하지 않고 계속 공부하고 있다.","en":"Even though Korean is hard, I keep studying without giving up."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"비가 많이 왔다 + 경기는 예정대로 열렸다.","a":"비가 많이 왔는데도 불구하고 경기는 예정대로 열렸다.","en":"Despite the heavy rain, the match was held as scheduled."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"주말이다 + 회사에 나가야 한다.","a":"주말인데도 회사에 나가야 한다.","en":"Even though it is the weekend, I have to go to the office."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"사람은 누구나 나이가 들면 늙다 + 당연하다.","a":"사람은 누구나 나이가 들면 늙게 마련이다.","en":"Everyone is bound to grow old as they age."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"아무리 단점이 많아도 사랑하면 단점도 장점으로 보이다 + 당연하다.","a":"아무리 단점이 많아도 사랑하면 단점도 장점으로 보이게 마련이다.","en":"However many flaws there are, when you love someone the flaws are bound to look like strengths."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"열심히 노력하면 좋은 결과가 나오다 + 당연하다.","a":"열심히 노력하면 좋은 결과가 나오게 마련이다.","en":"If you work hard, good results are bound to come."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"시간이 지나면 기억이 흐려지다 + 당연하다.","a":"시간이 지나면 기억이 흐려지게 마련이다.","en":"As time passes, memories are bound to fade."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"높은 곳에 올라가면 누구나 무섭다 + 당연하다.","a":"높은 곳에 올라가면 누구나 무섭게 마련이다.","en":"Anyone who climbs somewhere high is bound to feel scared."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"친구가 많으면 가끔 다투다 + 당연하다.","a":"친구가 많으면 가끔 다투게 마련이다.","en":"If you have many friends, you are bound to argue now and then."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"공부를 안 하면 성적이 떨어지다 + 당연하다.","a":"공부를 안 하면 성적이 떨어지게 마련이다.","en":"If you do not study, your grades are bound to drop."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"실수를 많이 하면 누구나 자신감이 없어지다 + 당연하다.","a":"실수를 많이 하면 누구나 자신감이 없어지게 마련이다.","en":"If you make many mistakes, anyone is bound to lose confidence."},{"g":"x-2","ch":"mid","title":"게다가","p":"그 식당은 음식이 맛있어요. [[그리고]] 가격도 싸요.","a":"그 식당은 음식이 맛있어요. 게다가 가격도 싸요.","en":"That restaurant's food is delicious. On top of that, the prices are cheap."},{"g":"x-2","ch":"mid","title":"게다가","p":"오늘은 비가 와요. [[그리고]] 바람도 많이 불어요.","a":"오늘은 비가 와요. 게다가 바람도 많이 불어요.","en":"It is raining today. On top of that, the wind is blowing hard."},{"g":"x-2","ch":"mid","title":"게다가","p":"민수는 노래를 잘해요. [[그리고]] 춤도 잘 춰요.","a":"민수는 노래를 잘해요. 게다가 춤도 잘 춰요.","en":"Minsu sings well. Moreover, he dances well too."},{"g":"x-2","ch":"mid","title":"게다가","p":"이 집은 넓어요. [[그리고]] 역에서도 가까워요.","a":"이 집은 넓어요. 게다가 역에서도 가까워요.","en":"This house is spacious. On top of that, it is close to the station."},{"g":"x-2","ch":"mid","title":"게다가","p":"이 노트북은 가벼워요. [[그리고]] 배터리도 오래가요.","a":"이 노트북은 가벼워요. 게다가 배터리도 오래가요.","en":"This laptop is light. Moreover, the battery lasts long."},{"g":"x-2","ch":"mid","title":"게다가","p":"길이 많이 막혔어요. [[그리고]] 비까지 왔어요.","a":"길이 많이 막혔어요. 게다가 비까지 왔어요.","en":"The roads were very congested. On top of that, it even rained."},{"g":"x-2","ch":"mid","title":"게다가","p":"감기에 걸렸어요. [[그리고]] 열도 나요.","a":"감기에 걸렸어요. 게다가 열도 나요.","en":"I caught a cold. On top of that, I have a fever too."},{"g":"x-2","ch":"mid","title":"게다가","p":"저는 돈이 없어요. [[그리고]] 시간도 없어요.","a":"저는 돈이 없어요. 게다가 시간도 없어요.","en":"I have no money. On top of that, I have no time either."},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"선생님이 다음 주에 결혼하신다. + 소식 들었어요?","a":"선생님이 다음 주에 결혼하신다는 소식 들었어요?","en":"Did you hear the news that the teacher is getting married next week?"},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"내일 시험이 취소됐다. + 말을 들었어요?","a":"내일 시험이 취소됐다는 말을 들었어요?","en":"Did you hear that tomorrow's exam was cancelled?"},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"그 가게 음식이 아주 맛있다. + 소문이 있어요.","a":"그 가게 음식이 아주 맛있다는 소문이 있어요.","en":"There is a rumor that the food at that shop is very delicious."},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"민수가 한국에 유학을 간다. + 이야기를 들었어요.","a":"민수가 한국에 유학을 간다는 이야기를 들었어요.","en":"I heard that Minsu is going to study abroad in Korea."},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"이분이 새로 오신 선생님이다. + 사실을 몰랐어요.","a":"이분이 새로 오신 선생님이라는 사실을 몰랐어요.","en":"I did not know the fact that this person is the new teacher."},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"어제 친구가 사고를 당했다. + 소식을 들었다.","a":"어제 친구가 사고를 당했다는 소식을 들었다.","en":"I heard the news that my friend had an accident yesterday."},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"열심히 하면 꿈을 이룰 수 있다. + 생각을 갖고 있어요.","a":"열심히 하면 꿈을 이룰 수 있다는 생각을 갖고 있어요.","en":"I hold the belief that if you work hard you can achieve your dream."},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"다음 달부터 월급이 오른다. + 말이 있어요.","a":"다음 달부터 월급이 오른다는 말이 있어요.","en":"There is talk that salaries will go up from next month."}],"gpoints":[{"id":"g1-1","ch":1,"title":"N은/는커녕"},{"id":"g1-2","ch":1,"title":"A/V-기는커녕"},{"id":"g1-3","ch":1,"title":"그리 A-지 않다 / V-지 않는다"},{"id":"g1-4","ch":1,"title":"N 말고도"},{"id":"g1-5","ch":1,"title":"N 말고는"},{"id":"g1-6","ch":1,"title":"A/V-(느)냐에 달려 있다"},{"id":"g1-7","ch":1,"title":"N에 달려 있다"},{"id":"g2-1","ch":2,"title":"V-고자 하다"},{"id":"g2-2","ch":2,"title":"A/V-은/는 반면에"},{"id":"g2-3","ch":2,"title":"N을/를 비롯해서"},{"id":"g3-1","ch":3,"title":"V-고 말다"},{"id":"g3-2","ch":3,"title":"A/V-기라도 하면"},{"id":"g3-3","ch":3,"title":"어찌나 A/V-던지"},{"id":"g4-1","ch":4,"title":"V-느니 (차라리)"},{"id":"g4-2","ch":4,"title":"V-을 겸 (해서)"},{"id":"g4-3","ch":4,"title":"V-으나 마나"},{"id":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사"},{"id":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다"},{"id":"g5-3","ch":5,"title":"A-아/어하다"},{"id":"g5-4","ch":5,"title":"N에다(가)"},{"id":"g6-1","ch":6,"title":"A/V-은/는가"},{"id":"g6-2","ch":6,"title":"V-는 김에"},{"id":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)"},{"id":"g7-2","ch":7,"title":"V-아/어다(가)"},{"id":"g8-1","ch":8,"title":"N조차"},{"id":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)"},{"id":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)"},{"id":"x-1","ch":"mid","title":"A/V-게 마련이다"},{"id":"x-2","ch":"mid","title":"게다가"},{"id":"x-3","ch":"mid","title":"A/V-다는 N"}],"colloc":[{"pairs":[["핑계를","대다"],["실력을","발휘하다"],["직업으로","삼다"],["인기를","누리다"]],"extra":"적응하다"},{"pairs":[["두각을","나타내다"],["폐를","끼치다"],["호감을","사다"],["한계에","부딪히다"]],"extra":"저지르다"},{"pairs":[["고집을","부리다"],["화를","풀다"],["허리를","숙이다"],["정신을","차리다"]],"extra":"번지다"},{"pairs":[["식은땀이","나다"],["소름이","끼치다"],["쌍코피가","터지다"],["무릎이","닳다"]],"extra":"흩어지다"},{"pairs":[["영향을","미치다"],["습관을","들이다"],["성취감을","맛보다"],["비중을","두다"]],"extra":"어기다"},{"pairs":[["귀를","기울이다"],["이를","악물다"],["시각을","넓히다"],["고개를","끄덕이다"]],"extra":"삼키다"},{"pairs":[["맞장구를","치다"],["말을","끊다"],["주의를","기울이다"],["고통을","겪다"]],"extra":"굽다"},{"pairs":[["작전을","벌이다"],["소란을","피우다"],["희망을","품다"],["비판을","받다"]],"extra":"지나치다"},{"pairs":[["독을","타다"],["장례식을","치르다"],["마법에","걸리다"],["나무를","심다"]],"extra":"펼쳐지다"},{"pairs":[["꽃이","피다"],["조화를","이루다"],["소꿉놀이를","하다"],["영감이","떠오르다"]],"extra":"쏟다"},{"pairs":[["가르마를","타다"],["속이","상하다"],["눈을","뜨다"],["발을","멈추다"]],"extra":"부수다"},{"pairs":[["사형을","선고하다"],["비율이","높아지다"],["물량이","달리다"],["열매를","맺다"]],"extra":"헤어지다"},{"pairs":[["기회를","놓치다"],["손해를","입다"],["충격을","받다"],["성과를","거두다"]],"extra":"겨루다"},{"pairs":[["재능을","타고나다"],["위기를","극복하다"],["야심을","품다"],["진심을","전하다"]],"extra":"빌리다"},{"pairs":[["영감을","얻다"],["목적을","달성하다"],["의지를","꺾다"],["야경을","감상하다"]],"extra":"매달리다"},{"pairs":[["소문이","나다"],["식중독에","걸리다"],["실랑이가","벌어지다"],["파도가","치다"]],"extra":"부러뜨리다"},{"pairs":[["염치가","없다"],["주량이","세다"],["마음이","착하다"],["가슴이","뛰다"]],"extra":"저물다"},{"pairs":[["시간을","보내다"],["끼니를","해결하다"],["여유를","부리다"],["서류를","지참하다"]],"extra":"스치다"},{"pairs":[["유물을","복원하다"],["불법 유턴을","단속하다"],["독재자를","몰아내다"],["손님을","대접하다"]],"extra":"축하하다"},{"pairs":[["부상을","입다"],["격려를","건네다"],["패배를","맛보다"],["정원을","가꾸다"]],"extra":"추락하다"},{"pairs":[["환청이","들리다"],["불평을","늘어놓다"],["대가를","치르다"],["오르막길을","오르다"]],"extra":"마시다"},{"pairs":[["시안을","수정하다"],["최저가를","검색하다"],["혼수를","장만하다"],["이벤트에","응모하다"]],"extra":"지치다"},{"pairs":[["갈등을","겪다"],["의견을","주장하다"],["눈치를","보다"],["목소리를","높이다"]],"extra":"허비하다"},{"pairs":[["이력을","쌓다"],["주례를","서다"],["각오를","다지다"],["위기에","처하다"]],"extra":"망하다"}],"personality":[{"text":"동생은 칭찬을 받아도 \"네.\" 한마디뿐이고 표정도 거의 변하지 않아요. 누가 말을 걸어도 길게 대답하는 법이 없어요.","answer":"무뚝뚝하다","options":["활기차다","무뚝뚝하다","수수하다","당당하다"],"en":"My younger sibling answers a compliment with just \"yes\" and hardly changes expression; never gives a long answer when spoken to."},{"text":"민수 씨는 작은 소리에도 잠을 깨고, 음식 맛이 조금만 달라져도 바로 알아채요. 옆 사람의 기분이 변한 것도 금방 느껴요.","answer":"예민하다","options":["둔하다","예민하다","막돼먹다","수수하다"],"en":"Minsu wakes at the slightest noise, notices tiny changes in taste, and quickly senses others' mood shifts."},{"text":"김 대리는 계약서를 읽을 때 한 글자씩 짚어 가며 숫자가 맞는지 두 번씩 확인해요. 그래서 실수가 거의 없어요.","answer":"꼼꼼하다","options":["꼼꼼하다","소극적이다","막돼먹다","활기차다"],"en":"Manager Kim checks a contract letter by letter and verifies numbers twice, so he almost never makes mistakes."},{"text":"선생님은 농담으로 한 말에도 웃지 않으시고, 학생들의 질문에 늘 심각한 얼굴로 곰곰이 대답해 주세요.","answer":"진지하다","options":["진지하다","활기차다","막돼먹다","수수하다"],"en":"The teacher doesn't laugh even at jokes and always answers students' questions thoughtfully with a serious face."},{"text":"그는 큰돈이 드는 결정이라서 몇 주 동안 가격을 비교하고 위험을 따져 본 뒤에야 계약했어요. 서두르는 법이 없어요.","answer":"신중하다","options":["신중하다","신경질적이다","능수능란하다","막돼먹다"],"en":"Because it was an expensive decision, he compared prices and weighed risks for weeks before signing; he never rushes."},{"text":"그 손님은 식당에서 직원에게 반말을 하고, 마음에 안 든다고 소리를 지르며 남들 앞에서 물건을 던졌어요. 예의라고는 전혀 없어요.","answer":"막돼먹다","options":["막돼먹다","단정하다","진지하다","신중하다"],"en":"The customer spoke rudely to the staff, shouted, and threw things in front of people; no manners at all."},{"text":"수진 씨는 많은 사람 앞에서도 목소리가 떨리지 않아요. 자기 생각이 옳다고 믿으면 상사 앞에서도 눈을 똑바로 보고 말해요.","answer":"당당하다","options":["당당하다","소극적이다","둔하다","수수하다"],"en":"Sujin's voice doesn't shake even in front of crowds, and if she believes she's right she looks her boss in the eye and says so."},{"text":"아버지는 사소한 일에도 쉽게 짜증을 내고, 말끝마다 한숨을 쉬면서 문을 쾅 닫으세요. 그래서 가족들이 늘 눈치를 봐요.","answer":"신경질적이다","options":["신경질적이다","단정하다","활기차다","능수능란하다"],"en":"Father gets annoyed over trivial things, sighs after every sentence and slams doors, so the family always watches their step."},{"text":"지은 씨는 회의에서 좋은 의견이 있어도 말하지 않고, 누가 시키기 전에는 먼저 나서는 법이 없어요.","answer":"소극적이다","options":["소극적이다","당당하다","활기차다","능수능란하다"],"en":"Jieun doesn't speak up in meetings even with good ideas and never steps forward until someone asks her."},{"text":"그는 주장을 할 때마다 이유와 근거를 순서대로 말해서 듣는 사람이 반박하기 어려워요. 감정보다 사실로 이야기해요.","answer":"논리적이다","options":["논리적이다","신경질적이다","수수하다","막돼먹다"],"en":"Whenever he makes a claim he lays out reasons and evidence in order, so it's hard to rebut; he argues with facts, not emotion."},{"text":"민정 씨는 머리 모양과 옷차림이 늘 깔끔하고 행동도 바르며 어른들께 예의를 지켜요. 흐트러진 모습을 본 적이 없어요.","answer":"단정하다","options":["단정하다","막돼먹다","둔하다","신경질적이다"],"en":"Minjeong's hair and clothes are always neat, she behaves properly and is polite to elders; I've never seen her disheveled."},{"text":"그 배우는 화려한 옷이나 장신구를 좋아하지 않아서 늘 평범한 색의 단순한 옷만 입어요. 꾸미지 않은 모습이 오히려 편안해 보여요.","answer":"수수하다","options":["수수하다","특이하다","활기차다","당당하다"],"en":"The actor dislikes flashy clothes or accessories and only wears plain, simple outfits; the unadorned look seems comfortable."},{"text":"친구는 주변 분위기가 이상한데도 눈치를 못 채요. 남이 힌트를 줘도 알아듣지 못해서 매번 설명해 줘야 해요.","answer":"둔하다","options":["둔하다","예민하다","꼼꼼하다","능수능란하다"],"en":"My friend fails to notice when the atmosphere is odd, and doesn't catch hints, so I have to explain every time."},{"text":"영업팀 박 부장님은 처음 만난 거래처 사람들도 금방 웃게 만들고, 어려운 협상도 막힘없이 척척 해결해요.","answer":"능수능란하다","options":["능수능란하다","소극적이다","둔하다","무뚝뚝하다"],"en":"Manager Park makes new clients smile right away and settles difficult negotiations smoothly and effortlessly."},{"text":"우리 막내는 아침부터 큰 목소리로 인사하고, 하루 종일 에너지가 넘쳐서 주변 사람들까지 밝아져요.","answer":"활기차다","options":["활기차다","무뚝뚝하다","소극적이다","신중하다"],"en":"Our youngest greets everyone loudly from the morning and is full of energy all day, brightening everyone around."},{"text":"그는 취미도 말투도 옷차림도 다른 사람들과 확연히 달라서 한 번 보면 잊을 수 없어요. 아무도 안 먹는 이상한 조합의 음식을 즐겨 먹기도 해요.","answer":"특이하다","options":["특이하다","수수하다","단정하다","논리적이다"],"en":"His hobbies, way of speaking and clothes differ so much from others that he's unforgettable; he even enjoys odd food combinations nobody else eats."}],"wrong":[{"sents":["[[아낌없이]] 주시는 사랑에 늘 감사드립니다.","[[머지 않아]] 이 마을에도 지하철이 들어올 거예요.","[[끊임없이]] 노력한 덕분에 합격했어요.","그 일은 [[반드시]] 오늘 끝내야 해요."],"wrong":1,"fix":"머지않아","why":"머지않다 is one word; it must not be spaced."},{"sents":["방을 [[깨끗히]] 청소했어요.","이 동아리는 대학 안에서 [[활발히]] 활동하고 있어요.","할머니는 손녀를 [[끔찍이]] 아끼세요.","서류를 [[꼼꼼히]] 확인해 주세요."],"wrong":0,"fix":"깨끗이","why":"깨끗하다 ends in ㅅ-batchim, so the adverb is 깨끗이, not -히."},{"sents":["[[다행히]] 비가 금방 그쳤어요.","그 사실을 [[완전히]] 잊어버렸어요.","콘서트장에는 [[수없이]] 많은 사람이 모였어요.","내일까지 [[반듯이]] 연락해 주세요."],"wrong":3,"fix":"반드시","why":"반듯이 means 'straight/neatly'; 'without fail' is 반드시."},{"sents":["음식을 [[적당히]] 드세요.","책상을 [[깨끗이]] 정리했어요.","[[곰곰히]] 생각해 보니 제 잘못이었어요.","[[끊임없이]] 질문이 쏟아졌어요."],"wrong":2,"fix":"곰곰이","why":"The adverb is 곰곰이 (not -히)."},{"sents":["[[낡은]] 가방이지만 아직 쓸 만해요.","처음 와 본 [[낯설은]] 도시에서 길을 잃었어요.","시장에는 [[싱싱한]] 생선이 가득했어요.","[[산뜻한]] 색깔의 옷을 샀어요."],"wrong":1,"fix":"낯선","why":"낯설다 drops ㄹ before ㄴ: 낯선, not 낯설은."},{"sents":["늦었으니까 빨리 [[서두러]] 주세요.","지도가 복잡해서 길이 [[헷갈려서]] 한참 헤맸어요.","시험이 끝나자 학생들이 [[흩어져]] 집으로 갔어요.","명절 시장은 [[떠들썩한]] 분위기였어요."],"wrong":0,"fix":"서둘러","why":"서두르다 is a 르-irregular: 서둘러."},{"sents":["그 가수는 오랫동안 [[인기를 누리고]] 있다.","요즘 회사에서 [[갈등을 겪고]] 있어요.","동생은 한 번 [[고집을 부리면]] 아무도 말릴 수 없어요.","그는 어릴 때부터 음악에서 [[두각을 나타나고]] 있었다."],"wrong":3,"fix":"두각을 나타내고","why":"나타나다 is intransitive; 두각을 나타내다 takes the object 두각을."},{"sents":["경찰이 사고의 원인을 [[밝혔어요]].","공원에서 자전거와 [[부딪혔어요]].","선거에서 우리 반 대표로 [[뽑였어요]].","눈이 와서 온 산이 하얗게 [[덮였어요]]."],"wrong":2,"fix":"뽑혔어요","why":"뽑다 → 뽑히다 (passive): 뽑혔어요."},{"sents":["추운 날 언 손을 따뜻한 물로 [[녹였어요]].","엄마가 아이에게 따뜻한 옷을 [[입었어요]].","이번 시험에서 점수를 [[높였어요]].","아픈 아이를 침대에 [[눕혔어요]]."],"wrong":1,"fix":"입혔어요","why":"'Dress someone' is the causative 입히다, not 입다."},{"sents":["회의 때문에 마감일을 일주일 [[늦혔다]].","라디오 소리를 조금 [[낮췄다]].","이사하면서 거실을 [[넓혔다]].","시끄럽던 소리가 갑자기 [[사라졌다]]."],"wrong":0,"fix":"늦췄다","why":"The causative of 늦다 is 늦추다 (늦췄다), not 늦히다."},{"sents":["공공장소에서 [[소란을 피우지]] 마세요.","그는 상사에게 [[호감을 사려고]] 애썼어요.","오랜 노력이 마침내 [[열매를 맺었어요]].","남에게 [[폐를 주지]] 않도록 조심하세요."],"wrong":3,"fix":"폐를 끼치지","why":"The collocation is 폐를 끼치다, not 폐를 주다."},{"sents":["그는 대회에서 [[실력을 발휘했어요]].","한참 울고 나서 친구가 [[화를 풀었어요]].","약속을 못 지킨 이유를 두고 계속 [[핑계를 하지]] 마세요.","손님께 [[허리를 숙여]] 인사했어요."],"wrong":2,"fix":"핑계를 대지","why":"The collocation is 핑계를 대다."},{"sents":["작은 목표를 이루고 [[성취감을 맛봤어요]].","일찍 일어나는 습관을 [[들었어요]].","[[이를 악물고]] 끝까지 달렸어요.","친구의 이야기에 [[귀를 기울였어요]]."],"wrong":1,"fix":"들였어요","why":"습관을 들이다 (not 들다)."},{"sents":["택배가 안 와서 [[어의없는]] 일이 생겼어요.","동생의 [[아슬아슬한]] 곡예를 보고 가슴이 뛰었어요.","숙제를 다 끝내니 마음이 [[후련해요]].","친구가 연락을 안 해서 좀 [[서운해요]]."],"wrong":0,"fix":"어이없는","why":"The word is 어이없다 (어이(가) 없다), not 어의없다."},{"sents":["매일 [[끊임없이]] 연습했어요.","[[어떻게든]] 해낼 거예요.","[[되도록]] 일찍 오세요.","그는 포기하지 않고 [[수 없이]] 시도했어요."],"wrong":3,"fix":"수없이","why":"수없이 is a single adverb ('countless times')."},{"sents":["책을 [[두세]] 권 빌렸어요.","빵을 [[한두]] 개만 사 주세요.","[[몇 몇]] 사람은 이미 집에 돌아갔어요.","[[수많은]] 이산가족이 만났어요."],"wrong":2,"fix":"몇몇","why":"몇몇 is one word."}],"pick":[{"s":"차에 태울 때 아이를 앞자리보다 뒷자리에 ( 앉는 / 앉히는 ) 게 안전해요.","answer":"앉히는","en":"It's safer to seat a child in the back seat than the front when riding in a car."},{"s":"아기에게 이유식을 ( 먹는 / 먹이는 ) 시간이 제일 행복해요.","answer":"먹이는","en":"The time I feed my baby solid food is the happiest."},{"s":"감기에 걸리지 않게 아이에게 두꺼운 외투를 ( 입어 / 입혀 ) 주세요.","answer":"입혀","en":"Please put a thick coat on the child so he doesn't catch a cold."},{"s":"친구가 일부러 이상한 표정을 지어서 나를 ( 웃었다 / 웃겼다 ).","answer":"웃겼다","en":"My friend made a silly face on purpose and made me laugh."},{"s":"거실을 ( 넓어 / 넓혀 ) 보려고 벽을 허물었어요.","answer":"넓혀","en":"We knocked down a wall to try to widen the living room."},{"s":"회의가 길어져서 약속 시간을 한 시간 ( 늦춰 / 늦어 ) 달라고 부탁했어요.","answer":"늦춰","en":"The meeting ran long, so I asked to push the appointment back an hour."},{"s":"밤에는 이웃에게 방해가 되니까 음악 소리를 좀 ( 낮아 / 낮춰 ) 주세요.","answer":"낮춰","en":"It disturbs the neighbors at night, so please turn the music down."},{"s":"아침에 늦잠 자는 아들을 ( 깨워서 / 깨서 ) 학교에 보냈어요.","answer":"깨워서","en":"I woke up my son, who was oversleeping, and sent him to school."},{"s":"아기를 겨우 ( 자고 / 재우고 ) 나서 설거지를 했어요.","answer":"재우고","en":"I barely got the baby to sleep, then did the dishes."},{"s":"얼음을 만들려고 물을 냉동실에 ( 얼려 / 얼어 ) 놓았어요.","answer":"얼려","en":"I put water in the freezer to freeze it into ice."},{"s":"야근이 계속돼서 일하는 시간이 점점 ( 늘려서 / 늘어서 ) 힘들어요.","answer":"늘어서","en":"Overtime keeps going so my working hours keep increasing and it's tough."},{"s":"경찰이 마침내 사고의 원인을 ( 밝았다 / 밝혔다 ).","answer":"밝혔다","en":"The police finally revealed the cause of the accident."},{"s":"감자는 껍질을 ( 벗어서 / 벗겨서 ) 삶으면 더 빨리 익어요.","answer":"벗겨서","en":"Potatoes cook faster if you peel them before boiling."},{"s":"엄마가 아이의 발에 운동화를 ( 신겨 / 신어 ) 주었어요.","answer":"신겨","en":"Mom put sneakers on her child's feet."},{"s":"아픈 아이를 침대에 ( 눕고 / 눕히고 ) 이마에 수건을 올려 주었어요.","answer":"눕히고","en":"I laid the sick child on the bed and put a towel on her forehead."},{"s":"얼음을 손으로 ( 녹여서 / 녹아서 ) 물을 만들었어요.","answer":"녹여서","en":"I melted the ice with my hands to make water."},{"s":"시험 점수를 ( 높으려면 / 높이려면 ) 꾸준히 공부해야 해요.","answer":"높이려면","en":"You have to study steadily if you want to raise your test score."},{"s":"고기를 속까지 완전히 ( 익어야 / 익혀야 ) 안전하게 먹을 수 있어요.","answer":"익혀야","en":"You must cook meat all the way through to eat it safely."},{"s":"이 소설은 십 대 독자에게 가장 많이 ( 읽힌다 / 읽는다 ).","answer":"읽힌다","en":"This novel is read the most by teenage readers."},{"s":"환자가 어제 병원에서 바이러스에 ( 감염했다 / 감염되었다 ).","answer":"감염되었다","en":"The patient was infected with the virus at the hospital yesterday."},{"s":"무너졌던 옛 궁궐이 원래 모습대로 ( 복원되었다 / 복원했다 ).","answer":"복원되었다","en":"The collapsed old palace was restored to its original appearance."},{"s":"눈이 와서 온 산이 하얗게 ( 덮었다 / 덮였다 ).","answer":"덮였다","en":"It snowed and the whole mountain was covered in white."},{"s":"엘리베이터 안에 한 시간 동안 ( 갇혔다 / 가두었다 ).","answer":"갇혔다","en":"I was trapped in the elevator for an hour."},{"s":"늦게 도착했지만 ( 다행이 / 다행히 ) 비행기가 아직 출발하지 않았어요.","answer":"다행히","en":"I arrived late but, fortunately, the plane hadn't left yet."}],"idiom":[{"idiom":"외유내강","b":"외유내강이시군요.","modelA":"어머니는 부드러워 보이는 인상과는 달리 속은 아주 강한 분이세요.","en":"My mother looks gentle, but inside she is very strong. / Gentle outside, strong inside."},{"idiom":"이심전심","b":"이심전심이라더니, 두 분 마음이 통했네요.","modelA":"제가 배고프다고 말하려는데 친구가 먼저 '밥 먹으러 가자'고 하더라고요.","en":"Just as I was about to say I was hungry, my friend said 'let's go eat.' / They say hearts understand each other without words."},{"idiom":"대기만성","b":"대기만성이라더니, 형님이 바로 그런 분이시군요.","modelA":"우리 형은 서른 살이 넘어서야 겨우 유명한 작가가 됐어요.","en":"My older brother only became a famous writer after turning thirty. / Great talents mature late."},{"idiom":"동문서답","b":"동문서답을 하시는군요.","modelA":"어제 어디 갔었냐고 물었는데 동생이 갑자기 '배고파요'라고 하더라고요.","en":"I asked my younger sibling where they went yesterday, and they suddenly said 'I'm hungry.' / Giving an irrelevant answer."},{"idiom":"동병상련","b":"동병상련이라고, 처지가 같은 사람끼리는 서로 이해하는 법이죠.","modelA":"저도 지난달에 시험에 떨어졌는데 그 친구도 떨어졌대요. 그래서 서로 위로해 줬어요.","en":"I failed an exam last month too, and that friend failed as well, so we comforted each other. / Fellow sufferers pity each other."},{"idiom":"막상막하","b":"정말 막상막하네요.","modelA":"두 선수 실력이 비슷해서 누가 이길지 전혀 모르겠어요.","en":"The two players are so evenly matched that I can't tell who will win. / Neck and neck."},{"idiom":"새옹지마","b":"새옹지마라더니, 인생은 정말 알 수 없네요.","modelA":"회사에서 잘려서 힘들었는데, 그 덕분에 시작한 가게가 지금은 아주 잘돼요.","en":"I had a hard time after being fired, but the shop I started because of it is doing very well now. / Fortune changes unexpectedly."},{"idiom":"설상가상","b":"설상가상이었네요.","modelA":"길이 막혀서 늦었는데 비까지 쏟아지고 우산도 없었어요.","en":"I was late because of traffic, and then it poured and I had no umbrella. / Making matters worse."},{"idiom":"일석이조","b":"일석이조네요.","modelA":"걸어서 출근하니까 운동도 되고 교통비도 아낄 수 있어요.","en":"Walking to work gives me exercise and saves transport money. / Killing two birds with one stone."},{"idiom":"천생연분","b":"천생연분이군요.","modelA":"두 사람은 취미도 성격도 똑같아서 싸우는 일이 거의 없대요.","en":"Those two have the same hobbies and personality, so they almost never fight. / A match made in heaven."},{"idiom":"칠전팔기","b":"칠전팔기네요. 정말 대단하세요!","modelA":"운전면허 시험에 일곱 번 떨어졌는데 여덟 번째에 드디어 붙었어요.","en":"I failed the driving test seven times but finally passed on the eighth. / Fall seven times, get up eight."},{"idiom":"함흥차사","b":"완전히 함흥차사네요.","modelA":"심부름을 보낸 동생이 세 시간이 지났는데 아직도 안 돌아와요. 연락도 없고요.","en":"I sent my sibling on an errand, and three hours later they still haven't returned or called. / Someone who disappears after being sent off."},{"idiom":"가는 날이 장날이다","b":"가는 날이 장날이라더니, 운이 없으셨네요.","modelA":"모처럼 그 식당에 갔는데 하필 오늘이 쉬는 날이래요.","en":"I finally went to that restaurant, and of all days it's closed today. / Bad timing on the day you go."},{"idiom":"배보다 배꼽이 더 크다","b":"배보다 배꼽이 더 크네요.","modelA":"만 원짜리 책을 사려고 했는데 배송비가 이만 원이래요.","en":"I wanted to buy a 10,000-won book, but the shipping is 20,000 won. / The tail is bigger than the body."},{"idiom":"병 주고 약 주다","b":"병 주고 약 주네요. 그 말 때문에 기분이 상하셨겠어요.","modelA":"친구가 제 그림을 보고 못 그렸다고 하더니, 나중에는 그래도 색은 예쁘다고 하더라고요.","en":"My friend said my painting was badly done, then later said at least the colors were pretty. / Hurting someone and then comforting them."},{"idiom":"식은 죽 먹기다","b":"식은 죽 먹기군요.","modelA":"저 사람한테는 그런 어려운 문제도 하나도 안 어렵대요. 금방 풀어요.","en":"Even such a hard problem isn't hard at all for that person; they solve it right away. / Easy as pie."},{"idiom":"싼 게 비지떡이다","b":"싼 게 비지떡이라더니, 그 말이 맞네요.","modelA":"아주 싸게 산 신발인데 일주일 만에 밑창이 떨어졌어요.","en":"I bought the shoes very cheaply, but the soles came off within a week. / You get what you pay for."},{"idiom":"제 눈에 안경이다","b":"제 눈에 안경이라고, 좋아하면 다 멋있어 보이는 법이죠.","modelA":"친구 남자친구는 솔직히 평범한데, 친구는 세상에서 제일 멋있대요.","en":"Honestly her boyfriend is ordinary, but she says he's the coolest in the world. / Beauty is in the eye of the beholder."},{"idiom":"이심전심","b":"이심전심이네요.","modelA":"약속도 안 했는데 오늘 아내와 제가 똑같은 선물을 사서 집에 왔어요.","en":"We hadn't agreed on anything, but my wife and I both came home with the same gift. / Hearts understanding each other."},{"idiom":"설상가상","b":"설상가상이시군요. 얼른 나으세요.","modelA":"감기에 걸려서 힘든데 오늘 아침에 지갑까지 잃어버렸어요.","en":"I'm suffering from a cold, and this morning I even lost my wallet. / Making matters worse."}],"speak":[{"grammar":"-긴요","a":"정말 노래를 잘하시는군요.","b":"___. 그냥 좋아해요.","answers":["잘하긴요"],"en":"A: You sing so well. B: Not at all. I just like it."},{"grammar":"-긴요","a":"요리 솜씨가 대단하세요. 이렇게 맛있는 건 처음 먹어 봐요.","b":"___. 그냥 집에서 하던 대로 했어요.","answers":["대단하긴요","맛있긴요"],"en":"A: Your cooking is amazing. I've never eaten anything this tasty. B: Not at all. I just cooked the way I do at home."},{"grammar":"-은/는 껌이다","a":"영어 번역 좀 부탁해도 될까요? 문장이 꽤 많은데요.","b":"그 정도는 저한테 ___. 금방 해 드릴게요.","answers":["껌이에요","껌이죠"],"en":"A: Could I ask you to translate into English? There are quite a lot of sentences. B: That's a piece of cake for me. I'll do it right away."},{"grammar":"-더라?","a":"우리 다음 모임이 몇 월 며칠이었어요?","b":"음, 몇 월 며칠 ___? 잠깐만요, 달력을 볼게요.","answers":["이더라"],"en":"A: What date is our next meeting? B: Hmm, what date was it again? Just a second, let me check the calendar."},{"grammar":"-면 다예요?","a":"제가 미안하다고 했잖아요.","b":"미안하다고 ___? 그렇게 말하면 제 속이 풀릴 것 같아요?","answers":["하면 다예요"],"en":"A: I already said I was sorry. B: Is saying you're sorry all there is to it? Do you think that will make me feel better?"},{"grammar":"-겠어요","a":"어제 밤새 일하고 오늘 아침에 또 출근했어요.","b":"많이 ___. 좀 쉬세요. (피곤하다)","answers":["피곤하시겠어요","피곤하겠어요"],"en":"A: I worked all night yesterday and came to work again this morning. B: You must be very tired. Please get some rest."},{"grammar":"-겠어요","a":"내일 같이 점심 먹을까요?","b":"네, 좋아요. 제가 맛있는 집을 한번 찾아 ___. (보다)","answers":["보겠어요"],"en":"A: Shall we have lunch together tomorrow? B: Sure. I'll try finding a good restaurant."},{"grammar":"-겠네요","a":"밖에 비가 아주 많이 오네요. 우산이 없는데 어떡하죠?","b":"이 비에는 우산이 있어도 다 ___. (젖다)","answers":["젖겠네요"],"en":"A: It's raining so hard outside. What do I do, I have no umbrella? B: In this rain, you'd get soaked even with an umbrella."},{"grammar":"-겠네요","a":"저 이번에 복권에 당첨됐어요!","b":"와, 정말 기분이 ___. (좋다)","answers":["좋으시겠네요","좋겠네요"],"en":"A: I won the lottery this time! B: Wow, you must feel really good."},{"grammar":"-겠군요","a":"이 집은 아침마다 햇빛이 정말 잘 들어요.","b":"아, 그래서 식물이 이렇게 잘 ___. (자라다)","answers":["자라겠군요","크겠군요"],"en":"A: This house gets lots of sunlight every morning. B: Ah, so that's why the plants grow so well."},{"grammar":"-겠군요","a":"저는 한국에서 십 년 동안 살았어요.","b":"아, 그래서 한국어를 이렇게 잘 ___. (하다)","answers":["하시겠군요","하겠군요"],"en":"A: I lived in Korea for ten years. B: Ah, so that's why you speak Korean so well."},{"grammar":"-다니 말도 안 되다","a":"사장님이 한 달 월급을 안 주고 도망갔대요.","b":"월급을 안 주고 ___ 말도 안 돼요! (도망가다)","answers":["도망가다니"],"en":"A: I heard the boss ran off without paying a month's salary. B: Running away without paying salaries, that makes no sense!"},{"grammar":"-다니 말도 안 되다","a":"민수 씨가 시험에서 백 점을 받았대요. 공부를 하나도 안 했는데요.","b":"공부도 안 했는데 백 점을 ___ 말도 안 돼요. (받다)","answers":["받다니"],"en":"A: I heard Minsu got a perfect score, though he didn't study at all. B: Getting a perfect score without studying, that makes no sense."},{"grammar":"-는 거야 일도 아니다","a":"이 무거운 상자를 혼자 옮길 수 있겠어요?","b":"이 정도 상자를 ___ 일도 아니에요. (옮기다)","answers":["옮기는 거야"],"en":"A: Can you move this heavy box by yourself? B: Moving a box this size is nothing at all."},{"grammar":"-는 거야 일도 아니다","a":"이렇게 많은 문장을 오늘까지 번역해야 해요?","b":"걱정 마세요. 저는 이 정도 ___ 일도 아니에요. (번역하다)","answers":["번역하는 거야"],"en":"A: I have to translate this many sentences by today? B: Don't worry. Translating this much is nothing for me."},{"grammar":"-면 누가 모를 줄 알고?","a":"나 어제 하루 종일 집에서 쉬었어.","b":"거짓말하면 ___? 어제 네가 극장에 있는 걸 봤다니까.","answers":["누가 모를 줄 알고"],"en":"A: I rested at home all day yesterday. B: Do you think I wouldn't know if you lie? I saw you at the cinema yesterday."},{"grammar":"누굴 망하게 할 참이야?","a":"내일 발표 자료를 아직도 안 만들었어. 그냥 즉흥으로 하자.","b":"뭐? ___? 팀 점수가 깎이면 어떡해.","answers":["누굴 망하게 할 참이야"],"en":"A: I still haven't made tomorrow's presentation material. Let's just improvise. B: What? Who are you trying to ruin? What if our team's grade drops?"},{"grammar":"언제까지 속일 셈이야?","a":"사실은 지난달부터 회사에 안 다니고 있어.","b":"뭐? 부모님께는 계속 출근한다고 했잖아. ___?","answers":["언제까지 속일 셈이야","언제까지 속일 셈이니"],"en":"A: Actually I haven't been going to work since last month. B: What? You kept telling your parents you go to work. How long do you intend to keep lying?"},{"grammar":"-기 짝이 없다","a":"그 사람은 약속을 해 놓고 연락도 없이 안 나왔대요.","b":"그 사람 행동이 정말 ___ 짝이 없어요. (한심하다)","answers":["한심하기"],"en":"A: I heard that person made plans and then didn't show up without any word. B: That person's behavior is incredibly pathetic."},{"grammar":"그렇긴 한데","a":"이 가방 좀 비싸지만 정말 예뻐요.","b":"___ 저한테는 좀 무거워 보여요.","answers":["그렇긴 한데","그렇긴 그런데"],"en":"A: This bag is a bit expensive, but it's really pretty. B: That's true, but it looks a bit heavy for me."}],"simile":[{"expr":"귀신같이 알아맞히다","meaning":"to guess something exactly right, as if by magic","model":["A: 어제 제가 뭘 먹었는지 맞혀 보세요.","B: 음... 김치찌개요?","A: 어떻게 알았어요? 정말 귀신같이 알아맞히시네요.","B: 옷에서 김치 냄새가 나거든요."]},{"expr":"곰같이 둔하다","meaning":"to be dull or clumsy like a bear","model":["A: 민호 씨는 몸이 크고 행동이 좀 느리죠?","B: 네, 곰같이 둔해서 늘 물건을 떨어뜨려요.","A: 그래도 마음은 정말 따뜻한 사람이에요.","B: 맞아요. 곰같이 둔하지만 정말 착한 사람이에요."]},{"expr":"여우같이 눈치가 빠르다","meaning":"to be quick to read the situation, like a fox","model":["A: 제가 깜짝 파티를 준비하는 걸 동생이 벌써 알아챘어요.","B: 동생이 여우같이 눈치가 빠르네요.","A: 맞아요. 아무 말도 안 했는데 표정만 보고 알더라고요.","B: 여우같이 눈치가 빠른 사람한테는 비밀을 지키기 어렵죠."]},{"expr":"물 쓰듯이 쓰다","meaning":"to spend something (money) freely, like water","model":["A: 지수 씨는 월급을 받으면 한 달도 안 돼서 다 쓴대요.","B: 정말요? 돈을 물 쓰듯이 쓰나 봐요.","A: 네, 어제도 쇼핑하는 데 백만 원을 썼어요.","B: 그렇게 물 쓰듯이 쓰면 나중에 후회할 텐데요."]},{"expr":"밥 먹듯이 하다","meaning":"to do something all the time, as casually as eating a meal","model":["A: 우리 팀장님은 야근을 밥 먹듯이 하세요.","B: 정말요? 건강이 걱정되네요.","A: 주말에도 출근을 밥 먹듯이 하셔서 가족들이 걱정해요.","B: 이제는 좀 쉬셔야 할 텐데요."]},{"expr":"불을 보듯이 뻔하다","meaning":"to be perfectly obvious, as clear as seeing fire","model":["A: 준비도 안 하고 시험을 보면 결과가 어떨까요?","B: 떨어질 게 불을 보듯이 뻔하죠.","A: 그런데 제 동생은 계속 놀기만 해요.","B: 결과가 불을 보듯이 뻔하니까 지금 말려야 해요."]},{"expr":"산더미같이 많다","meaning":"to be piled up in great amounts, like a mountain","model":["A: 요즘 많이 바쁘시죠?","B: 네, 처리해야 할 서류가 산더미같이 많아요.","A: 제가 좀 도와 드릴까요?","B: 정말요? 그럼 정말 고맙겠어요."]},{"expr":"얼굴이 백지장 같다","meaning":"to look pale, one's face like a blank sheet of paper","model":["A: 수연 씨, 얼굴이 백지장 같아요. 어디 아파요?","B: 어젯밤에 한숨도 못 잤어요.","A: 그러면 오늘은 일찍 들어가서 쉬세요.","B: 네, 그렇게 할게요. 고마워요."]}],"conflict":[{"title":"시험을 망친 날","lines":["친구1: 나 오늘 한국어 시험 완전히 망쳤어.","친구2: 그래? 난 이번 시험이 식은 죽 먹기던데.","친구1: 그래... 너는 공부를 잘하니까.","친구2: 하긴, 공부 안 하고 잠만 잤으니까 망치지.","친구1: 뭐? 나 밤새 공부했거든.","친구2: 밤새 했는데 그 점수야? 그럼 머리가 안 좋은 거 아니야?"],"problem":"Friend 2 brags that the test was easy (line 2) and then assumes Friend 1 didn't study (line 4) and even implies Friend 1 is not smart (line 6). Friend 1 only wanted comfort, so Friend 2's comparison and blame cause the conflict.","model":["A: 나 오늘 한국어 시험 완전히 망쳤어.","B: 어머, 정말? 많이 속상하겠다.","A: 응, 밤새 공부했는데도 모르는 문제가 너무 많았어.","B: 그러게. 밤새 공부했는데 결과가 안 좋으면 더 속상하지.","A: 맞아. 내 말이 그 말이야.","B: 그럴 수도 있겠다. 다음 시험은 잘 볼 수 있을 거야. 같이 공부할까?"]},{"title":"힘든 아르바이트","lines":["친구1: 요즘 아르바이트가 너무 힘들어서 그만두고 싶어.","친구2: 나는 아르바이트를 세 개 해도 안 힘든데.","친구1: 너는 체력이 좋으니까 그렇지.","친구2: 체력 문제가 아니라 의지가 약한 거지.","친구1: 내 말은 그게 아니라, 그냥 좀 들어 줬으면 해서...","친구2: 들어 주긴 뭘 들어 줘. 힘들면 그만두면 되잖아."],"problem":"Friend 2 compares themselves to Friend 1 (line 2), says Friend 1 is weak-willed (line 4), and refuses to listen (line 6). Friend 1 wanted sympathy, not advice or criticism.","model":["A: 요즘 아르바이트가 너무 힘들어서 그만두고 싶어.","B: 그렇구나. 무슨 일이 있었어?","A: 손님이 너무 많은 데다가 사장님도 계속 일을 더 시켜.","B: 그럴 수도 있겠다. 정말 힘들겠다.","A: 그러게 말이야. 그래서 쉬는 날에도 쉬는 것 같지가 않아.","B: 맞아, 맞아. 쉬어도 피곤하지. 오늘은 내가 커피 살게. 천천히 얘기해 봐."]},{"title":"말을 끊는 친구","lines":["친구1: 어제 퇴근길에 지갑을 잃어버렸는데...","친구2: 아, 지갑? 나도 작년에 잃어버렸어. 그때 카드를 다 정지해야 했는데 진짜 귀찮았어.","친구1: 그랬구나. 그런데 어제는...","친구2: 근데 너 저번에 말한 그 가방은 샀어?","친구1: 지금 내 얘기 하고 있잖아.","친구2: 아 알았어, 빨리 말해. 나 바빠."],"problem":"Friend 2 interrupts Friend 1 twice (lines 2 and 4), turns the topic to themselves and to a different subject, and finally rushes Friend 1 (line 6), so Friend 1 feels ignored.","model":["A: 어제 퇴근길에 지갑을 잃어버렸어.","B: 어머, 정말? 많이 놀랐겠다.","A: 응, 카드도 다 들어 있어서 어떻게 해야 할지 몰랐어.","B: 그러게. 카드가 다 들어 있으면 정말 당황스럽겠다. 그래서 어떻게 했어?","A: 일단 카드 회사에 전화해서 정지했어.","B: 잘했네. 그래도 큰 피해가 없어서 다행이다."]},{"title":"또 늦은 친구","lines":["친구1: 미안, 버스가 늦게 와서 20분 늦었어.","친구2: 또? 하루이틀이야?","친구1: 이번엔 진짜 버스 때문이야.","친구2: 언제까지 핑계 댈 셈이야?","친구1: 핑계라니, 나도 일찍 나오려고 했어.","친구2: 그럼 일찍 나왔어야지. 너랑 약속하면 매번 기다려야 하잖아."],"problem":"Friend 2 does not listen to the reason and accuses Friend 1 of always making excuses (lines 2, 4, 6). Friend 2's anger is understandable, but the blaming tone with no empathy turns it into an argument.","model":["A: 미안, 버스가 늦게 와서 20분 늦었어. 많이 기다렸지?","B: 응, 조금. 그런데 무슨 일 있었어?","A: 버스가 한참 안 왔어. 일찍 나오려고 했는데...","B: 그렇구나. 아침에 버스 기다리는 것도 힘들지.","A: 정말 미안해. 다음에는 더 일찍 나올게.","B: 그래. 나도 기다리다 보니 좀 속상했거든. 늦을 것 같으면 미리 연락해 줘."]},{"title":"다이어트를 시작한 친구","lines":["친구1: 나 오늘부터 다이어트 시작했어. 이번엔 꼭 성공할 거야.","친구2: 지난번에도 그렇게 말했잖아. 사흘 만에 포기했으면서.","친구1: 이번엔 다를 거야.","친구2: 네가 무슨 다이어트야. 어차피 또 치킨 시켜 먹을 텐데.","친구1: 너 지금 나 무시하는 거야?","친구2: 무시가 아니라 사실을 말하는 거야."],"problem":"Friend 2 brings up Friend 1's past failure (line 2), predicts failure again (line 4), and refuses to apologize (line 6). Friend 1 shared a new resolution and needed encouragement.","model":["A: 나 오늘부터 다이어트 시작했어. 이번엔 꼭 성공할 거야.","B: 와, 대단하다! 결심하기가 쉽지 않았겠다.","A: 맞아. 지난번에는 사흘 만에 포기해서 이번에는 걱정도 돼.","B: 하긴, 처음엔 누구나 힘들지.","A: 그렇지? 그래서 같이 운동해 줄 사람이 있으면 좋겠어.","B: 그럼 내가 같이 해 줄게. 주말에 산책부터 시작해 볼까?"]},{"title":"면접에서 떨어진 친구","lines":["친구1: 이번에도 면접에서 떨어졌어.","친구2: 또? 네가 너무 눈이 높은 거 아니야?","친구1: 그런 게 아니라 이번 회사는 정말 가고 싶었어.","친구2: 가고 싶다고 다 갈 수 있으면 누가 고생해? 네 수준에 맞는 데나 지원해.","친구1: 너 말 너무 심하게 하는 거 아니야?","친구2: 난 현실적으로 말한 거야."],"problem":"Friend 2 blames Friend 1 for aiming too high (line 2) and tells them to lower their standards (line 4) without acknowledging disappointment. Friend 1 is hurt and feels judged; Friend 2 then justifies the harsh words (line 6).","model":["A: 이번에도 면접에서 떨어졌어.","B: 아, 그래? 정말 속상하겠다.","A: 응. 이번 회사는 정말 가고 싶었거든.","B: 그렇구나. 간절히 원했던 회사였으니까 더 아쉽겠네.","A: 그러게. 내가 뭘 잘못했는지 모르겠어.","B: 잘못한 게 아니라 운이 안 따랐을 수도 있어. 다음 면접 준비도 같이 해 볼까?"]}]};

function burst(x, y, n = 40, p = 1){ if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = (2 + Math.random() * 6) * p; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4 * p, life: 60 + Math.random() * 40, age: 0, w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: COLORS[i % 6] }); }
  if (!raf) raf = requestAnimationFrame(tick); }
function tick(){ cx.clearRect(0, 0, innerWidth, innerHeight); parts = parts.filter(p => p.age < p.life);
  for (const p of parts) { p.age++; p.vy += .22; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.globalAlpha = Math.max(0, 1 - p.age / p.life); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); }
  raf = parts.length ? requestAnimationFrame(tick) : 0; }

  { id: "per",    title: "※ [{a}~{b}] 다음을 읽고 이 사람의 성격으로 알맞은 단어를 고르십시오. (각 1점)", n: 2, pts: 1 },
  { id: "wrong",  title: "※ [{a}~{b}] 다음 밑줄 친 부분이 틀린 것을 고르십시오. (각 1점)", n: 2, pts: 1 },
  { id: "box2",   title: "※ [{a}~{b}] 다음 밑줄 친 부분에 맞는 말을 골라 쓰십시오. (각 1점)", n: 4, pts: 1 },
  { id: "pick",   title: "※ [{a}~{b}] 알맞은 것을 고르십시오. (각 0.5점)", n: 4, pts: .5 },
  { id: "rew",    title: "※ [{a}~{b}] 다음 문법 중 알맞은 것을 골라서 밑줄 친 부분을 같은 뜻으로 바꾸십시오. (각 1점)", n: 3, pts: 1 },
  { id: "make",   title: "※ [{a}~{b}] 다음 문법을 사용해서 문장을 만드십시오. (각 2점)", n: 3, pts: 2 },
  { id: "idiom",  title: "대화 ※ [{a}~{b}] <보기>와 같이 대화를 완성하십시오. (각 3점)", n: 4, pts: 3, dlg: true },
  { id: "speak",  title: "※ [{a}~{b}] 알맞은 것을 골라 쓰십시오. (각 2점)", n: 2, pts: 2, dlg: true },
  { id: "simile", title: "※ [{a}] 다음 비유 표현을 사용해서 대화를 만드십시오. (6점)", n: 1, pts: 6, dlg: true },
  { id: "conf",   title: "※ [{a}] 대화 중 갈등을 일으키는 말을 고쳐 새로운 대화를 만드십시오. (8점)", n: 1, pts: 8, dlg: true },

const inCh = c => chSel.includes(+c);
function buildTest(){
  const W = DATA.words.filter(x => inCh(x.ch)), G = DATA.gram.filter(x => inCh(x.ch) || x.ch === "mid");
  const Q = []; let num = 0, dnum = 0;
  const push = (sec, q) => { const isD = sec.dlg; q.sec = sec; q.num = isD ? ++dnum : ++num; q.pts = sec.pts; q.ans = null; q.got = null; Q.push(q); };
  // 1-4 synonyms: the swap question in exam form
  for (const w of pick(W, 4)) push(SECS[0], { type: "mc", stem: w.s, options: shuffle([w.a, ...w.w]), answer: w.a, info: w.kr + " — " + w.gl, en: w.en });
  // 5-8 collocation matching (one set = 4 questions)
  { const set = pick(DATA.colloc, 1)[0]; const right = shuffle([...set.pairs.map(p => p[1]), set.extra]);
    set.pairs.forEach((p, k) => push(SECS[1], { type: "match", set, k, left: p[0], answer: p[1], right })); }
  // 9-13 / 18-21: a word box, write the right form
  const boxQs = pick(W.filter(w => w.kr.length > 1), 9);
  boxQs.slice(0, 5).forEach(w => push(SECS[2], { type: "type", box: [w.kr], stem: w.s.replace(/\[\[.+?\]\]/, "<span class=\"blank\"></span>"), answers: [w.a], info: w.kr + " — " + w.gl, en: w.en }));
  for (const p of pick(DATA.personality, 2)) push(SECS[3], { type: "mc", stem: p.text, boxed: true, options: shuffle(p.options.slice()), answer: p.answer, en: p.en });
  for (const p of pick(DATA.wrong, 2)) push(SECS[4], { type: "mc", sents: p.sents, options: p.sents.map((s, k) => k), answer: p.wrong, info: "→ " + p.fix + (p.why ? " · " + p.why : "") });
  boxQs.slice(5, 9).forEach(w => push(SECS[5], { type: "type", box: [w.kr], stem: w.s.replace(/\[\[.+?\]\]/, "<span class=\"blank\"></span>"), answers: [w.a], info: w.kr + " — " + w.gl, en: w.en }));
  for (const p of pick(DATA.pick, 4)) { const m = p.s.match(/\(\s*(.+?)\s*\/\s*(.+?)\s*\)/); push(SECS[6], { type: "two", stem: p.s.replace(m[0], "( ______ )"), options: [m[1], m[2]], answer: p.answer, en: p.en }); }
  // 26-28: rewrite with one of four grammar forms (underlined prompts only)
  { const rw = pick(G.filter(x => /\[\[/.test(x.p)), 3); const box = shuffle([...new Set([...rw.map(x => x.title), ...pick(DATA.gpoints.filter(p => !rw.some(r => r.title === p.title)), 1).map(p => p.title)])]);
    rw.forEach(x => push(SECS[7], { type: "type", long: true, box, stem: x.p, answers: [x.a], info: x.title, en: x.en })); }
  for (const g of pick(DATA.gpoints.filter(p => inCh(p.ch) || p.ch === "mid"), 3)) push(SECS[8], { type: "write", stem: g.title, model: (DATA.gram.find(x => x.g === g.id) || {}).a || "", lines: 2 });
  // 대화
  const bogi = pick(DATA.idiom, 1)[0];
  for (const d of pick(DATA.idiom.filter(x => x !== bogi), 4)) push(SECS[9], { type: "write", bogi, dlgB: d.b, model: "A: " + d.modelA + "\nB: " + d.b, lines: 2 });
  for (const s of pick(DATA.speak, 2)) push(SECS[10], { type: "type", box: [s.grammar], dlgA: s.a, dlgBb: s.b, answers: s.answers, en: s.en });
  { const s = pick(DATA.simile, 1)[0]; push(SECS[11], { type: "write", box: [s.expr], model: s.model.join("\n"), info: s.meaning, lines: 4 }); }
  { const c = pick(DATA.conflict, 1)[0]; push(SECS[12], { type: "write", conflict: c, model: c.model.join("\n"), info: c.problem, lines: 6 }); }
  return Q;
}

// ---------- the test ----------

}
function tickTimer(){
  const left = Math.max(0, 3600 - Math.floor((Date.now() - X.t0) / 1000));
  const el = $("#timer"); el.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0"); el.classList.toggle("low", left < 300);
  if (!left && !X.ended) submit();

function secRange(q){ const same = X.Q.filter(x => x.sec === q.sec); return { a: same[0].num, b: same[same.length - 1].num }; }
function show(){

  else if (q.sec.id === "idiom") h += `</div><div class="dlg" lang="ko"><div>A: <span class="blank" style="min-width:200px"></span></div><div>B: ${esc(q.dlgB)}</div></div><input class="ans" lang="ko" placeholder="A: …" value="${esc(q.ans || "")}">`;
  else if (q.sec.id === "speak") h += `</div><div class="dlg" lang="ko"><div>A: ${esc(q.dlgA)}</div><div>B: ${esc(q.dlgBb).replace("___", '<span class="blank"></span>')}</div></div><input class="ans" lang="ko" value="${esc(q.ans || "")}">`;
  else if (q.sec.id === "simile") h += `</div><textarea class="ans" lang="ko" placeholder="A: …&#10;B: …&#10;A: …&#10;B: …">${esc(q.ans || "")}</textarea>`;

  else if (q.type === "two") h += `${esc(q.stem)}</div><div class="two">${q.options.map(o => `<button class="opt${q.ans === o ? " sel" : ""}" data-o="${esc(o)}" lang="ko">${esc(o)}</button>`).join("")}</div>`;
  else if (q.type === "mc") h += `${q.boxed ? `</div><div class="bogi" lang="ko">${esc(q.stem)}</div><div>` : ul(q.stem)}</div><div class="opts">${q.options.map((o, k) => `<button class="opt${q.ans === o ? " sel" : ""}" data-o="${esc(o)}" lang="ko"><span class="n">${k + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  h += `<div id="fbx"></div>`;

function matchHtml(q){

    <div class="mcol">${q.right.map(r => `<button class="mi${q.ans === r ? " sel" : ""}" data-o="${esc(r)}" lang="ko">${esc(r)}</button>`).join("")}</div></div>`;
}
$("#paper").onclick = e => {
  const b = e.target.closest("[data-o]"); if (!b) return; const q = X.Q[X.i]; if (q.done) return;

};
function setNext(){

  else $("#next").textContent = last ? T("submit") : T("next") + " →";

$("#dots").onclick = e => { const b = e.target.closest("[data-k]"); if (!b) return; X.i = +b.dataset.k; show(); };
