<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Korean 5A — 중간시험 연습</title>
<meta name="description" content="Sogang Korean 5A mock midterm: 5급 말하기 어휘·문법 + 대화, 39 questions, 60 points, a new test every time.">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="exam.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="5A 시험 연습">
<link rel="apple-touch-icon" href="icon-exam-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2e; --card:#1c2740; --card2:#223052; --paper:#f7f4ec; --ink:#1d2230;
    --line:#2c3a5a; --txt:#eaf0fb; --dim:#96a3c2; --accent:#5b8cff; --gold:#ffcf5c; --good:#37d18f; --bad:#ff6b7a; --fire:#ff8a3d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Microsoft YaHei","PingFang SC","Leelawadee UI",Tahoma,Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -200px,#1b2747,transparent),linear-gradient(180deg,#0f1420,#0b0f18);color:var(--txt);min-height:100vh;overflow-x:hidden}
  .wrap{max-width:680px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--accent)}
  .hidden{display:none!important}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .home{border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--dim);text-decoration:none;font-size:14px}
  .top h1{font-size:19px;margin:0;flex:1}
  .iconbtn{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:16px}
  .chip{background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 12px;font-size:14px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .langs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
  .hero{background:linear-gradient(135deg,#23315a,#1a2440);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .hero h2{margin:0 0 4px;font-size:22px}
  .hero p{margin:0;color:var(--dim);font-size:14px;line-height:1.5}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:rgba(0,0,0,.18);border-radius:12px;padding:8px;text-align:center}
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--dim)}
  .label{font-size:13px;color:var(--dim);margin:14px 0 6px}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mode{text-align:left;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2)}
  .mode b{display:block;font-size:16px}
  .mode small{color:var(--dim);font-size:12.5px;line-height:1.35;display:block;margin-top:3px}
  .mode.on{border-color:var(--accent);background:linear-gradient(135deg,rgba(91,140,255,.25),rgba(155,123,255,.18))}
  .chs{display:flex;flex-wrap:wrap;gap:6px}
  .go{display:block;width:100%;margin-top:18px;padding:16px;border:0;border-radius:16px;font-size:19px;font-weight:800;color:#fff;background:linear-gradient(135deg,#5b8cff,#8a6bff);box-shadow:0 10px 26px rgba(91,140,255,.35)}
  .go:disabled{opacity:.45}
  .note{color:var(--dim);font-size:12.5px;margin-top:14px;line-height:1.5}

  /* exam paper */
  .hud{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .prog{flex:1;height:10px;background:#0d1322;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--good),#7af0c0);transition:width .35s}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold);min-width:58px;text-align:right}
  .timer.low{color:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.5}}
  .combo{font-weight:800;color:var(--fire);min-width:44px;text-align:right}
  .paper{background:var(--paper);color:var(--ink);border-radius:14px;padding:18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);line-height:1.7}
  .sec{font-size:14.5px;font-weight:700;color:#3a3f52;border-bottom:1px dashed #cfc8b6;padding-bottom:8px;margin-bottom:12px}
  .qn{font-weight:800;margin-right:6px}
  .stem{font-size:18.5px;word-break:keep-all}
  .stem u{text-decoration-thickness:2px;text-underline-offset:4px}
  .box{border:1.6px solid #333;padding:10px 14px;margin:10px 0;display:flex;flex-wrap:wrap;gap:18px;justify-content:center;font-size:17px;font-weight:600}
  .bogi{border:1.4px solid #555;border-radius:10px;padding:10px 12px;margin:8px 0 12px;font-size:15.5px;background:#fffdf6}
  .opts{display:grid;gap:8px;margin-top:12px}
  .opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:#fff;border:1.5px solid #d7d0bf;border-radius:12px;padding:10px 12px;font-size:17px;color:var(--ink)}
  .opt .n{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #888;display:grid;place-items:center;font-size:13px;font-weight:700}
  .opt.sel{border-color:var(--accent);background:#e8eeff}
  .opt.sel .n{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt.right{border-color:var(--good);background:#dff7ec}
  .opt.wrong{border-color:var(--bad);background:#ffe6e9}
  .two{display:flex;gap:10px;margin-top:12px}
  .two .opt{justify-content:center}
  .blank{display:inline-block;min-width:110px;border-bottom:2px solid #333;margin:0 4px}
  input.ans,textarea.ans{width:100%;margin-top:12px;background:#fff;border:1.5px solid #c9c1ad;border-radius:10px;padding:10px 12px;font-size:17px;color:var(--ink)}
  textarea.ans{min-height:110px;resize:vertical;line-height:1.6}
  input.ans:focus,textarea.ans:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .dlg{margin:8px 0;font-size:16.5px}
  .dlg div{margin:3px 0}
  .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:12px}
  .mcol{display:grid;gap:8px;align-content:start}
  .mi{background:#fff;border:1.5px solid #d7d0bf;border-radius:10px;padding:9px 10px;font-size:16.5px;color:var(--ink);text-align:left;position:relative}
  .mi.sel{border-color:var(--accent);background:#e8eeff}
  .mi .tag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;border-radius:999px;padding:1px 7px;color:#fff}
  .mi.right{border-color:var(--good);background:#dff7ec}
  .mi.wrong{border-color:var(--bad);background:#ffe6e9}
  .fb{margin-top:12px;border-radius:12px;padding:10px 12px;background:#efe9da;font-size:15px;line-height:1.55}
  .fb .h{font-weight:800}
  .fb.good .h{color:#178a58}.fb.bad .h{color:#c23a4b}
  .model{white-space:pre-wrap;background:#fff;border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;margin-top:6px}
  .marks{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .marks button{flex:1;min-width:90px;padding:10px;border-radius:10px;border:1.5px solid #bdb5a2;background:#fff;color:var(--ink);font-weight:700}
  .marks button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .nav{display:flex;gap:10px;margin-top:12px}
  .nav button{flex:1;padding:13px;border-radius:14px;border:0;font-weight:800;font-size:16px}
  .nav .prev{background:var(--bg2);border:1px solid var(--line)}
  .nav .next{background:var(--accent);color:#fff}
  .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
  .dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);font-size:12px;color:var(--dim)}
  .dot.done{background:#2a3a63;color:var(--txt)}
  .dot.cur{outline:2px solid var(--gold)}
  .override{margin-top:8px;font-size:13.5px;background:none;border:1px dashed #9a927d;border-radius:8px;padding:6px 10px;color:#5b5440}
  /* results */
  .score{text-align:center;margin:8px 0}
  .score .big{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#ffcf5c,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .score .of{color:var(--dim);font-size:18px}
  .grade{text-align:center;font-size:20px;font-weight:800;margin-top:2px}
  .rows{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .row:first-child{border-top:0}
  .row b{font-variant-numeric:tabular-nums}
  .ghost{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);font-weight:700;font-size:16px}
  .float{position:fixed;pointer-events:none;font-weight:900;font-size:24px;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.6);z-index:30;animation:rise 1s ease-out forwards}
  @keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:29}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <a class="home" href="index.html">← 5A</a>
    <h1>📝 중간시험 연습 <span style="color:var(--dim);font-weight:500;font-size:14px">· Mock exam</span></h1>
    <button class="iconbtn" id="mute">🔊</button>
  </div>

  <section id="start">
    <div class="langs" id="langs"></div>
    <div class="hero">
      <h2>5급 말하기 · 어휘·문법 / 대화</h2>
      <p id="tIntro"></p>
      <div class="stats">
        <div class="stat"><b id="sTests">0</b><span id="tTests"></span></div>
        <div class="stat"><b id="sBest">–</b><span id="tBest"></span></div>
        <div class="stat"><b id="sLast">–</b><span id="tLast"></span></div>
      </div>
    </div>
    <div class="label" id="tMode"></div>
    <div class="modes" id="modes"></div>
    <div class="label" id="tCh"></div>
    <div class="chs" id="chs"></div>
    <button class="go" id="go"></button>
    <p class="note" id="tNote"></p>
  </section>

  <section id="exam" class="hidden">
    <div class="hud">
      <button class="iconbtn" id="quit">✕</button>
      <div class="prog"><i id="progFill"></i></div>
      <div class="combo hidden" id="combo">🔥0</div>
      <div class="timer" id="timer"></div>
    </div>
    <div class="paper" id="paper"></div>
    <div class="nav">
      <button class="prev" id="prev">←</button>
      <button class="next" id="next"></button>
    </div>
    <div class="dots" id="dots"></div>
  </section>

  <section id="mark" class="hidden"></section>
  <section id="result" class="hidden"></section>
</div>

<script>
const DATA = {"chapters":[{"n":1,"title":"1과"},{"n":2,"title":"2과"},{"n":3,"title":"3과"},{"n":4,"title":"4과"},{"n":5,"title":"5과"},{"n":6,"title":"6과"},{"n":7,"title":"7과"},{"n":8,"title":"8과"}],"words":[{"kr":"막돼먹다","ch":1,"s":"저 사람은 [[예의 없는]] 사람이라서 다들 싫어해요.","a":"막돼먹은","w":["진지한","서먹한","난처한"],"en":"Everyone dislikes that person because he is rude.","gl":"to be rude, ill-mannered, badly behaved (often implies lack of basic decency)"},{"kr":"탈출하다","ch":1,"s":"불이 나서 사람들이 건물에서 [[도망쳐 나왔어요]].","a":"탈출했어요","w":["도전했어요","몰두했어요","발전했어요"],"en":"There was a fire, so people ran out of the building.","gl":"to escape, to break out, to get away"},{"kr":"소름","ch":1,"s":"무서운 영화를 봐서 팔에 [[닭살]]이 돋았어요.","a":"소름","w":["환청","식중독","소란"],"en":"I watched a scary movie and got goosebumps on my arms.","gl":"goosebumps, chills (from fear, shock, or strong emotion)"},{"kr":"바짝","ch":1,"s":"버스에서 모르는 사람이 내 옆에 [[아주 가깝게]] 앉았어요.","a":"바짝","w":["설마","반드시","끊임없이"],"en":"On the bus, a stranger sat very close to me.","gl":"closely, tightly, right up against; also \"completely / extremely\" depending on context"},{"kr":"야심","ch":1,"s":"그는 사장이 되겠다는 [[큰 꿈]]을 가지고 있어요.","a":"야심","w":["충격","비결","이력"],"en":"He has a big ambition to become the boss.","gl":"ambition (often strong or big goals)"},{"kr":"줄줄이","ch":1,"s":"새 빵을 사려고 손님들이 [[계속 이어서]] 들어왔어요.","a":"줄줄이","w":["설마","반드시","맘껏"],"en":"Customers came in one after another to buy the new bread.","gl":"one after another, in a row, consecutively"},{"kr":"나가떨어지다","ch":1,"s":"마라톤 중간에 힘든 사람들이 [[쓰러지거나 포기했어요]].","a":"나가떨어졌어요","w":["매달렸어요","몰두했어요","도전했어요"],"en":"Halfway through the marathon, tired people collapsed or gave up.","gl":"to collapse, drop out, be knocked out (physically or figuratively)"},{"kr":"설마","ch":1,"s":"[[그럴 리 없겠지만]] 네가 내 비밀을 말한 건 아니지?","a":"설마","w":["반드시","맘껏","줄줄이"],"en":"It can't be, but you didn't tell my secret, did you?","gl":"no way, could it be?, I doubt it (expresses disbelief)"},{"kr":"조잡하다","ch":1,"s":"이 가방은 [[잘 만들지 못한]] 물건이라서 금방 망가졌어요.","a":"조잡한","w":["진지한","서먹한","불안한"],"en":"This bag was poorly made, so it broke quickly.","gl":"crude, sloppy, poorly made"},{"kr":"대체","ch":1,"s":"한 시간이나 기다렸는데, [[답답해서 묻는데]] 너는 지금 어디야?","a":"대체","w":["설마","일단","아무래도"],"en":"I've waited an hour. Where on earth are you now?","gl":"on earth, in the world"},{"kr":"매달리다","ch":1,"s":"아이가 울면서 엄마 팔에 [[꼭 붙었어요]].","a":"매달렸어요","w":["부딪혔어요","안주했어요","도전했어요"],"en":"The child cried and clung tightly to her mother's arm.","gl":"to hang onto, cling to; to be obsessed with / devoted to"},{"kr":"대충","ch":1,"s":"시간이 없어서 청소를 [[꼼꼼하지 않게]] 했어요.","a":"대충","w":["깨끗이","끊임없이","맘껏"],"en":"I had no time, so I cleaned roughly.","gl":"roughly, approximately; carelessly, half-heartedly"},{"kr":"몰두하다","ch":1,"s":"그는 요즘 소설 쓰는 일에 [[온 마음을 쏟고]] 있어요.","a":"몰두하고","w":["탈출하고","망하고","안주하고"],"en":"These days he is devoting himself to writing a novel.","gl":"to immerse oneself in, to be absorbed in"},{"kr":"처형","ch":1,"s":"생일에 [[아내의 언니]]가 시계를 선물해 줬어요.","a":"처형","w":["안무가","금메달리스트","장애인"],"en":"My wife's older sister gave me a watch for my birthday.","gl":"wife's older sister (a man's term); (also) execution"},{"kr":"일단","ch":1,"s":"배고프니까 [[먼저]] 밥부터 먹자.","a":"일단","w":["설마","맘껏","끊임없이"],"en":"I'm hungry, so let's eat first.","gl":"for now, first of all, once (something happens)"},{"kr":"아무래도","ch":1,"s":"하늘이 어두워서 [[아마도]] 오늘 비가 올 것 같아요.","a":"아무래도","w":["맘껏","일단","끊임없이"],"en":"The sky is dark, so it will probably rain today.","gl":"probably, it seems likely"},{"kr":"수정","ch":1,"s":"보고서에 틀린 곳이 많아서 [[고치는 일]]이 필요해요.","a":"수정","w":["충격","재활","소란"],"en":"The report has many mistakes, so it needs correcting.","gl":"correction, revision;"},{"kr":"식상하다","ch":1,"s":"요즘 드라마에는 [[새롭지 않고 지루한]] 이야기가 많아요.","a":"식상한","w":["진지한","서먹한","후련한"],"en":"Many recent dramas have stale, boring stories.","gl":"to be cliché, stale, overused, boring from repetition"},{"kr":"망하다","ch":1,"s":"경기가 나빠서 동네 식당이 [[돈을 잃고 문을 닫았어요]].","a":"망했어요","w":["도전했어요","발전했어요","안주했어요"],"en":"The economy is bad, ung.","gl":"stinging, smarting (pain like from a cut, sunburn, or harsh words)"},{"kr":"명상하다","ch":4,"s":"스트레스를 풀려고 매일 아침 [[눈을 감고 마음을 가라앉혀요]].","a":"명상해요","w":["인정해요","표현해요","방해해요"],"en":"To relieve stress, I close my eyes and calm my mind every morning.","gl":"to meditate"},{"kr":"쌩쌩하다","ch":4,"s":"밤새 못 잤는데도 오늘 [[기운이 넘쳐]] 보여요.","a":"쌩쌩해","w":["따가워","단정해","엄청나"],"en":"Even though you didn't sleep all night, you look full of energy today.","gl":"to be lively, energetic, in good condition"},{"kr":"개운하다","ch":4,"s":"목욕을 하고 나니 몸이 [[가볍고 상쾌해서]] 기분이 좋아요.","a":"개운해서","w":["따가워서","단정해서","엄청나서"],"en":"After a bath, my body feels light and refreshed, so I feel good.","gl":"to feel refreshed, relieved, clear (physically or mentally)"},{"kr":"깡충깡충","ch":4,"s":"아이들이 토끼처럼 [[가볍게 자꾸 뛰며]] 마당을 돌아다녔다.","a":"깡충깡충","w":["제대로","워낙","원래"],"en":"The children hopped around the yard like rabbits.","gl":"hopping, bouncing repeatedly (like jumping up and down)"},{"kr":"윗몸 일으키기","ch":4,"s":"복근을 키우려고 [[누워서 상체를 올리는 운동을]] 매일 해요.","a":"윗몸 일으키기를","w":["줄넘기를","잡념을","주례를"],"en":"To build abs, I do sit-ups every day.","gl":"sit-ups"},{"kr":"품행","ch":4,"s":"교장 선생님은 그 학생의 [[평소의 행동을]] 칭찬하셨다.","a":"품행을","w":["수작을","잡념을","백수를"],"en":"The principal praised that student's good conduct.","gl":"behavior, conduct (often referring to moral behavior)"},{"kr":"단정하다","ch":4,"s":"면접에 갈 때는 옷차림을 [[깔끔하게]] 해야 한다.","a":"단정하게","w":["따갑게","개운하게","무사하게"],"en":"When going to an interview, you should dress neatly.","gl":"to be neat, tidy, well-groomed; also proper and well-mannered"},{"kr":"원래","ch":4,"s":"이 가게는 [[처음부터]] 문구점이었는데 지금은 카페가 됐다.","a":"원래","w":["제대로","깡충깡충","워낙"],"en":"This shop was originally a stationery shop but is now a cafe.","gl":"originally, by nature, from the beginning"},{"kr":"오르락내리락하다","ch":4,"s":"주식 가격이 하루에도 몇 번씩 [[높아졌다 낮아졌다 하며]] 사람들을 불안하게 한다.","a":"오르락내리락하며","w":["방해하며","사라지며","명상하며"],"en":"Stock prices go up and down several times a day, making people anxious.","gl":"to go up and down, fluctuate"},{"kr" 은 [[가족 외에는]] 친구가 없어요.","a":"그 사람은 가족 말고는 친구가 없어요.","en":"He has no friends other than his family."},{"g":"g1-6","ch":1,"title":"A/V-(느)냐에 달려 있다","p":"발표 결과 + 내가 얼마나 연습하다","a":"발표 결과는 내가 얼마나 연습하느냐에 달려 있다.","en":"The result of the presentation depends on how much I practice."},{"g":"g1-6","ch":1,"title":"A/V-(느)냐에 달려 있다","p":"경기 결과 + 우리가 얼마나 뛰다","a":"경기 결과는 우리가 얼마나 뛰느냐에 달려 있다.","en":"The result of the game depends on how much we run."},{"g":"g1-6","ch":1,"title":"A/V-(느)냐에 달려 있다","p":"내 기분 + 네가 어떻게 대답하다","a":"내 기분은 네가 어떻게 대답하느냐에 달려 있다.","en":"My mood depends on how you answer."},{"g":"g1-6","ch":1,"title":"A/V-(느)냐에 달려 있다","p":"음식의 맛 + 재료가 얼마나 신선하다","a":"음식의 맛은 재료가 얼마나 신선하냐에 달려 있다.","en":"The taste of food depends on how fresh the ingredients are."},{"g":"g1-6","ch":1,"title":"A/V-(느)냐에 달려 있다","p":"한국어 실력 + 매일 얼마나 연습하다","a":"한국어 실력은 매일 얼마나 연습하느냐에 달려 있다.","en":"Your Korean skill depends on how much you practice every day."},{"g":"g1-6","ch":1,"title":"A/V-(느)냐에 달려 있다","p":"여행의 즐거움 + 어떤 사람과 같이 가다","a":"여행의 즐거움은 어떤 사람과 같이 가느냐에 달려 있다.","en":"The enjoyment of a trip depends on who you go with."},{"g":"g1-6","ch":1,"title":"A/V-(느)냐에 달려 있다","p":"집값 + 위치가 얼마나 편하다","a":"집값은 위치가 얼마나 편하냐에 달려 있다.","en":"The price of a house depends on how convenient the location is."},{"g":"g1-6","ch":1,"title":"A/V-(느)냐에 달려 있다","p":"성적 + 네가 얼마나 공부하다","a":"성적은 네가 얼마나 공부하느냐에 달려 있다.","en":"Your grades depend on how much you study."},{"g":"g1-7","ch":1,"title":"N에 달려 있다","p":"음식의 맛 + 재료","a":"음식의 맛은 재료에 달려 있다.","en":"The taste of food depends on the ingredients."},{"g":"g1-7","ch":1,"title":"N에 달려 있다","p":"행복 + 마음먹기","a":"행복은 마음먹기에 달려 있다.","en":"Happiness depends on your mindset."},{"g":"g1-7","ch":1,"title":"N에 달려 있다","p":"그 영화의 성공 + 주인공 배우","a":"그 영화의 성공은 주인공 배우에게 달려 있다.","en":"The movie's success depends on the lead actor."},{"g":"g1-7","ch":1,"title":"N에 달려 있다","p":"건강 + 매일의 습관","a":"건강은 매일의 습관에 달려 있다.","en":"Health depends on your daily habits."},{"g":"g1-7","ch":1,"title":"N에 달려 있다","p":"그 일을 here's an accident?"},{"g":"g3-2","ch":3,"title":"A/V-기라도 하면","p":"아이가 길을 잃다 + 어떡하나 걱정이다","a":"아이가 길을 잃기라도 하면 어떡하나 걱정이다.","en":"I'm worried about what to do if the child gets lost."},{"g":"g3-2","ch":3,"title":"A/V-기라도 하면","p":"비밀번호를 잊어버리다 + 어떡해?","a":"비밀번호를 잊어버리기라도 하면 어떡해?","en":"What if I forget the password?"},{"g":"g3-2","ch":3,"title":"A/V-기라도 하면","p":"운전 중에 비가 많이 오다 + 두렵다","a":"운전 중에 비가 많이 오기라도 하면 두렵다.","en":"I'd be scared if it rained a lot while driving."},{"g":"g3-2","ch":3,"title":"A/V-기라도 하면","p":"엄마가 내 일기를 읽다 + 어떡하지?","a":"엄마가 내 일기를 읽기라도 하면 어떡하지?","en":"What if Mom reads my diary?"},{"g":"g3-2","ch":3,"title":"A/V-기라도 하면","p":"여권을 잃어버리다 + 어떡하나 걱정이 됐다","a":"여권을 잃어버리기라도 하면 어떡하나 걱정이 됐다.","en":"I was worried about what I'd do if I lost my passport."},{"g":"g3-2","ch":3,"title":"A/V-기라도 하면","p":"급한 연락을 놓치다 + 어떡하나 불안했다","a":"급한 연락을 놓치기라도 하면 어떡하나 불안했다.","en":"I felt anxious about what would happen if I missed an urgent message."},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"어제 날씨가 [[아주 추웠다.]]","a":"어제 날씨가 어찌나 춥던지…","en":"Yesterday it was so cold…"},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"그 영화가 [[아주 지루했다.]]","a":"그 영화가 어찌나 지루하던지…","en":"That movie was so boring…"},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"숙제를 끝내고 나니까 [[아주 기뻤다.]]","a":"숙제를 끝내고 나니까 어찌나 기쁘던지…","en":"When I finished my homework, I was so happy…"},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"결혼식 날 어머니가 [[아주 많이 우셨다.]]","a":"결혼식 날 어머니가 어찌나 많이 우시던지…","en":"On the wedding day, Mom cried so much…"},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"내가 삼겹살을 [[아주 급하게 먹었다.]]","a":"내가 삼겹살을 어찌나 급하게 먹었던지…","en":"I ate the pork belly so hurriedly…"},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"어제 본 공포 영화가 [[아주 무서웠다.]]","a":"어제 본 공포 영화가 어찌나 무섭던지…","en":"The horror movie I watched yesterday was so scary…"},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"시장에 갔더니 사람이 [[아주 많았다.]]","a":"시장에 갔더니 사람이 어찌나 많던지…","en":"When I went to the market, there were so many people…"},{"g":"g3-3","ch":3,"title":"어찌나 A/V-던지","p":"내가 어제 [[아주 많이 웃었다.]]","a":"내가 어제 어찌나 많이 웃었던지…","en":"Yesterday I laughed so much…"},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"사람들 앞에서 발표하다 + 차라리 숙제를 하겠다","a":"사람들 앞에서 발표하느니 차라리 숙제를 하겠다.","en":"I'd rather do homework than present in front of people."},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"백화점에서 쇼핑하다 + 차라리 집에서 쉬겠다","a":"백화점에서 쇼핑하느니 차라리 집에서 쉬겠다.","en":"I'd rather rest at home than shop at the department store."},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"청소하다 + 차라리 설거지할게","a":"청소하느니 차라리 설거지할게.","en":"I'd rather do the dishes than clean."},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"택시를 타다 + 차라리 걸어가겠다","a":"택시를 타느니 차라리 걸어가겠다.","en":"I'd rather walk than take a taxi."},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"그 사람한테 부탁하다 + 차라리 내가 직접 하겠다","a":"그 사람한테 부탁하느니 차라리 내가 직접 하겠다.","en":"I'd rather do it myself than ask that person."},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"이런 회사에서 일하다 + 차라리 그만두겠다","a":"이런 회사에서 일하느니 차라리 그만두겠다.","en":"I'd rather quit than work at a company like this."},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"비싼 옷을 사다 + 차라리 여행을 가겠다","a":"비싼 옷을 사느니 차라리 여행을 가겠다.","en":"I'd rather go on a trip than buy expensive clothes."},{"g":"g4-1","ch":4,"title":"V-느니 (차라리)","p":"친구한테 거짓말을 하다 + 차라리 솔직하게 말하겠다","a":"친구한테 거짓말을 하느니 차라리 솔직하게 말하겠다.","en":"I'd rather tell the truth than lie to my friend."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[커피도 마시고 책도 읽기 위해서]] 카페에 갔다.","a":"커피도 마시고 책도 읽을 겸 카페에 갔다.","en":"I went to a cafe to have coffee and read a book."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[영어도 배우고 여행도 하기 위해서]] 호주에 갔다.","a":"영어도 배우고 여행도 할 겸 호주에 갔다.","en":"I went to Australia to learn English and to travel."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[돈도 벌고 사람도 만나기 위해서]] 아르바이트를 했다.","a":"돈도 벌고 사람도 만날 겸 아르바이트를 했다.","en":"I worked part-time partly to earn money and partly to meet people."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[운동도 하고 산책도 하기 위해서]] 공원에 갔다.","a":"운동도 하고 산책도 할 겸 공원에 갔다.","en":"I went to the park partly to exercise and partly to take a walk."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[구경도 하고 선물도 사기 위해서]] 쇼핑몰에 갔다.","a":"구경도 하고 선물도 살 겸 쇼핑몰에 갔다.","en":"I went to the mall partly to look around and partly to buy a gift."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[산책도 하고 장도 보기 위해서]] 시장에 나왔다.","a":"산책도 하고 장도 볼 겸 시장에 나왔다.","en":"I came out to the market to take a walk and do some shopping."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[밥도 먹고 이야기도 하기 위해서]] 친구를 만났다.","a":"밥도 먹고 이야기도 할 겸 친구를 만났다.","en":"I met my friend partly to eat and partly to talk."},{"g":"g4-2","ch":4,"title":"V-을 겸 (해서)","p":"[[선물도 주고 인사도 하기 위해서]] 집에 갔다.","a":"선물도 주고 인사도 할 겸 집에 갔다.","en":"I went to the house partly to give a gift and partly to say hello."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"엄마 얘기는 듣다 + 청소하라고 하실 거야","a":"엄마 얘기는 들으나 마나 청소하라고 하실 거야.","en":"There's no need to listen — Mom will just tell me to clean."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"기다리다 + 오늘도 늦게 올 거야","a":"기다리나 마나 오늘도 늦게 올 거야.","en":"Waiting is pointless — he'll come late again today."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"이 약은 먹다 + 아무 효과가 없어요","a":"이 약은 먹으나 마나예요.","en":"This medicine is pointless to take."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"이렇게 비가 오는 날에는 우산은 쓰다 + 소용없어요","a":"이렇게 비가 오는 날에는 우산은 쓰나 마나예요.","en":"On a rainy day like this, an umbrella is useless."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"미나에게 말하다 + 절대로 안 할 거야","a":"미나에게 말하나 마나 절대로 안 할 거야.","en":"There's no point asking Mina — she will never do it."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"그 영화는 보다 + 재미없을 거야","a":"그 영화는 보나 마나 재미없을 거야.","en":"I don't even need to watch that movie — it's bound to be boring."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"그 사람에게 물어보다 + 모른다고 할 거예요","a":"그 사람에게 물어보나 마나 모른다고 할 거예요.","en":"It's no use asking him — he'll say he doesn't know."},{"g":"g4-3","ch":4,"title":"V-으나 마나","p":"점심시간이라 식당에 가다 + 사람이 많을 거야","a":"점심시간이라 식당에 가나 마나 사람이 많을 거야.","en":"It's lunchtime, so there's no point going to the restaurant — it'll be crowded."},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"하얗다 + 눈이 내렸다","a":"하얀 눈이 내렸다.","en":"White snow fell."},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"파랗다 + 하늘을 좋아해요","a":"파란 하늘을 좋아해요.","en":"I like blue skies."},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"까맣다 + 고양이가 지붕 위에 앉아 있어요","a":"까만 고양이가 지붕 위에 앉아 있어요.","en":"A black cat is sitting on the roof."},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"노랗다 + 꽃이 피었어요","a":"노란 꽃이 피었어요.","en":"Yellow flowers have bloomed."},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"오늘 하늘이 정말 파랗다 + (-아/어요)","a":"오늘 하늘이 정말 파래요.","en":"The sky is really blue today."},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"왜 얼굴이 빨갛다 + (-아/어요)","a":"왜 얼굴이 빨개요?","en":"Why is your face red?"},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"하늘이 까맣다 + (-(으)니까) 곧 비가 올 거예요","a":"하늘이 까마니까 곧 비가 올 거예요.","en":"The sky is dark, so it will rain soon."},{"g":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사","p":"이렇다 + 날씨에는 우산이 필요해요","a":"이런 날씨에는 우산이 필요해요.","en":"You need an umbrella in weather like this."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"데이트할 때 영화를 보다 / 드라이브를 하다","a":"데이트할 때 영화를 보기도 하고 드라이브를 하기도 한다.","en":"On dates, we sometimes watch a movie and sometimes go for a drive."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"대학을 졸업했을 때 기쁘다 / 아쉽다 (과거)","a":"대학을 졸업했을 때 기쁘기도 하고 아쉽기도 했다.","en":"When I graduated from university, I felt both happy and sad."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"사과는 맛있다 / 건강에 좋다 → 아침마다 먹는다","a":"사과는 맛있기도 하고 건강에 좋기도 해서 아침마다 먹는다.","en":"Apples are both tasty and good for your health, so I eat one every morning."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"이 가방은 예쁘다 / 튼튼하다 → 자주 써요","a":"이 가방은 예쁘기도 하고 튼튼하기도 해서 자주 써요.","en":"This bag is pretty and sturdy, so I use it often."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"주말에 늦잠을 자다 / 운동을 하다","a":"주말에 늦잠을 자기도 하고 운동을 하기도 한다.","en":"On weekends I sometimes sleep in and sometimes exercise."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"그 식당은 맛있다 / 싸다 → 자주 가요","a":"그 식당은 맛있기도 하고 싸기도 해서 자주 가요.","en":"That restaurant is tasty and cheap, so I go there often."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"퇴근 후에 친구를 만나다 / 혼자 쉬다","a":"퇴근 후에 친구를 만나기도 하고 혼자 쉬기도 해요.","en":"After work I sometimes meet friends and sometimes rest alone."},{"g":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다","p":"시험 전날에는 긴장되다 / 설레다","a":"시험 전날에는 긴장되기도 하고 설레기도 해요.","en":"The day before an exam I feel both nervous and excited."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"학생들 + 이 문법 + 어렵다","a":"학생들이 이 문법을 어려워한다.","en":"The students find this grammar difficult."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"동생 + 큰 개 + 무섭다","a":"동생이 큰 개를 무서워한다.","en":"My younger sibling is afraid of big dogs."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"어머니 + 시험에 합격한 아들 + 자랑스럽다","a":"어머니가 시험에 합격한 아들을 자랑스러워한다.","en":"The mother is proud of her son who passed the exam."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"친구 + 내 선물 + 기쁘다","a":"친구가 내 선물을 기뻐한다.","en":"My friend is delighted with my gift."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"고양이 + 물 + 싫다","a":"고양이가 물을 싫어한다.","en":"The cat dislikes water."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"할머니 + 손주 + 귀엽다","a":"할머니가 손주를 귀여워한다.","en":"The grandmother adores her grandchild."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"동생 + 강아지를 키우다 + -고 싶다","a":"동생이 강아지를 키우고 싶어한다.","en":"My younger sibling wants to raise a puppy."},{"g":"g5-3","ch":5,"title":"A-아/어하다","p":"아버지 + 내 성적 + 궁금하다","a":"아버지가 내 성적을 궁금해한다.","en":"My father is curious about my grades."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"지갑 + 가방 + 넣었다","a":"지갑을 가방에다가 넣었다.","en":"I put my wallet in my bag."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"상처 + 약 + 발랐다","a":"상처에다가 약을 발랐다.","en":"I put medicine on the wound."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"안내문 + 벽 + 붙였다","a":"안내문을 벽에다가 붙였다.","en":"I stuck the notice on the wall."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"꽃 + 꽃병 + 꽂았다","a":"꽃을 꽃병에다가 꽂았다.","en":"I put the flowers in the vase."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"커피 + 설탕 + 넣었다","a":"커피에다가 설탕을 넣었다.","en":"I put sugar in the coffee."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"그림 + 거실 벽 + 걸었다","a":"그림을 거실 벽에다가 걸었다.","en":"I hung the picture on the living room wall."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"책 + 책상 위 + 놓았다","a":"책을 책상 위에다가 놓았다.","en":"I put the book on the desk."},{"g":"g5-4","ch":5,"title":"N에다(가)","p":"메모 + 냉장고 문 + 붙였다","a":"메모를 냉장고 문에다가 붙였다.","en":"I stuck a note on the fridge door."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"사람들은 왜 김치를 먹습니까? + 알고 싶습니다.","a":"사람들은 왜 김치를 먹는가를 알고 싶습니다.","en":"I want to know why people eat kimchi."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"친구가 그 일을 어떻게 생각합니까? + 궁금합니다.","a":"친구가 그 일을 어떻게 생각하는가가 궁금합니다.","en":"I wonder how my friend thinks about that."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"그는 어떻게 한국어를 배웠습니까? + 관심이 있습니다.","a":"그는 어떻게 한국어를 배웠는가에 관심이 있습니다.","en":"I'm interested in how he learned Korean."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"사람은 왜 태어납니까? + 궁금합니다.","a":"사람은 왜 태어나는가가 궁금합니다.","en":"I wonder why people are born."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"이 도시는 얼마나 안전합니까? + 조사했습니다.","a":"이 도시는 얼마나 안전한가를 조사했습니다.","en":"We investigated how safe this city is."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"인생에서 중요한 것은 무엇입니까? + 생각해 봅시다.","a":"인생에서 중요한 것이 무엇인가를 생각해 봅시다.","en":"Let us think about what is important in life."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"그 사건은 왜 일어났습니까? + 뉴스에서 설명했다.","a":"그 사건이 왜 일어났는가를 뉴스에서 설명했다.","en":"The news explained why that incident happened."},{"g":"g6-1","ch":6,"title":"A/V-은/는가","p":"우리는 내일 무엇을 할 것입니까? + 생각해 봅시다.","a":"우리는 내일 무엇을 할 것인가를 생각해 봅시다.","en":"Let's think about what we will do tomorrow."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"등산 신발을 사다 + 등산 양말도 샀다.","a":"등산 신발을 사는 김에 등산 양말도 샀다.","en":"While buying hiking shoes, I bought hiking socks too."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"도서관에 가다 + 지난주에 빌린 책도 반납했다.","a":"도서관에 가는 김에 지난주에 빌린 책도 반납했다.","en":"While going to the library, I also returned the book I borrowed last week."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"이사를 하다 + 가구도 바꿨다.","a":"이사를 하는 김에 가구도 바꿨다.","en":"While moving, I changed the furniture too."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"내 커피를 사다 + 네 것도 하나 샀어.","a":"내 커피를 사는 김에 네 것도 하나 샀어.","en":"While buying my coffee, I got one for you too."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"오사카에 출장을 갔다 + 구경도 하고 와.","a":"오사카에 출장을 간 김에 구경도 하고 와.","en":"Since you are already on a business trip to Osaka, do some sightseeing too."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"마트에 가다 + 우유도 사 올게.","a":"마트에 가는 김에 우유도 사 올게.","en":"While I am going to the supermarket, I will buy milk too."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"세차를 하다 + 차 안도 청소했다.","a":"세차를 하는 김에 차 안도 청소했다.","en":"While washing the car, I cleaned the inside too."},{"g":"g6-2","ch":6,"title":"V-는 김에","p":"친구를 만나다 + 영화도 봤다.","a":"친구를 만나는 김에 영화도 봤다.","en":"While meeting my friend, I watched a movie too."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"언제 + 시작할 수 있다.","a":"언제든지 시작할 수 있다.","en":"You can start whenever."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"무슨 내용 + 한번 읽으면 다 이해한다.","a":"무슨 내용이든지 한번 읽으면 다 이해한다.","en":"Whatever the content, I understand it all once I read it."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"어떤 상황에서 + 최선을 다해야 한다.","a":"어떤 상황에서든지 최선을 다해야 한다.","en":"You must do your best in any situation."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"무엇을 먹다 + 다 좋다.","a":"무엇을 먹든지 다 좋다.","en":"Whatever we eat, it is all good."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"누구와 이야기를 하다 + 조심해야 한다.","a":"누구와 이야기를 하든지 조심해야 한다.","en":"No matter who you talk with, you have to be careful."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"어디에 가다 + 사람이 많다.","a":"어디에 가든지 사람이 많다.","en":"Wherever you go, there are lots of people."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"무엇이 필요하다 + 저에게 말씀하세요.","a":"무엇이 필요하든지 저에게 말씀하세요.","en":"Whatever you need, tell me."},{"g":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)","p":"어떻게 하다 + 결과는 같다.","a":"어떻게 하든지 결과는 같다.","en":"No matter how you do it, the result is the same."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"백화점에서 음식을 사다 + 집에서 먹었다.","a":"백화점에서 음식을 사다가 집에서 먹었다.","en":"I bought food at the department store and ate it at home."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"도서관에서 책을 빌리다 + 카페에서 읽었다.","a":"도서관에서 책을 빌려다가 카페에서 읽었다.","en":"I borrowed a book at the library and read it at a cafe."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"여행지에서 사진을 찍다 + 인터넷에 올렸다.","a":"여행지에서 사진을 찍어다가 인터넷에 올렸다.","en":"I took photos at the travel destination and uploaded them to the internet."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"냉장고에서 물을 꺼내다 + 아이에게 주었다.","a":"냉장고에서 물을 꺼내다가 아이에게 주었다.","en":"I took water out of the fridge and gave it to the child."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"책을 복사하다 + 친구에게 주었다.","a":"책을 복사해다가 친구에게 주었다.","en":"I copied the book and gave it to my friend."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"식당에서 김밥을 사다 + 공원에서 먹었다.","a":"식당에서 김밥을 사다가 공원에서 먹었다.","en":"I bought kimbap at a restaurant and ate it in the park."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"식당에서 음식을 포장하다 + 집에서 먹었다.","a":"식당에서 음식을 포장해다가 집에서 먹었다.","en":"I got food packed at the restaurant and ate it at home."},{"g":"g7-2","ch":7,"title":"V-아/어다(가)","p":"밭에서 딸기를 따다 + 손님에게 드렸다.","a":"밭에서 딸기를 따다가 손님에게 드렸다.","en":"I picked strawberries in the field and gave them to the guest."},{"g":"g8-1","ch":8,"title":"N조차","p":"요리를 잘 못해서 [[라면도]] 못 끓인다.","a":"요리를 잘 못해서 라면조차 못 끓인다.","en":"I am so bad at cooking that I cannot even boil instant noodles."},{"g":"g8-1","ch":8,"title":"N조차","p":"술에 약해서 [[맥주 한 잔도]] 못 마신다.","a":"술에 약해서 맥주 한 잔조차 못 마신다.","en":"I am so weak with alcohol that I cannot even drink one glass of beer."},{"g":"g8-1","ch":8,"title":"N조차","p":"아침에 늦게 일어나서 [[세수도]] 못 했다.","a":"아침에 늦게 일어나서 세수조차 못 했다.","en":"I got up so late in the morning that I could not even wash my face."},{"g":"g8-1","ch":8,"title":"N조차","p":"요즘 너무 바빠서 [[밥 먹을 시간도]] 없다.","a":"요즘 너무 바빠서 밥 먹을 시간조차 없다.","en":"I am so busy these days that I do not even have time to eat."},{"g":"g8-1","ch":8,"title":"N조차","p":"그 사람이 어디에 사는지[[도]] 모른다.","a":"그 사람이 어디에 사는지조차 모른다.","en":"I do not even know where that person lives."},{"g":"g8-1","ch":8,"title":"N조차","p":"나는 [[가족한테도]] 비밀을 말하지 않았다.","a":"나는 가족한테조차 비밀을 말하지 않았다.","en":"I didn't tell my secret even to my family."},{"g":"g8-1","ch":8,"title":"N조차","p":"한국에 오기 전에는 [[인사말도]] 몰랐다.","a":"한국에 오기 전에는 인사말조차 몰랐다.","en":"Before coming to Korea, I did not even know a greeting."},{"g":"g8-1","ch":8,"title":"N조차","p":"그는 화가 나서 [[내 얼굴도]] 안 봤다.","a":"그는 화가 나서 내 얼굴조차 안 봤다.","en":"He was so angry that he would not even look at my face."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"신발을 신다 + 집 안으로 들어왔다.","a":"신발을 신은 채로 집 안으로 들어왔다.","en":"I came into the house with my shoes still on."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"창문을 열다 + 잠이 들었다.","a":"창문을 연 채로 잠이 들었다.","en":"I fell asleep with the window open."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"휴대폰을 손에 들다 + 휴대폰을 찾았다.","a":"휴대폰을 손에 든 채로 휴대폰을 찾았다.","en":"I looked for my phone while holding it in my hand."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"미소를 짓다 + 눈물을 흘렸다.","a":"미소를 지은 채 눈물을 흘렸다.","en":"She shed tears while still smiling."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"불을 켜다 + 잠들었다.","a":"불을 켠 채로 잠들었다.","en":"I fell asleep with the light on."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"안경을 쓰다 + 샤워를 했다.","a":"안경을 쓴 채로 샤워를 했다.","en":"I took a shower with my glasses on."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"입을 벌리다 + 말을 못 했다.","a":"입을 벌린 채 말을 못 했다.","en":"He could not speak, his mouth hanging open."},{"g":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)","p":"눈을 감다 + 음악을 들었다.","a":"눈을 감은 채로 음악을 들었다.","en":"I listened to music with my eyes closed."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"공부를 열심히 했다 + 시험을 못 봤다.","a":"공부를 열심히 했는데도 시험을 못 봤다.","en":"Even though I studied hard, I did badly on the test."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"친구가 많다 + 가끔 외롭다.","a":"친구가 많은데도 가끔 외롭다.","en":"Even though I have many friends, I sometimes feel lonely."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"책을 열심히 읽었다 + 이해할 수 없다.","a":"책을 열심히 읽었는데도 이해할 수 없다.","en":"Even though I read the book diligently, I cannot understand it."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"문법을 알다 + 말할 때 자꾸 틀린다.","a":"문법을 아는데도 말할 때 자꾸 틀린다.","en":"Even though I know the grammar, I keep making mistakes when I speak."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"준비를 많이 못 했다 + 시험을 잘 봤다.","a":"준비를 많이 못 했는데도 시험을 잘 봤다.","en":"Even though I could not prepare much, I did well on the exam."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"한국어가 어렵다 + 계속 공부하고 있다.","a":"한국어가 어려운데도 계속 공부하고 있다.","en":"Even though Korean is difficult, I keep studying it."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"눈이 많이 왔다 + 학교에 갔다.","a":"눈이 많이 왔는데도 불구하고 학교에 갔다.","en":"Even though it snowed a lot, I went to school."},{"g":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)","p":"주말이다 + 회사에 나가야 한다.","a":"주말인데도 회사에 나가야 한다.","en":"Even though it is the weekend, I have to go to the office."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"사람은 누구나 나이가 들면 늙다 + 당연하다.","a":"사람은 누구나 나이가 들면 늙게 마련이다.","en":"Everyone is bound to grow old as they age."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"사랑하면 단점도 장점으로 보이다 + 당연하다.","a":"사랑하면 단점도 장점으로 보이게 마련이다.","en":"When you love someone, their faults naturally look like strengths."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"열심히 노력하면 좋은 결과가 나오다 + 당연하다.","a":"열심히 노력하면 좋은 결과가 나오게 마련이다.","en":"If you work hard, good results are bound to come."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"시간이 지나면 기억이 흐려지다 + 당연하다.","a":"시간이 지나면 기억이 흐려지게 마련이다.","en":"As time passes, memories are bound to fade."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"높은 곳에 올라가면 누구나 무섭다 + 당연하다.","a":"높은 곳에 올라가면 누구나 무섭게 마련이다.","en":"Anyone who climbs somewhere high is bound to feel scared."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"친구가 많으면 가끔 다투다 + 당연하다.","a":"친구가 많으면 가끔 다투게 마련이다.","en":"If you have many friends, you are bound to argue now and then."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"공부를 안 하면 성적이 떨어지다 + 당연하다.","a":"공부를 안 하면 성적이 떨어지게 마련이다.","en":"If you do not study, your grades are bound to drop."},{"g":"x-1","ch":"mid","title":"A/V-게 마련이다","p":"실수를 하면 누구나 속상하다 + 당연하다.","a":"실수를 하면 누구나 속상하게 마련이다.","en":"Everyone naturally feels upset when they make a mistake."},{"g":"x-2","ch":"mid","title":"게다가","p":"그 식당은 음식이 맛있어요. [[그리고]] 가격도 싸요.","a":"그 식당은 음식이 맛있어요. 게다가 가격도 싸요.","en":"That restaurant's food is delicious. On top of that, the prices are cheap."},{"g":"x-2","ch":"mid","title":"게다가","p":"오늘은 비가 와요. [[그리고]] 바람도 많이 불어요.","a":"오늘은 비가 와요. 게다가 바람도 많이 불어요.","en":"It is raining today. On top of that, the wind is blowing hard."},{"g":"x-2","ch":"mid","title":"게다가","p":"민수는 노래를 잘해요. [[그리고]] 춤도 잘 춰요.","a":"민수는 노래를 잘해요. 게다가 춤도 잘 춰요.","en":"Minsu sings well. Moreover, he dances well too."},{"g":"x-2","ch":"mid","title":"게다가","p":"이 집은 넓어요. [[그리고]] 역에서도 가까워요.","a":"이 집은 넓어요. 게다가 역에서도 가까워요.","en":"This house is spacious. On top of that, it is close to the station."},{"g":"x-2","ch":"mid","title":"게다가","p":"이 노트북은 가벼워요. [[그리고]] 배터리도 오래가요.","a":"이 노트북은 가벼워요. 게다가 배터리도 오래가요.","en":"This laptop is light. Moreover, the battery lasts long."},{"g":"x-2","ch":"mid","title":"게다가","p":"길이 많이 막혔어요. [[그리고]] 비까지 왔어요.","a":"길이 많이 막혔어요. 게다가 비까지 왔어요.","en":"The roads were very congested. On top of that, it even rained."},{"g":"x-2","ch":"mid","title":"게다가","p":"감기에 걸렸어요. [[그리고]] 열도 나요.","a":"감기에 걸렸어요. 게다가 열도 나요.","en":"I caught a cold. On top of that, I have a fever too."},{"g":"x-2","ch":"mid","title":"게다가","p":"저는 돈이 없어요. [[그리고]] 시간도 없어요.","a":"저는 돈이 없어요. 게다가 시간도 없어요.","en":"I have no money. On top of that, I have no time either."},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"선생님이 다음 주에 결혼하신다. + 소식 들었어요?","a":"선생님이 다음 주에 결혼하신다는 소식 들었어요?","en":"Did you hear the news that the teacher is getting married next week?"},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"내일 시험이 취소됐다. + 말을 들었어요?","a":"내일 시험이 취소됐다는 말을 들었어요?","en":"Did you hear that tomorrow's exam was cancelled?"},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"그 가게 음식이 아주 맛있다. + 소문이 있어요.","a":"그 가게 음식이 아주 맛있다는 소문이 있어요.","en":"There is a rumor that the food at that shop is very delicious."},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"민수가 한국에 유학을 간다. + 이야기를 들었어요.","a":"민수가 한국에 유학을 간다는 이야기를 들었어요.","en":"I heard that Minsu is going to study abroad in Korea."},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"이분이 새로 오신 선생님이다. + 사실을 몰랐어요.","a":"이분이 새로 오신 선생님이라는 사실을 몰랐어요.","en":"I did not know the fact that this person is the new teacher."},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"어제 친구가 사고를 당했다. + 소식을 들었다.","a":"어제 친구가 사고를 당했다는 소식을 들었다.","en":"I heard the news that my friend had an accident yesterday."},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"열심히 하면 된다. + 생각을 갖고 있어요.","a":"열심히 하면 된다는 생각을 갖고 있어요.","en":"I have the idea that if you work hard, it will work out."},{"g":"x-3","ch":"mid","title":"A/V-다는 N","p":"다음 달부터 월급이 오른다. + 말이 있어요.","a":"다음 달부터 월급이 오른다는 말이 있어요.","en":"There is talk that salaries will go up from next month."}],"gpoints":[{"id":"g1-1","ch":1,"title":"N은/는커녕"},{"id":"g1-2","ch":1,"title":"A/V-기는커녕"},{"id":"g1-3","ch":1,"title":"그리 A-지 않다 / V-지 않는다"},{"id":"g1-4","ch":1,"title":"N 말고도"},{"id":"g1-5","ch":1,"title":"N 말고는"},{"id":"g1-6","ch":1,"title":"A/V-(느)냐에 달려 있다"},{"id":"g1-7","ch":1,"title":"N에 달려 있다"},{"id":"g2-1","ch":2,"title":"V-고자 하다"},{"id":"g2-2","ch":2,"title":"A/V-은/는 반면에"},{"id":"g2-3","ch":2,"title":"N을/를 비롯해서"},{"id":"g3-1","ch":3,"title":"V-고 말다"},{"id":"g3-2","ch":3,"title":"A/V-기라도 하면"},{"id":"g3-3","ch":3,"title":"어찌나 A/V-던지"},{"id":"g4-1","ch":4,"title":"V-느니 (차라리)"},{"id":"g4-2","ch":4,"title":"V-을 겸 (해서)"},{"id":"g4-3","ch":4,"title":"V-으나 마나"},{"id":"g5-1","ch":5,"title":"‘ㅎ’ 불규칙 형용사"},{"id":"g5-2","ch":5,"title":"(A/V-기도 하고) A/V-기도 하다"},{"id":"g5-3","ch":5,"title":"A-아/어하다"},{"id":"g5-4","ch":5,"title":"N에다(가)"},{"id":"g6-1","ch":6,"title":"A/V-은/는가"},{"id":"g6-2","ch":6,"title":"V-는 김에"},{"id":"g7-1","ch":7,"title":"누가/언제/무엇/어떻게/어디 V-든(지)"},{"id":"g7-2","ch":7,"title":"V-아/어다(가)"},{"id":"g8-1","ch":8,"title":"N조차"},{"id":"g8-2","ch":8,"title":"V-(으)ㄴ 채(로)"},{"id":"g8-3","ch":8,"title":"A/V-(으)ㄴ/는데도 (불구하고)"},{"id":"x-1","ch":"mid","title":"A/V-게 마련이다"},{"id":"x-2","ch":"mid","title":"게다가"},{"id":"x-3","ch":"mid","title":"A/V-다는 N"}],"colloc":[{"pairs":[["핑계를","대다"],["실력을","발휘하다"],["직업으로","삼다"],["인기를","누리다"]],"extra":"적응하다"},{"pairs":[["두각을","나타내다"],["폐를","끼치다"],["호감을","사다"],["한계에","부딪히다"]],"extra":"저지르다"},{"pairs":[["고집을","부리다"],["화를","풀다"],["허리를","숙이다"],["정신을","차리다"]],"extra":"번지다"},{"pairs":[["식은땀이","나다"],["소름이","끼치다"],["쌍코피가","터지다"],["무릎이","닳다"]],"extra":"흩어지다"},{"pairs":[["영향을","미치다"],["습관을","들이다"],["성취감을","맛보다"],["비중을","두다"]],"extra":"어기다"},{"pairs":[["귀를","기울이다"],["이를","악물다"],["시각을","넓히다"],["고개를","끄덕이다"]],"extra":"삼키다"},{"pairs":[["맞장구를","치다"],["말을","끊다"],["주의를","기울이다"],["고통을","겪다"]],"extra":"굽다"},{"pairs":[["작전을","벌이다"],["소란을","피우다"],["희망을","품다"],["비판을","받다"]],"extra":"지나치다"},{"pairs":[["독을","타다"],["장례식을","치르다"],["마법에","걸리다"],["나무를","심다"]],"extra":"펼쳐지다"},{"pairs":[["꽃이","피다"],["조화를","이루다"],["소꿉놀이를","하다"],["영감이","떠오르다"]],"extra":"쏟다"},{"pairs":[["가르마를","타다"],["속이","상하다"],["눈을","뜨다"],["발을","멈추다"]],"extra":"부수다"},{"pairs":[["사형을","선고하다"],["비율이","높아지다"],["물량이","달리다"],["열매를","맺다"]],"extra":"헤어지다"},{"pairs":[["기회를","놓치다"],["손해를","입다"],["충격을","받다"],["성과를","거두다"]],"extra":"겨루다"},{"pairs":[["재능을","타고나다"],["위기를","극복하다"],["야심을","품다"],["진심을","전하다"]],"extra":"빌리다"},{"pairs":[["영감을","얻다"],["목적을","달성하다"],["의지를","꺾다"],["야경을","감상하다"]],"extra":"매달리다"},{"pairs":[["소문이","나다"],["식중독에","걸리다"],["실랑이가","벌어지다"],["파도가","치다"]],"extra":"부러뜨리다"},{"pairs":[["염치가","없다"],["주량이","세다"],["마음이","착하다"],["가슴이","뛰다"]],"extra":"저물다"},{"pairs":[["시간을","보내다"],["끼니를","해결하다"],["여유를","부리다"],["서류를","지참하다"]],"extra":"스치다"},{"pairs":[["유물을","복원하다"],["불법 유턴을","단속하다"],["독재자를","몰아내다"],["손님을","대접하다"]],"extra":"축하하다"},{"pairs":[["부상을","입다"],["격려를","건네다"],["패배를","맛보다"],["정원을","가꾸다"]],"extra":"추락하다"},{"pairs":[["환청이","들리다"],["불평을","늘어놓다"],["대가를","치르다"],["오르막길을","오르다"]],"extra":"마시다"},{"pairs":[["시안을","수정하다"],["최저가를","검색하다"],["혼수를","장만하다"],["이벤트에","응모하다"]],"extra":"지치다"},{"pairs":[["갈등을","겪다"],["의견을","주장하다"],["눈치를","보다"],["목소리를","높이다"]],"extra":"허비하다"},{"pairs":[["이력을","쌓다"],["주례를","서다"],["각오를","다지다"],["위기에","처하다"]],"extra":"망하다"}],"personality":[{"text":"동생은 칭찬을 받아도 \"네.\" 한마디만 해요. 표정도 거의 안 변하고, 길게 말하지 않아요.","answer":"무뚝뚝하다","options":["활기차다","무뚝뚝하다","수수하다","당당하다"],"en":"My younger sibling only says \"yes\" even when praised. Their expression hardly changes, and they don't talk much."},{"text":"민수 씨는 작은 소리에도 잠을 깨요. 음식 맛이 조금만 달라져도 바로 알아요.","answer":"예민하다","options":["둔하다","예민하다","막돼먹다","수수하다"],"en":"Minsu wakes up at the slightest noise. He notices right away even a small change in the taste of food."},{"text":"김 대리는 계약서를 읽을 때 숫자를 두 번씩 확인해요. 그래서 실수가 거의 없어요.","answer":"꼼꼼하다","options":["꼼꼼하다","소극적이다","막돼먹다","활기차다"],"en":"When Mr. Kim reads a contract, he checks the numbers twice. So he almost never makes mistakes."},{"text":"선생님은 농담에도 웃지 않으세요. 학생의 질문에 늘 심각한 얼굴로 대답해 주세요.","answer":"진지하다","options":["진지하다","활기차다","막돼먹다","수수하다"],"en":"The teacher doesn't laugh even at jokes. They always answer students' questions with a serious face."},{"text":"그는 비싼 물건을 살 때 몇 주 동안 가격을 비교해요. 절대 서두르지 않아요.","answer":"신중하다","options":["신중하다","신경질적이다","능수능란하다","막돼먹다"],"en":"When he buys an expensive item, he compares prices for weeks. He never rushes."},{"text":"그 손님은 식당에서 직원에게 반말을 하고 소리를 질렀어요. 예의가 전혀 없어요.","answer":"막돼먹다","options":["막돼먹다","단정하다","진지하다","신중하다"],"en":"The customer spoke rudely to the staff at the restaurant and shouted. He has no manners at all."},{"text":"수진 씨는 많은 사람 앞에서도 목소리가 떨리지 않아요. 상사 앞에서도 자기 생각을 자신 있게 말해요.","answer":"당당하다","options":["당당하다","소극적이다","둔하다","수수하다"],"en":"Sujin's voice doesn't shake even in front of many people. She says what she thinks with confidence, even in front of her boss."},{"text":"아버지는 작은 일에도 쉽게 짜증을 내세요. 한숨을 쉬고 문을 쾅 닫아서 가족들이 조심해요.","answer":"신경질적이다","options":["신경질적이다","단정하다","활기차다","능수능란하다"],"en":"My father gets annoyed easily over small things. He sighs and slams the door, so the family is careful around him."},{"text":"지은 씨는 회의에서 좋은 생각이 있어도 말하지 않아요. 누가 시키기 전에는 나서지 않아요.","answer":"소극적이다","options":["소극적이다","당당하다","활기차다","능수능란하다"],"en":"Jieun doesn't speak in meetings even when she has a good idea. She doesn't step forward until someone asks her."},{"text":"그는 이야기할 때 이유와 증거를 순서대로 말해요. 감정보다 사실로 설명해요.","answer":"논리적이다","options":["논리적이다","신경질적이다","수수하다","막돼먹다"],"en":"When he talks, he gives reasons and evidence in order. He explains with facts rather than emotions."},{"text":"민정 씨는 머리와 옷이 항상 깔끔해요. 행동도 바르고 어른께 예의를 지켜요.","answer":"단정하다","options":["단정하다","막돼먹다","둔하다","신경질적이다"],"en":"Minjeong's hair and clothes are always neat. She also behaves properly and is polite to elders."},{"text":"그 배우는 화려한 옷을 좋아하지 않아요. 항상 평범한 색의 단순한 옷만 입어요.","answer":"수수하다","options":["수수하다","특이하다","활기차다","당당하다"],"en":"That actor doesn't like flashy clothes. He always wears only simple clothes in plain colors."},{"text":"제 친구는 분위기가 이상해도 잘 몰라요. 힌트를 줘도 못 알아들어서 매번 설명해 줘야 해요.","answer":"둔하다","options":["둔하다","예민하다","꼼꼼하다","능수능란하다"],"en":"My friend doesn't notice even when the mood is strange. They don't catch hints either, so I have to explain every time."},{"text":"박 부장님은 처음 만난 사람도 금방 웃게 만들어요. 어려운 일도 막힘없이 척척 해결해요.","answer":"능수능란하다","options":["능수능란하다","소극적이다","둔하다","무뚝뚝하다"],"en":"Manager Park makes even people he just met smile quickly. He solves difficult problems smoothly and easily."},{"text":"우리 막내는 아침부터 큰 목소리로 인사해요. 하루 종일 에너지가 넘쳐서 주변 사람들도 밝아져요.","answer":"활기차다","options":["활기차다","무뚝뚝하다","소극적이다","신중하다"],"en":"Our youngest greets everyone in a loud voice from the morning. They are full of energy all day, so the people around them brighten up too."},{"text":"그는 취미도 말투도 옷도 다른 사람과 아주 달라요. 한 번 보면 잊을 수 없어요.","answer":"특이하다","options":["특이하다","수수하다","단정하다","논리적이다"],"en":"His hobbies, way of speaking and clothes are very different from other people's. Once you see him, you can't forget him."}],"wrong":[{"sents":["[[아낌없이]] 사랑을 주셔서 감사해요.","[[머지 않아]] 이 동네에도 지하철이 들어올 거예요.","[[끊임없이]] 노력해서 합격했어요.","이 일은 [[반드시]] 오늘 끝내야 해요."],"wrong":1,"fix":"머지않아","why":"머지않다 is one word; it must not be spaced."},{"sents":["방을 [[깨끗히]] 청소했어요.","이 동아리는 [[활발히]] 활동하고 있어요.","할머니는 손녀를 [[끔찍이]] 아끼세요.","서류를 [[꼼꼼히]] 확인해 주세요."],"wrong":0,"fix":"깨끗이","why":"깨끗하다 ends in ㅅ-batchim, so the adverb is 깨끗이, not -히."},{"sents":["[[다행히]] 비가 금방 그쳤어요.","그 일을 [[완전히]] 잊어버렸어요.","공연장에 [[수없이]] 많은 사람이 모였어요.","내일까지 [[반듯이]] 연락해 주세요."],"wrong":3,"fix":"반드시","why":"반듯이 means 'straight/neatly'; 'without fail' is 반드시."},{"sents":["음식을 [[적당히]] 드세요.","책상을 [[깨끗이]] 정리했어요.","[[곰곰히]] 생각해 보니 제 잘못이었어요.","[[끊임없이]] 질문이 나왔어요."],"wrong":2,"fix":"곰곰이","why":"The adverb is 곰곰이 (not -히)."},{"sents":["[[낡은]] 가방이지만 아직 쓸 수 있어요.","처음 온 [[낯설은]] 도시에서 길을 잃었어요.","시장에 [[싱싱한]] 생선이 많았어요.","[[산뜻한]] 색의 옷을 샀어요."],"wrong":1,"fix":"낯선","why":"낯설다 drops ㄹ before ㄴ: 낯선, not 낯설은."},{"sents":["늦었으니까 빨리 [[서두러]] 주세요.","처음 가는 곳이라서 길이 [[헷갈려서]] 한참 헤맸어요.","시험이 끝나자 학생들이 [[흩어져]] 집에 갔어요.","명절 시장은 [[떠들썩한]] 분위기였어요."],"wrong":0,"fix":"서둘러","why":"서두르다 is a 르-irregular: 서둘러."},{"sents":["그 가수는 오랫동안 [[인기를 누리고]] 있어요.","요즘 회사에서 [[갈등을 겪고]] 있어요.","동생은 한 번 [[고집을 부리면]] 아무도 못 말려요.","그는 어릴 때부터 음악에서 [[두각을 나타나고]] 있었어요."],"wrong":3,"fix":"두각을 나타내고","why":"나타나다 is intransitive; 두각을 나타내다 takes the object 두각을."},{"sents":["경찰이 사고 원인을 [[밝혔어요]].","공원에서 자전거와 [[부딪혔어요]].","선거에서 우리 반 대표로 [[뽑였어요]].","눈이 와서 산이 하얗게 [[덮였어요]]."],"wrong":2,"fix":"뽑혔어요","why":"뽑다 → 뽑히다 (passive): 뽑혔어요."},{"sents":["추운 날 언 손을 따뜻한 물로 [[녹였어요]].","엄마가 아이에게 따뜻한 옷을 [[입었어요]].","이번 시험에서 점수를 [[높였어요]].","아픈 아이를 침대에 [[눕혔어요]]."],"wrong":1,"fix":"입혔어요","why":"'Dress someone' is the causative 입히다, not 입다."},{"sents":["일이 많아서 약속 시간을 한 시간 [[늦혔다]].","라디오 소리를 조금 [[낮췄다]].","이사하면서 거실을 [[넓혔다]].","시끄럽던 소리가 갑자기 [[사라졌다]]."],"wrong":0,"fix":"늦췄다","why":"The causative of 늦다 is 늦추다 (늦췄다), not 늦히다."},{"sents":["공공장소에서 [[소란을 피우지]] 마세요.","그는 선생님께 [[호감을 사려고]] 노력했어요.","오랜 노력이 마침내 [[열매를 맺었어요]].","남에게 [[폐를 주지]] 않도록 조심하세요."],"wrong":3,"fix":"폐를 끼치지","why":"The collocation is 폐를 끼치다, not 폐를 주다."},{"sents":["그는 대회에서 [[실력을 발휘했어요]].","친구와 이야기하고 나서 [[화를 풀었어요]].","또 [[핑계를 하지]] 마세요.","손님께 [[허리를 숙여]] 인사했어요."],"wrong":2,"fix":"핑계를 대지","why":"The collocation is 핑계를 대다."},{"sents":["작은 목표를 이루고 [[성취감을 맛봤어요]].","일찍 일어나는 습관을 [[들었어요]].","[[이를 악물고]] 끝까지 달렸어요.","친구의 이야기에 [[귀를 기울였어요]]."],"wrong":1,"fix":"들였어요","why":"습관을 들이다 (not 들다)."},{"sents":["택배가 안 와서 [[어의없는]] 일이 생겼어요.","영화의 [[아슬아슬한]] 장면을 보고 가슴이 뛰었어요.","숙제를 다 끝내니 마음이 [[후련해요]].","친구가 연락을 안 해서 좀 [[서운해요]]."],"wrong":0,"fix":"어이없는","why":"The word is 어이없다 (어이(가) 없다), not 어의없다."},{"sents":["매일 [[끊임없이]] 연습했어요.","[[어떻게든]] 끝낼 거예요.","[[되도록]] 일찍 오세요.","그는 포기하지 않고 [[수 없이]] 시도했어요."],"wrong":3,"fix":"수없이","why":"수없이 is a single adverb ('countless times')."},{"sents":["책을 [[두세]] 권 빌렸어요.","빵을 [[한두]] 개만 사 주세요.","[[몇 몇]] 사람은 이미 집에 갔어요.","공원에 [[수많은]] 사람이 모였어요."],"wrong":2,"fix":"몇몇","why":"몇몇 is one word."}],"pick":[{"s":"차에서는 아이를 뒷자리에 ( 앉는 / 앉히는 ) 게 안전해요.","answer":"앉히는","en":"It's safer to seat a child in the back seat of a car."},{"s":"아기에게 밥을 ( 먹는 / 먹이는 ) 시간이 제일 행복해요.","answer":"먹이는","en":"The time I feed my baby is the happiest."},{"s":"감기에 걸리지 않게 아이에게 두꺼운 옷을 ( 입어 / 입혀 ) 주세요.","answer":"입혀","en":"Please put a thick coat on the child so he doesn't catch a cold."},{"s":"친구가 이상한 표정을 지어서 나를 ( 웃었다 / 웃겼다 ).","answer":"웃겼다","en":"My friend made a funny face and made me laugh."},{"s":"거실을 ( 넓어 / 넓혀 ) 보려고 가구를 치웠어요.","answer":"넓혀","en":"I moved the furniture away to try to make the living room bigger."},{"s":"회의가 길어져서 약속 시간을 한 시간 ( 늦춰 / 늦어 ) 달라고 했어요.","answer":"늦춰","en":"The meeting ran long, so I asked to push the appointment back an hour."},{"s":"밤에는 시끄러우니까 음악 소리를 좀 ( 낮아 / 낮춰 ) 주세요.","answer":"낮춰","en":"It's noisy at night, so please turn the music down a little."},{"s":"아침에 늦잠 자는 아들을 ( 깨워서 / 깨서 ) 학교에 보냈어요.","answer":"깨워서","en":"I woke up my son, who was oversleeping, and sent him to school."},{"s":"아기를 겨우 ( 자고 / 재우고 ) 나서 설거지를 했어요.","answer":"재우고","en":"I barely got the baby to sleep, then did the dishes."},{"s":"얼음을 만들려고 물을 냉동실에 ( 얼려 / 얼어 ) 놓았어요.","answer":"얼려","en":"I put water in the freezer to freeze it into ice."},{"s":"일이 많아서 일하는 시간이 점점 ( 늘려서 / 늘어서 ) 힘들어요.","answer":"늘어서","en":"There is a lot of work, so my working hours keep increasing and it's tough."},{"s":"경찰이 사고 원인을 ( 밝았다 / 밝혔다 ).","answer":"밝혔다","en":"The police revealed the cause of the accident."},{"s":"감자는 껍질을 ( 벗어서 / 벗겨서 ) 삶으면 빨리 익어요.","answer":"벗겨서","en":"Potatoes cook faster if you peel them before boiling."},{"s":"엄마가 아이에게 운동화를 ( 신겨 / 신어 ) 주었어요.","answer":"신겨","en":"Mom put sneakers on her child."},{"s":"아픈 아이를 침대에 ( 눕고 / 눕히고 ) 이마에 수건을 올려 주었어요.","answer":"눕히고","en":"I laid the sick child on the bed and put a towel on her forehead."},{"s":"손으로 얼음을 ( 녹여서 / 녹아서 ) 물을 만들었어요.","answer":"녹여서","en":"I melted the ice with my hands to make water."},{"s":"시험 점수를 ( 높으려면 / 높이려면 ) 열심히 공부해야 해요.","answer":"높이려면","en":"You have to study hard if you want to raise your test score."},{"s":"고기를 완전히 ( 익어야 / 익혀야 ) 안전하게 먹을 수 있어요.","answer":"익혀야","en":"You must cook meat thoroughly to eat it safely."},{"s":"이 책은 학생들에게 가장 많이 ( 읽힌다 / 읽는다 ).","answer":"읽힌다","en":"This book is read the most by students."},{"s":"그 환자는 어제 병원에서 바이러스에 ( 감염했다 / 감염되었다 ).","answer":"감염되었다","en":"The patient was infected with the virus at the hospital yesterday."},{"s":"옛 궁궐이 원래 모습대로 ( 복원되었다 / 복원했다 ).","answer":"복원되었다","en":"The old palace was restored to its original appearance."},{"s":"눈이 와서 산이 하얗게 ( 덮었다 / 덮였다 ).","answer":"덮였다","en":"It snowed and the mountain was covered in white."},{"s":"엘리베이터 안에 한 시간 동안 ( 갇혔다 / 가두었다 ).","answer":"갇혔다","en":"I was trapped in the elevator for an hour."},{"s":"늦게 도착했지만 ( 다행이 / 다행히 ) 비행기가 아직 안 떠났어요.","answer":"다행히","en":"I arrived late but, fortunately, the plane hadn't left yet."}],"idiom":[{"idiom":"외유내강","b":"외유내강이시군요.","modelA":"어머니는 부드러워 보이지만 속은 아주 강한 분이에요.","en":"My mother looks gentle, but inside she is very strong. / Gentle outside, strong inside."},{"idiom":"이심전심","b":"이심전심이라더니, 마음이 통했네요.","modelA":"제가 배고프다고 말하려는데 친구가 먼저 '밥 먹으러 가자'고 했어요.","en":"Just as I was about to say I was hungry, my friend said 'let's go eat.' / They say hearts understand each other without words."},{"idiom":"대기만성","b":"대기만성이라더니, 형님이 바로 그런 분이네요.","modelA":"우리 형은 서른 살이 넘어서야 유명한 작가가 됐어요.","en":"My older brother became a famous writer only after he turned thirty. / Great talents mature late."},{"idiom":"동문서답","b":"동문서답을 하네요.","modelA":"어제 어디 갔냐고 물었는데 동생이 갑자기 '배고파요'라고 했어요.","en":"I asked my younger sibling where they went yesterday, and they suddenly said 'I'm hungry.' / Giving an irrelevant answer."},{"idiom":"동병상련","b":"동병상련이라고, 힘든 일을 같이 겪으면 서로 잘 이해하죠.","modelA":"저도 지난달에 시험에 떨어졌는데 그 친구도 떨어졌대요. 그래서 서로 위로했어요.","en":"I failed an exam last month too, and that friend failed as well, so we comforted each other. / Fellow sufferers pity each other."},{"idiom":"막상막하","b":"정말 막상막하네요.","modelA":"두 선수 실력이 비슷해서 누가 이길지 모르겠어요.","en":"The two players are so evenly matched that I can't tell who will win. / Neck and neck."},{"idiom":"새옹지마","b":"새옹지마라더니, 인생은 정말 알 수 없네요.","modelA":"회사를 그만두게 돼서 힘들었는데, 그 덕분에 시작한 가게가 지금은 아주 잘돼요.","en":"I had a hard time after I had to leave my company, but the shop I started because of it is doing very well now. / Fortune changes unexpectedly."},{"idiom":"설상가상","b":"설상가상이었네요.","modelA":"길이 막혀서 늦었는데 비까지 많이 오고 우산도 없었어요.","en":"I was late because of traffic, and then it rained hard and I had no umbrella. / Making matters worse."},{"idiom":"일석이조","b":"일석이조네요.","modelA":"걸어서 출근하니까 운동도 되고 교통비도 아낄 수 있어요.","en":"Walking to work gives me exercise and saves transport money. / Killing two birds with one stone."},{"idiom":"천생연분","b":"천생연분이군요.","modelA":"두 사람은 취미도 성격도 똑같아서 거의 안 싸운대요.","en":"Those two have the same hobbies and personality, so they almost never fight. / A match made in heaven."},{"idiom":"칠전팔기","b":"칠전팔기네요. 정말 대단하세요!","modelA":"운전면허 시험에 일곱 번 떨어졌는데 여덟 번째에 붙었어요.","en":"I failed the driving test seven times but passed on the eighth. / Fall seven times, get up eight."},{"idiom":"함흥차사","b":"완전히 함흥차사네요.","modelA":"심부름을 보낸 동생이 세 시간이 지났는데 안 돌아와요. 연락도 없어요.","en":"I sent my sibling on an errand, and three hours later they still haven't come back. They haven't called either. / Someone who disappears after being sent off."},{"idiom":"가는 날이 장날이다","b":"가는 날이 장날이라더니, 운이 없으셨네요.","modelA":"오랜만에 그 식당에 갔는데 오늘이 쉬는 날이래요.","en":"I went to that restaurant after a long time, and they say it's closed today. / Bad timing on the day you go."},{"idiom":"배보다 배꼽이 더 크다","b":"배보다 배꼽이 더 크네요.","modelA":"만 원짜리 책을 사려는데 배송비가 이만 원이래요.","en":"I want to buy a 10,000-won book, but the shipping is 20,000 won. / The tail is bigger than the body."},{"idiom":"병 주고 약 주다","b":"병 주고 약 주네요. 기분이 안 좋으셨겠어요.","modelA":"친구가 제 그림을 보고 못 그렸다고 하더니, 나중에는 색은 예쁘다고 했어요.","en":"My friend said my painting was badly done, then later said at least the colors were pretty. / Hurting someone and then comforting them."},{"idiom":"식은 죽 먹기다","b":"식은 죽 먹기군요.","modelA":"저 사람한테는 어려운 문제도 하나도 안 어려워요. 금방 풀어요.","en":"Even a hard problem isn't hard at all for that person; they solve it right away. / Easy as pie."},{"idiom":"싼 게 비지떡이다","b":"싼 게 비지떡이라더니, 그 말이 맞네요.","modelA":"아주 싸게 산 신발인데 일주일 만에 망가졌어요.","en":"I bought the shoes very cheaply, but they broke within a week. / You get what you pay for."},{"idiom":"제 눈에 안경이다","b":"제 눈에 안경이라고, 좋아하면 다 멋있어 보여요.","modelA":"친구 남자친구는 솔직히 평범한데, 친구는 제일 멋있대요.","en":"Honestly her boyfriend is ordinary, but she says he's the coolest. / Beauty is in the eye of the beholder."},{"idiom":"이심전심","b":"이심전심이네요.","modelA":"약속도 안 했는데 오늘 아내와 제가 똑같은 선물을 사 왔어요.","en":"We hadn't made any plan, but my wife and I both came home with the same gift today. / Hearts understanding each other."},{"idiom":"설상가상","b":"설상가상이시군요. 얼른 나으세요.","modelA":"감기에 걸려서 힘든데 오늘 아침에 지갑까지 잃어버렸어요.","en":"I'm suffering from a cold, and this morning I even lost my wallet. / Making matters worse."}],"speak":[{"grammar":"-긴요","a":"정말 노래를 잘하시네요.","b":"___. 그냥 좋아해요.","answers":["잘하긴요"],"en":"A: You sing so well. B: Not at all. I just like it."},{"grammar":"-긴요","a":"요리 솜씨가 대단하세요. 이렇게 맛있는 건 처음이에요.","b":"___. 그냥 평소처럼 만들었어요.","answers":["대단하긴요","맛있긴요"],"en":"A: Your cooking is amazing. I've never had anything this tasty. B: Not at all. I just made it the way I usually do."},{"grammar":"-은/는 껌이다","a":"영어 번역 좀 부탁해도 될까요? 문장이 좀 많아요.","b":"그 정도는 저한테 ___. 금방 해 드릴게요.","answers":["껌이에요","껌이죠"],"en":"A: Could I ask you to translate into English? There are quite a lot of sentences. B: That's a piece of cake for me. I'll do it right away."},{"grammar":"-더라?","a":"다음 모임이 몇 월 며칠이었어요?","b":"음, 몇 월 며칠 ___? 잠깐만요, 달력을 볼게요.","answers":["이더라"],"en":"A: What date is our next meeting? B: Hmm, what date was it again? Just a second, let me check the calendar."},{"grammar":"-면 다예요?","a":"미안하다고 했잖아요.","b":"미안하다고 ___? 그 말 한마디로 제 기분이 풀릴 것 같아요?","answers":["하면 다예요"],"en":"A: I already said I was sorry. B: Is saying you're sorry all there is to it? Do you think that one phrase will make me feel better?"},{"grammar":"-겠어요","a":"어제 밤새 일하고 오늘 아침에 또 출근했어요.","b":"많이 ___. 좀 쉬세요. (피곤하다)","answers":["피곤하시겠어요","피곤하겠어요"],"en":"A: I worked all night yesterday and came to work again this morning. B: You must be very tired. Please get some rest."},{"grammar":"-겠어요","a":"내일 같이 점심 먹을까요?","b":"네, 좋아요. 제가 맛있는 식당을 찾아 ___. (보다)","answers":["보겠어요"],"en":"A: Shall we have lunch together tomorrow? B: Sure. I'll try finding a good restaurant."},{"grammar":"-겠네요","a":"밖에 비가 정말 많이 와요. 우산이 없는데 어떡하죠?","b":"이 비에는 우산이 있어도 다 ___. (젖다)","answers":["젖겠네요"],"en":"A: It's raining so hard outside. What do I do, I have no umbrella? B: In this rain, you'd get soaked even with an umbrella."},{"grammar":"-겠네요","a":"저 복권에 당첨됐어요!","b":"와, 정말 기분이 ___. (좋다)","answers":["좋으시겠네요","좋겠네요"],"en":"A: I won the lottery! B: Wow, you must feel really good."},{"grammar":"-겠군요","a":"이 집은 아침마다 햇빛이 정말 잘 들어요.","b":"아, 그래서 식물이 이렇게 잘 ___. (자라다)","answers":["자라겠군요","크겠군요"],"en":"A: This house gets lots of sunlight every morning. B: Ah, so that's why the plants grow so well."},{"grammar":"-겠군요","a":"저는 한국에서 십 년 살았어요.","b":"아, 그래서 한국어를 이렇게 잘 ___. (하다)","answers":["하시겠군요","하겠군요"],"en":"A: I lived in Korea for ten years. B: Ah, so that's why you speak Korean so well."},{"grammar":"-다니 말도 안 되다","a":"사장님이 월급을 안 주고 도망갔대요.","b":"월급을 안 주고 ___ 말도 안 돼요! (도망가다)","answers":["도망가다니"],"en":"A: I heard the boss ran off without paying the salaries. B: Running away without paying salaries, that makes no sense!"},{"grammar":"-다니 말도 안 되다","a":"민수 씨가 시험에서 백 점을 받았대요. 공부도 안 했는데요.","b":"공부도 안 했는데 백 점을 ___ 말도 안 돼요. (받다)","answers":["받다니"],"en":"A: I heard Minsu got a perfect score, though he didn't study at all. B: Getting a perfect score without studying, that makes no sense."},{"grammar":"-는 거야 일도 아니다","a":"이 무거운 상자를 혼자 옮길 수 있어요?","b":"이 정도 상자를 ___ 일도 아니에요. (옮기다)","answers":["옮기는 거야"],"en":"A: Can you move this heavy box by yourself? B: Moving a box this size is nothing at all."},{"grammar":"-는 거야 일도 아니다","a":"이 문장을 오늘까지 다 번역해야 해요?","b":"걱정 마세요. 저는 이 정도 ___ 일도 아니에요. (번역하다)","answers":["번역하는 거야"],"en":"A: I have to translate all these sentences by today? B: Don't worry. Translating this much is nothing for me."},{"grammar":"-면 누가 모를 줄 알고?","a":"나 어제 하루 종일 집에서 쉬었어.","b":"거짓말하면 ___? 어제 네가 극장에 있는 거 봤어.","answers":["누가 모를 줄 알고"],"en":"A: I rested at home all day yesterday. B: Do you think I wouldn't know if you lie? I saw you at the cinema yesterday."},{"grammar":"누굴 망하게 할 참이야?","a":"내일 발표 자료를 아직 안 만들었어. 그냥 생각나는 대로 말하자.","b":"뭐? ___? 우리 팀 점수가 깎이면 어떡해.","answers":["누굴 망하게 할 참이야"],"en":"A: I still haven't made tomorrow's presentation material. Let's just say whatever comes to mind. B: What? Who are you trying to ruin? What if our team's grade drops?"},{"grammar":"언제까지 속일 셈이야?","a":"사실은 지난달부터 회사에 안 다녀.","b":"뭐? 부모님께는 계속 출근한다고 했잖아. ___?","answers":["언제까지 속일 셈이야","언제까지 속일 셈이니"],"en":"A: Actually I haven't been going to work since last month. B: What? You kept telling your parents you go to work. How long do you intend to keep lying?"},{"grammar":"-기 짝이 없다","a":"그 사람이 약속을 해 놓고 연락도 없이 안 왔대요.","b":"그 사람 행동이 정말 ___ 짝이 없어요. (한심하다)","answers":["한심하기"],"en":"A: I heard that person made plans and then didn't show up, without any word. B: That person's behavior is incredibly pathetic."},{"grammar":"그렇긴 한데","a":"이 가방 좀 비싸지만 정말 예뻐요.","b":"___ 저한테는 좀 무거워 보여요.","answers":["그렇긴 한데","그렇긴 그런데"],"en":"A: This bag is a bit expensive, but it's really pretty. B: That's true, but it looks a bit heavy for me."}],"simile":[{"expr":"귀신같이 알아맞히다","meaning":"to guess something exactly right, as if by magic","model":["A: 어제 제가 뭘 먹었는지 맞혀 보세요.","B: 음... 김치찌개요?","A: 어떻게 알았어요? 정말 귀신같이 알아맞히시네요.","B: 옷에서 김치 냄새가 나거든요."]},{"expr":"곰같이 둔하다","meaning":"to be dull or clumsy like a bear","model":["A: 민호 씨는 몸이 크고 행동이 좀 느리죠?","B: 네, 곰같이 둔해서 늘 물건을 떨어뜨려요.","A: 그래도 마음은 정말 따뜻한 사람이에요.","B: 맞아요. 곰같이 둔하지만 정말 착한 사람이에요."]},{"expr":"여우같이 눈치가 빠르다","meaning":"to be quick to read the situation, like a fox","model":["A: 제가 깜짝 파티를 준비하는 걸 동생이 벌써 알았어요.","B: 동생이 여우같이 눈치가 빠르네요.","A: 맞아요. 아무 말도 안 했는데 제 표정을 보고 알았어요.","B: 여우같이 눈치가 빠른 사람한테는 비밀을 지키기 어렵죠."]},{"expr":"물 쓰듯이 쓰다","meaning":"to spend something (money) freely, like water","model":["A: 지수 씨는 월급을 받으면 한 달도 안 돼서 다 쓴대요.","B: 정말요? 돈을 물 쓰듯이 쓰나 봐요.","A: 네, 어제도 쇼핑하는 데 백만 원을 썼어요.","B: 그렇게 물 쓰듯이 쓰면 나중에 후회할 거예요."]},{"expr":"밥 먹듯이 하다","meaning":"to do something all the time, as casually as eating a meal","model":["A: 우리 팀장님은 야근을 밥 먹듯이 하세요.","B: 정말요? 건강이 걱정돼요.","A: 주말에도 출근을 밥 먹듯이 하셔서 가족들이 걱정해요.","B: 이제는 좀 쉬셔야 해요."]},{"expr":"불을 보듯이 뻔하다","meaning":"to be perfectly obvious, as clear as seeing fire","model":["A: 준비도 안 하고 시험을 보면 어떻게 될까요?","B: 떨어질 게 불을 보듯이 뻔하죠.","A: 그런데 제 동생은 계속 놀기만 해요.","B: 결과가 불을 보듯이 뻔하니까 지금 말려야 해요."]},{"expr":"산더미같이 많다","meaning":"to be piled up in great amounts, like a mountain","model":["A: 요즘 많이 바쁘시죠?","B: 네, 해야 할 서류가 산더미같이 많아요.","A: 제가 좀 도와 드릴까요?","B: 정말요? 그럼 정말 고맙겠어요."]},{"expr":"얼굴이 백지장 같다","meaning":"to look pale, one's face like a blank sheet of paper","model":["A: 수연 씨, 얼굴이 백지장 같아요. 어디 아파요?","B: 어젯밤에 한숨도 못 잤어요.","A: 그러면 오늘은 일찍 들어가서 쉬세요.","B: 네, 그렇게 할게요. 고마워요."]}],"conflict":[{"title":"시험을 망친 날","lines":["친구1: 나 오늘 한국어 시험 완전히 망쳤어.","친구2: 그래? 난 이번 시험이 식은 죽 먹기던데.","친구1: 그래... 너는 공부를 잘하니까.","친구2: 하긴, 너는 공부 안 하고 잠만 잤으니까 망치지.","친구1: 뭐? 나 밤새 공부했거든.","친구2: 밤새 했는데 그 점수야? 머리가 안 좋은 거 아니야?"],"problem":"Friend 2 brags that the test was easy (line 2) and then assumes Friend 1 didn't study (line 4) and even implies Friend 1 is not smart (line 6). Friend 1 only wanted comfort, so Friend 2's comparison and blame cause the conflict.","model":["A: 나 오늘 한국어 시험 완전히 망쳤어.","B: 어머, 정말? 많이 속상하겠다.","A: 응, 밤새 공부했는데도 모르는 문제가 너무 많았어.","B: 그러게. 밤새 공부했는데 결과가 안 좋으면 더 속상하지.","A: 맞아. 내 말이 그 말이야.","B: 그럴 수도 있겠다. 다음 시험은 잘 볼 수 있을 거야. 같이 공부할까?"]},{"title":"힘든 아르바이트","lines":["친구1: 요즘 아르바이트가 너무 힘들어서 그만두고 싶어.","친구2: 나는 아르바이트를 세 개 해도 안 힘든데.","친구1: 너는 체력이 좋으니까 그렇지.","친구2: 체력 문제가 아니라 네가 의지가 약한 거지.","친구1: 내 말은 그게 아니라, 그냥 좀 들어 줬으면 해서...","친구2: 들어 주긴 뭘 들어 줘. 힘들면 그만두면 되잖아."],"problem":"Friend 2 compares themselves to Friend 1 (line 2), says Friend 1 is weak-willed (line 4), and refuses to listen (line 6). Friend 1 wanted sympathy, not advice or criticism.","model":["A: 요즘 아르바이트가 너무 힘들어서 그만두고 싶어.","B: 그렇구나. 무슨 일이 있었어?","A: 손님도 너무 많고 사장님도 계속 일을 더 시켜.","B: 그럴 수도 있겠다. 정말 힘들겠다.","A: 그러게 말이야. 그래서 쉬는 날에도 쉬는 것 같지가 않아.","B: 맞아, 맞아. 쉬어도 피곤하지. 오늘은 내가 커피 살게. 천천히 얘기해 봐."]},{"title":"말을 끊는 친구","lines":["친구1: 어제 퇴근길에 지갑을 잃어버렸는데...","친구2: 아, 지갑? 나도 작년에 잃어버렸어. 카드 정지하느라 진짜 귀찮았어.","친구1: 그랬구나. 그런데 어제는...","친구2: 근데 너 저번에 말한 그 가방은 샀어?","친구1: 지금 내 얘기 하고 있잖아.","친구2: 아 알았어, 빨리 말해. 나 바빠."],"problem":"Friend 2 interrupts Friend 1 twice (lines 2 and 4), turns the topic to themselves and to a different subject, and finally rushes Friend 1 (line 6), so Friend 1 feels ignored.","model":["A: 어제 퇴근길에 지갑을 잃어버렸어.","B: 어머, 정말? 많이 놀랐겠다.","A: 응, 카드도 다 들어 있어서 어떻게 해야 할지 몰랐어.","B: 그러게. 카드가 다 들어 있었으면 많이 놀랐겠다. 그래서 어떻게 했어?","A: 일단 카드 회사에 전화해서 정지했어.","B: 잘했네. 그래도 큰 피해가 없어서 다행이다."]},{"title":"또 늦은 친구","lines":["친구1: 미안, 버스가 늦게 와서 20분 늦었어.","친구2: 또? 맨날 늦네.","친구1: 이번엔 진짜 버스 때문이야.","친구2: 언제까지 핑계 댈 셈이야?","친구1: 핑계라니, 나도 일찍 나오려고 했어.","친구2: 그럼 일찍 나왔어야지. 너랑 약속하면 매번 기다려야 하잖아."],"problem":"Friend 2 does not listen to the reason and accuses Friend 1 of always making excuses (lines 2, 4, 6). Friend 2's anger is understandable, but the blaming tone with no empathy turns it into an argument.","model":["A: 미안, 버스가 늦게 와서 20분 늦었어. 많이 기다렸지?","B: 응, 조금. 그런데 무슨 일 있었어?","A: 버스가 한참 안 왔어. 일찍 나오려고 했는데...","B: 그렇구나. 아침에 버스 기다리는 것도 힘들지.","A: 정말 미안해. 다음에는 더 일찍 나올게.","B: 그래. 나도 기다리다 보니 좀 속상했거든. 늦을 것 같으면 미리 연락해 줘."]},{"title":"다이어트를 시작한 친구","lines":["친구1: 나 오늘부터 다이어트 시작했어. 이번엔 꼭 성공할 거야.","친구2: 지난번에도 그렇게 말했잖아. 3일 만에 포기했으면서.","친구1: 이번엔 다를 거야.","친구2: 네가 무슨 다이어트야. 어차피 또 치킨 시켜 먹을 텐데.","친구1: 너 지금 나 무시하는 거야?","친구2: 무시가 아니라 사실을 말하는 거야."],"problem":"Friend 2 brings up Friend 1's past failure (line 2), predicts failure again (line 4), and refuses to apologize (line 6). Friend 1 shared a new resolution and needed encouragement.","model":["A: 나 오늘부터 다이어트 시작했어. 이번엔 꼭 성공할 거야.","B: 와, 대단하다! 결심하기가 쉽지 않았겠다.","A: 맞아. 지난번에는 3일 만에 포기해서 이번에는 걱정도 돼.","B: 하긴, 처음엔 누구나 힘들지.","A: 그렇지? 그래서 같이 운동해 줄 사람이 있으면 좋겠어.","B: 그럼 내가 같이 해 줄게. 주말에 산책부터 시작해 볼까?"]},{"title":"면접에서 떨어진 친구","lines":["친구1: 이번에도 면접에서 떨어졌어.","친구2: 또? 네가 너무 눈이 높은 거 아니야?","친구1: 그런 게 아니라 이번 회사는 정말 가고 싶었어.","친구2: 가고 싶다고 다 갈 수 있으면 누가 고생해? 네게 맞는 곳에나 지원해.","친구1: 너 말 너무 심하게 하는 거 아니야?","친구2: 난 현실적으로 말한 거야."],"problem":"Friend 2 blames Friend 1 for aiming too high (line 2) and tells them to lower their standards (line 4) without acknowledging disappointment. Friend 1 is hurt and feels judged; Friend 2 then justifies the harsh words (line 6).","model":["A: 이번에도 면접에서 떨어졌어.","B: 아, 그래? 정말 속상하겠다.","A: 응. 이번 회사는 정말 가고 싶었거든.","B: 그렇구나. 정말 가고 싶었던 회사니까 더 아쉽겠네.","A: 그러게. 내가 뭘 잘못했는지 모르겠어.","B: 네 잘못이 아니라 운이 없었을 수도 있어. 다음 면접 준비도 같이 해 볼까?"]}]};
