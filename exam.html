$("#quit").onclick = () => { clearInterval(X && X.timer); $("#exam").classList.add("hidden"); $("#start").classList.remove("hidden"); renderStart(); };

// grading: auto for choices and typed words; writing is marked by the learner against the model answer
function grade(q){
  if (q.type === "write") return null;
  if (q.type === "type") return q.answers.some(a => norm(a) === norm(q.ans || "")) ? q.pts : 0;
  return q.ans === q.answer ? q.pts : 0;
}
function check(q, el){
  if (q.ans == null || q.ans === "") { el && el.animate && el.animate([{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }], { duration: 250 }); return; }
  q.done = true; q.got = grade(q); feedback(q, true); setNext();
}
function feedback(q, fresh){
  const box = $("#fbx"); if (!box) return;
  const ok = q.got === q.pts, write = q.type === "write";
  // colour the choices
  for (const b of document.querySelectorAll("#paper [data-o]")) { const v = q.sents ? +b.dataset.o : b.dataset.o;
    if (v === q.answer) b.classList.add("right"); else if (v === q.ans) b.classList.add("wrong"); }
  let h = "";
  if (write) {
    h = `<div class="fb"><div class="h">${esc(T("model"))}</div><div class="model" lang="ko">${esc(q.model)}</div>${q.info ? `<div style="margin-top:6px;color:#5b5440">${esc(q.info)}</div>` : ""}
      <div style="margin-top:8px;font-weight:700">${esc(T("selfMark"))}</div><div class="marks" data-q="${X.Q.indexOf(q)}">
      ${[[q.pts, "✔ " + T("full")], [q.pts / 2, "△ " + T("half")], [0, "✖ " + T("none")]].map(([p, l]) => `<button data-p="${p}" class="${q.got === p ? "on" : ""}">${esc(l)} (${p})</button>`).join("")}</div></div>`;
  } else {
    const right = q.type === "type" ? q.answers[0] : q.sents ? (q.answer + 1) + "번" : q.answer;
    h = `<div class="fb ${ok ? "good" : "bad"}"><div class="h">${ok ? "✔ " + esc(T("right")) + " +" + q.pts : "✖ " + esc(T("wrong"))}</div>
      ${ok ? "" : `<div>${esc(T("answer"))}: <b lang="ko">${esc(right)}</b></div>`}${q.info ? `<div lang="ko">${esc(q.info)}</div>` : ""}${q.en ? `<div style="color:#5b5440">${esc(q.en)}</div>` : ""}
      ${!ok && q.type === "type" ? `<button class="override" id="ovr">${esc(T("override"))}</button>` : ""}</div>`;
  }
  box.innerHTML = h;
  if ($("#ovr")) $("#ovr").onclick = () => { q.got = q.pts; reward(q, true, $("#ovr")); feedback(q, false); };
  const mk = box.querySelector(".marks"); if (mk) mk.onclick = e => { const b = e.target.closest("[data-p]"); if (!b) return; const prev = q.got; q.got = +b.dataset.p; if (prev == null && q.got === q.pts) reward(q, true, b); feedback(q, false); };
  if (fresh && !write) reward(q, ok, box);
}
function reward(q, ok, el){
  if (X.mode !== "practice") return;
  const r = el.getBoundingClientRect();
  if (ok) { X.combo++; sndRight(X.combo); buzz(25); burst(r.left + r.width / 2, r.top + 20, 24 + Math.min(40, X.combo * 4), 1 + Math.min(.7, X.combo * .05)); floatText(r.left + r.width / 2, r.top, "+" + q.pts); }
  else { X.combo = 0; sndWrong(); buzz([60, 40, 60]); }
  $("#combo").textContent = "🔥" + X.combo;
}

// ---------- the end: mark the writing, then the score ----------
function submit(){

      <div class="sec">${esc(q.sec.title.replace("{a}", q.num).replace("{b}", q.num))}</div><div class="stem" lang="ko"><span class="qn">${q.sec.dlg ? "대화 " : ""}${q.num}.</span>${esc(q.stem || (q.box ? q.box[0] : q.dlgB || ""))}</div>
      <div style="margin-top:8px;font-weight:700">${esc(T("yours"))}</div><div class="model" style="border-color:#9a927d" lang="ko">${esc(q.ans || "—")}</div>
      <div style="margin-top:8px;font-weight:700">${esc(T("model"))}</div><div class="model" lang="ko">${esc(q.model)}</div>
      <div class="marks" data-k="${X.Q.indexOf(q)}">${[[q.pts, "✔ " + T("full")], [q.pts / 2, "△ " + T("half")], [0, "✖ " + T("none")]].map(([p, l]) => `<button data-p="${p}"${(q.ans || "").trim() ? "" : (p === 0 ? ' class="on"' : "")}>${esc(l)} (${p})</button>`).join("")}</div></div>`).join("")
    + `<button class="go" id="seeScore">${esc(T("seeScore"))}</button>`;
  for (const q of toMark) if (!(q.ans || "").trim()) q.got = 0;
  m.onclick = e => { const b = e.target.closest("[data-p]"); if (!b) return; const box = b.parentElement; X.Q[+box.dataset.k].got = +b.dataset.p; for (const x of box.children) x.classList.toggle("on", x === b); };
  $("#seeScore").onclick = () => { const left = toMark.filter(q => q.got == null).length; if (left) { alertBox(T("markAll")); return; } endTest(); };
  scrollTo(0, 0);
}
function alertBox(t){ const d = document.createElement("div"); d.className = "float"; d.style.left = "50%"; d.style.top = "40%"; d.style.color = "#ff6b7a"; d.style.fontSize = "18px"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1200); }
function endTest(){
  clearInterval(X.timer);
  for (const q of X.Q) if (q.got == null) q.got = q.type === "write" ? 0 : grade(q);
  const total = Math.round(X.Q.reduce((s, q) => s + (q.got || 0), 0) * 2) / 2;
  const part1 = X.Q.filter(q => !q.sec.dlg).reduce((s, q) => s + (q.got || 0), 0), part2 = total - part1;
  H.tests++; H.last = total; H.best = H.best == null ? total : Math.max(H.best, total); H.hist = [...H.hist, { d: new Date().toISOString().slice(0, 10), s: total, m: X.mode }].slice(-30); store.set("k5a_exam", H);
  $("#exam").classList.add("hidden"); $("#mark").classList.add("hidden");
  const res = $("#result"); res.classList.remove("hidden");
  const pct = total / 60, grade = pct >= .9 ? T("g1") : pct >= .75 ? T("g2") : pct >= .6 ? T("g3") : T("g4");
  const bySec = SECS.map(s => { const qs = X.Q.filter(q => q.sec === s); return { s, got: qs.reduce((a, q) => a + (q.got || 0), 0), max: qs.reduce((a, q) => a + q.pts, 0) }; });
  res.innerHTML = `<div class="score"><div class="big" id="bigScore">0</div><div class="of">/ 60</div></div><div class="grade">${esc(grade)}</div>
    <div class="stats"><div class="stat"><b>${part1}</b><span>어휘·문법 / 30</span></div><div class="stat"><b>${part2}</b><span>대화 / 30</span></div><div class="stat"><b>${H.best}</b><span>${esc(T("best"))}</span></div></div>
    <div class="rows">${bySec.map(r => `<div class="row"><span lang="ko">${esc(r.s.title.replace(/※ |\(.*?\)|\[\{a\}(~\{b\})?\] /g, "").slice(0, 34))}</span><b style="color:${r.got === r.max ? "var(--good)" : r.got ? "var(--gold)" : "var(--bad)"}">${r.got} / ${r.max}</b></div>`).join("")}</div>
    <button class="go" id="again">${esc(T("again"))}</button><button class="ghost" id="menu">${esc(T("menu"))}</button>`;
  // count up the score, then celebrate
  let n = 0; const tgt = total, step = Math.max(.5, tgt / 40);
  const iv = setInterval(() => { n = Math.min(tgt, n + step); $("#bigScore").textContent = Math.round(n * 2) / 2; tone(400 + n * 12, 0, .04, "triangle", .06);
    if (n >= tgt) { clearInterval(iv); if (pct >= .6) { sndFanfare(); for (let k = 0; k < (pct >= .9 ? 6 : 3); k++) setTimeout(() => burst(innerWidth * (.2 + Math.random() * .6), innerHeight * (.15 + Math.random() * .3), 70, 1.4), k * 250); buzz([40, 50, 40, 50, 80]); } } }, 35);
  $("#again").onclick = startTest; $("#menu").onclick = () => { res.classList.add("hidden"); $("#start").classList.remove("hidden"); renderStart(); };
  scrollTo(0, 0);
}
$("#go").onclick = startTest;
renderStart();
</script>
