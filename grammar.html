<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Korean 5A — 문법</title>
<meta property="og:title" content="Korean 5A 읽기 문법 · Grammar">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="grammar.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-grammar-192.png">
<link rel="icon" href="icon-grammar-192.png">
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2e; --card:#1c2740; --card2:#223052;
    --line:#2c3a5a; --txt:#eaf0fb; --dim:#96a3c2; --accent:#5b8cff;
    --gold:#ffcf5c; --good:#37d18f; --bad:#ff6b7a; --hl:#ffd98a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    line-height:1.55;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  [lang="zh"]{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
  [lang="zht"]{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
  [lang="th"]{font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif}
  [hidden]{display:none!important}
  a{color:var(--accent)}
  header{position:sticky;top:0;z-index:5;background:rgba(15,20,32,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;gap:8px;padding:10px 16px 6px;max-width:860px;margin:0 auto}
  .top h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
  .top h1 small{color:var(--dim);font-weight:400;font-size:13px;margin-left:6px}
  .top .home{color:var(--dim);text-decoration:none;font-size:20px;padding:0 4px}
  select,.pill{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;max-width:860px;margin:0 auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:12px;padding:5px 12px;cursor:pointer;font:inherit;font-size:14px;text-align:left;line-height:1.25}
  .tab small{display:block;font-size:11px}
  .tab.on{background:var(--card2);border-color:var(--accent);color:var(--txt)}
  main{max-width:860px;margin:0 auto;padding:12px 16px}
  .chhead{display:flex;align-items:baseline;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
  .chhead h2{margin:0;font-size:22px}
  .chhead .sub{color:var(--dim);font-size:14px}
  .chhead .grow{flex:1}

  .gp{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
  .gphead{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;cursor:pointer}
  .gphead .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px;color:var(--dim)}
  .gphead .ttl{flex:1;min-width:0}
  .gphead .ttl b{font-size:19px;display:block}
  .gphead .ttl .mean{color:var(--dim);font-size:14px}
  .gphead .part{flex:none;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-top:4px}
  .gphead .chev{flex:none;color:var(--dim);transition:.2s;margin-top:4px}
  .gp.open .gphead .chev{transform:rotate(180deg)}
  .gpbody{display:none;padding:0 16px 16px}
  .gp.open .gpbody{display:block}

  .formula{background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:2px 0 10px;font-size:17px}
  .formula .form{color:var(--dim);font-size:13px;margin-bottom:4px}
  .formula .pat{font-weight:600}
  .rule{font-size:15px;margin:0 0 4px}
  .tr{color:var(--dim);font-size:14px}
  .sec{margin-top:14px}
  .sec>h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .ex{padding:8px 12px;border-left:3px solid var(--accent);background:rgba(91,140,255,.06);border-radius:0 10px 10px 0;margin-bottom:6px;cursor:pointer}
  .ex .ko{font-size:16px}
  .ex .tr{margin-top:2px}
  body.hidetr .ex:not(.shown) .tr{display:none}
  body.hidetr .ex:not(.shown) .ko::after{content:" 👁";opacity:.35;font-size:12px}
  mark{background:none;color:var(--hl);font-weight:700;border-bottom:2px solid rgba(255,217,138,.45)}
  .note{border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:14px}
  .note.warn{background:rgba(255,107,122,.09);border:1px solid rgba(255,107,122,.35)}
  .note.tip{background:rgba(255,207,92,.08);border:1px solid rgba(255,207,92,.35)}
  .note .k{font-weight:700;margin-right:6px}
  .note .tr{margin-top:3px}

  .tbl{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{background:var(--bg2);color:var(--dim);font-weight:600}
  td:first-child{font-weight:600}
  tr:last-child td{border-bottom:none}
  .tbl.cover td:not(:first-child):not(.shown){color:transparent;background:var(--card2);cursor:pointer;border-radius:4px;text-shadow:none}
  .tbl.cover td:not(:first-child):not(.shown)::after{content:"?";color:var(--dim);margin-left:-.4em}
  .tbar{display:flex;gap:8px;margin:0 0 6px;flex-wrap:wrap;align-items:center}
  .tbar .tr{flex:1}

  .pr{display:flex;flex-direction:column;gap:4px;padding:9px 12px;background:var(--bg2);border-radius:10px;margin-bottom:6px;border:1px solid transparent}
  .pr .q{font-size:15px}
  .pr .a{font-size:15px;color:var(--good)}
  .pr button{align-self:flex-start}
  .pr.done{border-color:rgba(55,209,143,.35)}
  .pill.small{font-size:12px;padding:3px 10px}
  .aihint{font-size:11px;color:var(--dim);margin-top:4px}

  /* quiz */
  .quiz{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--accent);border-radius:16px;padding:16px;margin-bottom:14px}
  .quiz .qtop{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;margin-bottom:8px}
  .quiz .qs{font-size:19px;margin:6px 0 4px;line-height:1.6}
  .quiz .blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--gold);color:var(--gold);text-align:center}
  .quiz .qen{color:var(--dim);font-size:15px;font-style:italic;margin:2px 0 6px}
  .quiz .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:12px}
  .quiz .opt{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;text-align:left;cursor:pointer}
  .quiz .opt small{display:block;color:var(--dim);font-size:12px}
  .quiz .opt.right{border-color:var(--good);background:rgba(55,209,143,.15)}
  .quiz .opt.wrong{border-color:var(--bad);background:rgba(255,107,122,.12)}
  .quiz .fb{min-height:24px;margin-top:10px;font-size:14px}
  .quiz .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
  .foot{color:var(--dim);font-size:12px;text-align:center;margin:24px 0 8px}
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="home" href="./" title="단어장">‹</a>
    <h1>읽기 문법 <small>5A</small></h1>
    <button class="pill" id="trBtn"></button>
    <select id="lang" aria-label="Language"></select>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<div class="foot" id="foot"></div>

<script>
const DATA = {"chapters":[{"n":1,"title":"인물"},{"n":2,"title":"서울의 명소"},{"n":3,"title":"풍습"},{"n":4,"title":"사자성어와 속담"},{"n":5,"title":"문학"},{"n":6,"title":"한국인의 대화법"},{"n":7,"title":"성공적인 삶"}],"points":[{"id":"g1-1","ch":1,"part":"읽기 1","title":"N은/는커녕","form":"명사 + 은/는커녕","pattern":"A은/는커녕 B도 못 한다 / 안 한다 / 없다","rule":"A는 물론 못하고, A보다 훨씬 쉬운 일·기본적인 일인 B도 (못 한다).","meaning":"“not even B, let alone A”. A is the bigger thing; even the smaller, more basic B did not happen.","use":"After a noun. The second half always has 도 and is always negative (못/안/없다).","examples":[{"ko":"그는 춤은커녕 다시는 걸을 수도 없게 되었다.","en":"Let alone dance, he could never even walk again."},{"ko":"아침에 너무 늦게 일어나서 화장은커녕 세수도 못 했다.","en":"I got up so late I couldn't even wash my face, let alone put on make-up."},{"ko":"목이 아파서 밥은커녕 죽도 못 먹었어요.","en":"My throat hurt so much I couldn't even eat porridge, let alone rice."}],"notes":[{"kind":"주의","ko":"A은/는커녕 B도 못(안) 한다 → 항상 부정이 와요.","en":"The sentence always ends negatively (못, 안, 없다)."}],"practice":[{"q":"예습 × 복습 ×","a":"예습은커녕 복습도 못 했어요.","en":"I didn't even review, let alone prepare ahead."},{"q":"만 원 × 천 원 ×","a":"만 원은커녕 천 원도 없어요.","en":"I don't even have 1,000 won, let alone 10,000."},{"q":"요리 × 라면 ×","a":"요리는커녕 라면도 못 끓여요.","en":"I can't even make instant noodles, let alone cook."}],"hl":"[은는]커녕|도 (못|안) |도 없","hlShow":"[은는]커녕|도 (못|안) |도 없","drill":[{"ko":"요즘 너무 바빠서 운동은커녕 산책도 못 해요.","en":"I'm so busy these days I can't even go for a walk, let alone work out."},{"ko":"그 사람은 사과는커녕 인사도 안 하고 가 버렸어요.","en":"He left without even saying hello, let alone apologising."},{"ko":"시험 기간이라 여행은커녕 친구 만날 시간도 없어요.","en":"It's exam season, so I don't even have time to see friends, let alone travel."},{"ko":"돈이 없어서 새 차는커녕 자전거도 못 사요.","en":"I have no money, so I can't even buy a bicycle, let alone a new car."},{"ko":"감기 때문에 등산은커녕 집 앞 편의점에도 못 갔어요.","en":"Because of my cold I couldn't even go to the shop outside, let alone go hiking."},{"ko":"그는 한국어는커녕 영어도 못 한다.","en":"He can't even speak English, let alone Korean."},{"ko":"동생은 설거지는커녕 자기 방 청소도 안 해요.","en":"My younger sibling doesn't even clean their own room, let alone do the dishes."}]},{"id":"g1-2","ch":1,"part":"읽기 1","title":"A/V-기는커녕","form":"형용사/동사 + 기는커녕","pattern":"A-기는커녕 B도 못 한다 / 안 한다","rule":"N은/는커녕과 같은 뜻. 형용사·동사 뒤에는 -기는커녕을 써요.","meaning":"The same “let alone / far from” meaning, but after an adjective or verb.","use":"Stem + 기는커녕. Often used to answer a question with “far from it”.","examples":[{"ko":"A: 김 부장님이 지난달에 승진하셨는데 한턱 냈어요? B: 어휴, 한턱 내기는커녕 커피도 한 잔 안 샀어요.","en":"A: Did Manager Kim treat everyone after his promotion? B: Ugh, far from treating us, he didn't even buy one coffee."},{"ko":"사과는커녕 오히려 막 화를 내더라고요.","en":"Far from apologising, he actually got angry."},{"ko":"칭찬을 받기는커녕 혼나기만 했어요.","en":"Far from being praised, I only got scolded."}],"notes":[{"kind":"tip","ko":"A은/는커녕, -기는커녕 (오히려) B를 하다 → 기대와 반대의 결과가 오는 경우도 있어요.","en":"With (오히려) + an action, it means the opposite of what was expected happened."}],"practice":[{"q":"A: 요즘 그 친구하고 자주 만나지? B: 아니, ______ 요즘 얼굴 보기도 힘들어.","a":"만나기는커녕"},{"q":"A: 지난주에 이사할 때 앤디 씨가 많이 도와줬다면서? B: 뭐라고? ______ 연락도 없었어.","a":"도와주기는커녕"},{"q":"A: 미나가 이번 학기에 열심히 공부하지? B: 아니! ______ 학교에도 잘 안 와.","a":"공부하기는커녕"},{"q":"A: 그 영화 어땠어? 사람들이 재미있었다고 하던데. B: 재미있기는커녕 ______.","a":"재미있기는커녕 너무 지루해서 잠만 잤어.","en":"Far from being fun, it was so boring I just slept."},{"q":"A: 어제 아팠다면서? 몸은 좀 나아졌어? B: 아니. 나아지기는커녕 ______.","a":"나아지기는커녕 더 아파졌어.","en":"Far from getting better, I got even sicker."}],"hl":"기는커녕","hlShow":"기는커녕","drill":[{"ko":"약을 먹었는데 낫기는커녕 열이 더 났어요.","en":"I took medicine, but far from getting better, my fever went up."},{"ko":"주말에 쉬기는커녕 밤늦게까지 일만 했어요.","en":"Far from resting at the weekend, I did nothing but work until late at night."},{"ko":"선물을 받고 기뻐하기는커녕 고맙다는 말도 안 했어요.","en":"Far from being pleased with the present, she didn't even say thank you."},{"ko":"돈을 모으기는커녕 빚만 늘었어요.","en":"Far from saving money, all I did was pile up debt."},{"ko":"살이 빠지기는커녕 오히려 3킬로나 쪘어요.","en":"Far from losing weight, I actually gained three kilos."},{"ko":"그 식당은 맛있기는커녕 너무 짜서 먹을 수가 없었어요.","en":"Far from being tasty, that restaurant's food was too salty to eat."},{"ko":"동생은 나를 돕기는커녕 방해만 했다.","en":"Far from helping me, my sibling only got in the way."}]},{"id":"g1-3","ch":1,"part":"읽기 2","title":"그리 A-지 않다 / V-지 않는다","form":"그리 + 형용사/동사 + 지 않다","pattern":"그리 A-지 않다  (= 별로 A-지 않아요)","rule":"‘별로 -지 않다’의 뜻. 주로 글에서 써요.","meaning":"“not very / not that …”. A softer negative, like 별로 -지 않다, mostly used in writing.","use":"Mainly with adjectives. With a verb you need an adverb such as 많이 or 잘.","examples":[{"ko":"안정된 의사의 길을 포기하는 것은 그리 쉽지 않았습니다.","en":"Giving up the stable path of a doctor was not that easy."},{"ko":"서강대학교는 여기서 그리 멀지 않다. (= 별로 멀지 않아요)","en":"Sogang University isn't very far from here."},{"ko":"그 사람은 그리 많이 먹지 않는다.","en":"That person doesn't eat very much."}],"notes":[{"kind":"주의","ko":"‘그리 -지 않다’는 주로 형용사와 연결되지만 동사와 연결될 때는 부사가 필요해요. (그리 많이 먹지 않는다, 그는 술을 그리 잘 마시는 편이 아니다)","en":"Usually with adjectives; with verbs add an adverb: 그리 많이 먹지 않는다, 그리 잘 마시는 편이 아니다."}],"practice":[{"q":"한국어 공부, 쉽다 X","a":"한국어 공부는 그리 쉽지 않다.","en":"Studying Korean is not that easy."},{"q":"날씨, 춥다 X","a":"날씨가 그리 춥지 않다.","en":"The weather isn't that cold."},{"q":"바람, 불다 X","a":"바람이 그리 많이 불지 않는다.","en":"The wind isn't blowing that much."},{"q":"매운 음식, 먹다 X","a":"매운 음식을 그리 많이 먹지 않는다.","en":"I don't eat spicy food that much."}],"hl":"그리 (많이 |잘 )?\\S+?지 않|그리 잘 \\S+ 편이 아니","hlShow":"그리 (많이 |잘 )?\\S+?지 않|그리 잘 \\S+ 편이 아니","drill":[{"ko":"이 문제는 생각보다 그리 어렵지 않다.","en":"This question is not as hard as I thought."},{"ko":"오늘은 날씨가 그리 춥지 않다.","en":"It isn't that cold today."},{"ko":"그 식당의 음식 값은 그리 비싸지 않은 편이다.","en":"The food at that restaurant is not that expensive."},{"ko":"이번 시험 결과는 그리 좋지 않았다.","en":"The results of this exam weren't that good."},{"ko":"그는 술을 그리 많이 마시지 않는다.","en":"He doesn't drink that much."},{"ko":"우리 집에서 학교까지는 그리 멀지 않다.","en":"It isn't that far from my house to school."},{"ko":"나는 매운 음식을 그리 잘 먹지 않는다.","en":"I'm not that good with spicy food."}]},{"id":"g1-4","ch":1,"part":"읽기 2","title":"N 말고도","form":"명사 + 말고도","pattern":"A 말고도 B이/가 있다  (긍정적인 내용)","rule":"A도 있고 B도 있다. *말할 때 많이 사용","meaning":"“besides A, also B”. A is there, and B is there too.","use":"After a noun, followed by something that also exists or happens. Common in speech.","examples":[{"ko":"의대에는 나 말고도 많은 사람들이 있었다.","en":"Besides me, there were many other people at medical school."}],"notes":[],"practice":[{"q":"우리 반에는 ____ 씨 말고도 ____ 사람이 ____ 명 더 있다.","a":"우리 반에는 앤디 씨 말고도 미국 사람이 두 명 더 있다.","en":"Besides Andy, there are two more Americans in our class."},{"q":"이 옷 말고도 ______.","a":"이 옷 말고도 예쁜 옷이 많이 있어요.","en":"Besides this one, there are lots of pretty clothes."},{"q":"미나 씨는 영어 말고도 ______.","a":"미나 씨는 영어 말고도 중국어를 잘해요.","en":"Besides English, Mina is also good at Chinese."}],"hl":"말고도","hlShow":"말고도","drill":[{"ko":"이 식당은 비빔밥 말고도 맛있는 음식이 많아요.","en":"Besides bibimbap, this restaurant has lots of good food."},{"ko":"서울에는 경복궁 말고도 가 볼 만한 궁이 많다.","en":"Besides Gyeongbokgung, Seoul has many palaces worth visiting."},{"ko":"그는 한국어 말고도 일본어와 중국어를 할 줄 안다.","en":"Besides Korean, he can speak Japanese and Chinese."},{"ko":"오늘 회의에는 부장님 말고도 사장님도 오셨다.","en":"Besides the manager, the company president also came to today's meeting."},{"ko":"여기 말고도 근처에 좋은 카페가 몇 군데 더 있어요.","en":"Besides this one, there are a few more good cafés nearby."},{"ko":"그 배우는 연기 말고도 노래와 춤도 잘한다.","en":"Besides acting, that actor is also good at singing and dancing."},{"ko":"나 말고도 이 일을 도와줄 사람이 많다.","en":"Besides me, there are many people who can help with this."}]},{"id":"g1-5","ch":1,"part":"읽기 2","title":"N 말고는","form":"명사 + 말고는","pattern":"A 말고는 B이/가 없다  (부정적인 내용)","rule":"A만 있다. *말할 때 많이 사용","meaning":"“except A, there is no B”. Only A.","use":"After a noun, followed by a negative (없다, 안/못). Common in speech.","examples":[{"ko":"이 일은 나 말고는 할 수 있는 사람이 없다.","en":"Apart from me, nobody can do this job."}],"notes":[],"practice":[{"q":"우리 반에는 ____ 씨 말고는 ______ 사람이 없다.","a":"우리 반에는 앤디 씨 말고는 미국 사람이 없다.","en":"Apart from Andy, there are no Americans in our class."},{"q":"오늘 오후에 회의 말고는 ______.","a":"오늘 오후에 회의 말고는 다른 일정이 없어요.","en":"Apart from a meeting, I have nothing else scheduled this afternoon."},{"q":"그 영화배우는 이 영화 말고는 ______.","a":"그 영화배우는 이 영화 말고는 유명한 작품이 없어요.","en":"Apart from this film, that actor has no well-known work."}],"hl":"말고는","hlShow":"말고는","drill":[{"ko":"이 동네에는 편의점 말고는 가게가 하나도 없다.","en":"Apart from a convenience store, there isn't a single shop in this neighbourhood."},{"ko":"그 비밀은 너 말고는 아무도 몰라.","en":"Nobody but you knows that secret."},{"ko":"냉장고에 물 말고는 먹을 게 없어요.","en":"Apart from water, there's nothing to eat or drink in the fridge."},{"ko":"주말에는 잠자는 것 말고는 아무것도 안 했어요.","en":"At the weekend I did nothing apart from sleep."},{"ko":"그 문제를 해결할 방법은 이것 말고는 없다.","en":"There is no way to solve that problem other than this."},{"ko":"우리 반에서 민수 말고는 모두 숙제를 해 왔다.","en":"Apart from Minsu, everyone in our class did their homework."},{"ko":"그는 일 말고는 관심이 있는 게 없는 사람이다.","en":"He's someone who has no interest in anything apart from work."}]},{"id":"g1-6","ch":1,"part":"읽기 2","title":"A/V-(느)냐에 달려 있다","form":"형용사 + 냐에 / 동사 + 느냐에 달려 있다","pattern":"A는 B(느)냐에 달려 있다","rule":"A는 B가 결정한다.","meaning":"“A depends on how/whether B”. B decides A.","use":"Adjective stem + 냐에, verb stem + 느냐에. Usually with a question word such as 얼마나 or 어떻게.","examples":[{"ko":"이 영화의 성공은 얼마나 이야기가 잘 전달되느냐에 달려 있다.","en":"This film's success depends on how well the story comes across."},{"ko":"이번 일의 성공은 여러분이 얼마나 노력하느냐에 달려 있습니다.","en":"The success of this project depends on how hard you all work."}],"notes":[{"kind":"tip","ko":"‘-(느)냐에 달려 있다’는 ‘얼마나, 어떻게’ 처럼 의문사와 함께 써요.","en":"Use it together with a question word such as 얼마나 or 어떻게."}],"practice":[{"q":"이번 발표는 미나 씨가 ______. (얼마나 잘 준비하다)","a":"이번 발표는 미나 씨가 얼마나 잘 준비하느냐에 달려 있다.","en":"This presentation depends on how well Mina prepares."},{"q":"프로젝트의 성공은 ______. (어떤 사람이 담당자가 되다)","a":"프로젝트의 성공은 어떤 사람이 담당자가 되느냐에 달려 있다.","en":"The project's success depends on who is put in charge."},{"q":"내가 화를 낼지 안 낼지는 ______. (네가 어떻게 대답하다)","a":"내가 화를 낼지 안 낼지는 네가 어떻게 대답하느냐에 달려 있다.","en":"Whether I get angry or not depends on how you answer."},{"q":"음식의 맛은 재료가 ______. (얼마나 신선하다)","a":"음식의 맛은 재료가 얼마나 신선하냐에 달려 있다.","en":"How food tastes depends on how fresh the ingredients are."}],"hl":"느?냐에 달려 있","hlShow":"느?냐에 달려 있","drill":[{"ko":"성공은 얼마나 노력하느냐에 달려 있다.","en":"Success depends on how hard you try."},{"ko":"시험 결과는 얼마나 꾸준히 공부하느냐에 달려 있어요.","en":"Exam results depend on how consistently you study."},{"ko":"행복은 무엇을 가졌느냐보다 어떻게 생각하느냐에 달려 있다.","en":"Happiness depends less on what you have than on how you think."},{"ko":"내일 경기를 할 수 있는지는 비가 오느냐에 달려 있다.","en":"Whether tomorrow's match can go ahead depends on whether it rains."},{"ko":"좋은 관계를 유지하는 것은 서로를 얼마나 이해하느냐에 달려 있다.","en":"Keeping a good relationship depends on how well you understand each other."},{"ko":"합격 여부는 면접에서 어떻게 대답하느냐에 달려 있어요.","en":"Whether you pass depends on how you answer in the interview."},{"ko":"건강은 무엇을 먹느냐에 달려 있다고 한다.","en":"They say health depends on what you eat."}]},{"id":"g1-7","ch":1,"part":"읽기 2","title":"N에 달려 있다","form":"명사 + 에(게) 달려 있다","pattern":"A는 B에 달려 있다","rule":"A는 B가 결정한다.","meaning":"“A depends on B / is up to B”.","use":"After a noun; with a person use 에게.","examples":[{"ko":"그 일을 할지 말지는 너의 마음에 달려 있다.","en":"Whether to do it or not is up to you."}],"notes":[],"practice":[{"q":"음식의 맛은 ______ 에/에게 달려 있다.","a":"음식의 맛은 재료에 달려 있다.","en":"How food tastes depends on the ingredients."},{"q":"행복은 ______ 에/에게 달려 있다.","a":"행복은 마음먹기에 달려 있다.","en":"Happiness depends on how you set your mind."},{"q":"그 영화의 성공은 ______ 에/에게 달려 있다.","a":"그 영화의 성공은 주인공 배우에게 달려 있다.","en":"The film's success depends on the lead actor."}],"hl":"에(게)? 달려 있","hlShow":"에(게)? 달려 있","drill":[{"ko":"이 일의 성공은 여러분의 노력에 달려 있습니다.","en":"The success of this work depends on your efforts."},{"ko":"결정은 이제 너에게 달려 있어.","en":"The decision is up to you now."},{"ko":"나라의 미래는 젊은이들에게 달려 있다.","en":"The country's future depends on its young people."},{"ko":"행사 진행 여부는 날씨에 달려 있어요.","en":"Whether the event goes ahead depends on the weather."},{"ko":"우리 팀의 승리는 마지막 선수의 실력에 달려 있다.","en":"Our team's victory depends on the last player's skill."},{"ko":"모든 것이 네 선택에 달려 있다.","en":"Everything depends on your choice."},{"ko":"회사의 운명은 이번 계약에 달려 있다.","en":"The company's fate depends on this contract."}]},{"id":"g2-1","ch":2,"part":"읽기 2","title":"V-고자 하다","form":"동사 + 고자 하다","pattern":"V-고자 합니다  (= V-(으)려고 합니다)","rule":"발표, 토론, 회의 등에서 쓰는 격식적인 표현.","meaning":"“I intend to / I would like to …”, a formal version of -(으)려고 하다.","use":"Verb stem + 고자 하다. Used in presentations, debates, meetings and formal writing.","examples":[{"ko":"지금부터 ‘600년 역사의 북촌 한옥 마을’에 대해서 발표하고자 합니다.","en":"I would now like to present on “Bukchon Hanok Village, 600 years of history”."},{"ko":"지금부터 한국의 문화에 대해서 설명하고자 합니다. (= 설명하려고 합니다)","en":"I would now like to explain Korean culture."}],"notes":[],"practice":[{"q":"발표: 지금부터 서울의 명소에 대해 발표하다","a":"지금부터 서울의 명소에 대해 발표하고자 합니다.","en":"I would now like to give a presentation on Seoul's famous sights."},{"q":"회의: 오늘은 지난번에 실시한 설문 조사의 결과를 말씀드리다","a":"오늘은 지난번에 실시한 설문 조사의 결과를 말씀드리고자 합니다.","en":"Today I would like to tell you the results of the survey we carried out last time."}],"hl":"고자 (하|합|한)","hlShow":"고자 (하|합|한)","drill":[{"ko":"저는 이 발표에서 한국의 전통 문화를 소개하고자 합니다.","en":"In this presentation I would like to introduce Korea's traditional culture."},{"ko":"오늘은 환경 문제에 대해 이야기하고자 합니다.","en":"Today I would like to talk about environmental problems."},{"ko":"우리 회사는 새로운 시장에 진출하고자 한다.","en":"Our company intends to enter a new market."},{"ko":"그는 어려운 이웃을 돕고자 하는 마음으로 봉사 활동을 시작했다.","en":"He started volunteering out of a wish to help neighbours in need."},{"ko":"정부는 청년 실업 문제를 해결하고자 한다.","en":"The government intends to solve the problem of youth unemployment."},{"ko":"이 연구에서는 한국인의 식습관 변화를 살펴보고자 한다.","en":"This study aims to examine changes in Koreans' eating habits."},{"ko":"저희는 고객 여러분께 더 좋은 서비스를 제공하고자 합니다.","en":"We aim to provide our customers with better service."},{"ko":"그 작가는 이 소설을 통해 전쟁의 아픔을 전하고자 하였다.","en":"Through this novel, the author sought to convey the pain of war."},{"ko":"저는 졸업 후에 한국에서 일하고자 합니다.","en":"After graduating, I intend to work in Korea."},{"ko":"학교는 학생들의 의견을 직접 듣고자 한다.","en":"The school intends to hear the students' opinions directly."},{"ko":"이 글에서는 서울의 숨은 명소를 소개하고자 한다.","en":"This article aims to introduce Seoul's hidden gems."},{"ko":"우리는 이번 축제를 통해 지역 경제를 살리고자 합니다.","en":"Through this festival, we aim to revive the local economy."},{"ko":"그는 부모님의 기대에 보답하고자 하였다.","en":"He sought to live up to his parents' expectations."},{"ko":"이번 강연에서는 성공적인 삶의 조건을 함께 생각해 보고자 합니다.","en":"In this lecture I would like us to think together about what makes a successful life."}]},{"id":"g2-2","ch":2,"part":"읽기 2","title":"A/V-은/는 반면에","form":"형용사 + 은 / 동사 + 는 반면에","pattern":"A-은/는 반면에 B  (= -지만)","rule":"앞과 뒤의 내용이 반대일 때. 격식적인 느낌.","meaning":"“whereas / on the other hand”, a formal contrast between two facts.","use":"Adjective + 은 반면에, verb + 는 반면에 (past: -았/었는 반면에).","examples":[{"ko":"남산 한옥 마을에는 한옥이 전시만 되어 있는 반면에 북촌 한옥 마을에서는 사람들이 직접 살고 있습니다.","en":"Whereas in Namsan Hanok Village the houses are only on display, in Bukchon people actually live in them."},{"ko":"형은 성격이 조용한 반면에 동생은 아주 활발하다.","en":"The older brother is quiet, whereas the younger one is very lively."}],"notes":[],"practice":[{"q":"그 가수: 노래를 잘 부르다 ↔ 춤 실력이 부족하다","a":"그 가수는 노래를 잘 부르는 반면에 춤 실력이 부족하다.","en":"That singer sings well, whereas her dancing is lacking."},{"q":"한국의 음식과 고향의 음식:","a":"한국 음식은 매운 반면에 고향 음식은 단 편이다.","en":"Korean food is spicy, whereas the food back home tends to be sweet."}],"hl":"[은는한운] 반면에","hlShow":"[은는한운] 반면에","drill":[{"ko":"이 동네는 교통이 편리한 반면에 집값이 비싸다.","en":"This neighbourhood has good transport, but on the other hand housing is expensive."},{"ko":"서울은 볼거리가 많은 반면에 사람이 너무 많다.","en":"Seoul has lots to see, but on the other hand it's too crowded."},{"ko":"형은 말이 많은 반면에 동생은 조용한 편이다.","en":"The older brother talks a lot, whereas the younger one is rather quiet."},{"ko":"이 옷은 디자인은 좋은 반면에 가격이 비싸요.","en":"These clothes have a good design, but on the other hand they're expensive."},{"ko":"도시 생활은 편리한 반면에 여유가 없다.","en":"City life is convenient, but on the other hand there's no time to breathe."},{"ko":"그 식당은 음식은 맛있는 반면에 서비스가 별로다.","en":"That restaurant's food is tasty, whereas the service isn't great."},{"ko":"시골은 공기가 맑은 반면에 병원이 멀다.","en":"The countryside has clean air, but on the other hand hospitals are far away."},{"ko":"이 일은 월급이 많은 반면에 쉬는 날이 적다.","en":"This job pays well, but on the other hand there are few days off."},{"ko":"여름은 더운 반면에 해가 길어서 좋다.","en":"Summer is hot, but on the other hand the long days are nice."},{"ko":"그는 운동은 잘하는 반면에 공부는 싫어한다.","en":"He's good at sports, whereas he hates studying."},{"ko":"이 휴대폰은 화면이 넓은 반면에 조금 무겁다.","en":"This phone has a big screen, but on the other hand it's a bit heavy."},{"ko":"인터넷 쇼핑은 편한 반면에 물건을 직접 볼 수 없다.","en":"Online shopping is convenient, but on the other hand you can't see the item in person."},{"ko":"한국어는 발음은 쉬운 반면에 문법이 어렵다.","en":"Korean pronunciation is easy, whereas the grammar is hard."},{"ko":"명동은 쇼핑하기 좋은 반면에 주말에는 너무 복잡하다.","en":"Myeongdong is great for shopping, but on the other hand it's far too crowded at weekends."}]},{"id":"g2-3","ch":2,"part":"읽기 2","title":"N을/를 비롯해서","form":"명사 + 을/를 비롯해서","pattern":"A을/를 비롯해서 B  (= A을/를 포함해서)","rule":"여러 가지 중에서 대표적인 A를 먼저 말하고 다른 것도 포함할 때.","meaning":"“starting with / including A”. A is the leading example of a larger group.","use":"After a noun; the rest of the sentence talks about the whole group.","examples":[{"ko":"불교 미술 박물관에서는 조선 시대의 불상을 비롯해서 불교 미술품 500여 점을 전시하고 있다.","en":"The Buddhist art museum exhibits some 500 works, including Joseon-era Buddha statues."},{"ko":"한국에 갔을 때 서울을 비롯해서 여러 도시를 여행했다.","en":"In Korea I travelled to several cities, starting with Seoul."}],"notes":[],"practice":[{"q":"[서울의 명소] 서울에는 창덕궁을 비롯해서 ______.","a":"서울에는 창덕궁을 비롯해서 남산, 청계천 같은 명소가 많다.","en":"Seoul has many famous places, including Changdeokgung, Namsan and Cheonggyecheon."},{"q":"[콘서트에 참가한 가수] 그 콘서트에는 ______.","a":"그 콘서트에는 아이유를 비롯해서 유명한 가수들이 많이 참가했다.","en":"Many famous singers, including IU, took part in that concert."}],"hl":"[을를] 비롯해서","hlShow":"[을를] 비롯해서","drill":[{"ko":"서울에는 경복궁을 비롯해서 유명한 궁궐이 많다.","en":"Seoul has many famous palaces, including Gyeongbokgung."},{"ko":"이번 행사에는 시장을 비롯해서 많은 사람들이 참석했다.","en":"Many people, including the mayor, attended this event."},{"ko":"김치를 비롯해서 한국의 발효 음식은 건강에 좋다고 한다.","en":"They say Korea's fermented foods, including kimchi, are good for your health."},{"ko":"남산타워를 비롯해서 서울의 명소를 하루 만에 다 둘러봤다.","en":"I saw all of Seoul's sights, including Namsan Tower, in a single day."},{"ko":"우리 가족은 할머니를 비롯해서 모두 음악을 좋아한다.","en":"Everyone in my family, including my grandmother, loves music."},{"ko":"이 가게에서는 과일을 비롯해서 다양한 식품을 판다.","en":"This shop sells all kinds of food, including fruit."},{"ko":"인사동에는 전통 찻집을 비롯해서 볼거리가 많다.","en":"Insadong has lots to see, including traditional tea houses."},{"ko":"선생님을 비롯해서 반 친구들 모두가 나를 축하해 주었다.","en":"Everyone, including my teacher and all my classmates, congratulated me."},{"ko":"그 가수는 한국을 비롯해서 여러 나라에서 인기가 많다.","en":"That singer is popular in many countries, including Korea."},{"ko":"이번 여름에는 부산을 비롯해서 남쪽 도시들을 여행할 계획이다.","en":"This summer I plan to travel to cities in the south, including Busan."},{"ko":"학생들은 영어를 비롯해서 여러 외국어를 배운다.","en":"The students learn several foreign languages, including English."},{"ko":"한강 공원에서는 자전거 타기를 비롯해서 다양한 활동을 할 수 있다.","en":"At the Han River parks you can do all kinds of activities, including cycling."},{"ko":"사장님을 비롯해서 전 직원이 회의에 참석했다.","en":"All the staff, including the company president, attended the meeting."},{"ko":"이 박물관에는 조선 시대의 그림을 비롯해서 귀한 유물이 많다.","en":"This museum has many precious artefacts, including paintings from the Joseon era."}]},{"id":"g3-1","ch":3,"part":"읽기 2","title":"V-고 말다","form":"동사 + 고 말다","pattern":"V-고 말았다","rule":"후회되거나 아쉽고 섭섭한 마음. (= 참지 못하고 V-았/었다)","meaning":"“ended up …” with regret, disappointment, or not being able to hold back.","use":"Verb stem + 고 말다, almost always in the past: -고 말았다.","examples":[{"ko":"슬픈 마음을 보이기 싫어서 화를 내고 말았다.","en":"I didn't want to show my sadness, so I ended up getting angry."},{"ko":"다이어트 중인데 피자를 한 판이나 먹고 말았어요.","en":"I'm on a diet, but I ended up eating a whole pizza."}],"notes":[],"practice":[{"q":"최선을 다했지만 아쉽게 이번 경기에서 졌다. →","a":"최선을 다했지만 아쉽게 이번 경기에서 지고 말았다.","en":"We did our best, but sadly we ended up losing this match."},{"q":"열심히 외웠는데 시험에서 틀렸다. →","a":"열심히 외웠는데 시험에서 틀리고 말았다.","en":"I memorised it hard, but I still ended up getting it wrong in the test."},{"q":"막차를 타려고 있는 힘을 다해 뛰어갔지만 놓쳤다. →","a":"막차를 타려고 있는 힘을 다해 뛰어갔지만 놓치고 말았다.","en":"I ran with all my strength to catch the last train, but I ended up missing it."}],"hl":"고 말았","hlShow":"고 말았","drill":[{"ko":"조심했는데도 결국 컵을 깨뜨리고 말았다.","en":"Even though I was careful, I ended up breaking the cup."},{"ko":"늦잠을 자서 비행기를 놓치고 말았어요.","en":"I overslept and ended up missing my flight."},{"ko":"참으려고 했지만 결국 울고 말았다.","en":"I tried to hold it in, but in the end I burst into tears."},{"ko":"다이어트 중이었는데 케이크를 다 먹고 말았다.","en":"I was on a diet, but I ended up eating the whole cake."},{"ko":"비밀을 지키기로 했는데 친구에게 말하고 말았다.","en":"I'd promised to keep the secret, but I ended up telling a friend."},{"ko":"오랫동안 아프셨던 할아버지가 결국 돌아가시고 말았다.","en":"My grandfather, who had been ill for a long time, passed away in the end."},{"ko":"지하철에서 지갑을 잃어버리고 말았어요.","en":"I ended up losing my wallet on the subway."},{"ko":"열심히 준비했지만 시험에 떨어지고 말았다.","en":"I prepared hard, but I ended up failing the exam."},{"ko":"너무 피곤해서 수업 시간에 졸고 말았다.","en":"I was so tired that I ended up dozing off in class."},{"ko":"급하게 뛰다가 넘어지고 말았어요.","en":"I was running in a hurry and ended up falling over."},{"ko":"물을 안 줘서 그 식물은 결국 말라 죽고 말았다.","en":"I didn't water it, so in the end the plant dried up and died."},{"ko":"친구와의 약속을 또 잊어버리고 말았어요.","en":"I ended up forgetting my plans with a friend again."},{"ko":"세일이라서 필요 없는 옷까지 사고 말았다.","en":"There was a sale, so I ended up buying clothes I didn't even need."},{"ko":"두 사람은 작은 오해 때문에 헤어지고 말았다.","en":"The two of them ended up breaking up over a small misunderstanding."}]},{"id":"g3-2","ch":3,"part":"읽기 2","title":"A/V-기라도 하면","form":"형용사/동사 + 기라도 하면","pattern":"(부정적인 내용) -기라도 하면 + 어떡하나 걱정이 되다 / 두렵다 …","rule":"혹시 일어날지도 몰라서 걱정되는 일.","meaning":"“what if … (should happen)”. Worrying about something bad that might happen.","use":"Stem + 기라도 하면, followed by worry: 어떡해?, 어떡하나 걱정이다, 두렵다.","examples":[{"ko":"혹시 싸우기라도 하면 어떡하나 걱정이 되었다.","en":"I was worried about what would happen if they got into a fight."},{"ko":"쉿! 조용히 말해. 다른 사람들이 우리 이야기를 듣기라도 하면 어떡해?","en":"Shh! Keep your voice down. What if other people hear us?"}],"notes":[],"practice":[{"q":"시험에 떨어지다 →","a":"시험에 떨어지기라도 하면 어떡하나 걱정이 돼요.","en":"I'm worried about what I'll do if I happen to fail the exam."},{"q":"저렇게 빨리 운전하다가 사고가 나다 →","a":"저렇게 빨리 운전하다가 사고가 나기라도 하면 어떡해?","en":"What if there's an accident, driving that fast?"}],"hl":"기라도 하면","hlShow":"기라도 하면","drill":[{"ko":"비가 오기라도 하면 소풍은 취소될 거예요.","en":"If it should rain, the picnic will be cancelled."},{"ko":"아이가 다치기라도 하면 어떡해요?","en":"What if the child gets hurt?"},{"ko":"늦기라도 하면 선생님께 혼날 거야.","en":"If you're late, you'll get told off by the teacher."},{"ko":"그 사실을 부모님이 알기라도 하면 큰일 난다.","en":"If my parents ever find out, I'm in big trouble."},{"ko":"길을 잃기라도 하면 이 번호로 전화하세요.","en":"If you should get lost, call this number."},{"ko":"시험에 떨어지기라도 하면 어떻게 하지?","en":"What will I do if I fail the exam?"},{"ko":"감기에 걸리기라도 하면 여행을 못 가잖아.","en":"If you catch a cold, you won't be able to go on the trip."},{"ko":"휴대폰을 잃어버리기라도 하면 연락할 방법이 없다.","en":"If I lose my phone, there'll be no way to contact anyone."},{"ko":"약을 잘못 먹기라도 하면 위험할 수 있어요.","en":"If you take the wrong medicine, it could be dangerous."},{"ko":"사장님이 화를 내기라도 하면 나도 어쩔 수 없어.","en":"If the boss gets angry, there's nothing I can do either."},{"ko":"눈이 많이 오기라도 하면 길이 막힐 텐데.","en":"If it snows a lot, the roads will be jammed."},{"ko":"그 친구가 이 이야기를 듣기라도 하면 섭섭하게 생각할 거예요.","en":"If that friend ever hears this, they'll feel hurt."},{"ko":"배가 아프기라도 하면 바로 말해.","en":"If your stomach starts to hurt, tell me straight away."},{"ko":"물건이 깨지기라도 하면 변상해야 해요.","en":"If anything gets broken, you have to pay for it."}]},{"id":"g3-3","ch":3,"part":"읽기 2","title":"어찌나 A/V-던지","form":"어찌나 + 형용사/동사 + 던지","pattern":"어찌나 A-던지 …  (= 아주 A-았/었다)","rule":"자신이 경험한 사실을 회상하며 정도가 아주 심했다고 말할 때.","meaning":"“it was so … (that)”. Remembering something you experienced that was very much so.","use":"어찌나 + stem + 던지. When the subject is 내가 and the verb is an action, use -았/었던지.","examples":[{"ko":"오늘 친구 집에 가서 고양이를 봤다. 어찌나 귀엽던지…!","en":"I saw my friend's cat today. It was so cute…!"}],"notes":[{"kind":"주의","ko":"내가 + (동사): -던지 × → -았/었던지 (내가 삼겹살을 어찌나 급하게 먹었던지)","en":"With 내가 + an action verb, use -았/었던지, not -던지."}],"practice":[{"q":"처음 인천공항에서 나왔을 때 날씨가 아주 추웠다 →","a":"처음 인천공항에서 나왔을 때 날씨가 어찌나 춥던지…","en":"When I first came out of Incheon Airport, it was so cold…"},{"q":"그 영화가 아주 지루했다 →","a":"그 영화가 어찌나 지루하던지…","en":"That film was so boring…"},{"q":"밀린 숙제를 끝내고 나니까 아주 후련했다 →","a":"밀린 숙제를 끝내고 나니까 어찌나 후련하던지…","en":"After finishing all my overdue homework, I felt so relieved…"},{"q":"결혼식 날 어머니가 아주 많이 우셨다 →","a":"결혼식 날 어머니가 어찌나 많이 우시던지…","en":"On the wedding day, my mother cried so much…"},{"q":"내가 삼겹살을 아주 급하게 먹었다 →","a":"내가 삼겹살을 어찌나 급하게 먹었던지…","en":"I ate the pork belly so fast…"}],"hl":"어찌나|던지","hlShow":"어찌나|던지","drill":[{"ko":"어찌나 피곤하던지 집에 오자마자 잠들었다.","en":"I was so tired that I fell asleep as soon as I got home."},{"ko":"영화가 어찌나 슬프던지 계속 울었어요.","en":"The film was so sad that I cried the whole time."},{"ko":"날씨가 어찌나 덥던지 밖에 나갈 수가 없었다.","en":"It was so hot that I couldn't go outside."},{"ko":"그 식당 음식이 어찌나 맛있던지 두 그릇이나 먹었다.","en":"The food at that restaurant was so good that I had two bowls."},{"ko":"사람이 어찌나 많던지 들어갈 수도 없었어요.","en":"There were so many people that we couldn't even get in."},{"ko":"그 아이가 어찌나 귀엽던지 눈을 뗄 수가 없었다.","en":"The child was so cute that I couldn't take my eyes off them."},{"ko":"시험이 어찌나 어렵던지 반도 못 풀었다.","en":"The exam was so hard that I couldn't even answer half of it."},{"ko":"음악 소리가 어찌나 크던지 옆 사람 말이 안 들렸다.","en":"The music was so loud that I couldn't hear the person next to me."},{"ko":"어찌나 배가 고프던지 허겁지겁 먹었다.","en":"I was so hungry that I wolfed it down."},{"ko":"그 이야기가 어찌나 웃기던지 배가 아플 정도였다.","en":"The story was so funny that my stomach hurt from laughing."},{"ko":"길이 어찌나 막히던지 두 시간이나 걸렸어요.","en":"The traffic was so bad that it took two whole hours."},{"ko":"친구가 어찌나 말을 빨리 하던지 하나도 못 알아들었다.","en":"My friend talked so fast that I didn't understand a word."},{"ko":"그날 바람이 어찌나 세게 불던지 우산이 뒤집혔다.","en":"The wind blew so hard that day that my umbrella turned inside out."},{"ko":"발표를 앞두고 어찌나 떨리던지 손에 땀이 났다.","en":"I was so nervous before the presentation that my hands were sweating."}]},{"id":"g4-1","ch":4,"part":"읽기 2","title":"V-느니 (차라리)","form":"동사 + 느니 (차라리)","pattern":"A를 하느니 차라리 B를 하겠다 / 하는 게 낫다","rule":"둘 다 싫지만 A가 더 싫을 때. (= 하는 것보다)","meaning":"“I'd rather B than A”. Both are bad, but A is worse.","use":"Verb stem + 느니, usually with 차라리 and -겠다 / -는 게 낫다.","examples":[{"ko":"하기 싫은 일을 하느니 차라리 일을 그만두는 게 낫겠다.","en":"I'd rather quit than do work I hate."}],"notes":[],"practice":[{"q":"나는 사람들 앞에서 발표할 때 너무 긴장돼. (발표하다, 쓰기 숙제를 3개 하다)","a":"사람들 앞에서 발표하느니 차라리 쓰기 숙제를 3개 하겠다.","en":"Rather than present in front of people, I'd sooner do three writing assignments."},{"q":"나는 사람이 많은 곳을 너무 싫어해서 (주말에 백화점에서 쇼핑하다, 도서관에서 공부하다)","a":"주말에 백화점에서 쇼핑하느니 차라리 도서관에서 공부하겠다.","en":"Rather than shop at a department store at the weekend, I'd sooner study at the library."},{"q":"A: 청소할래? 설거지할래? B: ______","a":"청소하느니 차라리 설거지할게.","en":"Rather than clean, I'll do the dishes."}],"hl":"느니|차라리","hlShow":"느니|차라리","drill":[{"ko":"이렇게 기다리느니 차라리 걸어가는 게 낫겠다.","en":"Rather than wait like this, I'd be better off walking."},{"ko":"억지로 먹느니 차라리 굶겠어요.","en":"Rather than force myself to eat, I'd sooner go hungry."},{"ko":"그 사람과 같이 일하느니 차라리 회사를 그만두겠다.","en":"Rather than work with that person, I'd sooner quit the company."},{"ko":"비싼 돈을 내고 사느니 차라리 빌리는 게 낫다.","en":"Rather than pay a lot to buy it, it's better to borrow it."},{"ko":"혼자 고민하느니 차라리 친구에게 물어보는 게 좋겠어.","en":"Rather than worry about it alone, you'd do better to ask a friend."},{"ko":"이렇게 복잡하게 사느니 차라리 시골로 이사 가고 싶다.","en":"Rather than live such a hectic life, I'd sooner move to the countryside."},{"ko":"택시를 타느니 차라리 지하철을 타는 게 빠르다.","en":"Rather than take a taxi, the subway is actually faster."},{"ko":"거짓말을 하느니 차라리 아무 말도 안 하겠다.","en":"Rather than lie, I'd sooner say nothing at all."},{"ko":"밤새 걱정하느니 차라리 지금 전화해 보자.","en":"Rather than worry all night, let's just call now."},{"ko":"그런 영화를 보느니 차라리 집에서 잠을 자겠다.","en":"Rather than watch a film like that, I'd sooner sleep at home."},{"ko":"대충 하느니 차라리 안 하는 게 낫다.","en":"Rather than do it half-heartedly, it's better not to do it at all."},{"ko":"줄을 서서 기다리느니 차라리 다른 식당에 가자.","en":"Rather than queue and wait, let's just go to another restaurant."},{"ko":"매일 싸우느니 차라리 헤어지는 게 낫겠어.","en":"Rather than fight every day, it would be better to break up."},{"ko":"남에게 부탁하느니 차라리 내가 직접 하겠다.","en":"Rather than ask someone else, I'd sooner do it myself."}]},{"id":"g4-2","ch":4,"part":"읽기 2","title":"V-을 겸 (해서)","form":"동사 + (으)ㄹ 겸 (해서)","pattern":"A도 하고 B도 할 겸 (해서) C  (= C하기 위해서)","rule":"두 가지의 목적이 있을 때.","meaning":"“partly to A and partly to B”. Doing C with two purposes at once.","use":"Verb stem + (으)ㄹ 겸; with two purposes: A-고 B-(으)ㄹ 겸 (해서).","examples":[{"ko":"한국어 공부도 할 겸 한국 영화 보는 게 어때요?","en":"How about watching a Korean film, which also counts as studying Korean?"},{"ko":"친척도 만나고 바다도 볼 겸 (해서) 부산에 왔다.","en":"I came to Busan to see my relatives and the sea."}],"notes":[],"practice":[{"q":"커피를 마시다 / 책을 읽다 → 카페에 가다","a":"커피도 마시고 책도 읽을 겸 카페에 갔다.","en":"I went to a café to have a coffee and read a book at the same time."},{"q":"영어를 배우다 / 여행을 하다 → 호주에 가다","a":"영어도 배우고 여행도 할 겸 호주에 갔다.","en":"I went to Australia both to learn English and to travel."},{"q":"____ / ____ → 아르바이트를 시작하다","a":"돈도 벌고 한국 친구도 사귈 겸 아르바이트를 시작했다.","en":"I started a part-time job both to earn money and to make Korean friends."}],"hl":"\\S+ 겸( \\(?해서\\)?)?","hlShow":"\\S+ 겸( \\(?해서\\)?)?","drill":[{"ko":"운동도 할 겸 해서 걸어서 출근해요.","en":"I walk to work, partly to get some exercise."},{"ko":"바람도 쐴 겸 공원에 산책하러 갔다.","en":"I went for a walk in the park, partly to get some fresh air."},{"ko":"친구도 만날 겸 쇼핑도 할 겸 명동에 갔다.","en":"I went to Myeongdong both to meet a friend and to do some shopping."},{"ko":"한국어도 배울 겸 한국 드라마를 자주 본다.","en":"I often watch Korean dramas, partly to learn Korean."},{"ko":"머리도 식힐 겸 잠깐 밖에 나갔다 오자.","en":"Let's pop outside for a bit, partly to clear our heads."},{"ko":"돈도 벌 겸 경험도 쌓을 겸 아르바이트를 시작했다.","en":"I started a part-time job both to earn money and to gain experience."},{"ko":"구경도 할 겸 시장에 가 봤어요.","en":"I went to the market, partly to look around."},{"ko":"점심도 먹을 겸 잠깐 쉬자.","en":"Let's take a short break and have lunch at the same time."},{"ko":"부모님도 뵐 겸 고향에 다녀왔다.","en":"I went back to my hometown, partly to see my parents."},{"ko":"기분 전환도 할 겸 머리를 잘랐어요.","en":"I had my hair cut, partly for a change of mood."},{"ko":"책도 빌릴 겸 해서 도서관에 들렀다.","en":"I stopped by the library, partly to borrow a book."},{"ko":"사진도 찍을 겸 한강에 갔어요.","en":"I went to the Han River, partly to take photos."},{"ko":"휴식도 취할 겸 제주도로 여행을 떠났다.","en":"I went on a trip to Jeju, partly to get some rest."},{"ko":"요리 연습도 할 겸 친구들을 집에 초대했다.","en":"I invited friends over, partly to practise my cooking."}]},{"id":"g4-3","ch":4,"part":"읽기 2","title":"V-으나 마나","form":"동사 + (으)나 마나","pattern":"V-(으)나 마나 …  /  V-(으)나 마나이다","rule":"① 보지 않아도 알 수 있다 (보나 마나 비쌀 거야)  ② 해도 소용없다 (쓰나 마나예요)","meaning":"① “no need to (look) — it's obvious”; ② “doing it makes no difference / is pointless”.","use":"Verb stem + (으)나 마나. Very common as 보나 마나 and -(으)나 마나예요.","examples":[{"ko":"앤디는 보나 마나 또 친구하고 만나서 놀고 있을 거야.","en":"Without even looking, Andy is obviously out with friends again."},{"ko":"새로운 스마트폰이 나왔다던데 보나 마나 비쌀 거야.","en":"A new smartphone came out — it's bound to be expensive."},{"ko":"이렇게 바람이 불고 비가 오는 날에는 우산은 쓰나 마나예요.","en":"On a windy, rainy day like this an umbrella is useless."}],"notes":[],"practice":[{"q":"엄마는 나한테 항상 방을 청소하라고 하시니까 엄마 얘기는 듣지 않아도 청소하라는 말일 거야. →","a":"엄마 얘기는 들으나 마나 청소하라고 하실 거야.","en":"No need to listen to Mum; she'll obviously tell me to clean."},{"q":"민수는 나가기만 하면 함흥차사야. ______","a":"기다리나 마나 오늘도 늦게 올 거야.","en":"There's no point waiting; he'll be late again today."},{"q":"약을 우유와 함께 먹으면 약 효과가 없어지니까 ______","a":"약을 우유와 함께 먹으면 먹으나 마나예요.","en":"If you take the medicine with milk, you might as well not take it."},{"q":"A: 미나가 춤을 잘 추니까 한번 말해 봐. B: 이미 안 하겠다고 대답했다면서? ______","a":"말하나 마나 절대로 안 할 거야.","en":"There's no point telling him; he'll never do it."}],"hl":"\\S+나 마나","hlShow":"\\S+나 마나","drill":[{"ko":"그 사람은 보나 마나 또 늦을 거야.","en":"No need to check; he'll obviously be late again."},{"ko":"물어보나 마나 대답은 뻔하다.","en":"There's no point asking; the answer is obvious."},{"ko":"이 약은 먹으나 마나 효과가 없어요.","en":"This medicine makes no difference whether you take it or not."},{"ko":"지금 가 보나 마나 문을 닫았을 거예요.","en":"No point going now; it'll surely be closed."},{"ko":"이렇게 작은 우산은 쓰나 마나예요.","en":"An umbrella this small is as good as useless."},{"ko":"그 영화는 보나 마나 재미없을 거야.","en":"No need to watch it; that film will obviously be boring."},{"ko":"그 애한테 말하나 마나 소용없어.","en":"There's no point telling that kid; it's useless."},{"ko":"이미 끝난 일이라 걱정하나 마나다.","en":"It's already over, so worrying makes no difference."},{"ko":"결과는 들으나 마나 우리 팀이 이겼을 거야.","en":"No need to hear the result; our team will surely have won."},{"ko":"청소를 하나 마나 금방 다시 더러워진다.","en":"Cleaning makes no difference; it just gets dirty again right away."},{"ko":"시험 공부를 하루 전에 하나 마나 결과는 같다.","en":"Studying the day before the exam makes no difference; the result is the same."},{"ko":"그렇게 설명하나 마나 아무도 이해하지 못할 거예요.","en":"Explaining it like that is pointless; nobody will understand."},{"ko":"이 정도 비는 우산을 쓰나 마나다.","en":"In rain like this, an umbrella makes no difference."},{"ko":"그 가게는 가 보나 마나 사람이 많을 거야.","en":"No need to go and look; that shop will obviously be packed."}]},{"id":"g5-1","ch":5,"part":"읽기 1","title":"‘ㅎ’ 불규칙 형용사","form":"ㅎ 받침 형용사 (파랗다, 하얗다 …)","pattern":"파랗다 → 파란, 파라니까, 파래요","rule":"ㅎ 받침 형용사 뒤에 -은, -(으)니까, -(으)면이 오면 ㅎ이 없어지고, -아/어요가 오면 ㅎ이 없어지고 모음이 ㅐ/ㅒ가 돼요.","meaning":"Colour and 이렇다-type adjectives ending in ㅎ drop the ㅎ before -은/-(으)니까/-(으)면, and with -아/어요 the vowel becomes ㅐ.","use":"파랗다: 파란 · 파라니까 · 파라네요(파랗네요) · 파라면 · 파래요. 하얗다 → 하얘요.","examples":[{"ko":"기분 좋은 말을 생각해 보자. 파랗다. 하얗다. 깨끗하다. 싱그럽다.","en":"Let's think of words that feel good: blue, white, clean, fresh."},{"ko":"저는 파란 하늘을 좋아해요.","en":"I like blue skies."}],"notes":[{"kind":"주의","ko":"‘놓다, 넣다, 낳다, 닿다, 쌓다, 좋다’ 같은 동사와 형용사는 ‘ㅎ’ 받침이 있어도 ‘ㅎ’이 없어지지 않아요. (여기에 놓아 주실 수 있으세요? 냉장고에 우유를 넣으면 될 것 같아요.)","en":"Regular words like 놓다, 넣다, 낳다, 닿다, 쌓다, 좋다 keep their ㅎ (놓아, 넣으면, 좋아요)."}],"table":{"head":["","-은","-(으)니까","-네요","-(으)면","-아/어요"],"rows":[["파랗다","파란","파라니까","파라네요 (파랗네요)","파라면","파래요"],["빨갛다","빨간","빨가니까","빨가네요 (빨갛네요)","빨가면","빨개요"],["하얗다","하얀","하야니까","하야네요 (하얗네요)","하야면","하얘요"],["까맣다","까만","까마니까","까마네요 (까맣네요)","까마면","까매요"],["노랗다","노란","노라니까","노라네요 (노랗네요)","노라면","노래요"],["이렇다","이런","이러니까","이러네요 (이렇네요)","이러면","이래요"],["그렇다","그런","그러니까","그러네요 (그렇네요)","그러면","그래요"],["저렇다","저런","저러니까","저러네요 (저렇네요)","저러면","저래요"],["어떻다","어떤","어떠니까","어떠네요 (어떻네요)","어떠면","어때요"]]},"practice":[],"hl":null,"hlShow":"파란|파랗다|하얗다","drill":[]},{"id":"g5-2","ch":5,"part":"읽기 2","title":"(A/V-기도 하고) A/V-기도 하다","form":"형용사/동사 + 기도 하다","pattern":"A-기도 하고 B-기도 하다  (= A할 때도 있고 B할 때도 있다)","rule":"여러 가지 일이나 상태가 때에 따라 있을 때.","meaning":"“sometimes A, sometimes B” / “both A and B”.","use":"Stem + 기도 하다; two things: A-기도 하고 B-기도 하다.","examples":[{"ko":"나는 내 마음대로 쓸 수 있는 돈이 오만 원쯤 생기기도 하는 생활을 사랑한다.","en":"I love a life in which I sometimes end up with about 50,000 won to spend as I like."},{"ko":"주말에 친구를 만나기도 하고 밀린 집안일을 하기도 한다.","en":"On weekends I sometimes meet friends and sometimes catch up on housework."}],"notes":[],"practice":[{"q":"데이트를 할 때 영화를 보다 / 드라이브를 하다","a":"데이트를 할 때 영화를 보기도 하고 드라이브를 하기도 한다.","en":"On dates we sometimes see a film and sometimes go for a drive."},{"q":"대학을 졸업할 때 기쁘다 / 아쉽다","a":"대학을 졸업할 때 기쁘기도 하고 아쉽기도 했다.","en":"When I graduated from university, I was both happy and a bit sad."},{"q":"사과는 맛있다 / 건강에 좋다 → 아침마다 꼭 먹으려고 한다","a":"사과는 맛있기도 하고 건강에 좋기도 해서 아침마다 꼭 먹으려고 한다.","en":"Apples are both tasty and healthy, so I try to eat one every morning."},{"q":"여행 갔을 때 이 물건을 보자마자 예쁘다 / 귀엽다 → 사게 됐어요","a":"여행 갔을 때 이 물건을 보자마자 예쁘기도 하고 귀엽기도 해서 사게 됐어요.","en":"When I was travelling, this was so pretty and cute that I bought it as soon as I saw it."}],"hl":"기도 (하|한|했)","hlShow":"기도 (하|한|했)","drill":[{"ko":"혼자 사는 것은 편하기도 하고 외롭기도 하다.","en":"Living alone is both comfortable and lonely."},{"ko":"졸업을 하니까 기쁘기도 하고 슬프기도 해요.","en":"Now that I'm graduating, I feel both happy and sad."},{"ko":"주말에는 책을 읽기도 하고 영화를 보기도 한다.","en":"At weekends I sometimes read and sometimes watch films."},{"ko":"그 소설은 슬프기도 하고 감동적이기도 하다.","en":"That novel is both sad and moving."},{"ko":"외국 생활은 재미있기도 하고 힘들기도 해요.","en":"Living abroad is both fun and hard."},{"ko":"그는 가끔 시를 쓰기도 한다.","en":"He sometimes writes poems too."},{"ko":"비가 오는 날에는 집에서 음악을 듣기도 하고 잠을 자기도 해요.","en":"On rainy days I sometimes listen to music at home and sometimes sleep."},{"ko":"시험이 끝나서 시원하기도 하고 섭섭하기도 하다.","en":"Now the exams are over, I feel both relieved and a little sad."},{"ko":"그 작가의 글은 어렵기도 하고 쉽기도 하다.","en":"That author's writing is both difficult and easy."},{"ko":"가끔은 혼자 여행을 가기도 한다.","en":"Sometimes I travel on my own too."},{"ko":"그 이야기를 듣고 화가 나기도 하고 웃기기도 했다.","en":"Hearing that story made me both angry and amused."},{"ko":"퇴근 후에는 운동을 하기도 하고 친구를 만나기도 한다.","en":"After work I sometimes exercise and sometimes meet friends."},{"ko":"이 시는 짧기도 하고 쉽기도 해서 외우기 좋다.","en":"This poem is both short and easy, so it's good for memorising."},{"ko":"첫 출근 날이라 설레기도 하고 걱정되기도 했다.","en":"It was my first day at work, so I was both excited and worried."}]},{"id":"g5-3","ch":5,"part":"읽기 2","title":"A-아/어하다","form":"형용사 + 아/어하다 → 동사","pattern":"형용사 → 동사: 기쁘다 → 기뻐하다","rule":"다른 사람의 감정이나 느낌을 말할 때 형용사를 동사로 바꿔요.","meaning":"Turns a feeling adjective into a verb, used to describe someone else's feelings (and it can take an object with 을/를).","use":"Adjective stem + 아/어하다: 슬프다 → 슬퍼하다, 무섭다 → 무서워하다, -고 싶다 → -고 싶어하다.","examples":[{"ko":"여러 사람을 좋아하며 아무도 미워하지 않으며 몇몇 사람을 끔찍이 사랑하며 살고 싶다.","en":"I want to live liking many people, hating no one, and loving a few people dearly."},{"ko":"그 소식을 듣고 나도 슬펐고, 내 친구도 슬퍼했다.","en":"Hearing the news, I was sad, and my friend was sad too."}],"notes":[],"table":{"head":["형용사","→ 동사"],"rows":[["기쁘다","기뻐하다"],["슬프다","슬퍼하다"],["즐겁다","즐거워하다"],["난처하다","난처해하다"],["서운하다","서운해하다"],["싫다","싫어하다"],["어렵다","어려워하다"],["예쁘다","예뻐하다"],["밉다","미워하다"],["귀엽다","귀여워하다"],["무섭다","무서워하다"],["궁금하다","궁금해하다"],["자랑스럽다","자랑스러워하다"],["-고 싶다","-고 싶어하다"]]},"practice":[{"q":"학생들 / 이 문법 / 어렵다 →","a":"학생들이 이 문법을 어려워한다.","en":"The students find this grammar difficult."},{"q":"동생 / 큰 개 / 무섭다 →","a":"동생이 큰 개를 무서워한다.","en":"My younger sibling is scared of big dogs."},{"q":"어머니 / 칠전팔기 끝에 시험에 합격한 아들 / 자랑스럽다 →","a":"어머니가 칠전팔기 끝에 시험에 합격한 아들을 자랑스러워한다.","en":"The mother is proud of her son, who passed the exam after never giving up."}],"hl":"\\S+(아|어|워|퍼|뻐|해)(하|한|했)","hlShow":"\\S+(아|어|워|퍼|뻐|해)(하|한|했)","drill":[{"ko":"아이들은 눈을 보고 무척 좋아했다.","en":"The children were thrilled to see the snow."},{"ko":"동생은 벌레를 무서워한다.","en":"My younger sibling is scared of bugs."},{"ko":"할머니는 손자를 보고 기뻐하셨다.","en":"Grandma was delighted to see her grandson."},{"ko":"그는 친구의 소식을 듣고 슬퍼했다.","en":"He was saddened to hear his friend's news."},{"ko":"민수는 사람들 앞에서 발표하는 것을 부끄러워한다.","en":"Minsu is embarrassed about presenting in front of people."},{"ko":"그 아이는 강아지를 귀여워한다.","en":"That child adores the puppy."},{"ko":"친구가 이사 간다는 소식에 모두 아쉬워했다.","en":"Everyone was sorry to hear that our friend was moving away."},{"ko":"형은 내가 오래 기다린 것을 미안해했다.","en":"My older brother felt bad that I'd waited so long."},{"ko":"학생들은 시험이 끝나서 즐거워했다.","en":"The students were happy that the exams were over."},{"ko":"아이는 주사를 맞는 것을 싫어한다.","en":"The child hates getting injections."},{"ko":"부모님은 내 합격 소식에 몹시 기뻐하셨다.","en":"My parents were overjoyed at the news that I'd passed."},{"ko":"그는 새 직장을 아주 만족해한다.","en":"He is very satisfied with his new job."},{"ko":"동생은 혼자 있는 것을 심심해한다.","en":"My younger sibling finds being alone boring."},{"ko":"사람들은 그 영화의 결말을 궁금해했다.","en":"People were curious about the film's ending."}]},{"id":"g5-4","ch":5,"part":"읽기 2","title":"N에다(가)","form":"명사 + 에다(가)","pattern":"N에다(가) + 놓다 / 두다 / 넣다 / 꽂다 / 붙이다 / 걸다 / 바르다 …","rule":"= 에다 / 에. 물건을 어떤 장소에 놓거나 더할 때.","meaning":"“(put/add something) onto / into N”. Stresses the place where something is put.","use":"Noun + 에다(가) with verbs of placing: 놓다, 두다, 넣다, 꽂다, 붙이다, 걸다, 바르다.","examples":[{"ko":"내 귀에다 귓속말하는 내 딸 서영이의 말소리를 좋아한다.","en":"I love the sound of my daughter Seoyoung whispering into my ear."},{"ko":"책은 책상 위에다가 놓아 주세요.","en":"Please put the book on the desk."},{"ko":"거기에다가 거울을 놓으면 어때요? / 여기다가 꽃을 꽂으면 예쁠 것 같아요. / 저기다 그림을 걸어 보세요.","en":"How about putting a mirror there? / Flowers here would look nice. / Try hanging the picture over there."}],"notes":[{"kind":"tip","ko":"장소를 나타내는 ‘거기, 여기, 저기’의 경우는 ‘에’를 빼고 ‘다가’, ‘다’를 사용해도 돼요. (거기에다가 → 거기다가 → 거기다)","en":"With 거기/여기/저기 you can drop 에: 거기다가, 거기다."},{"kind":"주의","ko":"‘있다/없다’, ‘가다/오다’의 앞에는 ‘-에’만 사용해야 해요. (방에 책상이 있다 ○ / 방에다 ×, 공원에 산책하러 간다 ○ / 공원에다 ×)","en":"With 있다/없다 and 가다/오다 only 에 is possible, never 에다(가)."}],"practice":[{"q":"지갑 / 가방 / 넣다 →","a":"지갑을 가방에다(가) 넣었다.","en":"I put my wallet in my bag."},{"q":"상처 / 약 / 바르다 →","a":"상처에다(가) 약을 발랐다.","en":"I put ointment on the wound."},{"q":"안내문 / 벽 / 붙이다 →","a":"안내문을 벽에다(가) 붙였다.","en":"I stuck the notice on the wall."}],"hl":"에다가?|(?<=기)다가?","hlShow":"에다가?|(?<=기)다가?","drill":[{"ko":"책을 책상 위에다가 놓아 두었어요.","en":"I left the book on the desk."},{"ko":"커피에다 설탕을 두 스푼 넣었다.","en":"I put two spoons of sugar in my coffee."},{"ko":"메모지에다가 전화번호를 적어 주세요.","en":"Please write your phone number on the sticky note."},{"ko":"밥에다 김치를 얹어서 먹으면 맛있다.","en":"Rice is delicious with kimchi on top."},{"ko":"벽에다가 가족사진을 걸었다.","en":"I hung a family photo on the wall."},{"ko":"가방에다 물병을 넣고 출발했다.","en":"I put a water bottle in my bag and set off."},{"ko":"공책에다가 새로운 단어를 정리했다.","en":"I organised the new words in my notebook."},{"ko":"라면에다 계란을 넣어서 끓였어요.","en":"I cooked the ramyeon with an egg in it."},{"ko":"쓰레기는 여기에다가 버리세요.","en":"Please throw your rubbish in here."},{"ko":"월급에다가 보너스까지 받아서 기분이 좋다.","en":"I got a bonus on top of my salary, so I'm in a good mood."},{"ko":"우유에다 꿀을 타서 마셨다.","en":"I stirred honey into my milk and drank it."},{"ko":"편지 봉투에다가 주소를 크게 썼다.","en":"I wrote the address in big letters on the envelope."},{"ko":"그는 주머니에다 손을 넣고 걸었다.","en":"He walked with his hands in his pockets."},{"ko":"냉장고 문에다가 메모를 붙여 놓았다.","en":"I stuck a note on the fridge door."}]},{"id":"g6-1","ch":6,"part":"읽기 1","title":"A/V-은/는가","form":"형용사 + 은가 / 동사 + 는가 / 명사 + 인가","pattern":"… -는가에 대한 글  (= 하는지)","rule":"격식적인 상황, 글에서 쓰는 질문 형태. ‘-는지’와 같아요.","meaning":"A formal, written question form, like -는지 (“whether / how / why …”).","use":"Present: adjective -은가, verb -는가, 이다 → 인가. Past: -았/었는가. Future: -을 것인가.","examples":[{"ko":"내가 하는 말이 두 사람의 관계에 얼마나 도움이 될 것인가를 먼저 생각해야 한다.","en":"You should first think about how much what you say will help the relationship between the two of you."},{"ko":"한국 사람들이 왜 칭찬을 많이 하는가에 대한 글을 읽었다.","en":"I read an article about why Koreans give so many compliments."},{"ko":"한국 사회의 교육 문제를 어떻게 해결할 수 있는가? / 앞으로 환경을 보호하기 위해 무엇을 할 것인가?","en":"How can Korean society solve its education problems? / What will we do to protect the environment?"}],"notes":[{"kind":"tip","ko":"‘-은/는가’의 다른 의미: 일반적인 문제를 신문이나 책에서 글에서 질문하는 것처럼 쓸 때도 사용할 수 있어요.","en":"It is also used on its own to ask a general question in newspapers, books and essays."}],"table":{"head":["","형용사","동사","-이다"],"rows":[["현재","-은가","-는가","-인가"],["과거","-았/었는가","-았/었는가","-이었는가 / -였는가"],["미래","-을 것인가","-을 것인가","-일 것인가"]]},"practice":[{"q":"한국의 장례식이 왜 떠들썩합니까? + 연구하고자 합니다.","a":"한국의 장례식이 왜 떠들썩한가에 대해 연구하고자 합니다.","en":"I would like to research why Korean funerals are so lively."},{"q":"프로젝트를 성공적으로 끝냈습니까? + 관심을 갖고 있습니다.","a":"프로젝트를 어떻게 성공적으로 끝냈는가에 관심을 갖고 있습니다.","en":"I am interested in how the project was completed successfully."},{"q":"정부가 취업 문제를 어떻게 생각합니까? + 궁금합니다.","a":"정부가 취업 문제를 어떻게 생각하는가가 궁금합니다.","en":"I wonder how the government thinks about the employment problem."}],"hl":"것인가|[은는인한]가(?=[를가에?])","hlShow":"것인가|[은는인한]가(?=[를가에?])","drill":[{"ko":"행복이란 무엇인가?","en":"What is happiness?"},{"ko":"성공이란 과연 무엇인가?","en":"What, really, is success?"},{"ko":"중요한 것은 얼마나 많이 아는가가 아니라 어떻게 쓰는가이다.","en":"What matters is not how much you know but how you use it."},{"ko":"대화의 결과는 상대방의 말을 얼마나 잘 듣는가에 달려 있다.","en":"How a conversation turns out depends on how well you listen to the other person."},{"ko":"우리는 어떻게 살 것인가?","en":"How are we to live?"},{"ko":"사람들은 왜 그렇게 바쁘게 사는가?","en":"Why do people live such busy lives?"},{"ko":"좋은 대화란 어떤 것인가?","en":"What makes a good conversation?"},{"ko":"그가 왜 그런 말을 했는가를 먼저 생각해 보자.","en":"Let's first think about why he said that."},{"ko":"중요한 것은 누가 먼저 사과하는가가 아니다.","en":"What matters is not who apologises first."},{"ko":"이 글은 한국인이 왜 돌려서 말하는가에 대해 설명한다.","en":"This text explains why Koreans speak indirectly."},{"ko":"진정한 친구란 누구인가?","en":"Who is a true friend?"},{"ko":"말을 잘한다는 것은 무엇을 의미하는가?","en":"What does it mean to speak well?"},{"ko":"대화에서 가장 중요한 것은 무엇인가?","en":"What is the most important thing in a conversation?"},{"ko":"상대방이 무엇을 원하는가를 먼저 파악해야 한다.","en":"You first need to understand what the other person wants."},{"ko":"우리는 이 문제를 어떻게 해결할 것인가?","en":"How are we going to solve this problem?"},{"ko":"그 사람의 말이 사실인가를 확인해 봐야 한다.","en":"We need to check whether what that person says is true."},{"ko":"얼마나 오래 사는가보다 어떻게 사는가가 더 중요하다.","en":"How you live matters more than how long you live."},{"ko":"인생에서 정말 소중한 것은 무엇인가?","en":"What is truly precious in life?"},{"ko":"왜 사람들은 직접적으로 거절하지 못하는가?","en":"Why can't people say no directly?"},{"ko":"좋은 리더는 어떤 사람인가?","en":"What kind of person is a good leader?"}]},{"id":"g6-2","ch":6,"part":"읽기 1","title":"V-는 김에","form":"동사 + 는 김에 (과거: -은 김에)","pattern":"A하는 김에 B도 하다","rule":"A를 하면서 그 기회에 B를 하다. (A가 주 목적)","meaning":"“while (you're) doing A anyway, also do B”. A is the main purpose; B takes the opportunity.","use":"Verb stem + 는 김에; if A is already done: -(으)ㄴ 김에 (출장 간 김에).","examples":[{"ko":"칭찬하는 김에 이왕이면 미소도 한번 지어 주는 것은 어떨까?","en":"While you're complimenting someone, why not add a smile too?"}],"notes":[],"practice":[{"q":"등산 신발을 사다 / 등산 양말을 사다 →","a":"등산 신발을 사는 김에 등산 양말도 샀다.","en":"While I was buying hiking shoes, I bought hiking socks too."},{"q":"도서관에 가다 / 지난주에 빌렸던 책을 반납하다 →","a":"도서관에 가는 김에 지난주에 빌렸던 책도 반납했다.","en":"Since I was going to the library anyway, I returned the book I borrowed last week."},{"q":"이사를 하다 / 가구를 바꾸다 →","a":"이사를 하는 김에 가구도 바꿨다.","en":"Since I was moving anyway, I changed the furniture too."},{"q":"A: 이게 뭐야? 나 주는 거야? B: 별 거 아니야. ______ 네 것도 하나 샀어. (내 커피를 사다)","a":"내 커피를 사는 김에 네 것도 하나 샀어.","en":"While I was buying my coffee, I got one for you too."},{"q":"A: 나 다음 주에 일본에 출장가게 됐어. B: 정말? 그럼 ______ ○○ 좀 사다 줄 수 있어? (출장 가다)","a":"그럼 출장 가는 김에 ○○ 좀 사다 줄 수 있어?","en":"Then, since you're going on a business trip anyway, could you buy me some ○○?"},{"q":"A: 여보세요. 나 오사카에 잘 도착했어. B: 그래? 그럼 일 잘하고 ______ 오사카 구경도 하고 와. (출장 가다)","a":"그럼 일 잘하고 출장 간 김에 오사카 구경도 하고 와.","en":"Then do good work, and since you're there on business, see Osaka too."}],"hl":"(는|은|간) 김에","hlShow":"(는|은|간) 김에","drill":[{"ko":"시장에 가는 김에 우유 좀 사다 줄래?","en":"Since you're going to the market anyway, could you pick up some milk?"},{"ko":"청소하는 김에 창문도 닦았어요.","en":"While I was cleaning, I wiped the windows too."},{"ko":"서울에 간 김에 오랜 친구도 만났어요.","en":"While I was in Seoul, I also met an old friend."},{"ko":"밖에 나가는 김에 쓰레기 좀 버려 줘.","en":"Since you're going out anyway, take the rubbish out, please."},{"ko":"편의점에 가는 김에 내 것도 사 와.","en":"Since you're going to the convenience store anyway, get me one too."},{"ko":"부산에 출장 간 김에 바다도 보고 왔다.","en":"While I was in Busan on business, I went to see the sea too."},{"ko":"빨래하는 김에 이불도 빨았다.","en":"While I was doing the laundry, I washed the duvet too."},{"ko":"요리하는 김에 내일 도시락도 만들었다.","en":"While I was cooking, I made tomorrow's lunch box too."},{"ko":"머리를 자르는 김에 염색도 했어요.","en":"While I was getting my hair cut, I had it dyed as well."},{"ko":"은행에 들르는 김에 환전도 했다.","en":"Since I was stopping by the bank anyway, I changed some money too."},{"ko":"이사하는 김에 가구를 새로 샀다.","en":"Since I was moving anyway, I bought new furniture."},{"ko":"컴퓨터를 고치는 김에 프로그램도 새로 깔았다.","en":"While I was fixing the computer, I reinstalled the software too."},{"ko":"설거지하는 김에 냉장고 정리도 했어요.","en":"While I was doing the dishes, I tidied the fridge too."},{"ko":"운동하는 김에 한강까지 뛰어갔다 왔다.","en":"While I was exercising, I ran all the way to the Han River and back."},{"ko":"우체국에 가는 김에 이 편지도 부쳐 주세요.","en":"Since you're going to the post office anyway, please post this letter too."},{"ko":"부모님 댁에 간 김에 하룻밤 자고 왔다.","en":"While I was at my parents' place, I stayed the night."},{"ko":"휴가를 받은 김에 여행을 다녀왔다.","en":"Since I had some time off, I went on a trip."},{"ko":"마트에 가는 김에 세제도 좀 사 와.","en":"Since you're going to the supermarket anyway, get some detergent too."},{"ko":"사진을 정리하는 김에 앨범도 만들었다.","en":"While I was sorting my photos, I made an album too."},{"ko":"손을 씻은 김에 세수까지 했다.","en":"Since I'd washed my hands anyway, I washed my face too."}]},{"id":"g7-1","ch":7,"part":"읽기 2","title":"누가/언제/무엇/어떻게/어디 V-든(지)","form":"의문사 … 동사/명사 + 든(지)","pattern":"무슨 일을 하든지 …  (= 해도, 상관없이)","rule":"무엇이든, 언제든 상관없이 같은 결과일 때.","meaning":"“no matter who/when/what/how/where …”. It makes no difference.","use":"Question word + verb stem + 든(지), or noun + (이)든(지): 언제든지, 어디에서든.","examples":[{"ko":"어느 분야에서든 두각을 나타냈던 사람들은 대부분 독서광이었다.","en":"People who stood out, in whatever field, were mostly avid readers."},{"ko":"그 사람은 무슨 일을 하든지 열심히 한다.","en":"Whatever that person does, they work hard at it."}],"notes":[],"practice":[{"q":"언제 / 시작할 수 있다 →","a":"언제든지 시작할 수 있다.","en":"You can start at any time."},{"q":"무슨 내용 / 한번 읽으면 다 이해하다 →","a":"무슨 내용이든지 한번 읽으면 다 이해한다.","en":"Whatever the content, I understand it all once I read it."},{"q":"어떤 상황에서 / 최선을 다해야 하다 →","a":"어떤 상황에서든지 최선을 다해야 한다.","en":"Whatever the situation, you have to do your best."},{"q":"무엇(을 먹다) / 다 좋다 →","a":"무엇을 먹든지 다 좋다.","en":"Whatever we eat, it's all fine."},{"q":"누구를 만나서 이야기를 하다 / 조심해야 하다 →","a":"누구를 만나서 이야기를 하든지 조심해야 한다.","en":"Whoever you meet and talk to, you have to be careful."}],"hl":"이?든지?(?=[ .])","hlShow":"이?든지?(?=[ .])","drill":[{"ko":"무엇을 하든지 최선을 다해야 한다.","en":"Whatever you do, you should do your best."},{"ko":"어디에 가든지 연락은 꼭 해라.","en":"Wherever you go, make sure you stay in touch."},{"ko":"누가 뭐라고 하든지 신경 쓰지 마.","en":"Whatever anyone says, don't let it bother you."},{"ko":"언제 오든지 환영이에요.","en":"You're welcome whenever you come."},{"ko":"어떻게 하든지 오늘까지 끝내야 해요.","en":"However you do it, it has to be finished by today."},{"ko":"무엇을 먹든지 천천히 꼭꼭 씹어 먹어라.","en":"Whatever you eat, chew it slowly and well."},{"ko":"누구를 만나든지 예의를 지켜야 한다.","en":"Whoever you meet, you should be polite."},{"ko":"어떤 일을 하든지 즐겁게 하는 사람이 성공한다.","en":"Whatever the job, people who enjoy their work succeed."},{"ko":"어디에 살든지 건강하게만 지내렴.","en":"Wherever you live, just stay healthy."},{"ko":"무슨 일이 있든지 포기하지 마세요.","en":"Whatever happens, don't give up."},{"ko":"누가 이기든 결과를 받아들여야 한다.","en":"Whoever wins, we have to accept the result."},{"ko":"언제 전화하든지 친절하게 받아 주었다.","en":"Whenever I called, they answered kindly."},{"ko":"어떻게 말하든지 그는 믿지 않을 것이다.","en":"However you put it, he won't believe it."},{"ko":"무엇을 입든지 너한테는 다 잘 어울려.","en":"Whatever you wear, it all suits you."},{"ko":"어디를 여행하든지 그 나라의 문화를 존중해야 한다.","en":"Wherever you travel, you should respect that country's culture."},{"ko":"누가 오든지 문을 열어 주지 마세요.","en":"Whoever comes, don't open the door."},{"ko":"무엇을 선택하든지 후회하지 않았으면 좋겠다.","en":"Whatever you choose, I hope you won't regret it."},{"ko":"어떤 어려움이 있든지 꿈을 포기하지 않겠다.","en":"Whatever difficulties there are, I won't give up on my dream."},{"ko":"언제 시작하든지 늦은 때는 없다.","en":"Whenever you start, it's never too late."},{"ko":"어디서 일하든지 성실한 사람은 인정받는다.","en":"Wherever they work, hard-working people get recognised."}]},{"id":"g7-2","ch":7,"part":"읽기 2","title":"V-아/어다(가)","form":"동사 + 아/어다(가)","pattern":"A-아/어다(가) B  (= A한 뒤 그것을 가지고 다른 곳에서 B)","rule":"한 곳에서 한 일의 결과를 가지고 다른 곳으로 가서 다음 일을 할 때.","meaning":"Do A in one place, then take the result somewhere else and do B with it (“… and bring/take it to …”).","use":"Verb stem + 아/어다(가). The object of A is carried into B (복사해다가 나누어 주었다).","examples":[{"ko":"진정으로 성공하는 사람들은 이웃과 나누는 삶이 큰 기쁨과 보람을 가져다 준다는 것을 알고 있다.","en":"Truly successful people know that a life of sharing with neighbours brings great joy and fulfilment."},{"ko":"회의에 필요한 서류를 복사해다가 회의실에 있는 직원들에게 나누어 주었다.","en":"I copied the documents for the meeting and handed them out to the staff in the meeting room."}],"notes":[],"practice":[{"q":"백화점에서 음식을 사다 / (집에서) 먹다 →","a":"백화점에서 음식을 사다가 집에서 먹었다.","en":"I bought food at the department store and ate it at home."},{"q":"도서관에서 책을 빌리다 / (카페에서) 읽다 →","a":"도서관에서 책을 빌려다가 카페에서 읽었다.","en":"I borrowed a book from the library and read it at a café."},{"q":"여행지에서 사진을 찍다 / 인터넷에 올리다 →","a":"여행지에서 사진을 찍어다가 인터넷에 올렸다.","en":"I took photos on my trip and posted them online."}],"hl":"(아|어|해|려|사|져)다가?(?= )","hlShow":"(아|어|해|려|사|져)다가?(?= )","drill":[{"ko":"도서관에서 책을 빌려다가 집에서 읽었다.","en":"I borrowed a book from the library and read it at home."},{"ko":"시장에서 과일을 사다가 부모님께 드렸다.","en":"I bought fruit at the market and gave it to my parents."},{"ko":"부엌에서 물 좀 가져다가 줄래?","en":"Could you bring me some water from the kitchen?"},{"ko":"강에서 물고기를 잡아다가 구워 먹었다.","en":"We caught fish in the river and grilled them."},{"ko":"친구에게 돈을 빌려다가 등록금을 냈다.","en":"I borrowed money from a friend and paid my tuition with it."},{"ko":"빵을 사다가 아침으로 먹었어요.","en":"I bought some bread and had it for breakfast."},{"ko":"창고에서 의자를 가져다가 거실에 놓았다.","en":"I brought a chair from the storeroom and put it in the living room."},{"ko":"편의점에서 도시락을 사다 먹었다.","en":"I bought a lunch box at the convenience store and ate it."},{"ko":"엄마가 김치를 만들어다가 보내 주셨다.","en":"Mum made kimchi and sent it to me."},{"ko":"산에서 꽃을 꺾어다가 꽃병에 꽂았다.","en":"I picked flowers on the mountain and put them in a vase."},{"ko":"우체국에서 소포를 찾아다가 집에 가져왔다.","en":"I picked up the parcel at the post office and brought it home."},{"ko":"커피를 사다가 동료들에게 나눠 주었다.","en":"I bought coffee and shared it with my colleagues."},{"ko":"밭에서 채소를 뽑아다가 반찬을 만들었다.","en":"I pulled vegetables from the field and made side dishes with them."},{"ko":"반찬을 해다가 혼자 사는 아들에게 갖다주었다.","en":"I made side dishes and took them to my son, who lives alone."},{"ko":"인터넷에서 자료를 찾아다가 보고서를 썼다.","en":"I found material online and wrote the report with it."},{"ko":"옆집에서 사다리를 빌려다가 전구를 갈았다.","en":"I borrowed a ladder from next door and changed the light bulb."},{"ko":"떡을 사다가 이웃들과 나눠 먹었다.","en":"I bought rice cakes and shared them with the neighbours."},{"ko":"약국에서 감기약을 사다가 동생에게 주었다.","en":"I bought cold medicine at the pharmacy and gave it to my younger sibling."},{"ko":"은행에서 돈을 찾아다가 월세를 냈다.","en":"I withdrew money at the bank and paid the rent with it."},{"ko":"도서관에서 잡지를 빌려다가 동생에게 보여 주었다.","en":"I borrowed a magazine from the library and showed it to my younger sibling."}]}]};
const TR = {"zh":{"g1-1":{"meaning":"“别说A了，连B都……”。A是较大、较难的事；连更小、更基本的B都没有做到。","use":"接在名词后面。后半句一定带 도，而且一定是否定（못/안/없다）。","ex":["别说跳舞了，他连路都再也走不了了。","早上起得太晚，别说化妆了，连脸都没洗。","嗓子太疼了，别说吃饭了，连粥都喝不下。"],"notes":["句子一定以否定结尾（못、안、없다）。"]},"g1-2":{"meaning":"同样表示“别说……了 / 非但不……”，但接在形容词或动词后面。","use":"词干 + 기는커녕。常用来回答问题，表示“哪里是那样，恰恰相反”。","ex":["A：金部长上个月升职了，请客了吗？B：唉，别说请客了，连一杯咖啡都没请。","他非但没道歉，反而大发脾气。","非但没受到表扬，反而光挨骂了。"],"notes":["与（오히려）+ 动作连用时，表示发生了与预期相反的结果。"]},"g1-3":{"meaning":"“不太…… / 没那么……”。语气较委婉的否定，相当于 별로 -지 않다，主要用于书面语。","use":"主要与形容词连用。与动词连用时需要加 많이、잘 等副词。","ex":["放弃安稳的医生之路并不那么容易。","西江大学离这里不太远。","那个人吃得不太多。"],"notes":["一般与形容词连用；与动词连用时要加副词：그리 많이 먹지 않는다、그리 잘 마시는 편이 아니다。"]},"g1-4":{"meaning":"“除了A以外，还有B”。A有，B也有。","use":"接在名词后面，后面接同样存在或发生的事情。口语中常用。","ex":["医学院里除了我，还有很多其他人。"],"notes":[]},"g1-5":{"meaning":"“除了A以外，没有B”。只有A。","use":"接在名词后面，后面接否定（없다、안/못）。口语中常用。","ex":["这件事除了我，没有人能做。"],"notes":[]},"g1-6":{"meaning":"“A取决于B如何/是否……”。由B决定A。","use":"形容词词干 + 냐에，动词词干 + 느냐에。通常与 얼마나、어떻게 等疑问词一起使用。","ex":["这部电影的成功取决于故事能传达得多好。","这次工作的成功取决于大家有多努力。"],"notes":["与 얼마나、어떻게 等疑问词一起使用。"]},"g1-7":{"meaning":"“A取决于B / 由B决定”。","use":"接在名词后面；如果是人，用 에게。","ex":["做不做那件事，取决于你自己。"],"notes":[]},"g2-1":{"meaning":"“我打算 / 我想要……”，是 -(으)려고 하다 的正式说法。","use":"动词词干 + 고자 하다。用于发表、辩论、会议以及正式的书面语。","ex":["下面我想就“拥有600年历史的北村韩屋村”进行发表。","下面我想介绍一下韩国的文化。"],"notes":[]},"g2-2":{"meaning":"“而 / 与此相反”，对两个事实进行正式的对比。","use":"形容词 + 은 반면에，动词 + 는 반면에（过去：-았/었는 반면에）。","ex":["南山韩屋村的韩屋只是用来展示，而北村韩屋村里则真的有人居住。","哥哥性格文静，而弟弟非常活泼。"],"notes":[]},"g2-3":{"meaning":"“以A为首 / 包括A在内”。A是一个更大群体中具有代表性的例子。","use":"接在名词后面；句子的其余部分说的是整个群体。","ex":["佛教美术博物馆展出了以朝鲜时代佛像为首的约500件佛教美术作品。","去韩国的时候，我游览了以首尔为首的好几个城市。"],"notes":[]},"g3-1":{"meaning":"“最终还是……了 / 结果……了”，带有后悔、失望或忍不住的语气。","use":"动词词干 + 고 말다，几乎总是用过去时：-고 말았다。","ex":["我不想让人看出我的难过，结果还是发了脾气。","我正在减肥，结果还是吃掉了一整个披萨。"],"notes":[]},"g3-2":{"meaning":"“万一……可怎么办”。担心可能会发生不好的事情。","use":"词干 + 기라도 하면，后面接担心的表达：어떡해?、어떡하나 걱정이다、두렵다。","ex":["我担心他们万一吵起来可怎么办。","嘘！小声点。万一被别人听到我们说的话怎么办？"],"notes":[]},"g3-3":{"meaning":"“那个……啊 / ……得不得了”。回忆自己亲身经历过、程度非常强烈的事情。","use":"어찌나 + 词干 + 던지。主语是 내가 且谓语是动作动词时，用 -았/었던지。","ex":["今天去朋友家看到了猫。那叫一个可爱……！"],"notes":["내가 + 动作动词时，要用 -았/었던지，而不是 -던지。"]},"g4-1":{"meaning":"“与其A，还不如B”。两个都不好，但A更糟。","use":"动词词干 + 느니，通常与 차라리 以及 -겠다 / -는 게 낫다 一起使用。","ex":["与其做自己讨厌的工作，还不如辞职。"],"notes":[]},"g4-2":{"meaning":"“既为了A，也为了B”。做C时同时有两个目的。","use":"动词词干 + (으)ㄹ 겸；有两个目的时：A-고 B-(으)ㄹ 겸 (해서)。","ex":["看韩国电影怎么样？顺便也能学学韩语。","我来釜山，一来看望亲戚，二来看看大海。"],"notes":[]},"g4-3":{"meaning":"①“不用（看）也知道，明摆着的”；②“做了也没用 / 做不做都一样”。","use":"动词词干 + (으)나 마나。常用形式为 보나 마나 和 -(으)나 마나예요。","ex":["不用看也知道，安迪肯定又和朋友出去玩了。","听说新的智能手机出来了，不用看也知道肯定很贵。","像这样又刮风又下雨的日子，打伞也没用。"],"notes":[]},"g5-1":{"meaning":"以 ㅎ 收音的颜色形容词和 이렇다 类形容词，在 -은/-(으)니까/-(으)면 前面 ㅎ 脱落；接 -아/어요 时元音变为 ㅐ。","use":"파랗다：파란 · 파라니까 · 파라네요（파랗네요）· 파라면 · 파래요。하얗다 → 하얘요。","ex":["来想一想让人心情愉快的词吧：蓝色的、白色的、干净的、清新的。","我喜欢蓝蓝的天空。"],"notes":["놓다、넣다、낳다、닿다、쌓다、좋다 等规则词保留 ㅎ（놓아、넣으면、좋아요）。"]},"g5-2":{"meaning":"“有时A，有时B” / “既A又B”。","use":"词干 + 기도 하다；说两件事时：A-기도 하고 B-기도 하다。","ex":["我热爱这样的生活：偶尔会有大约五万韩元可以随心所欲地花。","周末我有时和朋友见面，有时把积攒下来的家务活做完。"],"notes":[]},"g5-3":{"meaning":"把表示感情的形容词变成动词，用来描述别人的感受（并且可以用 을/를 带宾语）。","use":"形容词词干 + 아/어하다：슬프다 → 슬퍼하다，무섭다 → 무서워하다，-고 싶다 → -고 싶어하다。","ex":["我想这样生活：喜欢很多人，不憎恨任何人，深深地爱着几个人。","听到那个消息，我很难过，我的朋友也很难过。"],"notes":[]},"g5-4":{"meaning":"“把（东西）放到/加到N上/里”。强调东西被放置的地点。","use":"名词 + 에다(가)，与表示放置的动词连用：놓다、두다、넣다、꽂다、붙이다、걸다、바르다。","ex":["我喜欢女儿瑞英贴在我耳边说悄悄话的声音。","请把书放在书桌上。","在那里放一面镜子怎么样？/ 在这里插上花应该会很好看。/ 把画挂到那边试试吧。"],"notes":["与 거기/여기/저기 连用时可以省略 에：거기다가、거기다。","与 있다/없다 和 가다/오다 连用时只能用 에，不能用 에다(가)。"]},"g6-1":{"meaning":"正式的书面疑问形式，相当于 -는지（“是否 / 如何 / 为什么……”）。","use":"现在：形容词 -은가，动词 -는가，이다 → 인가。过去：-았/었는가。将来：-을 것인가。","ex":["应该先想一想，自己说的话对两个人的关系会有多大帮助。","我读了一篇关于韩国人为什么经常称赞别人的文章。","韩国社会该如何解决教育问题？/ 今后我们要为保护环境做些什么？"],"notes":["在报纸、书籍和文章中，也可以单独使用，用来提出一般性的问题。"]},"g6-2":{"meaning":"“趁着做A，顺便也做B”。A是主要目的，B是借这个机会做的。","use":"动词词干 + 는 김에；如果A已经完成：-(으)ㄴ 김에（출장 간 김에）。","ex":["既然要称赞别人，何不顺便也送上一个微笑呢？"],"notes":[]},"g7-1":{"meaning":"“无论谁/何时/什么/怎样/哪里……”。都没有区别。","use":"疑问词 + 动词词干 + 든(지)，或名词 + (이)든(지)：언제든지、어디에서든。","ex":["无论在哪个领域，表现突出的人大多都是书迷。","那个人无论做什么事都很努力。"],"notes":[]},"g7-2":{"meaning":"在一个地方做完A，再把结果带到另一个地方去做B（“……了之后拿去……”）。","use":"动词词干 + 아/어다(가)。A的宾语被带到B中（복사해다가 나누어 주었다）。","ex":["真正成功的人都知道，与邻里分享的生活会带来巨大的快乐和成就感。","我把会议需要的文件复印好，拿去分发给了会议室里的职员。"],"notes":[]}},"th":{"g1-1":{"meaning":"“อย่าว่าแต่ A เลย แม้แต่ B ก็ยังไม่…” A คือสิ่งที่ใหญ่กว่า แม้แต่ B ที่เล็กกว่าและพื้นฐานกว่าก็ยังไม่เกิดขึ้น","use":"ใช้หลังคำนาม ประโยคส่วนหลังต้องมี 도 และเป็นประโยคปฏิเสธเสมอ (못/안/없다)","ex":["อย่าว่าแต่เต้นเลย เขาไม่สามารถกลับมาเดินได้อีกเลยด้วยซ้ำ","ฉันตื่นสายมากจนอย่าว่าแต่แต่งหน้าเลย แม้แต่ล้างหน้ายังไม่ได้ล้าง","เจ็บคอมากจนอย่าว่าแต่ข้าวเลย แม้แต่โจ๊กก็ยังกินไม่ได้"],"notes":["ประโยคจะลงท้ายด้วยรูปปฏิเสธเสมอ (못, 안, 없다)"]},"g1-2":{"meaning":"ความหมายเดียวกันคือ “อย่าว่าแต่… / แทนที่จะ…กลับ…” แต่ใช้หลังคำคุณศัพท์หรือคำกริยา","use":"รากศัพท์ + 기는커녕 มักใช้ตอบคำถามในความหมายว่า “ไม่ใช่อย่างนั้นเลย ตรงกันข้าม”","ex":["A: ผู้จัดการคิมเลี้ยงทุกคนหลังจากได้เลื่อนตำแหน่งไหม B: โอ๊ย อย่าว่าแต่เลี้ยงเลย แม้แต่กาแฟสักแก้วเขายังไม่ซื้อให้","แทนที่จะขอโทษ เขากลับโกรธใส่เสียอีก","แทนที่จะได้รับคำชม ฉันกลับโดนดุอย่างเดียว"],"notes":["ถ้าใช้กับ (오히려) + การกระทำ จะหมายความว่าเกิดผลตรงกันข้ามกับที่คาดไว้"]},"g1-3":{"meaning":"“ไม่ค่อย… / ไม่ได้…ขนาดนั้น” เป็นการปฏิเสธแบบนุ่มนวล คล้าย 별로 -지 않다 ส่วนใหญ่ใช้ในภาษาเขียน","use":"ส่วนใหญ่ใช้กับคำคุณศัพท์ ถ้าใช้กับคำกริยาต้องมีคำวิเศษณ์ เช่น 많이 หรือ 잘","ex":["การละทิ้งเส้นทางอาชีพหมอที่มั่นคงไม่ใช่เรื่องง่ายนัก","มหาวิทยาลัยซอกังไม่ค่อยไกลจากที่นี่","คนนั้นไม่ค่อยกินเยอะ"],"notes":["ปกติใช้กับคำคุณศัพท์ ถ้าใช้กับคำกริยาให้เติมคำวิเศษณ์ เช่น 그리 많이 먹지 않는다, 그리 잘 마시는 편이 아니다"]},"g1-4":{"meaning":"“นอกจาก A แล้ว ยังมี B ด้วย” มี A และมี B ด้วยเช่นกัน","use":"ใช้หลังคำนาม ตามด้วยสิ่งที่มีอยู่หรือเกิดขึ้นด้วยเช่นกัน ใช้บ่อยในภาษาพูด","ex":["ที่คณะแพทย์ นอกจากฉันแล้วยังมีคนอื่นอีกมากมาย"],"notes":[]},"g1-5":{"meaning":"“นอกจาก A แล้ว ไม่มี B เลย” มีแค่ A เท่านั้น","use":"ใช้หลังคำนาม ตามด้วยรูปปฏิเสธ (없다, 안/못) ใช้บ่อยในภาษาพูด","ex":["นอกจากฉันแล้ว ไม่มีใครทำงานนี้ได้"],"notes":[]},"g1-6":{"meaning":"“A ขึ้นอยู่กับว่า B … อย่างไร/แค่ไหน” B เป็นตัวตัดสิน A","use":"รากคำคุณศัพท์ + 냐에, รากคำกริยา + 느냐에 มักใช้กับคำแสดงคำถาม เช่น 얼마나 หรือ 어떻게","ex":["ความสำเร็จของภาพยนตร์เรื่องนี้ขึ้นอยู่กับว่าเรื่องราวถ่ายทอดออกมาได้ดีแค่ไหน","ความสำเร็จของงานครั้งนี้ขึ้นอยู่กับว่าทุกคนพยายามมากแค่ไหน"],"notes":["ใช้คู่กับคำแสดงคำถาม เช่น 얼마나 หรือ 어떻게"]},"g1-7":{"meaning":"“A ขึ้นอยู่กับ B / แล้วแต่ B”","use":"ใช้หลังคำนาม ถ้าเป็นคนให้ใช้ 에게","ex":["จะทำหรือไม่ทำงานนั้นก็แล้วแต่ใจเธอ"],"notes":[]},"g2-1":{"meaning":"“ตั้งใจจะ… / ขอ…” เป็นรูปแบบทางการของ -(으)려고 하다","use":"รากคำกริยา + 고자 하다 ใช้ในการนำเสนอ การอภิปราย การประชุม และงานเขียนที่เป็นทางการ","ex":["ต่อจากนี้ ขอนำเสนอเรื่อง “หมู่บ้านฮันอกพุกชน ประวัติศาสตร์ 600 ปี”","ต่อจากนี้ ขออธิบายเกี่ยวกับวัฒนธรรมเกาหลี"],"notes":[]},"g2-2":{"meaning":"“ในขณะที่… / ในทางกลับกัน” เป็นการเปรียบเทียบข้อเท็จจริงสองอย่างที่ตรงข้ามกันแบบทางการ","use":"คำคุณศัพท์ + 은 반면에, คำกริยา + 는 반면에 (อดีต: -았/었는 반면에)","ex":["ในขณะที่หมู่บ้านฮันอกนัมซานมีบ้านฮันอกจัดแสดงไว้เท่านั้น ที่หมู่บ้านฮันอกพุกชนมีคนอาศัยอยู่จริง","พี่ชายนิสัยเงียบ ในขณะที่น้องชายร่าเริงมาก"],"notes":[]},"g2-3":{"meaning":"“รวมถึง A / ตั้งแต่ A ไปจนถึง…” A เป็นตัวอย่างหลักของกลุ่มที่ใหญ่กว่า","use":"ใช้หลังคำนาม ส่วนที่เหลือของประโยคพูดถึงทั้งกลุ่ม","ex":["พิพิธภัณฑ์ศิลปะพุทธศาสนาจัดแสดงผลงานศิลปะพุทธศาสนาราว 500 ชิ้น รวมถึงพระพุทธรูปสมัยโชซอน","ตอนไปเกาหลี ฉันเที่ยวหลายเมือง เริ่มจากโซล"],"notes":[]},"g3-1":{"meaning":"“ลงเอยด้วยการ… / จนได้” แสดงความเสียใจ ความผิดหวัง หรือการที่อดใจไว้ไม่ได้","use":"รากคำกริยา + 고 말다 เกือบทุกครั้งใช้ในรูปอดีต: -고 말았다","ex":["ฉันไม่อยากให้ใครเห็นว่าเศร้า เลยลงเอยด้วยการโมโหออกไป","กำลังลดน้ำหนักอยู่แท้ๆ แต่ก็เผลอกินพิซซ่าไปทั้งถาดจนได้"],"notes":[]},"g3-2":{"meaning":"“ถ้าเกิด…ขึ้นมาล่ะ” แสดงความกังวลว่าเรื่องไม่ดีอาจจะเกิดขึ้น","use":"รากศัพท์ + 기라도 하면 ตามด้วยความกังวล เช่น 어떡해?, 어떡하나 걱정이다, 두렵다","ex":["ฉันกังวลว่าถ้าเกิดพวกเขาทะเลาะกันขึ้นมาจะทำอย่างไร","ชู่! พูดเบาๆ ถ้าคนอื่นได้ยินเรื่องที่เราคุยกันจะทำยังไง"],"notes":[]},"g3-3":{"meaning":"“…มากเสียจน… / …เหลือเกิน” ใช้เล่าย้อนถึงสิ่งที่ตัวเองเคยประสบว่ามีระดับมากจริงๆ","use":"어찌나 + รากศัพท์ + 던지 ถ้าประธานคือ 내가 และเป็นคำกริยาแสดงการกระทำ ให้ใช้ -았/었던지","ex":["วันนี้ไปบ้านเพื่อนแล้วได้เห็นแมว น่ารักเหลือเกิน…!"],"notes":["ถ้าใช้ 내가 + คำกริยาแสดงการกระทำ ให้ใช้ -았/었던지 ไม่ใช่ -던지"]},"g4-1":{"meaning":"“ยอม B ดีกว่าต้อง A” ทั้งสองอย่างไม่ดี แต่ A แย่กว่า","use":"รากคำกริยา + 느니 มักใช้คู่กับ 차라리 และ -겠다 / -는 게 낫다","ex":["ลาออกไปเลยยังดีกว่าต้องทำงานที่ไม่อยากทำ"],"notes":[]},"g4-2":{"meaning":"“เพื่อ A ไปด้วย และ B ไปด้วย” ทำ C โดยมีสองจุดประสงค์ในคราวเดียว","use":"รากคำกริยา + (으)ㄹ 겸 ถ้ามีสองจุดประสงค์: A-고 B-(으)ㄹ 겸 (해서)","ex":["ดูหนังเกาหลีดีไหม ถือว่าได้เรียนภาษาเกาหลีไปด้วย","ฉันมาปูซานเพื่อเจอญาติและดูทะเลไปด้วย"],"notes":[]},"g4-3":{"meaning":"① “ไม่ต้องดูก็รู้ ชัดเจนอยู่แล้ว” ② “ทำไปก็ไม่มีผลอะไร / ทำไปก็เปล่าประโยชน์”","use":"รากคำกริยา + (으)나 마나 ใช้บ่อยมากในรูป 보나 마나 และ -(으)나 마나예요","ex":["ไม่ต้องดูก็รู้ ป่านนี้แอนดี้คงออกไปเที่ยวกับเพื่อนอีกแล้ว","ได้ยินว่าสมาร์ตโฟนรุ่นใหม่ออกแล้ว ไม่ต้องดูก็รู้ว่าต้องแพงแน่","วันที่ลมแรงและฝนตกแบบนี้ กางร่มไปก็ไม่มีประโยชน์"],"notes":[]},"g5-1":{"meaning":"คำคุณศัพท์ที่ลงท้ายด้วย ㅎ เช่น คำบอกสีและคำกลุ่ม 이렇다 จะตัด ㅎ ทิ้งเมื่อตามด้วย -은/-(으)니까/-(으)면 และเมื่อตามด้วย -아/어요 สระจะเปลี่ยนเป็น ㅐ","use":"파랗다: 파란 · 파라니까 · 파라네요(파랗네요) · 파라면 · 파래요 / 하얗다 → 하얘요","ex":["ลองนึกถึงคำที่ทำให้รู้สึกดีกัน: ฟ้า ขาว สะอาด สดชื่น","ฉันชอบท้องฟ้าสีฟ้า"],"notes":["คำปกติอย่าง 놓다, 넣다, 낳다, 닿다, 쌓다, 좋다 จะไม่ตัด ㅎ (놓아, 넣으면, 좋아요)"]},"g5-2":{"meaning":"“บางครั้งก็ A บางครั้งก็ B” / “ทั้ง A และ B”","use":"รากศัพท์ + 기도 하다 ถ้ามีสองอย่าง: A-기도 하고 B-기도 하다","ex":["ฉันรักชีวิตที่บางครั้งก็มีเงินราว 50,000 วอนให้ใช้ได้ตามใจชอบ","วันหยุดสุดสัปดาห์ บางครั้งฉันก็ไปเจอเพื่อน บางครั้งก็ทำงานบ้านที่ค้างไว้"],"notes":[]},"g5-3":{"meaning":"เปลี่ยนคำคุณศัพท์แสดงความรู้สึกให้เป็นคำกริยา ใช้บรรยายความรู้สึกของคนอื่น (และสามารถมีกรรมด้วย 을/를 ได้)","use":"รากคำคุณศัพท์ + 아/어하다: 슬프다 → 슬퍼하다, 무섭다 → 무서워하다, -고 싶다 → -고 싶어하다","ex":["ฉันอยากใช้ชีวิตโดยชอบคนมากมาย ไม่เกลียดใคร และรักคนไม่กี่คนอย่างสุดหัวใจ","พอได้ยินข่าวนั้น ฉันก็เศร้า และเพื่อนของฉันก็เศร้าเช่นกัน"],"notes":[]},"g5-4":{"meaning":"“(วาง/ใส่/เพิ่มสิ่งของ) ลงบน / ลงใน N” เน้นสถานที่ที่วางสิ่งของไว้","use":"คำนาม + 에다(가) ใช้กับคำกริยาที่เกี่ยวกับการวาง เช่น 놓다, 두다, 넣다, 꽂다, 붙이다, 걸다, 바르다","ex":["ฉันชอบเสียงของซอยองลูกสาวที่กระซิบข้างหูฉัน","กรุณาวางหนังสือไว้บนโต๊ะ","ลองวางกระจกไว้ตรงนั้นดีไหม / ถ้าปักดอกไม้ไว้ตรงนี้น่าจะสวย / ลองแขวนรูปไว้ตรงโน้นดู"],"notes":["กับ 거기/여기/저기 สามารถตัด 에 ออกได้: 거기다가, 거기다","กับ 있다/없다 และ 가다/오다 ใช้ได้แค่ 에 เท่านั้น ห้ามใช้ 에다(가)"]},"g6-1":{"meaning":"รูปคำถามแบบทางการที่ใช้ในภาษาเขียน เหมือน -는지 (“ว่า… หรือไม่ / อย่างไร / ทำไม”)","use":"ปัจจุบัน: คำคุณศัพท์ -은가, คำกริยา -는가, 이다 → 인가 อดีต: -았/었는가 อนาคต: -을 것인가","ex":["ควรคิดก่อนว่าคำพูดของเราจะช่วยความสัมพันธ์ระหว่างสองคนได้มากแค่ไหน","ฉันอ่านบทความเกี่ยวกับว่าทำไมคนเกาหลีถึงชมกันบ่อย","สังคมเกาหลีจะแก้ปัญหาการศึกษาได้อย่างไร / ในอนาคตเราจะทำอะไรเพื่อปกป้องสิ่งแวดล้อม"],"notes":["ยังใช้เดี่ยวๆ เพื่อตั้งคำถามทั่วไปในหนังสือพิมพ์ หนังสือ และบทความได้ด้วย"]},"g6-2":{"meaning":"“ในเมื่อทำ A อยู่แล้ว ก็ถือโอกาสทำ B ด้วย” A เป็นจุดประสงค์หลัก B คือการถือโอกาส","use":"รากคำกริยา + 는 김에 ถ้า A ทำไปแล้ว: -(으)ㄴ 김에 (출장 간 김에)","ex":["ในเมื่อจะชมใครสักคนแล้ว ก็ยิ้มให้เขาด้วยเลยดีไหม"],"notes":[]},"g7-1":{"meaning":"“ไม่ว่าใคร/เมื่อไร/อะไร/อย่างไร/ที่ไหน …” ไม่มีความแตกต่าง ผลเหมือนกัน","use":"คำแสดงคำถาม + รากคำกริยา + 든(지) หรือคำนาม + (이)든(지): 언제든지, 어디에서든","ex":["คนที่โดดเด่นไม่ว่าในสาขาไหน ส่วนใหญ่เป็นหนอนหนังสือ","ไม่ว่าคนนั้นจะทำงานอะไร เขาก็ทำอย่างตั้งใจ"],"notes":[]},"g7-2":{"meaning":"ทำ A ในที่หนึ่ง แล้วนำผลนั้นไปยังอีกที่หนึ่งเพื่อทำ B (“…แล้วนำไป/เอามา…”)","use":"รากคำกริยา + 아/어다(가) กรรมของ A จะถูกนำไปใช้ใน B (복사해다가 나누어 주었다)","ex":["คนที่ประสบความสำเร็จอย่างแท้จริงรู้ว่าชีวิตที่แบ่งปันกับเพื่อนบ้านนำมาซึ่งความสุขและความภาคภูมิใจอย่างมาก","ฉันถ่ายเอกสารที่จำเป็นสำหรับการประชุมแล้วนำไปแจกให้พนักงานในห้องประชุม"],"notes":[]}},"ru":{"g1-1":{"meaning":"«не то что A, даже B не…». A — более серьёзное; даже более простое, базовое B не произошло.","use":"После существительного. Во второй части всегда есть 도, и она всегда отрицательная (못/안/없다).","ex":["Он не то что танцевать — даже ходить больше никогда не смог.","Я встал(а) так поздно, что не то что накраситься — даже умыться не успел(а).","Горло так болело, что я не то что рис — даже кашу не смог(ла) съесть."],"notes":["Предложение всегда заканчивается отрицанием (못, 안, 없다)."]},"g1-2":{"meaning":"То же значение «не то что / куда там», но после прилагательного или глагола.","use":"Основа + 기는커녕. Часто используется в ответе на вопрос в смысле «какое там!».","ex":["A: Начальник Ким угостил всех после повышения в прошлом месяце? B: Ох, какое там угощение — он даже чашку кофе никому не купил.","Не то что извиниться — он, наоборот, ещё и разозлился.","Меня не то что не похвалили — меня только отругали."],"notes":["С (오히려) + действием означает, что произошло противоположное ожидаемому."]},"g1-3":{"meaning":"«не очень / не так уж…». Смягчённое отрицание, как 별로 -지 않다; используется в основном в письменной речи.","use":"В основном с прилагательными. С глаголом нужно наречие, например 많이 или 잘.","ex":["Отказаться от стабильной карьеры врача было не так уж просто.","Университет Соган находится не очень далеко отсюда.","Этот человек ест не очень много."],"notes":["Обычно с прилагательными; с глаголами добавляется наречие: 그리 많이 먹지 않는다, 그리 잘 마시는 편이 아니다."]},"g1-4":{"meaning":"«кроме A, ещё и B». Есть A, и есть также B.","use":"После существительного; дальше идёт то, что тоже есть или происходит. Часто в устной речи.","ex":["Кроме меня, на медицинском факультете было много других людей."],"notes":[]},"g1-5":{"meaning":"«кроме A, нет никакого B». Только A.","use":"После существительного; дальше идёт отрицание (없다, 안/못). Часто в устной речи.","ex":["Кроме меня, эту работу никто не может сделать."],"notes":[]},"g1-6":{"meaning":"«A зависит от того, как / насколько B». B определяет A.","use":"Основа прилагательного + 냐에, основа глагола + 느냐에. Обычно с вопросительным словом, например 얼마나 или 어떻게.","ex":["Успех этого фильма зависит от того, насколько хорошо будет донесена история.","Успех этого дела зависит от того, насколько вы все будете стараться."],"notes":["Используется вместе с вопросительным словом, например 얼마나 или 어떻게."]},"g1-7":{"meaning":"«A зависит от B / решать B».","use":"После существительного; с человеком используется 에게.","ex":["Делать это или нет — решать тебе."],"notes":[]},"g2-1":{"meaning":"«я намерен / я хотел бы…» — официальный вариант -(으)려고 하다.","use":"Основа глагола + 고자 하다. Используется в докладах, дебатах, на совещаниях и в официальных текстах.","ex":["Сейчас я хотел(а) бы представить доклад на тему «Деревня ханоков Пукчхон: 600 лет истории».","Сейчас я хотел(а) бы рассказать о корейской культуре."],"notes":[]},"g2-2":{"meaning":"«тогда как / с другой стороны» — официальное противопоставление двух фактов.","use":"Прилагательное + 은 반면에, глагол + 는 반면에 (прошедшее время: -았/었는 반면에).","ex":["Тогда как в деревне ханоков Намсан дома только выставлены для осмотра, в Пукчхоне в них по-настоящему живут люди.","Старший брат по характеру тихий, тогда как младший очень активный."],"notes":[]},"g2-3":{"meaning":"«начиная с / включая A». A — главный пример из более широкой группы.","use":"После существительного; остальная часть предложения говорит обо всей группе.","ex":["В музее буддийского искусства выставлено около 500 произведений буддийского искусства, включая статуи Будды эпохи Чосон.","Когда я был(а) в Корее, я путешествовал(а) по многим городам, начиная с Сеула."],"notes":[]},"g3-1":{"meaning":"«в итоге (всё-таки) сделал…» — с сожалением, разочарованием или когда не смог сдержаться.","use":"Основа глагола + 고 말다, почти всегда в прошедшем времени: -고 말았다.","ex":["Я не хотел(а) показывать свою грусть и в итоге разозлился(ась).","Я на диете, но в итоге съел(а) целую пиццу."],"notes":[]},"g3-2":{"meaning":"«а вдруг… / что если…». Беспокойство о чём-то плохом, что может случи
