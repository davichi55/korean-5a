ться.","use":"Основа + 기라도 하면, дальше идёт беспокойство: 어떡해?, 어떡하나 걱정이다, 두렵다.","ex":["Я волновался(ась): что, если они вдруг поссорятся?","Тсс! Говори тише. А вдруг другие услышат наш разговор?"],"notes":[]},"g3-3":{"meaning":"«было так…, что…». Воспоминание о пережитом, которое было очень сильным.","use":"어찌나 + основа + 던지. Если подлежащее 내가 и глагол действия, используется -았/었던지.","ex":["Сегодня был(а) у друга и видел(а) его кошку. Она была такая милая…!"],"notes":["С 내가 + глаголом действия используется -았/었던지, а не -던지."]},"g4-1":{"meaning":"«чем A, лучше уж B». Оба варианта плохи, но A хуже.","use":"Основа глагола + 느니, обычно с 차라리 и -겠다 / -는 게 낫다.","ex":["Чем заниматься работой, которую ненавижу, лучше уж уволиться."],"notes":[]},"g4-2":{"meaning":"«заодно и A, и B». Делать C сразу с двумя целями.","use":"Основа глагола + (으)ㄹ 겸; с двумя целями: A-고 B-(으)ㄹ 겸 (해서).","ex":["Может, посмотрим корейский фильм — заодно и корейский поучим?","Я приехал(а) в Пусан, чтобы и родственников повидать, и на море посмотреть."],"notes":[]},"g4-3":{"meaning":"① «можно и не (смотреть) — и так ясно»; ② «делай не делай — толку нет / бесполезно».","use":"Основа глагола + (으)나 마나. Очень часто в виде 보나 마나 и -(으)나 마나예요.","ex":["Тут и смотреть не надо: Энди наверняка опять гуляет с друзьями.","Говорят, вышел новый смартфон — ясное дело, он дорогой.","В такой ветреный и дождливый день от зонта никакого толку."],"notes":[]},"g5-1":{"meaning":"Прилагательные цвета и прилагательные типа 이렇다 с конечной ㅎ теряют ㅎ перед -은/-(으)니까/-(으)면, а с -아/어요 гласная превращается в ㅐ.","use":"파랗다: 파란 · 파라니까 · 파라네요(파랗네요) · 파라면 · 파래요. 하얗다 → 하얘요.","ex":["Давай подумаем о словах, от которых становится хорошо: синий, белый, чистый, свежий.","Я люблю синее небо."],"notes":["Правильные слова, такие как 놓다, 넣다, 낳다, 닿다, 쌓다, 좋다, сохраняют ㅎ (놓아, 넣으면, 좋아요)."]},"g5-2":{"meaning":"«иногда A, иногда B» / «и A, и B».","use":"Основа + 기도 하다; две вещи: A-기도 하고 B-기도 하다.","ex":["Я люблю жизнь, в которой у меня иногда появляется около 50 000 вон, которые можно потратить как хочется.","По выходным я иногда встречаюсь с друзьями, а иногда занимаюсь накопившимися домашними делами."],"notes":[]},"g5-3":{"meaning":"Превращает прилагательное чувства в глагол; используется, чтобы описать чувства другого человека (и может иметь дополнение с 을/를).","use":"Основа прилагательного + 아/어하다: 슬프다 → 슬퍼하다, 무섭다 → 무서워하다, -고 싶다 → -고 싶어하다.","ex":["Я хочу жить, любя многих людей, никого не ненавидя и горячо любя нескольких человек.","Услышав эту новость, я загрустил(а), и мой друг тоже загрустил."],"notes":[]},"g5-4":{"meaning":"«(положить/добавить что-то) на / в N». Подчёркивает место, куда что-то кладут.","use":"Существительное + 에다(가) с глаголами размещения: 놓다, 두다, 넣다, 꽂다, 붙이다, 걸다, 바르다.","ex":["Я люблю голос моей дочери Со Ён, когда она шепчет мне на ухо.","Положите, пожалуйста, книгу на стол.","Может, поставить туда зеркало? / Цветы здесь, по-моему, будут смотреться красиво. / Попробуйте повесить картину вон там."],"notes":["С 거기/여기/저기 можно опустить 에: 거기다가, 거기다.","С 있다/없다 и 가다/오다 возможно только 에, но никогда не 에다(가)."]},"g6-1":{"meaning":"Официальная, письменная вопросительная форма, как -는지 («ли / как / почему…»).","use":"Настоящее время: прилагательное -은가, глагол -는가, 이다 → 인가. Прошедшее: -았/었는가. Будущее: -을 것인가.","ex":["Сначала нужно подумать, насколько твои слова помогут отношениям между вами двумя.","Я прочитал(а) статью о том, почему корейцы так часто делают комплименты.","Как корейскому обществу решить проблемы образования? / Что мы будем делать, чтобы защитить окружающую среду?"],"notes":["Также используется самостоятельно, чтобы задать общий вопрос в газетах, книгах и эссе."]},"g6-2":{"meaning":"«раз уж (всё равно) делаешь A, заодно сделай и B». A — главная цель, B — пользуешься случаем.","use":"Основа глагола + 는 김에; если A уже сделано: -(으)ㄴ 김에 (출장 간 김에).","ex":["Раз уж делаешь комплимент, почему бы заодно и не улыбнуться?"],"notes":[]},"g7-1":{"meaning":"«кто бы / когда бы / что бы / как бы / где бы ни…». Разницы нет.","use":"Вопросительное слово + основа глагола + 든(지), или существительное + (이)든(지): 언제든지, 어디에서든.","ex":["Люди, которые выделялись в какой бы то ни было области, в большинстве своём были заядлыми читателями.","Чем бы этот человек ни занимался, он делает это старательно."],"notes":[]},"g7-2":{"meaning":"Сделать A в одном месте, затем взять результат в другое место и сделать с ним B («сделать… и отнести/принести…»).","use":"Основа глагола + 아/어다(가). Объект действия A переносится в действие B (복사해다가 나누어 주었다).","ex":["По-настоящему успешные люди знают, что жизнь, в которой делишься с ближними, приносит большую радость и удовлетворение.","Я сделал(а) копии документов для совещания и раздал(а) их сотрудникам в переговорной."],"notes":[]}},"vi":{"g1-1":{"meaning":"“ngay cả B cũng không, nói gì đến A”. A là việc lớn hơn; ngay cả việc nhỏ, cơ bản hơn là B cũng đã không xảy ra.","use":"Dùng sau danh từ. Vế sau luôn có 도 và luôn ở dạng phủ định (못/안/없다).","ex":["Đừng nói là nhảy múa, anh ấy thậm chí không bao giờ đi lại được nữa.","Tôi dậy muộn quá nên ngay cả rửa mặt cũng không kịp, nói gì đến trang điểm.","Tôi đau họng đến mức ngay cả cháo cũng không ăn được, nói gì đến cơm."],"notes":["Câu luôn kết thúc ở dạng phủ định (못, 안, 없다)."]},"g1-2":{"meaning":"Cùng nghĩa “nói gì đến / chẳng những không … mà”, nhưng dùng sau tính từ hoặc động từ.","use":"Gốc từ + 기는커녕. Thường dùng để trả lời một câu hỏi với ý “còn lâu mới thế”.","ex":["A: Trưởng phòng Kim được thăng chức tháng trước, anh ấy có khao mọi người không? B: Trời, khao gì chứ, đến một ly cà phê anh ấy cũng không mua.","Chẳng những không xin lỗi, anh ta còn nổi giận đùng đùng.","Chẳng những không được khen, tôi còn chỉ bị mắng."],"notes":["Khi đi với (오히려) + một hành động, nó có nghĩa là đã xảy ra điều ngược lại với mong đợi."]},"g1-3":{"meaning":"“không … lắm / không đến mức …”. Một cách phủ định nhẹ nhàng, giống 별로 -지 않다, chủ yếu dùng trong văn viết.","use":"Chủ yếu đi với tính từ. Khi đi với động từ cần thêm một phó từ như 많이 hoặc 잘.","ex":["Từ bỏ con đường làm bác sĩ ổn định không phải là điều dễ dàng lắm.","Trường Đại học Sogang không xa đây lắm.","Người đó không ăn nhiều lắm."],"notes":["Thường đi với tính từ; với động từ thì thêm phó từ: 그리 많이 먹지 않는다, 그리 잘 마시는 편이 아니다."]},"g1-4":{"meaning":"“ngoài A ra, còn có B”. Có A, và cũng có cả B.","use":"Dùng sau danh từ, theo sau là một điều cũng tồn tại hoặc cũng xảy ra. Hay dùng khi nói.","ex":["Ở trường y, ngoài tôi ra còn có rất nhiều người khác."],"notes":[]},"g1-5":{"meaning":"“ngoài A ra thì không có B”. Chỉ có A.","use":"Dùng sau danh từ, theo sau là dạng phủ định (없다, 안/못). Hay dùng khi nói.","ex":["Ngoài tôi ra, không ai có thể làm được việc này."],"notes":[]},"g1-6":{"meaning":"“A phụ thuộc vào việc B như thế nào / có hay không”. B quyết định A.","use":"Gốc tính từ + 냐에, gốc động từ + 느냐에. Thường đi với từ để hỏi như 얼마나 hoặc 어떻게.","ex":["Thành công của bộ phim này phụ thuộc vào việc câu chuyện được truyền tải tốt đến mức nào.","Thành công của công việc lần này phụ thuộc vào việc các bạn nỗ lực đến mức nào."],"notes":["Dùng cùng với một từ để hỏi như 얼마나 hoặc 어떻게."]},"g1-7":{"meaning":"“A phụ thuộc vào B / tùy vào B”.","use":"Dùng sau danh từ; với người thì dùng 에게.","ex":["Có làm việc đó hay không là tùy vào bạn."],"notes":[]},"g2-1":{"meaning":"“tôi định / tôi xin được …”, dạng trang trọng của -(으)려고 하다.","use":"Gốc động từ + 고자 하다. Dùng trong thuyết trình, tranh luận, cuộc họp và văn viết trang trọng.","ex":["Sau đây tôi xin được trình bày về “Làng Hanok Bukchon, 600 năm lịch sử”.","Sau đây tôi xin được giải thích về văn hóa Hàn Quốc."],"notes":[]},"g2-2":{"meaning":"“trong khi / ngược lại”, dùng để đối lập hai sự việc một cách trang trọng.","use":"Tính từ + 은 반면에, động từ + 는 반면에 (quá khứ: -았/었는 반면에).","ex":["Trong khi ở Làng Hanok Namsan các ngôi nhà chỉ được trưng bày, thì ở Làng Hanok Bukchon người ta thực sự sống trong đó.","Người anh có tính cách trầm lặng, ngược lại người em thì rất hoạt bát."],"notes":[]},"g2-3":{"meaning":"“bắt đầu từ / bao gồm A”. A là ví dụ tiêu biểu của cả một nhóm lớn hơn.","use":"Dùng sau danh từ; phần còn lại của câu nói về cả nhóm.","ex":["Bảo tàng mỹ thuật Phật giáo đang trưng bày khoảng 500 tác phẩm mỹ thuật Phật giáo, trong đó có các tượng Phật thời Joseon.","Khi đến Hàn Quốc, tôi đã du lịch nhiều thành phố, bắt đầu từ Seoul."],"notes":[]},"g3-1":{"meaning":"“cuối cùng lại … / rốt cuộc đã …” kèm cảm giác tiếc nuối, thất vọng hoặc không kìm được.","use":"Gốc động từ + 고 말다, hầu như luôn ở thì quá khứ: -고 말았다.","ex":["Tôi không muốn để lộ nỗi buồn nên cuối cùng lại nổi giận.","Tôi đang ăn kiêng mà rốt cuộc lại ăn hết cả một chiếc pizza."],"notes":[]},"g3-2":{"meaning":"“lỡ mà … thì sao”. Lo lắng về một điều xấu có thể xảy ra.","use":"Gốc từ + 기라도 하면, theo sau là sự lo lắng: 어떡해?, 어떡하나 걱정이다, 두렵다.","ex":["Tôi đã lo không biết phải làm sao lỡ họ cãi nhau.","Suỵt! Nói nhỏ thôi. Lỡ người khác nghe thấy chuyện của mình thì sao?"],"notes":[]},"g3-3":{"meaning":"“… đến mức / … biết bao”. Nhớ lại một điều mình đã trải qua với mức độ rất cao.","use":"어찌나 + gốc từ + 던지. Khi chủ ngữ là 내가 và vị ngữ là động từ hành động, dùng -았/었던지.","ex":["Hôm nay tôi đến nhà bạn và thấy con mèo. Nó dễ thương biết bao…!"],"notes":["Với 내가 + động từ hành động, dùng -았/었던지, không dùng -던지."]},"g4-1":{"meaning":"“thà B còn hơn A”. Cả hai đều không muốn, nhưng A còn tệ hơn.","use":"Gốc động từ + 느니, thường đi với 차라리 và -겠다 / -는 게 낫다.","ex":["Thà nghỉ việc còn hơn làm công việc mình ghét."],"notes":[]},"g4-2":{"meaning":"“vừa để A vừa để B”. Làm C với hai mục đích cùng lúc.","use":"Gốc động từ + (으)ㄹ 겸; với hai mục đích: A-고 B-(으)ㄹ 겸 (해서).","ex":["Xem phim Hàn nhân tiện học luôn tiếng Hàn thì thế nào?","Tôi đến Busan vừa để gặp họ hàng vừa để ngắm biển."],"notes":[]},"g4-3":{"meaning":"① “không cần (xem) cũng biết — rõ ràng rồi”; ② “làm cũng như không / vô ích”.","use":"Gốc động từ + (으)나 마나. Rất hay dùng dưới dạng 보나 마나 và -(으)나 마나예요.","ex":["Không cần xem cũng biết, chắc chắn Andy lại đang đi chơi với bạn bè.","Nghe nói có điện thoại thông minh mới ra — chắc chắn là đắt rồi.","Vào ngày vừa gió vừa mưa thế này thì che ô cũng như không."],"notes":[]},"g5-1":{"meaning":"Các tính từ chỉ màu sắc và kiểu 이렇다 có patchim ㅎ sẽ mất ㅎ trước -은/-(으)니까/-(으)면, còn khi gặp -아/어요 thì nguyên âm biến thành ㅐ.","use":"파랗다: 파란 · 파라니까 · 파라네요(파랗네요) · 파라면 · 파래요. 하얗다 → 하얘요.","ex":["Hãy thử nghĩ đến những từ khiến ta thấy dễ chịu: xanh, trắng, sạch sẽ, tươi mát.","Tôi thích bầu trời xanh."],"notes":["Các từ có quy tắc như 놓다, 넣다, 낳다, 닿다, 쌓다, 좋다 vẫn giữ ㅎ (놓아, 넣으면, 좋아요)."]},"g5-2":{"meaning":"“lúc thì A, lúc thì B” / “vừa A vừa B”.","use":"Gốc từ + 기도 하다; với hai việc: A-기도 하고 B-기도 하다.","ex":["Tôi yêu cuộc sống mà thỉnh thoảng lại có được khoảng 50.000 won để tiêu tùy thích.","Cuối tuần, lúc thì tôi gặp bạn bè, lúc thì làm nốt việc nhà còn tồn đọng."],"notes":[]},"g5-3":{"meaning":"Biến tính từ chỉ cảm xúc thành động từ, dùng để miêu tả cảm xúc của người khác (và có thể đi với tân ngữ bằng 을/를).","use":"Gốc tính từ + 아/어하다: 슬프다 → 슬퍼하다, 무섭다 → 무서워하다, -고 싶다 → -고 싶어하다.","ex":["Tôi muốn sống yêu mến nhiều người, không ghét ai, và yêu thương tha thiết một vài người.","Nghe tin đó, tôi buồn, và bạn tôi cũng buồn."],"notes":[]},"g5-4":{"meaning":"“(đặt/thêm cái gì) lên / vào N”. Nhấn mạnh nơi mà đồ vật được đặt vào.","use":"Danh từ + 에다(가) đi với các động từ đặt để: 놓다, 두다, 넣다, 꽂다, 붙이다, 걸다, 바르다.","ex":["Tôi yêu giọng nói của con gái tôi, Seoyoung, khi con thì thầm vào tai tôi.","Hãy đặt quyển sách lên trên bàn giúp tôi.","Đặt gương ở đó thì thế nào? / Cắm hoa ở đây chắc sẽ đẹp. / Thử treo bức tranh ở đằng kia xem."],"notes":["Với 거기/여기/저기 có thể bỏ 에: 거기다가, 거기다.","Với 있다/없다 và 가다/오다 thì chỉ dùng được 에, không bao giờ dùng 에다(가)."]},"g6-1":{"meaning":"Dạng câu hỏi trang trọng, dùng trong văn viết, giống -는지 (“liệu / như thế nào / tại sao …”).","use":"Hiện tại: tính từ -은가, động từ -는가, 이다 → 인가. Quá khứ: -았/었는가. Tương lai: -을 것인가.","ex":["Trước hết cần suy nghĩ xem lời mình nói sẽ giúp ích bao nhiêu cho mối quan hệ giữa hai người.","Tôi đã đọc một bài viết về lý do tại sao người Hàn hay khen nhau.","Xã hội Hàn Quốc có thể giải quyết vấn đề giáo dục như thế nào? / Sau này chúng ta sẽ làm gì để bảo vệ môi trường?"],"notes":["Nó cũng được dùng độc lập để đặt ra một câu hỏi chung trên báo, sách và bài luận."]},"g6-2":{"meaning":"“nhân tiện làm A thì làm luôn B”. A là mục đích chính; B là tận dụng cơ hội đó.","use":"Gốc động từ + 는 김에; nếu A đã làm xong: -(으)ㄴ 김에 (출장 간 김에).","ex":["Nhân tiện khen ai đó, sao không mỉm cười thêm một cái nhỉ?"],"notes":[]},"g7-1":{"meaning":"“bất kể ai/khi nào/cái gì/thế nào/ở đâu …”. Đều không có gì khác biệt.","use":"Từ để hỏi + gốc động từ + 든(지), hoặc danh từ + (이)든(지): 언제든지, 어디에서든.","ex":["Những người nổi bật, dù ở lĩnh vực nào, phần lớn đều là những người mê đọc sách.","Người đó dù làm việc gì cũng làm rất chăm chỉ."],"notes":[]},"g7-2":{"meaning":"Làm A ở một nơi, rồi mang kết quả đó đến nơi khác để làm B (“… rồi mang/đem đến …”).","use":"Gốc động từ + 아/어다(가). Tân ngữ của A được mang sang B (복사해다가 나누어 주었다).","ex":["Những người thực sự thành công biết rằng một cuộc sống biết sẻ chia với hàng xóm sẽ mang lại niềm vui và ý nghĩa lớn lao.","Tôi đã photo tài liệu cần cho cuộc họp rồi đem phát cho các nhân viên trong phòng họp."],"notes":[]}},"zht":{"g1-1":{"meaning":"“別說A了，連B都……”。A是較大、較難的事；連更小、更基本的B都沒有做到。","use":"接在名詞後面。後半句一定帶 도，而且一定是否定（못/안/없다）。","ex":["別說跳舞了，他連路都再也走不了了。","早上起得太晚，別說化妝了，連臉都沒洗。","嗓子太疼了，別說吃飯了，連粥都喝不下。"],"notes":["句子一定以否定結尾（못、안、없다）。"]},"g1-2":{"meaning":"同樣表示“別說……了 / 非但不……”，但接在形容詞或動詞後面。","use":"詞幹 + 기는커녕。常用來回答問題，表示“哪裡是那樣，恰恰相反”。","ex":["A：金部長上個月升職了，請客了嗎？B：唉，別說請客了，連一杯咖啡都沒請。","他非但沒道歉，反而大發脾氣。","非但沒受到表揚，反而光捱罵了。"],"notes":["與（오히려）+ 動作連用時，表示發生了與預期相反的結果。"]},"g1-3":{"meaning":"“不太…… / 沒那麼……”。語氣較委婉的否定，相當於 별로 -지 않다，主要用於書面語。","use":"主要與形容詞連用。與動詞連用時需要加 많이、잘 等副詞。","ex":["放棄安穩的醫生之路並不那麼容易。","西江大學離這裡不太遠。","那個人吃得不太多。"],"notes":["一般與形容詞連用；與動詞連用時要加副詞：그리 많이 먹지 않는다、그리 잘 마시는 편이 아니다。"]},"g1-4":{"meaning":"“除了A以外，還有B”。A有，B也有。","use":"接在名詞後面，後面接同樣存在或發生的事情。口語中常用。","ex":["醫學院裡除了我，還有很多其他人。"],"notes":[]},"g1-5":{"meaning":"“除了A以外，沒有B”。只有A。","use":"接在名詞後面，後面接否定（없다、안/못）。口語中常用。","ex":["這件事除了我，沒有人能做。"],"notes":[]},"g1-6":{"meaning":"“A取決於B如何/是否……”。由B決定A。","use":"形容詞詞幹 + 냐에，動詞詞幹 + 느냐에。通常與 얼마나、어떻게 等疑問詞一起使用。","ex":["這部電影的成功取決於故事能傳達得多好。","這次工作的成功取決於大家有多努力。"],"notes":["與 얼마나、어떻게 等疑問詞一起使用。"]},"g1-7":{"meaning":"“A取決於B / 由B決定”。","use":"接在名詞後面；如果是人，用 에게。","ex":["做不做那件事，取決於你自己。"],"notes":[]},"g2-1":{"meaning":"“我打算 / 我想要……”，是 -(으)려고 하다 的正式說法。","use":"動詞詞幹 + 고자 하다。用於發表、辯論、會議以及正式的書面語。","ex":["下面我想就“擁有600年曆史的北村韓屋村”進行發表。","下面我想介紹一下韓國的文化。"],"notes":[]},"g2-2":{"meaning":"“而 / 與此相反”，對兩個事實進行正式的對比。","use":"形容詞 + 은 반면에，動詞 + 는 반면에（過去：-았/었는 반면에）。","ex":["南山韓屋村的韓屋只是用來展示，而北村韓屋村裡則真的有人居住。","哥哥性格文靜，而弟弟非常活潑。"],"notes":[]},"g2-3":{"meaning":"“以A為首 / 包括A在內”。A是一個更大群體中具有代表性的例子。","use":"接在名詞後面；句子的其餘部分說的是整個群體。","ex":["佛教美術博物館展出了以朝鮮時代佛像為首的約500件佛教美術作品。","去韓國的時候，我遊覽了以首爾為首的好幾個城市。"],"notes":[]},"g3-1":{"meaning":"“最終還是……了 / 結果……了”，帶有後悔、失望或忍不住的語氣。","use":"動詞詞幹 + 고 말다，幾乎總是用過去時：-고 말았다。","ex":["我不想讓人看出我的難過，結果還是發了脾氣。","我正在減肥，結果還是吃掉了一整個披薩。"],"notes":[]},"g3-2":{"meaning":"“萬一……可怎麼辦”。擔心可能會發生不好的事情。","use":"詞幹 + 기라도 하면，後面接擔心的表達：어떡해?、어떡하나 걱정이다、두렵다。","ex":["我擔心他們萬一吵起來可怎麼辦。","噓！小聲點。萬一被別人聽到我們說的話怎麼辦？"],"notes":[]},"g3-3":{"meaning":"“那個……啊 / ……得不得了”。回憶自己親身經歷過、程度非常強烈的事情。","use":"어찌나 + 詞幹 + 던지。主語是 내가 且謂語是動作動詞時，用 -았/었던지。","ex":["今天去朋友家看到了貓。那叫一個可愛……！"],"notes":["내가 + 動作動詞時，要用 -았/었던지，而不是 -던지。"]},"g4-1":{"meaning":"“與其A，還不如B”。兩個都不好，但A更糟。","use":"動詞詞幹 + 느니，通常與 차라리 以及 -겠다 / -는 게 낫다 一起使用。","ex":["與其做自己討厭的工作，還不如辭職。"],"notes":[]},"g4-2":{"meaning":"“既為了A，也為了B”。做C時同時有兩個目的。","use":"動詞詞幹 + (으)ㄹ 겸；有兩個目的時：A-고 B-(으)ㄹ 겸 (해서)。","ex":["看韓國電影怎麼樣？順便也能學學韓語。","我來釜山，一來看望親戚，二來看看大海。"],"notes":[]},"g4-3":{"meaning":"①“不用（看）也知道，明擺著的”；②“做了也沒用 / 做不做都一樣”。","use":"動詞詞幹 + (으)나 마나。常用形式為 보나 마나 和 -(으)나 마나예요。","ex":["不用看也知道，安迪肯定又和朋友出去玩了。","聽說新的智慧手機出來了，不用看也知道肯定很貴。","像這樣又颳風又下雨的日子，打傘也沒用。"],"notes":[]},"g5-1":{"meaning":"以 ㅎ 收音的顏色形容詞和 이렇다 類形容詞，在 -은/-(으)니까/-(으)면 前面 ㅎ 脫落；接 -아/어요 時母音變為 ㅐ。","use":"파랗다：파란 · 파라니까 · 파라네요（파랗네요）· 파라면 · 파래요。하얗다 → 하얘요。","ex":["來想一想讓人心情愉快的詞吧：藍色的、白色的、乾淨的、清新的。","我喜歡藍藍的天空。"],"notes":["놓다、넣다、낳다、닿다、쌓다、좋다 等規則詞保留 ㅎ（놓아、넣으면、좋아요）。"]},"g5-2":{"meaning":"“有時A，有時B” / “既A又B”。","use":"詞幹 + 기도 하다；說兩件事時：A-기도 하고 B-기도 하다。","ex":["我熱愛這樣的生活：偶爾會有大約五萬韓元可以隨心所欲地花。","週末我有時和朋友見面，有時把積攢下來的家務活做完。"],"notes":[]},"g5-3":{"meaning":"把表示感情的形容詞變成動詞，用來描述別人的感受（並且可以用 을/를 帶賓語）。","use":"形容詞詞幹 + 아/어하다：슬프다 → 슬퍼하다，무섭다 → 무서워하다，-고 싶다 → -고 싶어하다。","ex":["我想這樣生活：喜歡很多人，不憎恨任何人，深深地愛著幾個人。","聽到那個訊息，我很難過，我的朋友也很難過。"],"notes":[]},"g5-4":{"meaning":"“把（東西）放到/加到N上/裡”。強調東西被放置的地點。","use":"名詞 + 에다(가)，與表示放置的動詞連用：놓다、두다、넣다、꽂다、붙이다、걸다、바르다。","ex":["我喜歡女兒瑞英貼在我耳邊說悄悄話的聲音。","請把書放在書桌上。","在那裡放一面鏡子怎麼樣？/ 在這裡插上花應該會很好看。/ 把畫掛到那邊試試吧。"],"notes":["與 거기/여기/저기 連用時可以省略 에：거기다가、거기다。","與 있다/없다 和 가다/오다 連用時只能用 에，不能用 에다(가)。"]},"g6-1":{"meaning":"正式的書面疑問形式，相當於 -는지（“是否 / 如何 / 為什麼……”）。","use":"現在：形容詞 -은가，動詞 -는가，이다 → 인가。過去：-았/었는가。將來：-을 것인가。","ex":["應該先想一想，自己說的話對兩個人的關係會有多大幫助。","我讀了一篇關於韓國人為什麼經常稱讚別人的文章。","韓國社會該如何解決教育問題？/ 今後我們要為保護環境做些什麼？"],"notes":["在報紙、書籍和文章中，也可以單獨使用，用來提出一般性的問題。"]},"g6-2":{"meaning":"“趁著做A，順便也做B”。A是主要目的，B是借這個機會做的。","use":"動詞詞幹 + 는 김에；如果A已經完成：-(으)ㄴ 김에（출장 간 김에）。","ex":["既然要稱讚別人，何不順便也送上一個微笑呢？"],"notes":[]},"g7-1":{"meaning":"“無論誰/何時/什麼/怎樣/哪裡……”。都沒有區別。","use":"疑問詞 + 動詞詞幹 + 든(지)，或名詞 + (이)든(지)：언제든지、어디에서든。","ex":["無論在哪個領域，表現突出的人大多都是書迷。","那個人無論做什麼事都很努力。"],"notes":[]},"g7-2":{"meaning":"在一個地方做完A，再把結果帶到另一個地方去做B（“……了之後拿去……”）。","use":"動詞詞幹 + 아/어다(가)。A的賓語被帶到B中（복사해다가 나누어 주었다）。","ex":["真正成功的人都知道，與鄰里分享的生活會帶來巨大的快樂和成就感。","我把會議需要的檔案影印好，拿去分發給了會議室裡的職員。"],"notes":[]}}};           // {lang: {id: {meaning,use,ex[],notes[]}}}  (en comes from DATA)

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k){try{return localStorage.getItem(k);}catch(e){return null;}}, set(k,v){try{localStorage.setItem(k,v);}catch(e){}} };

let lang = LANGS.some(l => l.code === store.get("k5a_lang")) ? store.get("k5a_lang") : "en";
let showTr = store.get("k5a_gr_tr") !== "0";
let chapter = +(store.get("k5a_gr_ch") || 1);
if (!DATA.chapters.some(c => c.n === chapter)) chapter = 1;
const openSet = new Set();
let quiz = null;
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.en[k];

function tr(p, field, i){
  if (lang === "en") return field === "ex" ? p.examples[i].en : field === "notes" ? p.notes[i].en : p[field];
  const x = (TR[lang] || {})[p.id];
  const v = x && (field === "ex" || field === "notes" ? x[field][i] : x[field]);
  return v || (field === "ex" ? p.examples[i].en : field === "notes" ? p.notes[i].en : p[field]);
}
// highlight the grammar in a Korean sentence (regex list per point, built in build_grammar.js)
function hl(p, ko){
  const re = p.hlShow ? new RegExp(p.hlShow, "g") : null;
  if (!re) return esc(ko);
  let out = "", last = 0, m;
  while ((m = re.exec(ko))) { if (!m[0]) { re.lastIndex++; continue; } out += esc(ko.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>"; last = m.index + m[0].length; }
  return out + esc(ko.slice(last));
}
const L = () => ` lang="${lang}"`;

function renderTabs(){
  $("#tabs").innerHTML = DATA.chapters.map(c =>
    `<button class="tab${c.n === chapter ? " on" : ""}" data-ch="${c.n}">${c.n}과<small>${esc(c.title)}</small></button>`).join("");
}
function renderPoint(p, idx){
  const open = openSet.has(p.id);
  let h = `<div class="gp${open ? " open" : ""}" data-id="${p.id}">
    <div class="gphead"><span class="num">${idx + 1}</span>

      <span class="part">${esc(p.part)}</span><span class="chev">▼</span></div>
    <div class="gpbody">
      <div class="formula"><div class="form">${esc(p.form)}</div><div class="pat">${esc(p.pattern)}</div></div>
      <p class="rule">${esc(p.rule)}</p>
      <div class="sec"><h4${L()}>${t("use")}</h4><div class="tr"${L()}>${esc(tr(p, "use"))}</div></div>`;
  if (p.table) {
    h += `<div class="sec"><h4${L()}>${t("table")}</h4>
      <div class="tbar"><span class="tr"${L()}>${t("coverTip")}</span><button class="pill small" data-cover>${t("cover")}</button></div>
      <div class="tbl"><table><tr>${p.table.head.map(x => `<th>${esc(x)}</th>`).join("")}</tr>
      ${p.table.rows.map(r => `<tr>${r.map(x => `<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div></div>`;
  }
  if (p.examples.length) {
    h += `<div class="sec"><h4${L()}>${t("examples")}</h4>` + p.examples.map((e, i) =>
      `<div class="ex"><div class="ko">${hl(p, e.ko)}</div><div class="tr"${L()}>${esc(tr(p, "ex", i))}</div></div>`).join("") + `</div>`;
  }
  if (p.notes.length) {
    h += `<div class="sec"><h4${L()}>${t("notes")}</h4>` + p.notes.map((n, i) =>
      `<div class="note ${n.kind === "주의" ? "warn" : "tip"}"><span class="k">${n.kind === "주의" ? "⚠ 주의" : "💡 tip"}</span>${esc(n.ko)}
        <div class="tr"${L()}>${esc(tr(p, "notes", i))}</div></div>`).join("") + `</div>`;
  }
  if (p.practice.length) {
    h += `<div class="sec"><h4${L()}>${t("practice")}</h4>` + p.practice.map(x =>
      `<div class="pr"><div class="q">${esc(x.q)}</div><div class="a" hidden>→ ${hl(p, x.a)}</div>
        <button class="pill small" data-ans>${t("show")}</button></div>`).join("") +
      `<div class="aihint"${L()}>${t("model")}</div></div>`;
  }
  return h + `</div></div>`;
}
function render(){
  document.documentElement.lang = "ko";
  document.body.classList.toggle("hidetr", !showTr);
  $("#trBtn").textContent = showTr ? "번역 ✓" : "번역 👁";
  $("#trBtn").title = showTr ? t("trOn") : t("trOff");
  $("#trBtn").classList.toggle("on", showTr);
  renderTabs();
  const ch = DATA.chapters.find(c => c.n === chapter);
  const pts = DATA.points.filter(p => p.ch === chapter);
  let h = `<div class="chhead"><h2>${chapter}과</h2><span class="sub">${esc(ch.title)} · ${pts.length}</span><span class="grow"></span>
    <button class="pill" id="quizBtn">🎯 ${t("quiz")}</button></div>`;
  if (quiz) h += renderQuiz();
  h += pts.map(renderPoint).join("");
  $("#main").innerHTML = h;
  $("#foot").innerHTML = `서강 5A 읽기 문법 · ${esc(showTr ? "" : t("tapEx"))}`;
}

// ---- quiz: blank the grammar out of the chapter's example sentences, model answers and drill sentences ----
// Rounds of ROUND questions dealt from a per-chapter deck: "again" continues with sentences you have not had
// yet, and the deck is only reshuffled once the whole chapter has been gone through.
const ROUND = 15;
const decks = {};
function chapterItems(chN){
  const items = [];
  for (const p of DATA.points.filter(p => p.ch === chN && p.hl)) {
    // Korean sentence -> its English (shown after answering); the first source to give one wins
    const sents = new Map();
    for (const [ko, en] of [...p.examples.map(e => [e.ko, e.en]), ...p.practice.map(x => [x.a, x.en]), ...(p.drill || []).map(d => [d.ko, d.en])])
      if (!sents.has(ko) || (!sents.get(ko) && en)) sents.set(ko, en || "");
    for (const [s, en] of sents) {
      const m = new RegExp(p.hl).exec(s);
      if (!m || m[0].length < 1 || s.length < 8) continue;
      items.push({ id: p.id, before: s.slice(0, m.index), gap: m[0], after: s.slice(m.index + m[0].length), en });
    }
  }
  for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
  return items;
}
function quizItems(chN){
  let d = decks[chN];
  if (!d || d.pos >= d.items.length) d = decks[chN] = { items: chapterItems(chN), pos: 0 };
  const items = d.items.slice(d.pos, d.pos + ROUND);
  d.pos += items.length;
  return { pts: DATA.points.filter(p => p.ch === chN), items, i: 0, score: 0, picked: null, seen: d.pos, total: d.items.length };
}
function renderQuiz(){
  const q = quiz;
  if (q.i >= q.items.length) {
    // how far through this chapter's sentences you are; "again" deals the next unseen ones
    return `<div class="quiz"><div class="qs">🎉 ${t("done")}: ${q.score} / ${q.items.length}</div>
      <div class="qtop"><span>📚 ${q.seen} / ${q.total}</span></div>
      <div class="row"><button class="pill" data-q="close">${t("close")}</button><button class="pill on" data-q="again">${t("again")}</button></div></div>`;
  }
  const it = q.items[q.i];
  const done = q.picked !== null;
  const right = DATA.points.find(p => p.id === it.id);
  return `<div class="quiz"><div class="qtop"><span${L()}>${t("quizT")}</span><span>${q.i + 1} / ${q.items.length} · ${t("score")} ${q.score}</span></div>
    <div class="qs">${esc(it.before)}<span class="blank">${done ? esc(it.gap) : "?"}</span>${esc(it.after)}</div>
    ${done && it.en ? `<div class="qen">${esc(it.en)}</div>` : ""}
    <div class="opts">${q.pts.map(p => {
      const cls = done ? (p.id === it.id ? " right" : p.id === q.picked ? " wrong" : "") : "";
      return `<button class="opt${cls}" data-pick="${p.id}"${done ? " disabled" : ""}>${esc(p.title)}<small${L()}>${esc(tr(p, "meaning"))}</small></button>`;
    }).join("")}</div>
    <div class="fb"${L()}>${done ? (q.picked === it.id ? "✅ " + t("right") : "❌ " + t("wrong") + " " + esc(right.title)) : ""}</div>
    <div class="row"><button class="pill" data-q="close">${t("close")}</button>${done ? `<button class="pill on" data-q="next">${t("next")} ›</button>` : ""}</div></div>`;
}

// ---- events ----
$("#tabs").onclick = e => {
  const b = e.target.closest("[data-ch]"); if (!b) return;
  chapter = +b.dataset.ch; store.set("k5a_gr_ch", chapter); quiz = null; render(); window.scrollTo(0, 0);
};
$("#main").onclick = e => {
  const el = e.target;
  if (el.closest("#quizBtn")) { quiz = quizItems(chapter); render(); window.scrollTo(0, 0); return; }
  const pick = el.closest("[data-pick]");
  if (pick && quiz && quiz.picked === null) { quiz.picked = pick.dataset.pick; if (quiz.picked === quiz.items[quiz.i].id) quiz.score++; render(); return; }
  const qa = el.closest("[data-q]");
  if (qa) { const a = qa.dataset.q; if (a === "close") quiz = null; else if (a === "again") quiz = quizItems(chapter); else { quiz.i++; quiz.picked = null; } render(); return; }
  const ans = el.closest("[data-ans]");
  if (ans) { const pr = ans.closest(".pr"), a = pr.querySelector(".a"); a.hidden = !a.hidden; pr.classList.toggle("done", !a.hidden); ans.textContent = a.hidden ? t("show") : t("hide"); return; }
  const cov = el.closest("[data-cover]");
  if (cov) { const tb = cov.closest(".sec").querySelector(".tbl"); const on = !tb.classList.contains("cover");
    tb.classList.toggle("cover", on); tb.querySelectorAll("td.shown").forEach(td => td.classList.remove("shown")); cov.textContent = on ? t("uncover") : t("cover"); return; }
  const td = el.closest(".tbl.cover td"); if (td) { td.classList.add("shown"); return; }
  const ex = el.closest(".ex"); if (ex) { ex.classList.toggle("shown"); return; }
  const head = el.closest(".gphead");
  if (head) { const gp = head.parentElement, id = gp.dataset.id; gp.classList.toggle("open"); gp.classList.contains("open") ? openSet.add(id) : openSet.delete(id); }
};
$("#trBtn").onclick = () => { showTr = !showTr; store.set("k5a_gr_tr", showTr ? "1" : "0"); render(); };
$("#lang").innerHTML = LANGS.map(l => `<option value="${l.code}">${esc(l.native)}</option>`).join("");
$("#lang").value = lang;
$("#lang").onchange = e => { lang = e.target.value; store.set("k5a_lang", lang); render(); };

// first visit: open the first point so the page doesn't look like a bare list
if (!store.get("k5a_gr_seen")) { const f = DATA.points.find(p => p.ch === chapter); if (f) openSet.add(f.id); store.set("k5a_gr_seen", "1"); }
render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
