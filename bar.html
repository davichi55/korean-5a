<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>단어 바</title>
<meta property="og:title" content="단어 바 · 5A 복습 게임">
<meta property="og:description" content="팀으로 손님의 한국어 주문을 맞히고 가게를 꾸며요">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  :root{
    --night:#1E1726; --wall:#3A2A43; --wall2:#4A3654; --lamp:#FFC766; --ink:#2B1E24; --paper:#FFF4DA; --cream:#F3E6CF;
    --dim:#B9A6BF; --line:#5A4666; --card:#2E2238; --good:#7BE0A0; --bad:#FF7E86;
    --pv:#FFD86B; --pr1:#9EE3C4; --pr2:#FFB6C9; --ps1:#AFD5FF;
    --display:"Jua","Gowun Dodum","Malgun Gothic",sans-serif;
    --body:"Gowun Dodum","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--night);color:var(--cream);font-family:var(--body);-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit}
  button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
  [hidden]{display:none!important}
  [lang="zh-Hans"]{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
  [lang="zh-Hant"]{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
  [lang="th"]{font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif}
  .stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding:18px 12px}
  .phone{width:100%;max-width:420px;height:min(860px,calc(100dvh - 36px));background:var(--wall);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 8px #120d18,0 24px 60px rgba(0,0,0,.5)}
  @media (max-width:520px){ .stage{padding:0} .phone{max-width:none;height:100dvh;border-radius:0;box-shadow:none} }

  .hud{display:flex;align-items:center;gap:7px;padding:10px 14px 6px;background:var(--night)}
  .sign{font-family:var(--display);font-size:22px;color:var(--lamp);flex:1;white-space:nowrap}
  .pill{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pill b{font-family:var(--display);font-weight:400;font-size:15px}
  .pill.late{border-color:var(--bad)}
  .coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--lamp);box-shadow:inset 0 -2px 0 #D99A2B;flex:0 0 auto;vertical-align:-2px}
  .board{display:flex;gap:6px;padding:0 14px 9px;background:var(--night);overflow-x:auto;scrollbar-width:none}
  .team{flex:1 0 auto;min-width:92px;border-radius:10px;padding:4px 8px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border-left:4px solid}
  .team b{font-family:var(--display);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums}
  .team.mine{background:var(--wall2)}

  main{flex:1;min-height:0;position:relative}
  section.screen{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column}
  .panel{padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px}
  .hint{font-size:13px;color:var(--dim);line-height:1.5}
  .big{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-family:var(--display);font-size:19px;cursor:pointer;background:var(--lamp);color:var(--ink);box-shadow:0 4px 0 #C98A2A}
  .big:active{transform:translateY(2px);box-shadow:0 2px 0 #C98A2A}
  .big:disabled{background:#5B4A62;color:#9C8BA3;box-shadow:none;cursor:not-allowed}
  .big.teal{background:#4CC9B4;box-shadow:0 4px 0 #2B9281}
  .ghostBtn{border:1px solid var(--line);background:none;border-radius:12px;padding:10px;font-size:14px;cursor:pointer;color:var(--dim)}
  label{display:block;font-size:12.5px;color:var(--dim);margin:0 0 5px}
  input,select{width:100%;font:inherit;font-size:16px;color:var(--cream);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  input.code{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-family:var(--display);font-size:24px}

  .scene{display:flex;flex-direction:column-reverse;background:#443250;padding-top:10px}
  .scene svg{display:block;width:100%;height:auto}
  .bubble{position:relative;margin:0 12px 14px;background:var(--paper);color:var(--ink);border-radius:18px;padding:12px 14px 11px;font-family:var(--display);font-size:19px;line-height:1.38;box-shadow:0 4px 0 rgba(0,0,0,.25);text-wrap:balance;word-break:keep-all}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-11px;border:12px solid transparent;border-top-color:var(--paper);border-bottom:0;transform:translateX(-50%)}
  .bubble .who{display:block;font-family:var(--body);font-size:12px;color:#7A6470;margin-bottom:2px}
  .bubble.happy{background:#DFF7E7} .bubble.happy::after{border-top-color:#DFF7E7}
  .bubble.sad{background:#FFE1E3} .bubble.sad::after{border-top-color:#FFE1E3}
  .meaning{background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 14px}
  .meaning .kr{font-family:var(--display);font-size:24px}
  .meaning .en{font-size:15px;margin-top:2px;line-height:1.45}
  .meaning .src{font-size:12px;color:#7A6470;margin-top:6px}
  .resultRow{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .result{font-family:var(--display);font-size:18px}
  .result.ok{color:var(--good)} .result.no{color:var(--bad)}
  .nextArrow{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--good);color:#12402A;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 #3E9C66}

  .kitchen{padding:12px 12px 0;background:linear-gradient(#5B3E2C,#4B3223);flex:1;display:flex;flex-direction:column;gap:12px}
  .orderMini{background:rgba(255,244,218,.1);border:1px dashed rgba(255,244,218,.35);border-radius:12px;padding:8px 11px;font-size:14px;line-height:1.45}
  .orderMini b{font-family:var(--display);font-weight:400;color:var(--lamp)}
  .group h3{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:14px;display:flex;align-items:center;gap:6px}
  .group h3 .sw{width:12px;height:12px;border-radius:3px}
  .notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .postit{position:relative;border:0;border-radius:3px 3px 12px 3px;padding:12px 8px 13px;min-height:56px;font-family:var(--body);font-size:18px;line-height:1.25;color:#3A2A1F;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.22);transform:rotate(var(--r,0deg));word-break:keep-all;text-align:center}
  .postit.me{outline:3px solid #4CC9B4;outline-offset:2px}
  .dots{position:absolute;top:-9px;right:-4px;display:flex;gap:2px}
  .dot{min-width:22px;height:22px;border-radius:11px;padding:0 5px;font-family:var(--body);font-size:11px;line-height:18px;text-align:center;color:#1B1016;border:2px solid #4B3223;white-space:nowrap}
  .serveBar{position:sticky;bottom:0;margin:0 -12px;padding:10px 12px 12px;background:#3A2718;border-top:1px solid #6B4A33;display:flex;flex-direction:column;gap:8px}
  .agree{font-size:14px;line-height:1.45} .agree.warn{color:#FFD9A8}

  .room{background:radial-gradient(circle at 50% 40%,#4A3654,#2A1F33);border-radius:18px;padding:4px 0 0;overflow:hidden}
  .room svg{display:block;width:100%;height:auto}
  .drop{animation:drop .55s cubic-bezier(.3,1.6,.5,1)}
  @keyframes drop{from{transform:translateY(-40px);opacity:0}}
  .ghost{opacity:.45}
  .cat h3{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:14px;color:var(--dim)}
  .items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .item{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 10px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;position:relative;min-height:52px}
  .item .sw{width:26px;height:26px;border-radius:8px;flex:0 0 auto}
  .item .nm{display:block;font-family:var(--display);font-size:15.5px;line-height:1.2}
  .item .pr{font-size:12px;color:var(--dim)}
  .item.mine{border-color:#4CC9B4;box-shadow:inset 0 0 0 1px #4CC9B4}
  .item.owned{opacity:.55;cursor:default}
  .item .dot{border-color:var(--card)}
  .buyBar{position:sticky;bottom:0;background:var(--wall);padding:10px 0 2px;display:flex;flex-direction:column;gap:6px}
  .callout{background:var(--card);border:1px solid var(--lamp);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.45}
  .callout b{font-family:var(--display);font-weight:400;color:var(--lamp);font-size:17px}

  .chat{display:flex;flex-direction:column;height:100%}
  .seg{display:flex;margin:10px 14px 0;background:var(--card);border-radius:12px;padding:3px}
  .seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-family:var(--display);font-size:15px;cursor:pointer;color:var(--dim);position:relative}
  .seg button.on{background:var(--wall2);color:var(--cream)}
  .seg .bdg{position:absolute;top:6px;right:18%;width:8px;height:8px;border-radius:50%;background:var(--bad)}
  .feed{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:84%;padding:8px 11px;border-radius:14px;font-size:15px;line-height:1.4;background:var(--card);border-left:3px solid var(--line);word-break:break-word}
  .msg .n{display:block;font-size:11.5px;color:var(--dim);margin-bottom:1px}
  .msg.me{align-self:flex-end;background:#2F5E57;border-left:0}
  .msg.sys{align-self:center;background:none;color:var(--dim);font-size:12.5px;padding:0;border:0;text-align:center}
  .compose{display:flex;gap:8px;padding:10px 14px 12px;border-top:1px solid var(--line);background:var(--wall)}
  .compose input{flex:1;min-width:0}
  .compose button{border:0;border-radius:12px;background:#4CC9B4;color:#10302B;font-family:var(--display);font-size:16px;padding:0 14px;cursor:pointer}

  nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--night);border-top:1px solid var(--card);padding-bottom:env(safe-area-inset-bottom)}
  nav button{border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--dim);position:relative;font-family:var(--display);font-size:13px}
  nav button svg{width:26px;height:26px}
  nav button.on{color:var(--lamp)}
  nav .bdg{position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--bad)}
  .toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-family:var(--display);font-size:15px;padding:9px 14px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:30;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}

  .overlay{position:absolute;inset:0;background:var(--night);z-index:20;overflow-y:auto;padding:22px 18px 24px;display:flex;flex-direction:column;gap:14px}
  .overlay h1,.overlay h2{font-family:var(--display);font-weight:400;margin:0;color:var(--lamp);text-wrap:balance}
  .overlay h1{font-size:38px} .overlay h2{font-size:24px}
  .rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
  .rules li{background:var(--card);border-radius:12px;padding:9px 12px;font-size:14.5px;line-height:1.45;display:flex;gap:10px}
  .rules li span{font-family:var(--display);color:var(--lamp);font-size:17px;min-width:16px}
  .card{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
  .teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
  .tcard{background:var(--card);border-radius:12px;padding:10px;border-top:4px solid;min-height:84px}
  .tcard h3{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:15px}
  .tcard .p{display:block;width:100%;text-align:left;border:0;background:none;padding:3px 0;font-size:14px;cursor:default}
  .tcard.host .p{cursor:pointer;text-decoration:underline dotted var(--line)}
  .code{font-family:var(--display);font-size:40px;letter-spacing:.2em;color:var(--lamp);text-align:center}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row > *{flex:1 1 120px}
  .chk{display:flex;align-items:center;gap:6px;background:var(--wall);border-radius:10px;padding:8px 10px;font-size:14px;cursor:pointer}
  .chk input{width:auto}
  .shopCard{background:var(--card);border-radius:16px;overflow:hidden;border-top:4px solid}
  .shopCard .cap{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:8px}
  .shopCard .cap b{font-family:var(--display);font-weight:400;font-size:17px}
  .voteBtn{border:0;border-radius:10px;background:var(--lamp);color:var(--ink);font-family:var(--display);font-size:14.5px;padding:7px 12px;cursor:pointer}
  .voteBtn.on{background:#4CC9B4}
  .prize{background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 14px;flex:1}
  .prize small{display:block;font-size:12.5px;color:#7A6470}
  .prize b{font-family:var(--display);font-weight:400;font-size:21px}
  table.score{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--card);border-radius:14px;overflow:hidden}
  table.score td{padding:9px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  table.score tr:first-child td{border-top:0;color:var(--dim);font-size:12.5px}
  .words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .words li{background:var(--card);border-radius:10px;padding:8px 11px;font-size:14px;line-height:1.45}
  .words li b{font-family:var(--display);font-weight:400;font-size:17px}
  .ver{text-align:center;color:var(--dim);font-size:11.5px}
  .err{color:var(--bad);font-size:14px}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="stage"><div class="phone">
  <div class="hud" id="hud" hidden>
    <span class="sign">단어 바</span>
    <span class="pill" id="clockPill"><b id="clock">12:00</b></span>
    <span class="pill"><span class="coin"></span><b id="coins">0</b></span>
  </div>
  <div class="board" id="board" hidden></div>
  <main id="game" hidden>
    <section class="screen" id="s-bar"><div class="scene"><div id="scene"></div><div class="bubble" id="bubble"></div></div><div class="panel" id="barPanel"></div></section>
    <section class="screen" id="s-kitchen" hidden><div class="kitchen" id="kitchen"></div></section>
    <section class="screen" id="s-shop" hidden><div class="panel" id="shop"></div></section>
    <section class="screen" id="s-chat" hidden>
      <div class="chat">
        <div class="seg"><button id="segTeam" class="on">우리 팀<span class="bdg" id="bdgTeam" hidden></span></button><button id="segAll">전체<span class="bdg" id="bdgAll" hidden></span></button></div>
        <div class="feed" id="feed"></div>
        <form class="compose" id="compose"><input id="msg" autocomplete="off" maxlength="120" placeholder="팀원에게 메시지"><button>보내기</button></form>
      </div>
    </section>
  </main>
  <nav id="nav" hidden>
    <button data-tab="bar" class="on"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 4h12l-1.5 9a4.5 4.5 0 0 1-9 0z"/><path d="M13 17.5V22M9 22h8"/></svg>바</button>
    <button data-tab="kitchen"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 5h11l5 5v11H5z"/><path d="M16 5v5h5M9 14h8M9 18h5"/></svg>주방<span class="bdg" id="bdgKitchen" hidden></span></button>
    <button data-tab="shop"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11 13 4l9 7v11H4z"/><path d="M10 22v-6h6v6"/></svg>꾸미기<span class="bdg" id="bdgShop" hidden></span></button>
    <button data-tab="chat"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 6h18v11H11l-5 4v-4H4z"/></svg>채팅<span class="bdg" id="bdgChat" hidden></span></button>
  </nav>
  <div class="overlay" id="front"></div>
  <div class="toast" id="toast" hidden></div>
</div></div>

<script>
/* 단어 바 — a team review game for the 5A class, built by build_bar.js.
   Same multiplayer model as 같이 외우기: the host's browser runs the whole game and everyone connects through
   the Cloudflare room relay (Korean 5A/relay), which only passes messages. Every team gets the same customers

:"đại khí vãn thành — tài lớn thành đạt muộn","zht":"大器晚成"},"who":"늦게 성공한 손님","say":"저는 50살에 처음 가수로 성공했어요. 큰 사람은 늦게 완성된대요."},"w349":{"kr":"동문서답","pos":"관용 표현","sec":"ch4-r2","ch":4,"tr":{"en":"answering irrelevantly, giving a non sequitur","zh":"答非所问","th":"ถามอย่างตอบอย่าง","ru":"отвечать невпопад, «в огороде бузина, а в Киеве дядька»","vi":"ông nói gà bà nói vịt, trả lời lạc đề","zht":"答非所問"},"who":"황당한 손님","say":"‘몇 시예요?’ 하고 물었는데 친구가 ‘김치찌개 좋아해’라고 대답했어요."},"w721":{"kr":"동병상련","pos":"관용 표현","sec":"ch4-r2","ch":4,"tr":{"en":"fellow sufferers pity each other","zh":"同病相怜","th":"คนทุกข์เหมือนกันย่อมเห็นใจกัน","ru":"товарищи по несчастью сочувствуют друг другу","vi":"đồng bệnh tương lân — cùng cảnh ngộ thì thương nhau","zht":"同病相憐"},"who":"위로하는 손님","say":"저도 시험에 떨어져 봐서 친구 마음을 잘 알아요. 같은 아픔이 있어서 서로 위로해요."},"w350":{"kr":"막상막하","pos":"관용 표현","sec":"ch4-r2","ch":4,"tr":{"en":"neck-and-neck, evenly matched, hard to distinguish who's better","zh":"不相上下","th":"สูสี พอๆ กัน","ru":"быть на равных, идти вровень","vi":"kẻ tám lạng người nửa cân, ngang tài ngang sức","zht":"不相上下"},"who":"경기 보는 손님","say":"두 팀이 너무 비슷하게 잘해서 누가 이길지 전혀 모르겠어요."},"w351":{"kr":"새옹지마","pos":"관용 표현","sec":"ch4-r2","ch":4,"tr":{"en":"life is full of ups and downs, fortune changes like a horse at the border (unexpected twists of fate)","zh":"塞翁失马（인생은 새옹지마다：人生祸福难料）","th":"โชคร้ายอาจกลายเป็นโชคดี ชีวิตมีขึ้นมีลง (塞翁失马)","ru":"не было бы счастья, да несчастье помогло; в жизни всё переменчиво (인생은 새옹지마다)","vi":"tái ông thất mã — họa phúc khôn lường","zht":"塞翁失馬（인생은 새옹지마다：人生禍福難料）"},"who":"담담한 손님","say":"다리를 다쳐서 슬펐는데, 그래서 군대에 안 가게 됐어요. 인생은 좋은 일과 나쁜 일이 계속 바뀌어요."},"w352":{"kr":"설상가상","pos":"관용 표현","sec":"ch4-r2","ch":4,"tr":{"en":"to make matters worse, adding insult to injury","zh":"雪上加霜","th":"ซ้ำเติม ยิ่งแย่ลงไปอีก","ru":"беда не приходит одна; к худшему прибавилось худшее","vi":"họa vô đơn chí — đã khổ lại càng thêm khổ","zht":"雪上加霜"},"who":"비 맞은 손님","say":"지갑을 잃어버렸는데 비까지 와요. 나쁜 일 위에 또 나쁜 일이 생겼어요."},"w346":{"kr":"외유내강","pos":"관용 표현","sec":"ch4-r2","ch":4,"tr":{"en":"gentle outside, strong inside (soft exterior, strong inner character)","zh":"外柔内刚","th":"ภายนอกอ่อนโยน ภายในเข้มแข็ง","ru":"мягок снаружи, твёрд внутри","vi":"ngoài mềm trong cứng, ngoại nhu nội cương","zht":"外柔內剛"},"who":"조용하지만 강한 손님","say":"제 친구는 겉으로는 부드럽고 착하지만 마음속은 아주 강해요."},"w353":{"kr":"이심전심","pos":"관용 표현","sec":"ch4-r2","ch":4,"tr":{"en":"telepathy, \"heart-to-heart understanding","zh":"以心传心、心有灵犀","th":"ใจตรงกัน รู้ใจกันโดยไม่ต้องพูด","ru":"понимать друг друга без слов, сердцем","vi":"tâm đầu ý hợp, hiểu nhau không cần nói","zht":"以心傳心、心有靈犀"},"who":"눈을 마주친 손님","say":"말을 안 해도 친구와 제가 같은 생각을 하고 있다는 걸 알았어요."},"w354":{"kr":"일석이조","pos":"관용 표현","sec":"ch4-r2","ch":4,"tr":{"en":"killing two birds with one stone, achieving two things at once","zh":"一石二鸟、一举两得","th":"ยิงปืนนัดเดียวได้นกสองตัว","ru":"одним выстрелом убить двух зайцев","vi":"một công đôi việc","zht":"一石二鳥、一舉兩得"},"who":"자전거 탄 손님","say":"회사에 자전거로 가요. 운동도 하고 버스비도 아꼈어요. 한 번에 좋은 일이 두 개!"},"w344":{"kr":"천생연분","pos":"관용 표현","sec":"ch4-r2","ch":4,"tr":{"en":"a match made in heaven, perfect couple","zh":"天生一对、天作之合","th":"คู่แท้ที่ฟ้าส่งมา","ru":"пара, созданная на небесах","vi":"duyên trời định, trời sinh một cặp","zht":"天生一對、天作之合"},"who":"신혼부부 손님","say":"우리 두 사람은 하늘이 만들어 준 것처럼 너무 잘 맞아요."},"w355":{"kr":"칠전팔기","pos":"관용 표현","sec":"ch4-r2","ch":4,"tr":{"en":"fall seven times, get up eight\" → perseverance, never giving up","zh":"七转八起、百折不挠","th":"ล้มเจ็ดครั้งลุกแปดครั้ง ไม่ยอมแพ้","ru":"семь раз упасть, восемь раз подняться; не сдаваться","vi":"thất bại bảy lần đứng dậy tám lần, không bỏ cuộc","zht":"七轉八起、百折不撓"},"who":"운동선수 손님","say":"시합에서 일곱 번 졌어요. 그래도 포기하지 않고 또 일어나서 도전했어요."},"w356":{"kr":"함흥차사","pos":"관용 표현","sec":"ch4-r2","ch":4,"tr":{"en":"someone who disappears without a trace after being sent on an errand","zh":"咸兴差使（一去不回、杳无音信的人）","th":"คนที่ถูกส่งไปแล้วหายเงียบไม่กลับมา","ru":"посланник, который так и не вернулся; пропавший без вести","vi":"đi rồi biệt tăm, một đi không trở lại","zht":"咸興差使（一去不回、杳無音信的人）"},"who":"기다리는 손님","say":"편의점에 간 동생이 한 시간이 지나도 소식이 없고 안 돌아와요."},"w357":{"kr":"겪다","pos":"동사","sec":"ch4-r2","ch":4,"tr":{"en":"to experience, go through","zh":"经历、遭受","th":"ประสบ ผ่าน (เหตุการณ์)","ru":"пережить, пройти через","vi":"trải qua, nếm trải","zht":"經歷、遭受"},"who":"유학생 손님","say":"한국에 와서 처음 혼자 살면서 여러 가지 힘든 일을 직접 해 봤어요."},"w290":{"kr":"가는 날이 장날이다","pos":"관용 표현","sec":"ch4-s1","ch":4,"tr":{"en":"The day you go is a market day. When timing is unlucky, When something coincidental happens","zh":"去的那天正好赶集（来得不巧 / 太巧了）","th":"วันที่ไปดันเป็นวันตลาดนัด (มาไม่ถูกจังหวะ / บังเอิญตรงกัน)","ru":"пришёл — а тут базарный день (не вовремя; какое совпадение)","vi":"đi đúng hôm chợ phiên — thật xui, thật trùng hợp","zht":"去的那天正好趕集（來得不巧 / 太巧了）"},"who":"실망한 손님","say":"오랜만에 식당에 갔는데 하필 오늘이 쉬는 날이었어요. 운이 없어요."},"w291":{"kr":"배보다 배꼽이 더 크다","pos":"관용 표현","sec":"ch4-s1","ch":4,"tr":{"en":"belly button is bigger than the belly (the cost outweighs the benefits) Effort > result","zh":"肚脐比肚子大（本末倒置、得不偿失）","th":"สะดือใหญ่กว่าท้อง (ของแถมแพงกว่าของหลัก ไม่คุ้ม)","ru":"пупок больше живота (второстепенное дороже главного; овчинка выделки не стоит)","vi":"rốn to hơn bụng — lợi bất cập hại","zht":"肚臍比肚子大（本末倒置、得不償失）"},"who":"황당한 손님","say":"만 원짜리 장난감을 샀는데 배송비가 이만 원이에요. 중요한 것보다 다른 게 더 비싸요."},"w292":{"kr":"병 주고 약 주다","pos":"관용 표현","sec":"ch4-s1","ch":4,"tr":{"en":"to say something hurtful to someone and then say something nice to cover it up","zh":"先给病再给药（打一巴掌给个甜枣）","th":"ให้โรคแล้วค่อยให้ยา (ทำร้ายแล้วค่อยปลอบ)","ru":"сначала наградить болезнью, потом дать лекарство (обидеть, а потом утешать)","vi":"vừa đấm vừa xoa","zht":"先給病再給藥（打一巴掌給個甜棗）"},"who":"헷갈리는 손님","say":"친구가 제 옷이 이상하다고 놀리고, 바로 사탕을 주면서 미안하대요."},"w293":{"kr":"식은 죽 먹기다","pos":"관용 표현","sec":"ch4-s1","ch":4,"tr":{"en":"easy as pie\" used when a task is easy just like eating cooled down porridge","zh":"像喝凉粥一样容易（小菜一碟）","th":"ง่ายเหมือนกินโจ๊กที่เย็นแล้ว (ง่ายมาก)","ru":"проще, чем съесть остывшую каш const ME = { pid:null, host:false, name:store.get("k5a_bar_name", store.get("k5a_together_name", "")), ws:null, conn:null, lastMsg:0 };
let G = null;       // host only: the whole game
let V = null;       // what this screen shows (the last message from the host)
let TAB = "bar", CHAT_TAB = "team", UNREAD = { team:false, all:false }, CHAT = { team:[], all:[] };

function send(m){   // player -> host
  if(ME.host) hostReceive("me", m);
  else if(ME.conn && ME.conn.open) ME.conn.send(m);
}
function relayConn(pid){
  return { get open(){ return !!(ME.ws && ME.ws.readyState === 1); }, send: d => { if(ME.ws && ME.ws.readyState === 1) ME.ws.send(JSON.stringify({ to:pid, d })); } };
}
function cleanup(){
  if(G){ clearInterval(G.tick); clearInterval(G.pinger); (G.timers || []).forEach(clearTimeout); }
  const ws = ME.ws; ME.ws = null; try{ if(ws) ws.close(1000); }catch(e){}
  ME.conn = null; ME.lastMsg = 0; G = null; V = null;
  CHAT = { team:[], all:[] }; UNREAD = { team:false, all:false };
}
function joinRoom(code){
  cleanup(); ME.host = false; ME.pid = "p" + rid();
  front('<h2>연결 중…</h2><p class="hint">방 ' + esc(code) + '에 연결하고 있어요.</p>');
  let opened = false;
  const ws = ME.ws = new WebSocket(RELAY + "/room/" + code + "?role=player&id=" + ME.pid);
  const conn = ME.conn = { open:false, send: d => { if(ws.readyState === 1) ws.send(JSON.stringify(d)); } };
  const giveUp = setTimeout(() => { if(!opened && ME.ws === ws){ cleanup(); home("연결이 안 돼요. 인터넷을 확인하고 다시 해 보세요."); } }, 15000);
  ws.onopen = () => { opened = true; conn.open = true; clearTimeout(giveUp); ME.lastMsg = Date.now(); conn.send({ t:"hello", name:ME.name, lang:LANG }); };
  ws.onmessage = e => { let m; try{ m = JSON.parse(e.data); }catch(_){ return; } ME.lastMsg = Date.now(); if(m.t === "ping") conn.send({ t:"pong" }); else onMessage(m); };
  ws.onclose = e => {
    clearTimeout(giveUp); if(ME.ws !== ws) return; cleanup();
    if(e.code === 4004) home("방 " + code + "을 찾을 수 없어요. 코드를 확인하세요.");
    else if(e.code === 4000) home("호스트가 방을 닫았어요.");
    else if(e.code === 4029) home("방이 꽉 찼어요.");
    else home(opened ? "연결이 끊겼어요. 같은 코드로 다시 들어올 수 있어요." : "연결이 안 돼요. 인터넷을 확인하고 다시 해 보세요.");
  };
}
setInterval(() => { if(!ME.host && ME.conn && ME.lastMsg && Date.now() - ME.lastMsg > 28000){ cleanup(); home("호스트의 응답이 없어요. 같은 코드로 다시 들어올 수 있어요."); } }, 3000);

   host: the game
   ====================================================================================== */
const randCode = () => { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let s = ""; for(let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)]; return s; };
function createRoom(){
  cleanup(); ME.host = true; ME.pid = "me";
  G = { key:rid() + rid(), code:"", phase:"lobby", players:new Map(), teamCount:2, minutes:12, chapters:DATA.chapters.map(c => c.n),
        teams:[], state:{}, votes:{}, timers:[], lastTeacherAt:0, lastPlayerChatAt:0 };
  G.players.set("me", { pid:"me", name:ME.name, lang:LANG, team:0, connected:true, alive:Date.now() });
  front('<h2>방 만드는 중…</h2>');
  openHost(randCode(), 0, 0);
}
function openHost(code, tries, reconnects){
  const game = G;
  const ws = ME.ws = new WebSocket(RELAY + "/room/" + code + "?role=host&key=" + game.key);
  let opened = false;
  ws.onopen = () => {
    if(G !== game) return; opened = true;
    if(reconnects) toast("다시 연결됐어요");
    if(!game.code){
      game.code = code; pushAll();
      game.pinger = setInterval(() => {
        if(!ME.ws || ME.ws.readyState !== 1) return;
        for(const p of game.players.values()) if(p.pid !== "me" && p.connected && Date.now() - p.alive > 15000) setConnected(p.pid, false);
        for(const p of game.players.values()) if(p.pid !== "me" && p.connected) relayConn(p.pid).send({ t:"ping" });
      }, 4000);
    } else for(const p of game.players.values()) p.alive = Date.now();
  };
  ws.onmessage = e => { if(G !== game) return; let m; try{ m = JSON.parse(e.data); }catch(_){ return; }
    if(m.k === "msg" && m.d) hostReceive(m.from, m.d); else if(m.k === "leave") setConnected(m.id, false); };
  ws.onclose = e => {
    if(G !== game || ME.ws !== ws) return;
    if(e.code === 4009 && tries < 8) return openHost(randCode(), tries + 1, 0);
    if(!opened && !game.code){ cleanup(); home("방을 만들 수 없어요. 인터넷을 확인하세요."); return; }
    if(e.code === 4010) return;
    if(reconnects >= 8){ cleanup(); home("연결이 끊겨서 방이 닫혔어요."); return; }
    toast("연결이 끊겼어요 · 다시 연결하는 중…", 4000);
    setTimeout(() => { if(G === game) openHost(game.code, 0, reconnects + 1); }, 1500);
  };
}
function toPlayer(p, m){ if(p.pid === "me") onMessage(m); else if(p.connected) relayConn(p.pid).send(m); }
const humans = () => [...G.players.values()];
function setConnected(pid, on){
  const p = G && G.players.get(pid); if(!p || pid === "me") return;
  p.connected = on;
  if(!on && G.phase === "lobby") G.players.delete(pid);
  pushAll();
}

function hostReceive(pid, m){
  const p = G.players.get(pid);
  if(p) p.alive = Date.now();
  if(m.t === "hello"){
    const name = String(m.name || "?").trim().slice(0, 14) || "?";
    const np = { pid, name, lang:String(m.lang || "en"), team:0, connected:true, alive:Date.now() };
    if(G.phase === "lobby") np.team = smallestTeam();
    else np.team = smallestTeam();
    G.players.set(pid, np);
    if(G.phase !== "lobby") chatSys("all", name + " 님이 " + teamName(np.team) + "에 들어왔어요");
    pushAll();
    return;
  }
  if(m.t === "pong" || !p) return;
  if(m.t === "chat") return hostChat(p, m.room === "all" ? "all" : "team", m.text);
  if(G.phase === "lobby" && pid === "me") return lobbyAction(m);
  if(G.phase === "play") return playAction(p, m);
  if(G.phase === "vote" && m.t === "vote") return castVote(p, m.team);
  if(G.phase === "vote" && m.t === "results" && pid === "me") return showResults();
  if(G.phase === "results" && m.t === "again" && pid === "me"){ G.phase = "lobby"; pushAll(); }
}
const teamName = i => i === "tc" ? TEACHER.name : TEAM_STYLE[i].name;
function smallestTeam(){
  const counts = Array.from({ length:G.teamCount }, (_, i) => [...G.players.values()].filter(p => p.team === i && p.connected).length);
  return counts.indexOf(Math.min(...counts));
}
function lobbyAction(m){
  if(m.t === "teams"){ G.teamCount = Math.max(1, Math.min(4, +m.n || 2)); for(const p of G.players.values()) if(p.team >= G.teamCount) p.team = smallestTeam(); }
  if(m.t === "shuffle"){ const list = shuffle([...G.players.values()]); list.forEach((p, i) => p.team = i % G.teamCount); }
  if(m.t === "move"){ const p = G.players.get(m.pid); if(p) p.team = (p.team + 1) % G.teamCount; }
  if(m.t === "minutes") G.minutes = [5, 10, 12, 15].includes(+m.v) ? +m.v : 12;
  if(m.t === "chapter"){ const n = +m.n; G.chapters = G.chapters.includes(n) ? G.chapters.filter(x => x !== n) : G.chapters.concat(n).sort(); }
  if(m.t === "start") return startShift();
  pushAll();
}

/* ---------- the shift ---------- */
function startShift(){
  const pool = Object.keys(C).filter(id => G.chapters.includes(C[id].ch));
  if(pool.length < 12){ toast("단어가 부족해요. 과를 더 고르세요"); return; }
  const teamsUsed = [...new Set([...G.players.values()].filter(p => p.connected).map(p => p.team))];
  if(!teamsUsed.length) return;
  G.pool = pool;
  // one shared order of customers, long enough for a very fast team
  let seq = []; while(seq.length < 160) seq = seq.concat(shuffle(pool));
  G.seq = seq.map((id, n) => ({ id, n, look:n % 6 }));
  G.state = {};
  for(let i = 0; i < G.teamCount; i++) G.state[i] = newTeamState();
  G.state.tc = newTeamState();
  G.phase = "play"; G.endAt = Date.now() + G.minutes * 60000; G.lastCall = false; G.votes = {};
  for(const k of Object.keys(G.state)) newTurn(k);
  G.tick = setInterval(shiftTick, 500);
  scheduleTeacher();
  G.timers.push(setTimeout(teacherChatter, 80000));
  teacherSays("오늘도 즐겁게 복습해요~ 선생님 팀도 열심히 할게요!", true);
  pushAll();
}
function newTeamState(){ return { list:G.seq.slice(), pos:0, turn:null, score:0, coins:0, owned:[], votes:{}, log:[], dropped:null }; }
function newTurn(k){
  const s = G.state[k];
  const c = s.list[s.pos];
  const others = shuffle(G.pool.filter(id => id !== c.id)).slice(0, 11);
  s.turn = { id:c.id, n:c.n, look:c.look, repeat:!!c.repeat, notes:shuffle([c.id, ...others]), picks:{}, status:"order", ok:null };
}
const activeMembers = team => [...G.players.values()].filter(p => p.team === +team && p.connected);
function playAction(p, m){
  const k = p.team, s = G.state[k]; if(!s) return;
  const t = s.turn;
  if(m.t === "pick" && t.status === "order" && t.notes.includes(m.id)){ t.picks[p.pid] = m.id; }
  else if(m.t === "serve" && t.status === "order"){
    const act = activeMembers(k), first = act.length && t.picks[act[0].pid];
    if(!first || act.some(x => t.picks[x.pid] !== first)) return;
    t.status = "done"; t.ok = first === t.id;
    s.log.push({ id:t.id, ok:t.ok });
    if(t.ok){ s.score++; s.coins++; }
    else s.list.splice(s.pos + 5, 0, { id:t.id, n:t.n, look:t.look, repeat:true });
    if(t.ok && s.score % 5 === 0) teacherSays(pickOne([teamName(k) + " 벌써 " + s.score + "명! 대단해요", "와, " + teamName(k) + " 속도가 장난 아니네요", "선생님들도 긴장돼요… ㅎㅎ"]));
  }
  else if(m.t === "next" && t.status === "done"){ s.pos++; ensureList(s); newTurn(k); }
  else if(m.t === "skip" && t.status === "order"){
    s.list.splice(s.pos + 4, 0, { id:t.id, n:t.n, look:t.look, repeat:true });
    chatSys(k, p.name + " 님이 손님을 나중에 다시 오게 했어요");
    s.pos++; ensureList(s); newTurn(k);
  }
  else if(m.t === "want" && itemById(m.item) && !s.owned.includes(m.item)){ s.votes[p.pid] = m.item; }
  else if(m.t === "buy"){
    const act = activeMembers(k), want = act.length && s.votes[act[0].pid], it = itemById(want);
    if(!it || s.owned.includes(want) || s.coins < it.cost || act.some(x => s.votes[x.pid] !== want)) return;
    s.coins -= it.cost; s.owned.push(want); s.votes = {}; s.dropped = want;
    chatSys(k, "가게에 " + iga(it.nm) + " 생겼어요");
  }
  else return;
  pushAll();
  s.dropped = null;
}
function ensureList(s){ if(s.pos >= s.list.length - 2) s.list = s.list.concat(G.seq); }

/* ---------- teacher team: plays, buys, and keeps the chat company without talking over people ---------- */
function scheduleTeacher(){
  G.timers.push(setTimeout(() => {
    if(!G || G.phase !== "play") return;
    const s = G.state.tc;
    if(Math.random() < .85){ s.score++; s.coins++; }
    s.pos++;
    const open = ITEMS.filter(i => !s.owned.includes(i.id) && i.cost <= s.coins);
    if(open.length && Math.random() < .6){ const i = pickOne(open); s.owned.push(i.id); s.coins -= i.cost; }
    pushAll();
    scheduleTeacher();
  }, rnd(45, 70) * 1000));
}
function teacherSays(text, important){
  const now = Date.now();
  if(!important && (now - G.lastTeacherAt < 90000 || now - G.lastPlayerChatAt < 45000)) return;
  G.lastTeacherAt = now;
  broadcastChat("all", { name:pickOne(TEACHER.members), text, color:TEACHER.color });
}
function teacherChatter(){
  if(!G || G.phase !== "play") return;
  const best = Math.max(...Object.keys(G.state).filter(k => k !== "tc").map(k => G.state[k].score));
  teacherSays(pickOne(best > G.state.tc.score
    ? ["선생님들보다 앞선 팀이 있네요… ㅠㅠ", "다들 복습 열심히 했나 봐요!", "좋아요, 틀린 단어는 끝나고 꼭 다시 봐요~"]
    : ["천천히 해도 괜찮아요. 주문을 끝까지 읽어 보세요~", "모르는 단어는 팀원에게 물어봐요!", "가게도 예쁘게 꾸미는 거 잊지 마세요 ㅎㅎ"]));
  G.timers.push(setTimeout(teacherChatter, rnd(70, 110) * 1000));
}

function shiftTick(){
  if(G.phase !== "play") return;
  const left = G.endAt - Date.now();
  if(left <= 60000 && !G.lastCall){
    G.lastCall = true;
    teacherSays("마감 1분 전이에요! 동전 남은 팀은 가게 꾸미세요~", true);
    for(const p of G.players.values()){ const s = G.state[p.team]; if(s && s.coins > 3) toPlayer(p, { t:"lastcall", coins:s.coins }); }
  }
  if(left <= 0){
    G.phase = "vote"; clearInterval(G.tick); G.timers.forEach(clearTimeout); G.timers = [];
    // the teachers vote too, never for themselves, a little more often for fuller bars
    const humanTeams = Object.keys(G.state).filter(k => k !== "tc" && activeMembers(k).length);
    G.teacherVotes = TEACHER.members.map(() => { if(!humanTeams.length) return null; const w = humanTeams.map(k => G.state[k].owned.length + 1), sum = w.reduce((a, b) => a + b, 0);
      let r = Math.random() * sum; for(let i = 0; i < w.length; i++){ r -= w[i]; if(r <= 0) return humanTeams[i]; } return humanTeams[0]; });
    pushAll();
  }
}
function castVote(p, team){
  if(String(team) === String(p.team) || !G.state[team]) return;
  G.votes[p.pid] = String(team);
  const voters = [...G.players.values()].filter(x => x.connected);
  if(voters.every(x => G.votes[x.pid])) return showResults();
  pushAll();
}
function showResults(){ G.phase = "results"; pushAll(); }

/* ---------- chat ---------- */
function hostChat(p, room, raw){
  const text = String(raw || "").replace(/\s+/g, " ").trim().slice(0, 120); if(!text) return;
  const now = Date.now(); if(p.lastChat && now - p.lastChat < 500) return; p.lastChat = now;
  if(room === "all") G.lastPlayerChatAt = now;
  broadcastChat(room === "all" ? "all" : p.team, { name:p.name, pid:p.pid, text, color:G.phase === "lobby" ? null : TEAM_STYLE[p.team] && TEAM_STYLE[p.team].color });
}
function chatSys(room, text){ broadcastChat(room, { sys:true, text }); }
function broadcastChat(room, msg){
  for(const p of G.players.values()) if(room === "all" || p.team === +room) toPlayer(p, Object.assign({ t:"chat", room: room === "all" ? "all" : "team" }, msg));
}

/* ---------- what each player sees ---------- */
function viewFor(p){
  const base = { t:"view", phase:G.phase, code:G.code, you:p.pid, host:p.pid === "me", myTeam:p.team, teamCount:G.teamCount, minutes:G.minutes, chapters:G.chapters,
    players:[...G.players.values()].map(x => ({ pid:x.pid, name:x.name, team:x.team, connected:x.connected })) };
  if(G.phase === "lobby") return base;
  const teams = Object.keys(G.state).filter(k => k === "tc" || [...G.players.values()].some(x => x.team === +k));
  base.scores = teams.map(k => ({ id:k, name:teamName(k === "tc" ? "tc" : +k), color:k === "tc" ? TEACHER.color : TEAM_STYLE[+k].color, score:G.state[k].score, owned:G.state[k].owned }));
  base.left = Math.max(0, G.endAt - Date.now());
  if(G.phase === "play"){
    const s = G.state[p.team];
    base.team = { coins:s.coins, owned:s.owned, votes:s.votes, dropped:s.dropped, pos:s.pos, turn:s.turn, members:activeMembers(p.team).map(x => ({ pid:x.pid, name:x.name })) };
  } else {
    base.votes = { mine:G.votes[p.pid] || null, count:Object.keys(G.votes).length, total:[...G.players.values()].filter(x => x.connected).length };
    if(G.phase === "results"){
      const tally = {}; teams.forEach(k => tally[k] = 0);
      Object.values(G.votes).concat(G.teacherVotes || []).forEach(v => { if(v != null && tally[v] != null) tally[v]++; });
      base.tally = tally;
      base.log = (G.state[p.team] || { log:[] }).log;
    }
  }
  return base;
}
function pushAll(){ if(!G) return; for(const p of G.players.values()) toPlayer(p, viewFor(p)); }

/* ======================================================================================
   screens (every player, including the host, renders from the host's messages)
   ====================================================================================== */
function onMessage(m){
  if(m.t === "view"){ V = m; render(); }
  else if(m.t === "chat") addChat(m);
  else if(m.t === "lastcall"){ LASTCALL = true; go("shop"); }
}
let LASTCALL = false, PREV_PHASE = null;
function front(html){ const f = $("front"); f.hidden = false; f.innerHTML = html; ["hud","board","game","nav"].forEach(id => $(id).hidden = true); }

function home(err){
  cleanup(); ME.host = false; LASTCALL = false; PREV_PHASE = null;
  const room = (new URLSearchParams(location.search).get("room") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  front('<h1>단어 바</h1><p class="hint">팀으로 손님의 한국어 주문을 맞히고, 동전으로 가게를 꾸며요. 5A 중요 단어 복습 게임이에요.</p>' +
    (err ? '<p class="err">' + esc(err) + '</p>' : '') +
    '<div class="card"><div class="row"><div><label>이름</label><input id="name" maxlength="14" value="' + esc(ME.name) + '"></div>' +
    '<div><label>뜻을 볼 언어</label><select id="lang">' + LANGS.map(l => '<option value="' + l.code + '"' + (l.code === LANG ? " selected" : "") + '>' + esc(l.native) + '</option>').join("") + '</select></div></div></div>' +
    '<div class="card"><label>방 코드</label><input id="code" class="code" maxlength="4" value="' + esc(room) + '" placeholder="ABCD"><button class="big" id="join">참여하기</button></div>' +
    '<div class="card"><button class="big teal" id="host">방 만들기 (호스트)</button><p class="hint" style="margin:0">호스트는 게임이 끝날 때까지 이 창을 열어 두세요.</p></div>' +
    '<p class="ver">버전 ' + esc(VERSION) + '</p>');
  $("lang").onchange = e => { LANG = e.target.value; store.set("k5a_lang", LANG); };
  const nameOk = () => { const n = $("name").value.trim().slice(0, 14); if(!n){ toast("이름을 입력하세요"); return false; } ME.name = n; store.set("k5a_bar_name", n); return true; };
  $("join").onclick = () => { if(!nameOk()) return; const c = $("code").value.toUpperCase().replace(/[^A-Z]/g, ""); if(c.length !== 4){ toast("방 코드 4글자를 입력하세요"); return; } joinRoom(c); };
  $("host").onclick = () => { if(nameOk()) createRoom(); };
}

function render(){
  if(V.phase !== PREV_PHASE){ if(V.phase === "play"){ TAB = "bar"; LASTCALL = false; } PREV_PHASE = V.phase; }
  if(V.phase === "lobby") return renderLobby();
  if(V.phase === "vote" || V.phase === "results") return renderEnd();
  $("front").hidden = true; ["hud","board","game","nav"].forEach(id => $(id).hidden = false);
  renderHud(); go(TAB, true);
}
const RULES = '<ul class="rules"><li><span>1</span>손님의 한국어 주문을 읽고, 주방에서 맞는 단어를 찾아요.</li><li><span>2</span>팀원 모두 같은 단어를 골라야 서빙할 수 있어요. 모르면 채팅으로 물어봐요.</li><li><span>3</span>맞히면 동전 1개. 가구를 사서 가게를 꾸며요.</li><li><span>4</span>마감이 되면 가장 많이 맞힌 팀과 가장 예쁜 가게를 뽑아요.</li></ul>';
function renderLobby(){
  const host = V.host;
  const teamsHtml = Array.from({ length:V.teamCount }, (_, i) => '<div class="tcard' + (host ? " host" : "") + '" style="border-color:' + TEAM_STYLE[i].color + '"><h3>' + TEAM_STYLE[i].name + '</h3>' +
    V.players.filter(p => p.team === i).map(p => '<button class="p" data-move="' + esc(p.pid) + '"' + (host ? "" : " disabled") + '>' + esc(p.name) + (p.pid === V.you ? " (나)" : "") + '</button>').join("") + '</div>').join("") +
    '<div class="tcard" style="border-color:' + TEACHER.color + '"><h3>' + TEACHER.name + '</h3>' + TEACHER.members.map(n => '<span class="p">' + n + '</span>').join("") + '</div>';
  const settings = host
    ? '<div class="card"><div class="row"><div><label>팀 수</label><select id="teamsSel">' + [1,2,3,4].map(n => '<option' + (n === V.teamCount ? " selected" : "") + '>' + n + '</option>').join("") + '</select></div>' +
      '<div><label>영업 시간</label><select id="minSel">' + [5,10,12,15].map(n => '<option value="' + n + '"' + (n === V.minutes ? " selected" : "") + '>' + n + '분</option>').join("") + '</select></div></div>' +
      '<label style="margin:0">복습할 과</label><div class="row">' + DATA.chapters.map(c => '<label class="chk"><input type="checkbox" data-ch="' + c.n + '"' + (V.chapters.includes(c.n) ? " checked" : "") + '> ' + c.n + '과 · ' + c.count + '단어</label>').join("") + '</div>' +
      '<div class="row"><button class="ghostBtn" id="shuffle">팀 섞기</button><button class="ghostBtn" id="copyLink">참여 링크 복사</button></div>' +
      '<p class="hint" style="margin:0">이름을 누르면 다른 팀으로 옮겨요.</p></div>'
    : '<p class="hint">' + V.chapters.map(n => n + "과").join(" · ") + ' 복습 · ' + V.minutes + '분 영업 · 호스트가 시작할 때까지 기다리세요.</p>';
  front('<h1>단어 바</h1>' + (V.code ? '<div class="code">' + esc(V.code) + '</div>' : '') + RULES +
    '<div class="teams">' + teamsHtml + '</div>' + settings +
    (host ? '<button class="big" id="start">영업 시작</button>' : '') + '<button class="ghostBtn" id="leave">나가기</button>');
  document.querySelectorAll("[data-move]").forEach(b => b.onclick = () => host && send({ t:"move", pid:b.dataset.move }));

    $("teamsSel").onchange = e => send({ t:"teams", n:e.target.value });
    $("minSel").onchange = e => send({ t:"minutes", v:e.target.value });
    document.querySelectorAll("[data-ch]").forEach(c => c.onchange = () => send({ t:"chapter", n:c.dataset.ch }));
    $("shuffle").onclick = () => send({ t:"shuffle" });
    $("copyLink").onclick = async () => { const url = location.origin + location.pathname + "?room=" + V.code; try{ await navigator.clipboard.writeText(url); toast("링크를 복사했어요"); }catch(e){ prompt("이 링크를 복사하세요", url); } };
    $("start").onclick = () => send({ t:"start" });
  }
  $("leave").onclick = () => home();
}
function renderHud(){
  const l = V.left, mm = Math.floor(l / 60000), ss = Math.floor(l / 1000) % 60;
  $("clock").textContent = mm + ":" + String(ss).padStart(2, "0");
  $("clockPill").classList.toggle("late", l <= 60000);
  $("coins").textContent = V.team ? V.team.coins : 0;
  $("board").innerHTML = V.scores.map(s => '<div class="team' + (String(s.id) === String(V.myTeam) ? " mine" : "") + '" style="border-color:' + s.color + '">' + esc(s.name) + ' <b>' + s.score + '</b></div>').join("");
}
setInterval(() => { if(V && V.phase === "play"){ V.left = Math.max(0, V.left - 1000); const mm = Math.floor(V.left / 60000), ss = Math.floor(V.left / 1000) % 60; $("clock").textContent = mm + ":" + String(ss).padStart(2, "0"); $("clockPill").classList.toggle("late", V.left <= 60000); } }, 1000);

function go(tab, fromRender){
  TAB = tab;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ["bar","kitchen","shop","chat"].forEach(t => $("s-" + t).hidden = t !== tab);
  if(!V || V.phase !== "play") return;
  if(tab === "bar") renderBar();
  if(tab === "kitchen") renderKitchen();
  if(tab === "shop") renderShop();
  if(tab === "chat" && !fromRender) renderFeed();
  const t = V.team.turn, act = V.team.members, mine = t.picks[V.you];
  $("bdgKitchen").hidden = !(t.status === "order" && mine && act.some(x => t.picks[x.pid] && t.picks[x.pid] !== mine));
  $("bdgShop").hidden = !(V.team.coins > 0 && V.team.owned.length < ITEMS.length);
  badges();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.tab));
const memberColor = pid => MEMBER_COLORS[Math.max(0, V.team.members.findIndex(x => x.pid === pid)) % MEMBER_COLORS.length];
const dotsFor = (map, value) => V.team.members.filter(x => map[x.pid] === value).map(x => '<span class="dot" style="background:' + memberColor(x.pid) + '">' + esc(x.pid === V.you ? "나" : x.name.slice(0, 3)) + '</span>').join("");

function renderBar(){
  const t = V.team.turn, c = C[t.id];
  $("scene").innerHTML = frontSvg(t.look, t.status === "done" ? (t.ok ? "happy" : "sad") : "neutral", V.team.owned);
  const b = $("bubble");
  if(t.status === "order"){
    b.className = "bubble"; b.innerHTML = '<span class="who">' + esc(c.who) + '</span>' + esc(c.say);
    $("barPanel").innerHTML = '<div class="hint">' + (V.team.pos + 1) + '번째 손님 · 천천히 읽어요, 시간 제한은 없어요</div><button class="big" id="toKitchen">주방에서 단어 찾기</button><button class="ghostBtn" id="later">잘 모르겠어요 · 다음에 올게요</button>';
    $("toKitchen").onclick = () => go("kitchen");
    $("later").onclick = () => send({ t:"skip" });
    return;
  }
  b.className = "bubble " + (t.ok ? "happy" : "sad");
  b.innerHTML = '<span class="who">' + esc(c.who) + '</span>' + (t.ok ? "딱 이거예요! 감사합니다." : "음… 제가 원한 건 이게 아닌데요.");
  $("barPanel").innerHTML = '<div class="resultRow"><div class="result ' + (t.ok ? "ok" : "no") + '">' + (t.ok ? "서빙 성공 · 동전 +1" : "이번 손님은 실패 · 이 단어는 나중에 또 와요") + '</div>' +
    '<button class="nextArrow" id="nextTop" aria-label="다음 손님 받기"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>' +
    '<div class="meaning"><div class="kr" lang="ko">' + esc(c.kr) + '</div><div class="en" lang="' + hl(LANG) + '">' + esc(meaning(t.id)) + '</div><div class="src">' + esc(SEC[c.sec].name) + (c.pos ? ' · ' + esc(c.pos) : '') + '</div></div>' +
    '<button class="big" id="next">다음 손님 받기</button>';
  $("next").onclick = $("nextTop").onclick = () => send({ t:"next" });
}
function renderKitchen(){
  const t = V.team.turn, c = C[t.id], act = V.team.members, mine = t.picks[V.you];
  let h = '<div class="orderMini"><b>주문</b> ' + esc(c.say) + '</div>';
  const groups = DATA.sections.filter(s => t.notes.some(id => C[id].sec === s.id));
  groups.forEach((g, gi) => {
    h += '<div class="group"><h3><span class="sw" style="background:' + secColor(g.id) + '"></span>' + esc(g.name) + '</h3><div class="notes">' +
      t.notes.filter(id => C[id].sec === g.id).map((id, i) => '<button class="postit' + (mine === id ? " me" : "") + '" data-w="' + id + '" lang="ko" style="background:' + secColor(g.id) + ';--r:' + (((gi * 3 + i * 5) % 5) - 2) * .8 + 'deg">' + esc(C[id].kr) +
        (Object.values(t.picks).includes(id) ? '<span class="dots">' + dotsFor(t.picks, id) + '</span>' : '') + '</button>').join("") + '</div></div>';
  });
  const picked = act.filter(x => t.picks[x.pid]), allSame = picked.length === act.length && act.length && picked.every(x => t.picks[x.pid] === t.picks[act[0].pid]);
  let status;
  if(t.status !== "order") status = '<div class="agree">이 손님은 끝났어요. 바에서 다음 손님을 받으세요.</div>';
  else if(!mine) status = '<div class="agree">손님이 원하는 단어를 골라요. ' + (picked.length ? picked.length + "명이 벌써 골랐어요." : "") + '</div>';
  else if(allSame) status = '<div class="agree">모두 <b>' + esc(C[mine].kr) + '</b>' + (batchim(C[mine].kr) ? "을" : "를") + ' 골랐어요. 같이 서빙해요!</div>';
  else if(picked.length < act.length) status = '<div class="agree">팀원이 고를 때까지 기다려요 (' + picked.length + '/' + act.length + ')</div>';
  else status = '<div class="agree warn">팀원들이 서로 다른 단어를 골랐어요. 채팅으로 이야기해서 하나로 정해요.</div>';
  h += '<div class="serveBar">' + status + '<button class="big teal" id="serve"' + (t.status === "order" && allSame ? "" : " disabled") + '>같이 서빙하기</button></div>';
  $("kitchen").innerHTML = h;
  document.querySelectorAll(".postit").forEach(p => p.onclick = () => { if(t.status === "order") send({ t:"pick", id:p.dataset.w }); });
  $("serve").onclick = () => send({ t:"serve" });
}
function renderShop(){
  const T = V.team, want = T.votes[V.you], it = want && itemById(want), act = T.members;
  const allSame = want && act.every(x => T.votes[x.pid] === want), can = allSame && T.coins >= it.cost;
  let status;
  if(!want) status = "사고 싶은 가구를 눌러 보세요. 가게에 미리 보여요.";
  else if(allSame) status = act.length > 1 ? "모두 " + it.nm + "! 같이 사요." : eulreul(it.nm) + " 살 수 있어요.";
  else status = "팀원 모두 같은 가구를 골라야 살 수 있어요. 채팅으로 정해요.";
  const call = LASTCALL ? '<div class="callout"><span><b>마감 1분 전!</b><br>동전이 ' + T.coins + '개 남았어요. 가게를 꾸밀 마지막 기회예요. 안 사도 투표는 받을 수 있어요.</span><button class="ghostBtn" id="backToWork">계속 서빙하기</button></div>' : "";
  const cats = [...new Set(ITEMS.map(i => i.cat))];
  $("shop").innerHTML = call + '<div class="room">' + roomSvg(T.owned, want, T.dropped) + '</div>' +
    '<div class="hint"><span class="coin"></span> 동전 ' + T.coins + '개 · 가구 ' + T.owned.length + '/' + ITEMS.length + ' · 마감 때 가장 예쁜 가게 투표가 있어요</div>' +
    cats.map(cat => '<div class="cat"><h3>' + esc(cat) + '</h3><div class="items">' + ITEMS.filter(i => i.cat === cat).map(i => { const own = T.owned.includes(i.id);
      return '<button class="item' + (own ? " owned" : "") + (want === i.id ? " mine" : "") + '" data-item="' + i.id + '"><span class="sw" style="background:' + i.sw + '"></span><span><span class="nm">' + esc(i.nm) + '</span><span class="pr">' + (own ? "우리 가게에 있어요" : '<span class="coin"></span> ' + i.cost) + '</span></span>' +
        (!own && Object.values(T.votes).includes(i.id) ? '<span class="dots">' + dotsFor(T.votes, i.id) + '</span>' : '') + '</button>'; }).join("") + '</div></div>').join("") +
    '<div class="buyBar"><div class="hint">' + esc(status) + '</div><button class="big teal" id="buy"' + (can ? "" : " disabled") + '>' + (it ? (T.coins < it.cost ? "동전이 " + (it.cost - T.coins) + "개 더 필요해요" : "같이 사기 · 동전 " + it.cost + "개") : "같이 사기") + '</button></div>';
  document.querySelectorAll("[data-item]").forEach(el => el.onclick = () => { if(!T.owned.includes(el.dataset.item)) send({ t:"want", item:el.dataset.item }); });
  $("buy").onclick = () => send({ t:"buy" });
  const bw = $("backToWork"); if(bw) bw.onclick = () => { LASTCALL = false; go("bar"); };
}

/* ---------- chat ---------- */
function addChat(m){
  const room = m.room === "all" ? "all" : "team";
  CHAT[room].push(m); if(CHAT[room].length > 150) CHAT[room].shift();
  const own = V && m.pid === V.you;
  if(!own && (!(TAB === "chat" && CHAT_TAB === room) || $("s-chat").hidden)) UNREAD[room] = true;
  if(TAB === "chat" && CHAT_TAB === room && !$("s-chat").hidden){
    const f = $("feed"), near = f.scrollHeight - f.scrollTop - f.clientHeight < 80;
    f.insertAdjacentHTML("beforeend", msgHtml(m)); if(near || m.pid === V.you) f.scrollTop = f.scrollHeight;
  }
  badges();
}
function msgHtml(m){
  if(m.sys) return '<div class="msg sys">' + esc(m.text) + '</div>';
  const mine = V && m.pid === V.you;
  return '<div class="msg' + (mine ? " me" : "") + '"' + (!mine && m.color ? ' style="border-left-color:' + m.color + '"' : '') + '><span class="n">' + esc(m.name) + '</span><span lang="ko">' + esc(m.text) + '</span></div>';
}
function renderFeed(){
  const list = CHAT[CHAT_TAB];
  $("feed").innerHTML = list.length ? list.map(msgHtml).join("") : '<div class="msg sys">' + (CHAT_TAB === "team" ? "우리 팀만 보는 채팅이에요" : "모든 팀과 선생님이 보는 채팅이에요") + '</div>';
  $("feed").scrollTop = $("feed").scrollHeight;
  UNREAD[CHAT_TAB] = false; badges();
}
function badges(){ $("bdgTeam").hidden = !UNREAD.team; $("bdgAll").hidden = !UNREAD.all; $("bdgChat").hidden = TAB === "chat" || !(UNREAD.team || UNREAD.all); }
$("segTeam").onclick = () => { CHAT_TAB = "team"; $("segTeam").classList.add("on"); $("segAll").classList.remove("on"); $("msg").placeholder = "팀원에게 메시지"; renderFeed(); };
$("segAll").onclick = () => { CHAT_TAB = "all"; $("segAll").classList.add("on"); $("segTeam").classList.remove("on"); $("msg").placeholder = "모두에게 메시지"; renderFeed(); };
$("compose").onsubmit = e => {
  e.preventDefault(); const inp = $("msg"), t = inp.value.trim(); if(!t) return;
  send({ t:"chat", room:CHAT_TAB, text:t }); inp.value = ""; inp.focus();
  setTimeout(() => { if([...inp.value].length <= 1) inp.value = ""; }, 40);
};

/* ---------- closing time ---------- */
function renderEnd(){
  const shops = V.scores, mine = String(V.myTeam);
  if(V.phase === "vote"){
    front('<h2>마감! 가장 예쁜 가게에 투표해요</h2><p class="hint">우리 가게에는 투표할 수 없어요 · ' + V.votes.count + '/' + V.votes.total + '명 투표함</p>' +
      shops.map(s => '<div class="shopCard" style="border-color:' + s.color + '"><div class="room" style="border-radius:0">' + roomSvg(s.owned) + '</div><div class="cap"><b>' + esc(s.name) + '</b>' +
        (String(s.id) === mine ? '<span class="hint">우리 가게</span>' : '<button class="voteBtn' + (V.votes.mine === String(s.id) ? " on" : "") + '" data-v="' + s.id + '">' + (V.votes.mine === String(s.id) ? "투표했어요" : "이 가게에 투표") + '</button>') + '</div></div>').join("") +
      (V.host ? '<button class="big" id="results">결과 보기</button>' : '<p class="hint">모두 투표하면 결과가 나와요.</p>'));
    document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => send({ t:"vote", team:b.dataset.v }));
    const r = $("results"); if(r) r.onclick = () => send({ t:"results" });
    return;
  }
  const bestS = Math.max(...shops.map(s => s.score)), bestV = Math.max(...shops.map(s => V.tally[s.id] || 0));
  const winners = (f, best) => shops.filter(s => f(s) === best).map(s => s.name).join(", ");
  const rows = shops.slice().sort((a, b) => b.score - a.score || (V.tally[b.id] || 0) - (V.tally[a.id] || 0));
  front('<h2>오늘의 결과</h2>' +
    '<div class="row"><div class="prize"><small>최고의 서비스</small><b>' + esc(winners(s => s.score, bestS)) + '</b></div><div class="prize"><small>가장 예쁜 가게</small><b>' + esc(winners(s => V.tally[s.id] || 0, bestV)) + '</b></div></div>' +
    '<table class="score"><tr><td>팀</td><td style="text-align:right">맞힌 손님</td><td style="text-align:right">예쁜 가게 표</td></tr>' +
    rows.map(s => '<tr><td style="font-family:var(--display);font-size:16px;color:' + s.color + '">' + esc(s.name) + '</td><td style="text-align:right">' + (s.score === bestS ? "🏆 " : "") + s.score + '</td><td style="text-align:right">' + ((V.tally[s.id] || 0) === bestV ? "🏆 " : "") + (V.tally[s.id] || 0) + '</td></tr>').join("") + '</table>' +
    shops.map(s => '<div class="shopCard" style="border-color:' + s.color + '"><div class="room" style="border-radius:0">' + roomSvg(s.owned) + '</div><div class="cap"><b>' + esc(s.name) + '</b><span class="hint">' + (V.tally[s.id] || 0) + '표</span></div></div>').join("") +
    '<h2 style="font-size:20px">우리 팀이 서빙한 단어</h2>' +
    (V.log.length ? '<ul class="words">' + V.log.map(l => '<li><b lang="ko">' + esc(C[l.id].kr) + '</b> ' + (l.ok ? "성공" : "실패") + '<br><span lang="' + hl(LANG) + '">' + esc(meaning(l.id)) + '</span> · ' + esc(SEC[C[l.id].sec].name) + '</li>').join("") + '</ul>' : '<p class="hint">서빙한 손님이 없어요.</p>') +
    (V.host ? '<button class="big" id="again">대기실로</button>' : '<p class="hint">호스트가 다음 게임을 준비할 때까지 기다리세요.</p>') + '<button class="ghostBtn" id="leave">나가기</button>');
  const a = $("again"); if(a) a.onclick = () => send({ t:"again" });
  $("leave").onclick = () => home();
}

/* ---------- Korean typing on laptops that send loose letters (same fix as 같이 외우기) ---------- */
const H_CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ", H_JUNG = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const H_JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const H_V2 = { "ㅗㅏ":"ㅘ","ㅗㅐ":"ㅙ","ㅗㅣ":"ㅚ","ㅜㅓ":"ㅝ","ㅜㅔ":"ㅞ","ㅜㅣ":"ㅟ","ㅡㅣ":"ㅢ" };
const H_T2 = { "ㄱㅅ":"ㄳ","ㄴㅈ":"ㄵ","ㄴㅎ":"ㄶ","ㄹㄱ":"ㄺ","ㄹㅁ":"ㄻ","ㄹㅂ":"ㄼ","ㄹㅅ":"ㄽ","ㄹㅌ":"ㄾ","ㄹㅍ":"ㄿ","ㄹㅎ":"ㅀ","ㅂㅅ":"ㅄ" };
const H_T2R = Object.fromEntries(Object.entries(H_T2).map(([k, v]) => [v, k]));
function hangulJoin(chars){
  let out = "", L = "", Vw = "", T = "";
  const flush = () => { if(L && Vw) out += String.fromCharCode(0xAC00 + (H_CHO.indexOf(L) * 21 + H_JUNG.indexOf(Vw)) * 28 + H_JONG.indexOf(T)); else out += L + Vw; L = Vw = T = ""; };
  for(const ch of chars){
    if(H_CHO.includes(ch)){ if(L && Vw && !T && H_JONG.includes(ch)) T = ch; else if(L && Vw && T && H_T2[T + ch]) T = H_T2[T + ch]; else { flush(); L = ch; } }
    else if(H_JUNG.includes(ch)){ if(L && !Vw) Vw = ch; else if(L && Vw && !T && H_V2[Vw + ch]) Vw = H_V2[Vw + ch]; else if(L && Vw && T){ const sp = H_T2R[T], nx = sp ? sp[1] : T; T = sp ? sp[0] : ""; flush(); L = nx; Vw = ch; } else { flush(); out += ch; } }
    else { flush(); out += ch; }
  }
  flush(); return out;
}
function hangulSplit(syl){ const c = syl.charCodeAt(0) - 0xAC00; if(c < 0 || c > 11171) return [syl]; const t = H_JONG[c % 28];
  return [H_CHO[Math.floor(c / 588)], H_JUNG[Math.floor(c % 588 / 28)], ...(H_T2R[t] ? [...H_T2R[t]] : t ? [t] : [])]; }
let jamoMode = store.get("k5a_together_jamo", "") === "1";
function jamoWatch(el, data){
  if(!(el instanceof HTMLInputElement)) return;
  if(!jamoMode && data && /^[ㅏ-ㅣ]$/.test(data) && /[ㄱ-ㅎ]$/.test(el.value.slice(0, Math.max(0, el.selectionStart - 1)))){ jamoMode = true; store.set("k5a_together_jamo", "1"); }
  if(!jamoMode || el.selectionStart !== el.value.length) return;
  const v = el.value, m = v.match(/([가-힣]?)([ㄱ-ㅣ]+)$/); if(!m) return;
  const nv = v.slice(0, v.length - m[0].length) + hangulJoin([...(m[1] ? hangulSplit(m[1]) : []), ...m[2]]);
  if(nv !== v){ el.value = nv; el.setSelectionRange(nv.length, nv.length); }
}
document.addEventListener("input", e => { if(!e.isComposing) jamoWatch(e.target, e.data); }, true);
document.addEventListener("compositionend", e => { const el = e.target, d = e.data; setTimeout(() => jamoWatch(el, d), 0); }, true);

window.addEventListener("beforeunload", e => { if(ME.host && G && G.players.size > 1){ e.preventDefault(); e.returnValue = ""; } });
home();
</script>
